name: Frontend Production Release Proof

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: frontend-production-release-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate release identity contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate source contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          route = Path("apps/web/app/api/release/route.ts").read_text(encoding="utf-8")
          workspace = Path("apps/web/app/assessment/AssessmentWorkspace.tsx").read_text(encoding="utf-8")
          copy = Path("apps/web/app/assessment/assessmentCopy.ts").read_text(encoding="utf-8")
          verifier = Path("scripts/production_frontend_release_identity.py").read_text(encoding="utf-8")

          assert 'const UI_CONTRACT = "expert-engagement-v2"' in route
          assert "process.env.VERCEL_GIT_COMMIT_SHA" in route
          assert '"Cache-Control": "no-store, no-cache, must-revalidate, max-age=0"' in route
          assert 'data-assessment-copy-contract="expert-engagement-v2"' in workspace
          assert 'data-assessment-action-copy="create-engagement-v2"' in workspace
          assert 'run: "Create engagement and capture repository snapshot"' in copy
          assert 'run: "Run NICO Assessment"' not in copy
          assert '"specialist_authentication_gate"' in verifier
          assert '"authentication_gate_markers"' in verifier
          assert '"Cybersecurity specialist access"' in verifier
          assert '"Acceso para especialistas en ciberseguridad"' in verifier
          PY

  production:
    name: Verify custom domain serves exact main release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-smoke
    env:
      NICO_PRODUCTION_FRONTEND_URL: ${{ vars.NICO_PRODUCTION_FRONTEND_URL || 'https://app.nicoaudit.com' }}
      RELEASE_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Wait for exact Vercel deployment status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          deadline = time.time() + 30 * 60
          last = "missing"
          while time.time() < deadline:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/commits/{sha}/status",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "nico-frontend-release-proof",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              statuses = [
                  item
                  for item in payload.get("statuses") or []
                  if item.get("context") == "Vercel"
              ]
              if statuses:
                  last = str(statuses[0].get("state") or "unknown")
                  print(f"Vercel status: {last}", flush=True)
                  if last == "success":
                      break
                  if last in {"error", "failure"}:
                      raise SystemExit(f"Vercel deployment failed for exact SHA {sha}")
              time.sleep(20)
          else:
              raise SystemExit(
                  f"Timed out waiting for Vercel deployment for {sha}; last={last}"
              )
          PY

      - name: Verify exact release and bilingual specialist access boundary
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python scripts/production_frontend_release_identity.py \
            --origin "${NICO_PRODUCTION_FRONTEND_URL}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-ui-contract "expert-engagement-v2" \
            --expected-deployment-environment "production" \
            --timeout-seconds 720 \
            --interval-seconds 15 \
            --output audit-results/frontend-production-release-proof.json

      - name: Upload immutable frontend release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-production-release-proof-${{ github.sha }}-${{ github.run_id }}
          path: audit-results/frontend-production-release-proof.json
          if-no-files-found: warn
          retention-days: 90
