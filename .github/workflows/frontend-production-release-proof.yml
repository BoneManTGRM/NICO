name: Frontend Production Release Proof

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: frontend-production-release-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate release identity contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate source contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          route = Path("apps/web/app/api/release/route.ts").read_text(encoding="utf-8")
          workspace = Path("apps/web/app/assessment/AssessmentWorkspace.tsx").read_text(encoding="utf-8")
          copy = Path("apps/web/app/assessment/assessmentCopy.ts").read_text(encoding="utf-8")

          assert 'const UI_CONTRACT = "expert-engagement-v2"' in route
          assert "process.env.VERCEL_GIT_COMMIT_SHA" in route
          assert '"Cache-Control": "no-store, no-cache, must-revalidate, max-age=0"' in route
          assert 'data-assessment-copy-contract="expert-engagement-v2"' in workspace
          assert 'data-assessment-action-copy="create-engagement-v2"' in workspace
          assert 'run: "Create engagement and capture repository snapshot"' in copy
          assert 'run: "Run NICO Assessment"' not in copy
          PY

  production:
    name: Verify custom domain serves exact main release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-smoke
    env:
      NICO_PRODUCTION_FRONTEND_URL: ${{ vars.NICO_PRODUCTION_FRONTEND_URL || 'https://app.nicoaudit.com' }}
      RELEASE_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for exact Vercel deployment status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          deadline = time.time() + 30 * 60
          last = "missing"
          while time.time() < deadline:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/commits/{sha}/status",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "nico-frontend-release-proof",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              statuses = [item for item in payload.get("statuses") or [] if item.get("context") == "Vercel"]
              if statuses:
                  last = str(statuses[0].get("state") or "unknown")
                  print(f"Vercel status: {last}", flush=True)
                  if last == "success":
                      break
                  if last in {"error", "failure"}:
                      raise SystemExit(f"Vercel deployment failed for exact SHA {sha}")
              time.sleep(20)
          else:
              raise SystemExit(f"Timed out waiting for Vercel deployment for {sha}; last={last}")
          PY

      - name: Verify custom domain release identity and UI contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          origin = os.environ["NICO_PRODUCTION_FRONTEND_URL"].rstrip("/")
          expected_sha = os.environ["RELEASE_SHA"]
          deadline = time.time() + 12 * 60
          last = {}

          while time.time() < deadline:
              release_url = origin + "/api/release?" + urllib.parse.urlencode({"expected": expected_sha, "ts": int(time.time())})
              request = urllib.request.Request(
                  release_url,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                      "User-Agent": "nico-frontend-release-proof",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      status = response.status
                      raw = response.read().decode("utf-8")
                  payload = json.loads(raw)
                  last = {"http_status": status, **payload}
              except urllib.error.HTTPError as exc:
                  last = {"http_status": exc.code, "body": exc.read().decode("utf-8", errors="replace")[:240]}
              except Exception as exc:
                  last = {"error": f"{type(exc).__name__}: {exc}"}

              print("Custom-domain release:", json.dumps(last, sort_keys=True), flush=True)
              if (
                  last.get("http_status") == 200
                  and last.get("release_sha") == expected_sha
                  and last.get("ui_contract") == "expert-engagement-v2"
              ):
                  break
              time.sleep(15)
          else:
              raise SystemExit(
                  "The production custom domain is not serving the exact successful Vercel deployment. "
                  "Verify the Vercel production branch, project root, and app.nicoaudit.com domain assignment: "
                  + json.dumps(last, sort_keys=True)
              )

          page_url = origin + "/assessment?" + urllib.parse.urlencode({"tier": "comprehensive", "release_sha": expected_sha})
          request = urllib.request.Request(
              page_url,
              headers={"Cache-Control": "no-cache", "User-Agent": "nico-frontend-release-proof"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              html = response.read().decode("utf-8", errors="replace")

          required = (
              'data-assessment-copy-contract="expert-engagement-v2"',
              'data-assessment-action-copy="create-engagement-v2"',
              "Create engagement and capture repository snapshot",
              "Decision-grade technical diligence",
          )
          missing = [item for item in required if item not in html]
          forbidden = [item for item in ("Run NICO Assessment", "One assessment. One evidence ledger. One decision-grade report.") if item in html]
          if missing or forbidden:
              raise SystemExit(
                  "The exact-release endpoint passed, but the custom-domain assessment HTML is stale or inconsistent: "
                  + json.dumps({"missing": missing, "forbidden": forbidden}, sort_keys=True)
              )
          PY
