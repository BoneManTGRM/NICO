name: Apply active-run identity hotfix

on:
  push:
    branches:
      - fix/preserve-run-identity-on-recovery

permissions:
  contents: write

jobs:
  patch:
    if: >-
      !contains(github.event.head_commit.message, 'Apply exact active-run identity hotfix') &&
      !contains(github.event.head_commit.message, 'Remove active-run identity patcher')
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v7
        with:
          ref: fix/preserve-run-identity-on-recovery
          fetch-depth: 0

      - name: Apply exact source repair
        run: python scripts/apply_active_run_identity_hotfix.py

      - name: Verify repair contracts
        run: |
          python -m py_compile tests/test_active_run_identity_recovery_v1.py
          grep -q 'function preserveRunIdentity' apps/web/app/assessment/useAssessmentRun.ts
          grep -q 'const recovered = preserveRunIdentity(recoveredResponse' apps/web/app/assessment/useAssessmentRun.ts

      - name: Commit repaired product code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/assessment/useAssessmentRun.ts tests/test_active_run_identity_recovery_v1.py
          git diff --cached --quiet && exit 0
          git commit -m "Apply exact active-run identity hotfix"
          git push origin HEAD:fix/preserve-run-identity-on-recovery
