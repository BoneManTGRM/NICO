name: NICO Production Acceptance Green Watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: nico-production-acceptance-green-watch
  cancel-in-progress: true

jobs:
  verify-exact-main:
    name: Derive exact-main production acceptance status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STATUS_CONTEXT: NICO Production Acceptance Green Watch
      REQUIRED_STATUS_CONTEXTS: >-
        ["Vercel","successful-cat - NICO","NICO Two-Service Production Acceptance","NICO Mobile Restart Production Proof","NICO iOS WebKit Paint Proof","NICO Spanish Comprehensive Production Proof"]
    steps:
      - name: Publish derived exact-main acceptance status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          required_contexts = json.loads(os.environ["REQUIRED_STATUS_CONTEXTS"])
          status_context = os.environ["STATUS_CONTEXT"]
          api_root = "https://api.github.com"

          def request(method: str, path: str, payload: dict | None = None) -> dict:
              body = None
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "nico-production-acceptance-green-watch",
              }
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  f"{api_root}{path}",
                  data=body,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode("utf-8")
              except urllib.error.HTTPError as exc:
                  details = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub API {method} {path} failed with {exc.code}: {details}"
                  ) from exc
              return json.loads(raw) if raw else {}

          main_commit = request("GET", f"/repos/{repository}/commits/main")
          sha = str(main_commit.get("sha") or "").strip()
          if len(sha) != 40:
              raise RuntimeError("Unable to resolve the exact current main SHA.")

          status_payload = request(
              "GET",
              f"/repos/{repository}/commits/{sha}/status?per_page=100",
          )
          statuses = [
              item
              for item in status_payload.get("statuses") or []
              if isinstance(item, dict)
          ]

          def latest(values: list[dict]) -> dict:
              return max(
                  values,
                  key=lambda item: (
                      str(item.get("created_at") or ""),
                      int(item.get("id") or 0),
                  ),
                  default={},
              )

          spanish_context = "NICO Spanish Comprehensive Production Proof"
          spanish = latest([
              item
              for item in statuses
              if str(item.get("context") or "").strip() == spanish_context
          ])
          spanish_description = str(spanish.get("description") or "").strip()
          marker_match = re.match(r"^(source:\d+:\d+) ", spanish_description)
          source_marker = marker_match.group(1) if marker_match else ""
          source_bound_contexts = {
              spanish_context,
              "NICO Two-Service Production Acceptance",
              "NICO Mobile Restart Production Proof",
              "NICO iOS WebKit Paint Proof",
          }

          latest_by_context: dict[str, dict] = {}
          for context in required_contexts:
              latest_by_context[context] = latest([
                  item
                  for item in statuses
                  if str(item.get("context") or "").strip() == context
                  and (
                      context not in source_bound_contexts
                      or (
                          bool(source_marker)
                          and str(item.get("description") or "").strip().startswith(
                              source_marker + " "
                          )
                      )
                  )
              ])

          observed = {
              context: str((latest_by_context.get(context) or {}).get("state") or "missing").lower()
              for context in required_contexts
          }
          blocking = {
              context: state
              for context, state in observed.items()
              if state != "success"
          }
          hard_failures = {
              context: state
              for context, state in blocking.items()
              if state in {"error", "failure"}
          }
          if not source_marker:
              derived_state = "pending"
              description = "Waiting for a source-bound Spanish production proof"
          elif not blocking:
              derived_state = "success"
              description = f"{source_marker} all exact-main production acceptance contexts succeeded"
          elif hard_failures:
              derived_state = "failure"
              description = f"{source_marker} one or more exact-main production contexts failed"
          else:
              derived_state = "pending"
              description = f"{source_marker} waiting for exact-main production contexts"

          target_url = f"https://github.com/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          request(
              "POST",
              f"/repos/{repository}/statuses/{sha}",
              {
                  "state": derived_state,
                  "context": status_context,
                  "description": description[:140],
                  "target_url": target_url,
              },
          )
          print(
              json.dumps(
                  {
                      "main_sha": sha,
                      "derived_state": derived_state,
                      "required_statuses": observed,
                      "blocking": blocking,
                      "source_binding": source_marker.removeprefix("source:"),
                  },
                  sort_keys=True,
              )
          )
          PY
