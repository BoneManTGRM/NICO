name: Apply canonical report truth patch

on:
  push:
    branches:
      - fix/canonical-87-85-report-truth

permissions:
  contents: write

jobs:
  patch:
    if: >-
      !contains(github.event.head_commit.message, 'Apply canonical report truth implementation') &&
      !contains(github.event.head_commit.message, 'Remove temporary canonical report patcher')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/canonical-87-85-report-truth
          fetch-depth: 0

      - name: Apply exact source patch
        run: python scripts/apply_canonical_report_truth_patch.py

      - name: Verify generated source compiles
        run: |
          python -m py_compile nico/comprehensive_canonical_report_truth_v1.py
          python -m py_compile tests/test_comprehensive_canonical_report_truth_v1.py
          grep -q 'install_comprehensive_canonical_report_truth_v1' nico/api/production.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nico/api/production.py \
            nico/comprehensive_canonical_report_truth_v1.py \
            tests/test_comprehensive_canonical_report_truth_v1.py
          git diff --cached --quiet && exit 0
          git commit -m "Apply canonical report truth implementation"
          git push origin HEAD:fix/canonical-87-85-report-truth
