name: Production Proof Reconciliation

on:
  workflow_run:
    workflows:
      - Mobile Restart Production Proof
      - iOS WebKit Paint Proof
    types:
      - completed

permissions:
  actions: write
  contents: read
  statuses: read

concurrency:
  group: nico-production-proof-reconciliation-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile recovered exact-SHA proof dependencies
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
      SOURCE_CONSUMER_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_CONSUMER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

    steps:
      - name: Reconcile stale downstream proof failures
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import urllib.request
          from typing import Any

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"].strip()
          token = os.environ["GITHUB_TOKEN"]
          source_workflow = os.environ["SOURCE_WORKFLOW"].strip()
          source_consumer_run_id = os.environ["SOURCE_CONSUMER_RUN_ID"].strip()
          source_consumer_run_attempt = os.environ["SOURCE_CONSUMER_RUN_ATTEMPT"].strip()

          if not sha:
              raise SystemExit("workflow_run event did not provide an exact release SHA")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nico-production-proof-reconciliation",
          }

          def request_json(
              method: str,
              url: str,
              payload: dict[str, Any] | None = None,
          ) -> dict[str, Any]:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      **headers,
                      **({"Content-Type": "application/json"} if data is not None else {}),
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read()
              if not raw:
                  return {}
              value = json.loads(raw.decode("utf-8"))
              if not isinstance(value, dict):
                  raise RuntimeError(f"Expected a JSON object from {method} {url}")
              return value

          def commit_statuses() -> list[dict[str, Any]]:
              payload = request_json(
                  "GET",
                  f"https://api.github.com/repos/{repository}/commits/{sha}/status",
              )
              return [
                  item for item in payload.get("statuses") or []
                  if isinstance(item, dict)
              ]

          def latest(values: list[dict[str, Any]]) -> dict[str, Any]:
              return max(
                  values,
                  key=lambda item: (
                      str(item.get("created_at") or ""),
                      int(item.get("id") or 0),
                  ),
                  default={},
              )

          def source_bound_status(
              statuses: list[dict[str, Any]],
              context: str,
              source_marker: str,
          ) -> dict[str, Any]:
              return latest(
                  [
                      item
                      for item in statuses
                      if str(item.get("context") or "").strip() == context
                      and str(item.get("description") or "").strip().startswith(
                          source_marker + " "
                      )
                  ]
              )

          def rerun_exact_failed_workflow(
              workflow_file: str,
              *,
              expected_context: str,
              status_item: dict[str, Any],
          ) -> bool:
              target_url = str(status_item.get("target_url") or "")
              match = re.search(r"/actions/runs/(\d+)(?:/|$)", target_url)
              if not match:
                  raise SystemExit(
                      f"{expected_context} exact source-bound status omitted its workflow run URL"
                  )
              run_id = int(match.group(1))
              run = request_json(
                  "GET",
                  f"https://api.github.com/repos/{repository}/actions/runs/{run_id}",
              )
              workflow_path = str(run.get("path") or "").split("@", 1)[0]
              if (
                  str(run.get("head_sha") or "") != sha
                  or str(run.get("event") or "") != "workflow_run"
                  or not workflow_path.endswith("/" + workflow_file)
              ):
                  raise SystemExit(
                      f"{expected_context} status targeted an unrelated workflow run: {run_id}"
                  )
              status = str(run.get("status") or "unknown").lower()
              conclusion = str(run.get("conclusion") or "").lower()
              if status != "completed":
                  print(
                      f"{expected_context} exact-SHA run {run_id} is {status}; reconciliation is already in progress or not yet terminal.",
                      flush=True,
                  )
                  return False
              if conclusion not in {"failure", "cancelled", "timed_out", "action_required", "stale"}:
                  print(
                      f"{expected_context} exact-SHA run {run_id} concluded {conclusion or 'unknown'}; no failed jobs to replay.",
                      flush=True,
                  )
                  return False

              request_json(
                  "POST",
                  f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/rerun-failed-jobs",
              )
              print(
                  f"Re-ran only failed jobs for {expected_context} at exact SHA {sha} (run {run_id}).",
                  flush=True,
              )
              return True

          statuses = commit_statuses()
          mobile_context = "NICO Mobile Restart Production Proof"
          ios_context = "NICO iOS WebKit Paint Proof"
          acceptance_context = "NICO Two-Service Production Acceptance"
          triggering_context = {
              "Mobile Restart Production Proof": mobile_context,
              "iOS WebKit Paint Proof": ios_context,
          }.get(source_workflow)
          if not triggering_context:
              raise SystemExit(f"Unsupported reconciliation source workflow: {source_workflow}")
          trigger_run = request_json(
              "GET",
              f"https://api.github.com/repos/{repository}/actions/runs/{source_consumer_run_id}",
          )
          if (
              str(trigger_run.get("head_sha") or "") != sha
              or str(trigger_run.get("event") or "") != "workflow_run"
              or str(trigger_run.get("run_attempt") or "") != source_consumer_run_attempt
          ):
              raise SystemExit(
                  "Reconciliation event did not match the exact consumer run ID and attempt"
              )
          triggering = latest(
              [
                  item
                  for item in statuses
                  if str(item.get("context") or "").strip() == triggering_context
                  and str(item.get("target_url") or "").rstrip("/").endswith(
                      f"/actions/runs/{source_consumer_run_id}"
                  )
              ]
          )
          description = str(triggering.get("description") or "").strip()
          marker_match = re.match(r"^(source:\d+:\d+) ", description)
          if not marker_match:
              raise SystemExit(
                  "Triggering consumer status did not prove its Spanish source run ID and attempt"
              )
          source_marker = marker_match.group(1)
          bound = {
              context: source_bound_status(statuses, context, source_marker)
              for context in (mobile_context, ios_context, acceptance_context)
          }
          observed = {
              context: str(item.get("state") or "missing").strip().lower()
              for context, item in bound.items()
          }
          print(
              "Exact-SHA production proof state after "
              f"{source_workflow}: {json.dumps(observed, sort_keys=True)}",
              flush=True,
          )

          # A failed prerequisite status is not permanent truth when the same exact-SHA
          # workflow is later rerun successfully. Reconcile the dependency graph from
          # current status instead of leaving downstream proofs red forever.
          if observed[mobile_context] == "success" and observed[ios_context] in {"failure", "error"}:
              rerun_exact_failed_workflow(
                  "ios-webkit-paint-proof.yml",
                  expected_context=ios_context,
                  status_item=bound[ios_context],
              )
              raise SystemExit(0)

          if (
              observed[mobile_context] == "success"
              and observed[ios_context] == "success"
              and observed[acceptance_context] in {"failure", "error"}
          ):
              rerun_exact_failed_workflow(
                  "two-service-production-acceptance.yml",
                  expected_context=acceptance_context,
                  status_item=bound[acceptance_context],
              )
              raise SystemExit(0)

          print(
              "No stale downstream proof failure is eligible for bounded reconciliation.",
              flush=True,
          )
          PY
