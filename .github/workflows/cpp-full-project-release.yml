name: C++ Full Project Image Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpp-full-project-image-release
  cancel-in-progress: false

jobs:
  qualify-image:
    if: github.repository == 'BoneManTGRM/NICO' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    outputs:
      handoff_sha256: ${{ steps.handoff-anchor.outputs.sha256 }}
    runs-on: ubuntu-24.04
    # 7,800s baseline+runtime + 1,030s combined static + bounded setup/artifact margin.
    timeout-minutes: 175
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nico
          POSTGRES_PASSWORD: nico
          POSTGRES_DB: nico
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nico -d nico"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      NICO_TEST_DATABASE_URL: postgresql://nico:nico@127.0.0.1:5432/nico
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cppcheck-opensource/cppcheck
          ref: ac9db3069b9f90e81e126a090b99ad456e122cf8
          path: toolchain/full-project/cppcheck
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install the native control dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Provision exact tools without assessed source or runtime network
        run: |
          set -euo pipefail
          test "$(git -C toolchain/full-project/cppcheck rev-parse HEAD)" = ac9db3069b9f90e81e126a090b99ad456e122cf8
          printf 'cppcheck/.git\n' > toolchain/full-project/.dockerignore
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps --platform manylinux2014_x86_64 --implementation py --abi none cmake==3.31.6 --dest toolchain/full-project
          mv toolchain/full-project/cmake-3.31.6-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl toolchain/full-project/cmake.whl
          echo '1c8b05df0602365da91ee6a3336fe57525b137706c4ab5675498f662ae1dbcec  toolchain/full-project/cmake.whl' | sha256sum -c -
          curl --proto '=https' --tlsv1.2 --fail --retry 3 --retry-delay 2 --max-filesize 8388608 \
            --output toolchain/full-project/pycapnp.whl \
            https://files.pythonhosted.org/packages/f0/a6/eeb28ab162eed10340921aca24efe062d6bf7d9b98acc7a55c3b6900bf7a/pycapnp-2.2.1-cp311-cp311-manylinux_2_28_x86_64.whl
          echo 'd682ae9f23a0c6568533ca2ebf6d70ac7e599dd222f671fa87dff278de343eec  toolchain/full-project/pycapnp.whl' | sha256sum -c -
          python -m scripts.provision_cpp_fuzz_tools --destination toolchain/full-project/llvm
          python -m scripts.provision_cpp_fuzz_tools --project-dependencies --destination toolchain/full-project/project-dependencies
          python -m scripts.provision_cpp_fuzz_tools --capnp-source --destination toolchain/full-project/capnp-source
          python -m scripts.provision_cpp_runtime_dependencies --destination toolchain/full-project/runtime-dependencies
          cp scripts/repair_cppcheck_placement_ast.py toolchain/full-project/
          cp scripts/verify_cpp_runtime_toolchain.py toolchain/full-project/
          timeout 210s docker build --network=none --iidfile full-project-image-id.txt -f docker/assessment-full-project-fuzz.Dockerfile toolchain/full-project
          docker image inspect "$(cat full-project-image-id.txt)" > full-project-image.json
          toolchain_container="$(docker create --network=none --read-only --entrypoint=/bin/true "$(cat full-project-image-id.txt)")"
          trap 'docker rm --force "$toolchain_container" >/dev/null' EXIT
          docker cp "$toolchain_container:/opt/nico-cpp-runtime-toolchain.json" cpp-runtime-toolchain.json
      - name: Verify container boundary and same-image owned runtime controls
        run: |
          python scripts/qualify_cpp_worker_container.py
          python -m scripts.qualify_cppcheck_worker_control --image "$(cat full-project-image-id.txt)"
          python -m scripts.qualify_cpp_full_project_integration --generated-headers --bounded-fuzz --project-dependencies --project-compiler-options --image "$(cat full-project-image-id.txt)"
          python -m scripts.qualify_cpp_project_generated_context --project-static-analysis --extended-compiler-budget --compiler-environment --image "$(cat full-project-image-id.txt)"
      - name: Acquire pinned public qualification source without execution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bitcoin/bitcoin
          ref: bb5296576e8f1a9fc11c19d9a25ba02ed4547e24
          path: qualification-input
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Stage the pinned unit-test asset outside the assessed source
        run: |
          set -euo pipefail
          mkdir -p qualification-unit-test-data
          curl --location --fail --retry 3 --retry-delay 2 -o qualification-unit-test-data/script_assets_test.json \
            https://github.com/bitcoin-core/qa-assets/raw/b33d85102d169b54d966ea315ad81a636680aefa/unit_test_data/script_assets_test.json
          echo 'cd789a58ec45916e1721cdd14e82ca4c93100959f1cef4e229b22e3bf539f095  qualification-unit-test-data/script_assets_test.json' | sha256sum -c -
          test "$(wc -c < qualification-unit-test-data/script_assets_test.json)" -eq 9243520
      - name: Collect the complete frozen assessment and preserve target findings
        env:
          NICO_PRODUCER_SOURCE_SHA: ${{ github.sha }}
        run: >-
          python -m scripts.qualify_cpp_project_configuration
          --qualification-source qualification-input
          --qualification-manifest tests/fixtures/cpp/bitcoin-configuration-benchmark.json
          --baseline-execution-contract tests/fixtures/cpp/bitcoin-baseline-execution.json
          --runtime-scope-contract tests/fixtures/cpp/bitcoin-runtime-scope.json
          --unit-test-data qualification-unit-test-data
          --accept-completed-collection --producer-source-sha "$NICO_PRODUCER_SOURCE_SHA"
          --capture-generated-context --project-compiler-evidence --project-static-analysis --extended-compiler-budget --compiler-environment
          --output cpp-baseline-qualification
          --image "$(cat full-project-image-id.txt)"
      - name: Retain native success and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpp-baseline-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cpp-baseline-qualification/
            cppcheck-worker-control.json
            cpp-worker-boundary-evidence.json
            cpp-full-project-integration/
            cpp-generated-context-qualification/
            full-project-image-id.txt
            full-project-image.json
            cpp-runtime-toolchain.json
            toolchain/full-project/llvm/receipt.json
            toolchain/full-project/project-dependencies/receipt.json
            toolchain/full-project/project-dependencies/lock.json
            toolchain/full-project/capnp-source/receipt.json
            toolchain/full-project/capnp-source/lock.json
            toolchain/full-project/runtime-dependencies/lock.json
            toolchain/full-project/runtime-dependencies/receipt.json
            toolchain/full-project/runtime-dependencies/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Export the exact controlled image and revalidate retained collection
        env:
          QUALIFIED_SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PYTHON'
          import json, os, shutil
          from pathlib import Path
          from scripts.cpp_full_project_handoff import CONTRACTS, export
          for name in CONTRACTS:
              shutil.copyfile(Path('tests/fixtures/cpp') / name, Path('cpp-baseline-qualification') / name)
          export('cpp-baseline-qualification', json.loads(Path('cppcheck-worker-control.json').read_bytes()),
              json.loads(Path('full-project-image.json').read_bytes()),
              'docker/assessment-full-project-fuzz.Dockerfile', 'full-project-image-handoff',
              source_sha=os.environ['QUALIFIED_SOURCE_SHA'])
          PYTHON
      - name: Anchor exact handoff for this run
        id: handoff-anchor
        run: |
          python - <<'PYTHON'
          import hashlib, os
          from pathlib import Path
          digest = hashlib.sha256(Path('full-project-image-handoff/handoff.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha256=' + digest + '\n')
          PYTHON
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-project-image-handoff-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: full-project-image-handoff/
          compression-level: 1
          if-no-files-found: error
          retention-days: 7

  publish-image:
    needs: [qualify-image]
    if: github.event_name == 'workflow_dispatch' && github.repository == 'BoneManTGRM/NICO' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      NICO_IMAGE_HANDOFF_SHA256: ${{ needs.qualify-image.outputs.handoff_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install existing controller dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: full-project-image-handoff-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: full-project-image-handoff
      - name: Record publication reservation before any registry operation
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.cpp_full_project_release import identity
          revision, anchor = identity('publish')
          Path('image-publication-intent.json').write_text(json.dumps({
              'source_sha': revision, 'handoff_sha256': anchor,
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': 1,
              'state': 'reserved', 'production_qualified': False,
              'recovery': 'If a terminal receipt is absent, publication outcome is unknown; do not retry.'
          }, sort_keys=True) + '\n')
          PY
      - name: Retain reservation before publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpp-image-publication-intent-${{ github.sha }}-${{ github.run_id }}
          path: image-publication-intent.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish exact full-project image with complete retained collection
        env:
          NICO_IMAGE_RELEASE_MODE: publish
          NICO_IMAGE_PUBLICATION_TOKEN: ${{ github.token }}
        run: python -m scripts.cpp_full_project_release
      - name: Retain publication outcome including uncertain pushes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpp-image-publication-${{ github.sha }}-${{ github.run_id }}
          path: image-publication/publication.json
          if-no-files-found: warn
          retention-days: 30

  verify-image:
    needs: [qualify-image, publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      NICO_IMAGE_HANDOFF_SHA256: ${{ needs.qualify-image.outputs.handoff_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install existing controller dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cpp-image-publication-${{ github.sha }}-${{ github.run_id }}
          path: image-publication
      - name: Verify digest retrieval on a separate clean daemon
        env:
          NICO_IMAGE_RELEASE_MODE: verify
          NICO_IMAGE_PULL_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          retrieval_root=$(mktemp -d "$RUNNER_TEMP/nico-image-retrieval.XXXXXX")
          printf '{}\n' > "$retrieval_root/daemon.json"
          sudo --non-interactive systemctl stop docker.service docker.socket
          cleanup() {
            if [ -f "$retrieval_root/daemon.pid" ]; then
              sudo --non-interactive kill -TERM "$(sudo --non-interactive cat "$retrieval_root/daemon.pid")" || true
            fi
          }
          trap cleanup EXIT
          sudo --non-interactive env -i PATH="$PATH" dockerd \
            --config-file "$retrieval_root/daemon.json" \
            --data-root "$retrieval_root/data" \
            --exec-root "$retrieval_root/exec" \
            --pidfile "$retrieval_root/daemon.pid" \
            --host unix:///var/run/docker.sock \
            --bridge none --iptables=false --ip6tables=false --ip-forward=false --ip-masq=false \
            > "$retrieval_root/daemon.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if docker --host unix:///var/run/docker.sock info > /dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          actual_root=$(docker --host unix:///var/run/docker.sock info --format '{{.DockerRootDir}}')
          test "$actual_root" = "$retrieval_root/data"
          python -m scripts.cpp_full_project_release
      - name: Retain clean retrieval outcome and anonymous access probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpp-image-retrieval-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-retrieval/verification.json
          if-no-files-found: warn
          retention-days: 30
