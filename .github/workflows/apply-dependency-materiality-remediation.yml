name: Apply dependency materiality remediation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/remediation/dependency-materiality.patch
      - .github/workflows/apply-dependency-materiality-remediation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply the reviewed source patch
        run: |
          git apply --check .github/remediation/dependency-materiality.patch
          git apply .github/remediation/dependency-materiality.patch
          python -m compileall -q nico

      - name: Commit the source changes
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nico/snapshot_scanner_worker.py nico/v2_authoritative_premium_report.py
          git commit -m "Apply evidence-bound dependency materiality scoring"
          git push origin "HEAD:${BRANCH_NAME}"
