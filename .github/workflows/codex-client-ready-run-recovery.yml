name: Apply Comprehensive run recovery repair

on:
  push:
    branches:
      - codex/client-ready-run-recovery

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/client-ready-run-recovery
          fetch-depth: 0

      - name: Apply bounded run-lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()
          hook_path = ROOT / "apps/web/app/assessment/useAssessmentRun.ts"
          workspace_path = ROOT / "apps/web/app/assessment/AssessmentWorkspace.tsx"
          test_path = ROOT / "tests/test_comprehensive_stuck_run_recovery_contract.py"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          hook = hook_path.read_text(encoding="utf-8")

          hook = replace_once(
              hook,
              '''  retry: () => Promise<void>;
  startNew: () => void;
};''',
              '''  retry: () => Promise<void>;
  cancelCurrent: () => void;
  startNew: () => void;
};''',
              "controller cancel contract",
          )

          hook = replace_once(
              hook,
              '''const CLIENT_RETRY_DELAYS_MS = [0, 2_000, 5_000];
const ACTIVE_RUN_STORAGE_KEY = "nico.comprehensive.active-run.v1";''',
              '''const CLIENT_RETRY_DELAYS_MS = [0, 2_000, 5_000];
const REQUEST_TIMEOUT_MS = 45_000;
const READINESS_TIMEOUT_MS = 60_000;
const INTAKE_TIMEOUT_MS = 240_000;
const CONTINUATION_TIMEOUT_MS = 300_000;
const OVERALL_RUN_TIMEOUT_MS = 45 * 60_000;
const ACTIVE_RUN_MAX_AGE_MS = 2 * 60 * 60_000;
const ACTIVE_RUN_STORAGE_KEY = "nico.comprehensive.active-run.v1";''',
              "timeout constants",
          )

          old_request = '''async function requestWithRetry(
  path: string,
  init: RequestInit,
  copy: ReturnType<typeof copyFor>,
): Promise<Result> {
  let lastError: unknown = null;
  for (let attempt = 0; attempt < CLIENT_RETRY_DELAYS_MS.length; attempt += 1) {
    const delay = CLIENT_RETRY_DELAYS_MS[attempt];
    if (delay) await wait(delay);
    try {
      const response = await fetch(apiUrl(path), {
        ...init,
        headers: browserHeaders(init.headers),
        cache: "no-store",
      });
      if (TRANSIENT_STATUS.has(response.status) && attempt < CLIENT_RETRY_DELAYS_MS.length - 1) {
        await response.arrayBuffer();
        continue;
      }
      return await parseJson(response, copy);
    } catch (error) {
      lastError = error;
      const retryable = error instanceof AssessmentApiError ? error.retryable : true;
      if (!retryable || attempt >= CLIENT_RETRY_DELAYS_MS.length - 1) break;
    }
  }
  if (lastError instanceof AssessmentApiError) throw lastError;
  if (lastError instanceof Error) {
    throw new AssessmentApiError(lastError.message || copy.backendError, {
      status: 0,
      code: "assessment_network_error",
      retryable: true,
    });
  }
  throw new AssessmentApiError(copy.backendError, {
    status: 0,
    code: "assessment_network_error",
    retryable: true,
  });
}'''
          new_request = '''async function requestWithRetry(
  path: string,
  init: RequestInit,
  copy: ReturnType<typeof copyFor>,
  timeoutMs = REQUEST_TIMEOUT_MS,
): Promise<Result> {
  let lastError: unknown = null;
  for (let attempt = 0; attempt < CLIENT_RETRY_DELAYS_MS.length; attempt += 1) {
    if (init.signal?.aborted) {
      throw new AssessmentApiError("Assessment request was canceled.", {
        status: 0,
        code: "assessment_cancelled",
        retryable: false,
      });
    }
    const delay = CLIENT_RETRY_DELAYS_MS[attempt];
    if (delay) await wait(delay);

    const controller = new AbortController();
    let timedOut = false;
    const abortFromCaller = () => controller.abort();
    if (init.signal) init.signal.addEventListener("abort", abortFromCaller, {once: true});
    const timeout = globalThis.setTimeout(() => {
      timedOut = true;
      controller.abort();
    }, timeoutMs);

    try {
      const response = await fetch(apiUrl(path), {
        ...init,
        headers: browserHeaders(init.headers),
        cache: "no-store",
        signal: controller.signal,
      });
      if (TRANSIENT_STATUS.has(response.status) && attempt < CLIENT_RETRY_DELAYS_MS.length - 1) {
        await response.arrayBuffer();
        continue;
      }
      return await parseJson(response, copy);
    } catch (error) {
      if (init.signal?.aborted) {
        throw new AssessmentApiError("Assessment request was canceled.", {
          status: 0,
          code: "assessment_cancelled",
          retryable: false,
        });
      }
      lastError = timedOut
        ? new AssessmentApiError("Assessment service did not respond before the request timeout.", {
            status: 408,
            code: "assessment_request_timeout",
            retryable: true,
          })
        : error;
      const retryable = lastError instanceof AssessmentApiError ? lastError.retryable : true;
      if (!retryable || attempt >= CLIENT_RETRY_DELAYS_MS.length - 1) break;
    } finally {
      globalThis.clearTimeout(timeout);
      if (init.signal) init.signal.removeEventListener("abort", abortFromCaller);
    }
  }
  if (lastError instanceof AssessmentApiError) throw lastError;
  if (lastError instanceof Error) {
    throw new AssessmentApiError(lastError.message || copy.backendError, {
      status: 0,
      code: "assessment_network_error",
      retryable: true,
    });
  }
  throw new AssessmentApiError(copy.backendError, {
    status: 0,
    code: "assessment_network_error",
    retryable: true,
  });
}'''
          hook = replace_once(hook, old_request, new_request, "bounded request helper")

          hook = replace_once(
              hook,
              '''    const raw = window.localStorage.getItem(ACTIVE_RUN_STORAGE_KEY);
    return raw ? normalizePersistedRun(JSON.parse(raw)) : null;''',
              '''    const raw = window.localStorage.getItem(ACTIVE_RUN_STORAGE_KEY);
    const persisted = raw ? normalizePersistedRun(JSON.parse(raw)) : null;
    if (persisted && Date.now() - persisted.startedAt > ACTIVE_RUN_MAX_AGE_MS) {
      clearPersistedRun(false);
      return null;
    }
    return persisted;''',
              "stale persisted run expiry",
          )

          hook = replace_once(
              hook,
              '''  const bootstrapped = useRef(false);
  const recoveryInFlight = useRef(false);''',
              '''  const bootstrapped = useRef(false);
  const recoveryInFlight = useRef(false);
  const activeRequest = useRef<AbortController | null>(null);''',
              "active request controller",
          )

          hook = replace_once(
              hook,
              '''      window.removeEventListener("online", restoreAfterPageResume);
      sequence.current += 1;
    };''',
              '''      window.removeEventListener("online", restoreAfterPageResume);
      activeRequest.current?.abort();
      activeRequest.current = null;
      sequence.current += 1;
    };''',
              "unmount cancellation",
          )

          hook = replace_once(
              hook,
              '''  async function verifyRuntimePersistence(): Promise<void> {
    const diagnostics = await requestWithRetry(
      "/diagnostics/comprehensive-runtime",
      {method: "GET"},
      copy,
    );''',
              '''  async function verifyRuntimePersistence(signal: AbortSignal): Promise<void> {
    const diagnostics = await requestWithRetry(
      "/diagnostics/comprehensive-runtime",
      {method: "GET", signal},
      copy,
      READINESS_TIMEOUT_MS,
    );''',
              "bounded readiness verification",
          )

          hook = replace_once(
              hook,
              '''  async function recoverRun(runId: string, fallback: Partial<RunIdentityFallback> = {}): Promise<Result | null> {
    try {
      const recovered = await requestWithRetry(
        `/assessment/comprehensive-run/${encodeURIComponent(runId)}`,
        {method: "GET"},
        copy,
      );''',
              '''  async function recoverRun(
    runId: string,
    fallback: Partial<RunIdentityFallback> = {},
    signal?: AbortSignal,
  ): Promise<Result | null> {
    try {
      const recovered = await requestWithRetry(
        `/assessment/comprehensive-run/${encodeURIComponent(runId)}`,
        {method: "GET", signal},
        copy,
        REQUEST_TIMEOUT_MS,
      );''',
              "bounded run recovery",
          )

          hook = replace_once(
              hook,
              '''  async function continueRun(initial: Result, scope: Scope, token: number, startedAt = Date.now()): Promise<void> {''',
              '''  async function continueRun(
    initial: Result,
    scope: Scope,
    token: number,
    startedAt = Date.now(),
    signal?: AbortSignal,
  ): Promise<void> {''',
              "continuation signal contract",
          )

          hook = replace_once(
              hook,
              '''    for (let count = 1; count <= MAX_POLL_ATTEMPTS; count += 1) {
      if (token !== sequence.current) return;
      persistExactRun(current, scope, startedAt);''',
              '''    for (let count = 1; count <= MAX_POLL_ATTEMPTS; count += 1) {
      if (token !== sequence.current || signal?.aborted) return;
      if (Date.now() - startedAt >= OVERALL_RUN_TIMEOUT_MS) {
        clearPersistedRun(false);
        setResult(current);
        setPhase("timed_out");
        setStarted(null);
        setMessage(copy.phases.timed_out);
        return;
      }
      persistExactRun(current, scope, startedAt);''',
              "overall run timeout",
          )

          hook = replace_once(
              hook,
              '''            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({max_stages: 1}),
          },
          copy,
        );''',
              '''            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({max_stages: 1}),
            signal,
          },
          copy,
          CONTINUATION_TIMEOUT_MS,
        );''',
              "bounded continuation request",
          )

          hook = replace_once(
              hook,
              '''          evidenceLedgerId: current.evidence_ledger_id,
        });
        if (!recovered) throw requestError;''',
              '''          evidenceLedgerId: current.evidence_ledger_id,
        }, signal);
        if (!recovered) throw requestError;''',
              "continuation recovery signal",
          )

          hook = replace_once(
              hook,
              '''    persistExactRun(current, scope, startedAt);
    setResult(current);
    setPhase("timed_out");''',
              '''    clearPersistedRun(false);
    setResult(current);
    setPhase("timed_out");''',
              "poll exhaustion clears stale resume",
          )

          hook = replace_once(
              hook,
              '''  function applyIssue(caught: unknown, runCreated: boolean): void {
    const normalized = issueFor(caught, copy, runCreated);
    setPhase(normalized.kind === "run_failed" ? "failed" : "unavailable");''',
              '''  function applyIssue(caught: unknown, runCreated: boolean): void {
    const normalized = issueFor(caught, copy, runCreated);
    clearPersistedRun(false);
    setPhase(normalized.kind === "run_failed" ? "failed" : "unavailable");''',
              "failed runs do not auto-trap refresh",
          )

          hook = replace_once(
              hook,
              '''    recoveryInFlight.current = true;
    const token = sequence.current + 1;
    sequence.current = token;''',
              '''    recoveryInFlight.current = true;
    activeRequest.current?.abort();
    const controller = new AbortController();
    activeRequest.current = controller;
    const token = sequence.current + 1;
    sequence.current = token;''',
              "resume request controller",
          )

          hook = replace_once(
              hook,
              '''        `/assessment/comprehensive-run/${encodeURIComponent(persisted.runId)}`,
        {method: "GET"},
        copy,
      );''',
              '''        `/assessment/comprehensive-run/${encodeURIComponent(persisted.runId)}`,
        {method: "GET", signal: controller.signal},
        copy,
        REQUEST_TIMEOUT_MS,
      );''',
              "resume status timeout",
          )

          hook = replace_once(
              hook,
              '''      await continueRun(recovered, scope, token, persisted.startedAt);
    } catch (caught) {''',
              '''      await continueRun(recovered, scope, token, persisted.startedAt, controller.signal);
    } catch (caught) {''',
              "resume continuation cancellation",
          )

          hook = replace_once(
              hook,
              '''    } finally {
      recoveryInFlight.current = false;
    }
  }

  async function run(): Promise<void> {''',
              '''    } finally {
      if (activeRequest.current === controller) activeRequest.current = null;
      recoveryInFlight.current = false;
    }
  }

  async function run(): Promise<void> {''',
              "resume controller cleanup",
          )

          hook = replace_once(
              hook,
              '''  async function run(): Promise<void> {
    clearPersistedRun(false);''',
              '''  async function run(): Promise<void> {
    activeRequest.current?.abort();
    const controller = new AbortController();
    activeRequest.current = controller;
    clearPersistedRun(false);''',
              "new run controller",
          )

          hook = replace_once(
              hook,
              '''      await verifyRuntimePersistence();''',
              '''      await verifyRuntimePersistence(controller.signal);''',
              "readiness signal",
          )

          hook = replace_once(
              hook,
              '''          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(body),
        },
        copy,
      );''',
              '''          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(body),
          signal: controller.signal,
        },
        copy,
        INTAKE_TIMEOUT_MS,
      );''',
              "intake timeout",
          )

          hook = replace_once(
              hook,
              '''      await continueRun(data, scope, token, startedAt);
    } catch (caught) {''',
              '''      await continueRun(data, scope, token, startedAt, controller.signal);
    } catch (caught) {''',
              "run continuation signal",
          )

          hook = replace_once(
              hook,
              '''      if (acceptedRun) {
        persistExactRun(acceptedRun, scope, startedAt);
        setResult(acceptedRun);
      }
    }
  }

  function startNew(): void {''',
              '''      if (acceptedRun) setResult(acceptedRun);
    } finally {
      if (activeRequest.current === controller) activeRequest.current = null;
    }
  }

  function cancelCurrent(): void {
    sequence.current += 1;
    activeRequest.current?.abort();
    activeRequest.current = null;
    recoveryInFlight.current = false;
    clearPersistedRun(false);
    setPhase("idle");
    setResult(null);
    setMessage("");
    setError("");
    setIssue(null);
    setAttempt(0);
    setStarted(null);
    setElapsed(0);
  }

  function startNew(): void {''',
              "cancel current run",
          )

          hook = replace_once(
              hook,
              '''  function startNew(): void {
    sequence.current += 1;
    recoveryInFlight.current = false;''',
              '''  function startNew(): void {
    sequence.current += 1;
    activeRequest.current?.abort();
    activeRequest.current = null;
    recoveryInFlight.current = false;''',
              "start new cancellation",
          )

          hook = replace_once(
              hook,
              '''    run,
    retry,
    startNew,
  };''',
              '''    run,
    retry,
    cancelCurrent,
    startNew,
  };''',
              "return cancel action",
          )

          hook_path.write_text(hook, encoding="utf-8")

          workspace = workspace_path.read_text(encoding="utf-8")
          workspace = replace_once(
              workspace,
              '''    run,
    retry,
    startNew,
  } = controller;''',
              '''    run,
    retry,
    cancelCurrent,
    startNew,
  } = controller;''',
              "workspace cancel action",
          )

          workspace = replace_once(
              workspace,
              '''          {!compactMobile ? <p className={workspaceStyles.actionNote}>{copy.preflightNote}</p> : null}
        </div>''',
              '''          {running ? <button
            type="button"
            data-assessment-cancel-active-run="true"
            onClick={cancelCurrent}
          >{locale === "es-MX" ? "Detener y limpiar la evaluación actual" : "Stop and clear current assessment"}</button> : null}
          {!compactMobile ? <p className={workspaceStyles.actionNote}>{copy.preflightNote}</p> : null}
        </div>''',
              "form recovery control",
          )

          workspace = replace_once(
              workspace,
              '''      {!runIssue && message ? <p className={workspaceStyles.stateMessage}>{message}</p> : null}

      {running && phase !== "checking" ? <>''',
              '''      {!runIssue && message ? <p className={workspaceStyles.stateMessage}>{message}</p> : null}

      {running ? <div className={workspaceStyles.terminalActions} data-assessment-recovery-actions="true">
        <button type="button" onClick={cancelCurrent} data-assessment-reset-stuck-run="true">
          {locale === "es-MX" ? "Cancelar recuperación y empezar de nuevo" : "Cancel recovery and start over"}
        </button>
      </div> : null}

      {running && phase !== "checking" ? <>''',
              "state-panel recovery control",
          )

          workspace_path.write_text(workspace, encoding="utf-8")

          test_path.write_text('''from __future__ import annotations

from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]
HOOK = ROOT / "apps/web/app/assessment/useAssessmentRun.ts"
WORKSPACE = ROOT / "apps/web/app/assessment/AssessmentWorkspace.tsx"


def test_comprehensive_requests_have_bounded_timeouts_and_cancel_signal() -> None:
    source = HOOK.read_text(encoding="utf-8")
    assert "const READINESS_TIMEOUT_MS = 60_000" in source
    assert "const INTAKE_TIMEOUT_MS = 240_000" in source
    assert "const CONTINUATION_TIMEOUT_MS = 300_000" in source
    assert "const OVERALL_RUN_TIMEOUT_MS = 45 * 60_000" in source
    assert "const controller = new AbortController()" in source
    assert "signal: controller.signal" in source
    assert 'code: "assessment_request_timeout"' in source
    assert 'code: "assessment_cancelled"' in source


def test_stale_run_cannot_trap_refresh_forever() -> None:
    source = HOOK.read_text(encoding="utf-8")
    assert "const ACTIVE_RUN_MAX_AGE_MS = 2 * 60 * 60_000" in source
    assert "Date.now() - persisted.startedAt > ACTIVE_RUN_MAX_AGE_MS" in source
    assert source.count("clearPersistedRun(false)") >= 5
    assert "Date.now() - startedAt >= OVERALL_RUN_TIMEOUT_MS" in source


def test_operator_can_stop_or_reset_a_stuck_run() -> None:
    hook = HOOK.read_text(encoding="utf-8")
    workspace = WORKSPACE.read_text(encoding="utf-8")
    assert "cancelCurrent: () => void" in hook
    assert "function cancelCurrent(): void" in hook
    assert "activeRequest.current?.abort()" in hook
    assert "data-assessment-cancel-active-run=\"true\"" in workspace
    assert "data-assessment-reset-stuck-run=\"true\"" in workspace
    assert "Stop and clear current assessment" in workspace
    assert "Cancel recovery and start over" in workspace


def test_recovery_does_not_create_duplicate_intake() -> None:
    source = HOOK.read_text(encoding="utf-8")
    assert source.count('"/assessment/comprehensive-intake"') == 1
    assert "recoverRun(" in source
    assert "persistExactRun(" in source


if __name__ == "__main__":
    test_comprehensive_requests_have_bounded_timeouts_and_cancel_signal()
    test_stale_run_cannot_trap_refresh_forever()
    test_operator_can_stop_or_reset_a_stuck_run()
    test_recovery_does_not_create_duplicate_intake()
''', encoding="utf-8")
          PY

      - name: Verify focused recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_comprehensive_stuck_run_recovery_contract.py
          python -m compileall -q tests/test_comprehensive_stuck_run_recovery_contract.py

      - name: Commit repair and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/codex-client-ready-run-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix stuck Comprehensive run recovery and bounded timeouts"
          git push origin HEAD:codex/client-ready-run-recovery
