name: Phase 6 Final Regression Fix

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-final-regression-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-6/report-deduplication-security-remediation
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Apply final canonical path and evidence-layer fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          canonical = Path("nico/phase6_canonical_truth_v2.py")
          text = canonical.read_text(encoding="utf-8")
          old = "        index = lowered.find(root.casefold())\n"
          new = "        index = lowered.rfind(root.casefold())\n"
          if old not in text:
              if new not in text:
                  raise SystemExit("canonical path lookup marker missing")
          else:
              text = text.replace(old, new, 1)
          canonical.write_text(text, encoding="utf-8")

          html = Path("nico/comprehensive_decision_grade_html_v5.py")
          text = html.read_text(encoding="utf-8")
          old = "        f\"<dt>Evidence / fact</dt><dd>{_escape(item.get('fact') or item.get('evidence'))}</dd>\"\n"
          new = "        f\"<dt>Layer 1 — Evidence / fact</dt><dd>{_escape(item.get('fact') or item.get('evidence'))}</dd>\"\n"
          if old not in text:
              if new not in text:
                  raise SystemExit("HTML evidence-layer marker missing")
          else:
              text = text.replace(old, new, 1)
          html.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/phase6-final-regression-fix.yml
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-deps -e .
          python -m py_compile nico/phase6_canonical_truth_v2.py nico/comprehensive_decision_grade_html_v5.py
          python -m pytest \
            tests/test_decision_grade_report_surfaces_v1.py::test_markdown_and_html_use_exact_seven_item_executive_register \
            tests/test_phase6_canonical_truth_v2.py::test_absolute_paths_are_repository_relative_and_occurrences_group \
            -q --tb=short
          git add -A
          git diff --cached --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 6: fix final canonical path and HTML evidence regressions"
          git push origin HEAD:phase-6/report-deduplication-security-remediation
