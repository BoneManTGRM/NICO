name: Clean generated metadata from PR 991

on:
  push:
    branches:
      - codex/production-final-context-scanner-truth

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/production-final-context-scanner-truth
          fetch-depth: 0

      - name: Restore generated metadata from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- nico_cyber_defense.egg-info
          rm .github/workflows/codex-pr991-clean-generated.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated package metadata from PR 991"
          git push origin HEAD:codex/production-final-context-scanner-truth

# This no-op edit triggers the cleanup after the workflow exists on the branch.
