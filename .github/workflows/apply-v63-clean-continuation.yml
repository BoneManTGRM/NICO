name: Apply v63 clean continuation

on:
  push:
    branches:
      - codex/exact-head-client-report-coverage-v63

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact continuation head
        uses: actions/checkout@v4
        with:
          ref: codex/exact-head-client-report-coverage-v63
          fetch-depth: 0

      - name: Bind final report rendering to v63
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("nico/client_report_completion_v2.py")
          source = path.read_text(encoding="utf-8")
          old = "from nico.comprehensive_authoritative_scanner_truth_v62 import (\n    reconcile_authoritative_scanner_truth,\n)"
          new = "from nico.comprehensive_authoritative_scanner_truth_v63 import (\n    reconcile_authoritative_scanner_truth,\n)"
          if source.count(old) != 1:
              raise SystemExit(f"expected one v62 import, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run focused exact-run truth tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q nico/comprehensive_authoritative_scanner_truth_v63.py tests/test_comprehensive_authoritative_scanner_truth_v63.py
          python -m pytest -q tests/test_comprehensive_authoritative_scanner_truth_v63.py
          grep -F "comprehensive_authoritative_scanner_truth_v63" nico/client_report_completion_v2.py

      - name: Commit clean continuation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-v63-clean-continuation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind final report rendering to authoritative scanner truth v63"
          git push origin HEAD:codex/exact-head-client-report-coverage-v63
