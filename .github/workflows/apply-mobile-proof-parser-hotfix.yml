name: Apply mobile proof parser hotfix

on:
  push:
    branches:
      - fix/mobile-proof-internal-review-parser

permissions:
  contents: write

jobs:
  patch:
    if: >-
      !contains(github.event.head_commit.message, 'Apply compact mobile proof parser') &&
      !contains(github.event.head_commit.message, 'Remove temporary mobile proof patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mobile-proof-internal-review-parser
          fetch-depth: 0
      - name: Apply exact parser repair
        run: python scripts/apply_mobile_proof_parser_hotfix.py
      - name: Verify parser contracts
        run: |
          python -m py_compile scripts/mobile_restart_live_acceptance_v1.py
          python -m py_compile tests/test_mobile_restart_compact_state_parser_v1.py
          grep -q "querySelectorAll('article, details p')" scripts/mobile_restart_live_acceptance_v1.py
          grep -q 'Internal review required' scripts/mobile_restart_live_acceptance_v1.py
      - name: Commit product-proof repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mobile_restart_live_acceptance_v1.py tests/test_mobile_restart_compact_state_parser_v1.py
          git diff --cached --quiet && exit 0
          git commit -m "Apply compact mobile proof parser"
          git push origin HEAD:fix/mobile-proof-internal-review-parser
