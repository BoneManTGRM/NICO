name: Diagnose Merged Comprehensive Finality c381 v58

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-finality-c381-v58.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ORIGIN: https://app.nicoaudit.com
      RUN_IDS: >-
        comprun_34f1301a6be4491daa5d3d858ff618d7
        comprun_696d5411a63c447380feb75b45840f8b
    steps:
      - name: Check out exact diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch persisted blocked runs and canonical reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          for run_id in ${RUN_IDS}; do
            run_dir="diagnostic/${run_id}"
            mkdir -p "${run_dir}"
            base="${ORIGIN}/api/nico/assessment/comprehensive-run/${run_id}"
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-delay 2 --retry-all-errors --max-time 120 \
              -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
              "${base}" -o "${run_dir}/run-status.json"
            if ! curl --fail-with-body --silent --show-error \
              --retry 1 --retry-delay 2 --retry-all-errors --max-time 60 \
              -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
              "${base}/report/json" -o "${run_dir}/report.json"; then
              rm -f "${run_dir}/report.json"
              printf '%s\n' 'canonical_report_fetch_unavailable' > "${run_dir}/report-fetch-status.txt"
            fi
          done

      - name: Extract exact finality failure truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("diagnostic")
          aggregate = {
              "artifact_schema": "nico.merged_finality_diagnostic.v58",
              "release_sha": "c38133946f11dd899e62542d83e0fa8c5f7662cd",
              "runs": [],
              "read_only": True,
              "human_review_required": True,
              "client_delivery_allowed": False,
          }
          for run_dir in sorted(path for path in root.iterdir() if path.is_dir()):
              status = json.loads((run_dir / "run-status.json").read_text(encoding="utf-8"))
              record = status.get("record") if isinstance(status.get("record"), dict) else status
              stages = record.get("stage_results") if isinstance(record.get("stage_results"), dict) else status.get("stage_results")
              stages = stages if isinstance(stages, dict) else {}
              cross = stages.get("cross_format_truth_verification")
              final = stages.get("final_comprehensive_report_generation")
              canonical = {}
              report_path = run_dir / "report.json"
              if report_path.exists():
                  canonical = json.loads(report_path.read_text(encoding="utf-8"))
              assessment = canonical.get("assessment") if isinstance(canonical.get("assessment"), dict) else {}
              maturity = assessment.get("maturity_signal") if isinstance(assessment.get("maturity_signal"), dict) else {}
              register = canonical.get("findings_register") if isinstance(canonical.get("findings_register"), list) else []
              source_anchors = canonical.get("canonical_source_anchor_register") if isinstance(canonical.get("canonical_source_anchor_register"), list) else []
              run_summary = {
                  "run_id": status.get("run_id") or record.get("identity", {}).get("run_id") or run_dir.name,
                  "status": status.get("status") or record.get("status"),
                  "current_stage": status.get("current_stage") or record.get("current_stage"),
                  "terminal": status.get("terminal", record.get("terminal")),
                  "completed_stages": status.get("completed_stages") or record.get("completed_stages"),
                  "revision": status.get("revision") or record.get("revision"),
                  "cross_format_truth_verification": cross,
                  "final_comprehensive_report_generation": final,
                  "canonical_report_available": bool(canonical),
                  "technical_score": assessment.get("technical_score", maturity.get("technical_score", maturity.get("score"))),
                  "evidence_adjusted_score": assessment.get("canonical_evidence_adjusted_score", assessment.get("evidence_adjusted_score", maturity.get("evidence_adjusted_score"))),
                  "unique_finding_count": canonical.get("unique_finding_count"),
                  "canonical_finding_count": canonical.get("canonical_finding_count"),
                  "findings_register_count": len(register),
                  "source_anchor_register_count": len(source_anchors),
                  "v2_prepublication_contract": canonical.get("v2_prepublication_contract"),
                  "final_projection_contract": canonical.get("final_projection_contract"),
                  "report_quality_contract": canonical.get("report_quality_contract"),
              }
              (run_dir / "diagnostic-summary.json").write_text(
                  json.dumps(run_summary, indent=2, sort_keys=True, default=str) + "\n",
                  encoding="utf-8",
              )
              aggregate["runs"].append(run_summary)
          (root / "diagnostic-summary.json").write_text(
              json.dumps(aggregate, indent=2, sort_keys=True, default=str) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(aggregate, indent=2, sort_keys=True, default=str))
          PY

      - name: Upload immutable diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: merged-finality-c381-v58-${{ github.sha }}
          path: diagnostic/
          if-no-files-found: error
          retention-days: 30
