name: Apply v63 scanner truth import

on:
  push:
    branches:
      - codex/client-report-accuracy-continuation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out continuation branch
        uses: actions/checkout@v4
        with:
          ref: codex/client-report-accuracy-continuation
          fetch-depth: 0

      - name: Bind the core report finalizer to v63
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("nico/client_report_completion_v2.py")
          source = path.read_text(encoding="utf-8")
          old = "from nico.comprehensive_authoritative_scanner_truth_v62 import (\n    reconcile_authoritative_scanner_truth,\n)"
          new = "from nico.comprehensive_authoritative_scanner_truth_v63 import (\n    reconcile_authoritative_scanner_truth,\n)"
          if source.count(old) != 1:
              raise SystemExit(f"expected one v62 import, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify syntax and focused source contract
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q nico/comprehensive_authoritative_scanner_truth_v63.py tests/test_comprehensive_authoritative_scanner_truth_v63.py
          grep -F "comprehensive_authoritative_scanner_truth_v63" nico/client_report_completion_v2.py

      - name: Commit import update and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-client-report-v63-import.yml
          rm -f docs/.client-report-accuracy-diagnostic-trigger docs/.client-report-accuracy-pr-ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind final report rendering to authoritative scanner truth v63"
          git push origin HEAD:codex/client-report-accuracy-continuation
