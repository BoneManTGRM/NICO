name: Apply single-pass final report repair

on:
  push:
    branches:
      - codex/atomic-final-report-publication-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/atomic-final-report-publication-v2
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Apply production repair
        shell: bash
        run: |
          set -euo pipefail
          echo "The implementation body is retained from the preceding commit."
          git show HEAD^:.github/workflows/codex-final-report-single-pass-repair.yml > /tmp/original-workflow.yml
          python - <<'PY'
          from pathlib import Path
          current = Path('.github/workflows/codex-final-report-single-pass-repair.yml')
          original = Path('/tmp/original-workflow.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply production repair\n'
          start = original.index(marker)
          body = original[start:]
          # Execute the original implementation script by replacing this compact trigger
          # workflow in the working tree, then extracting and running its Apply step.
          Path('/tmp/original-body.txt').write_text(body, encoding='utf-8')
          PY
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          text = Path('/tmp/original-workflow.yml').read_text(encoding='utf-8')
          match = re.search(r"      - name: Apply production repair\n        shell: bash\n        run: \|\n(?P<body>.*?)(?=\n      - name: Run focused regression suite)", text, re.S)
          if not match:
              raise SystemExit('original apply step not found')
          lines = match.group('body').splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-repair.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/apply-repair.sh'], check=True)
          PY

      - name: Run focused regression suite
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_comprehensive_pre_render_scanner_truth_v65.py \
            tests/test_comprehensive_final_report_execution_boundary_v4.py \
            tests/test_comprehensive_run_service.py \
            tests/test_comprehensive_runtime.py \
            tests/test_cross_format_production_truth_v2.py \
            tests/test_comprehensive_final_report_execution_scanner_truth_v5.py \
            tests/test_comprehensive_pre_render_scanner_truth_v64.py \
            tests/test_comprehensive_pre_render_unknown_evidence_v64.py

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/codex-final-report-single-pass-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            nico/comprehensive_pre_render_scanner_truth_v65.py \
            nico/comprehensive_final_report_execution_boundary_v4.py \
            nico/comprehensive_run_service.py \
            nico/comprehensive_final_report_execution_v1.py \
            nico/comprehensive_report_package.py \
            tests/test_comprehensive_pre_render_scanner_truth_v65.py \
            tests/test_comprehensive_final_report_execution_boundary_v4.py \
            tests/test_comprehensive_run_service.py \
            tests/test_comprehensive_runtime.py
          git commit -m "Make final report publication atomic and single-pass"
          git push origin HEAD:codex/atomic-final-report-publication-v2
