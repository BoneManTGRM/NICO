name: Apply single-pass final report repair

on:
  push:
    branches:
      - codex/atomic-final-report-publication-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/atomic-final-report-publication-v2
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .

      - name: Apply production repair
        shell: bash
        run: |
          set -euo pipefail

          cat > nico/comprehensive_pre_render_scanner_truth_v65.py <<'PY'
          from __future__ import annotations

          import re
          import sys
          import time
          from functools import wraps
          from typing import Any, Mapping

          from nico import comprehensive_client_readiness_v59 as v59

          VERSION = "nico.comprehensive_pre_render_scanner_truth.v65"
          _INSTALL_MARKER = "_nico_pre_render_scanner_truth_v65"
          _MANIFEST_KEY = "pre_render_scanner_truth"
          _DROP = object()

          _STRICT_INCOMPLETE_LIST_FIELDS = frozenset(
              {"incomplete_analyzers", "incomplete_scanners", "failed_analyzers", "failed_scanners"}
          )
          _BLOCKER_LIST_FIELDS = frozenset(
              {"analyzer_evidence_blockers", "scanner_evidence_blockers"}
          )
          _INCOMPLETE_COUNT_FIELDS = frozenset(
              {
                  "incomplete_applicable_analyzers",
                  "incomplete_applicable_scanners",
                  "incomplete_analyzer_count",
                  "incomplete_scanner_count",
              }
          )
          _COMPLETED_COUNT_FIELDS = frozenset(
              {
                  "completed_applicable_analyzers",
                  "completed_applicable_scanners",
                  "completed_analyzer_count",
                  "completed_scanner_count",
              }
          )
          _HEAVY_FIELDS = frozenset(
              {
                  "pdf_base64",
                  "html",
                  "markdown",
                  "report_package",
                  "reports",
                  "raw_output",
                  "stdout",
                  "stderr",
                  "file_contents",
                  "source_contents",
                  "scanner_results",
              }
          )
          _RELEVANT_STAGE_IDS = frozenset(
              {
                  "dependency_security_static_analysis",
                  "evidence_reconciliation_and_scoring",
                  "decision_report_generation",
                  "deep_scanner_triage",
                  "risk_reduction_and_executive_briefing",
              }
          )
          _COVERAGE_KEY_RE = re.compile(
              r"(?:analy[sz]er|scanner).*(?:coverage|completion)|"
              r"(?:coverage|completion).*(?:analy[sz]er|scanner)",
              re.I,
          )
          _STALE_FLATTENED_PATH_RE = re.compile(
              r"(?P<label>(?:^|[.\s]))incomplete_(?:analyzers|scanners)"
              r"\[\d+\]\s*[:=]\s*(?P<value>[^\n]+)",
              re.I,
          )
          _REQUIRED_TOOLS = frozenset(
              {
                  "pip-audit",
                  "npm-audit",
                  "osv-scanner",
                  "bandit",
                  "semgrep",
                  "eslint",
                  "typescript",
                  "gitleaks",
                  "trufflehog",
              }
          )
          _MAX_DISCOVERY_VISITS = 12_000
          _MAX_SANITIZE_VISITS = 40_000
          _MAX_GENERIC_LIST_SCAN = 1_000


          def _text(value: Any) -> str:
              return " ".join(str(value or "").split()).strip()


          def _mapping(value: Any) -> Mapping[str, Any]:
              return value if isinstance(value, Mapping) else {}


          def _safe_int(value: Any) -> int:
              try:
                  return max(0, int(value or 0))
              except (TypeError, ValueError):
                  return 0


          def _names(value: Any) -> set[str]:
              if not isinstance(value, (list, tuple, set)):
                  return set()
              output: set[str] = set()
              for item in value:
                  name = v59._tool(item)
                  if name:
                      output.add(name)
              return output


          def _existing_manifest(stage_results: Mapping[str, Any]) -> Mapping[str, Any]:
              direct = stage_results.get(_MANIFEST_KEY)
              if isinstance(direct, Mapping) and direct.get("pre_flatten_truth_enforced") is True:
                  return direct
              for stage_id in ("evidence_reconciliation_and_scoring", "dependency_security_static_analysis"):
                  stage = _mapping(stage_results.get(stage_id))
                  evidence = _mapping(stage.get("evidence"))
                  manifest = evidence.get(_MANIFEST_KEY)
                  if isinstance(manifest, Mapping) and manifest.get("pre_flatten_truth_enforced") is True:
                      return manifest
              return {}


          def _relevant_roots(stage_results: Mapping[str, Any]) -> list[Mapping[str, Any]]:
              roots: list[Mapping[str, Any]] = []
              for stage_id in _RELEVANT_STAGE_IDS:
                  stage = stage_results.get(stage_id)
                  if isinstance(stage, Mapping):
                      roots.append(stage)
              return roots


          def _discover_mappings(
              roots: list[Mapping[str, Any]],
              key_name: str,
          ) -> list[Mapping[str, Any]]:
              output: list[Mapping[str, Any]] = []
              stack: list[Any] = list(reversed(roots))
              visits = 0
              while stack and visits < _MAX_DISCOVERY_VISITS:
                  node = stack.pop()
                  visits += 1
                  if isinstance(node, Mapping):
                      for raw_key, value in node.items():
                          key = str(raw_key)
                          if key == key_name and isinstance(value, Mapping):
                              output.append(value)
                          if key.casefold() in _HEAVY_FIELDS:
                              continue
                          if isinstance(value, Mapping):
                              stack.append(value)
                          elif isinstance(value, list) and len(value) <= 250:
                              stack.extend(reversed(value))
                  elif isinstance(node, list) and len(node) <= 250:
                      stack.extend(reversed(node))
              return output


          def _direct_contract_candidates(stage_results: Mapping[str, Any]) -> list[Mapping[str, Any]]:
              candidates: list[Mapping[str, Any]] = []
              for stage_id in ("evidence_reconciliation_and_scoring", "decision_report_generation"):
                  stage = _mapping(stage_results.get(stage_id))
                  for container in (stage, _mapping(stage.get("assessment")), _mapping(stage.get("evidence"))):
                      value = container.get("client_readiness_contract")
                      if isinstance(value, Mapping):
                          candidates.append(value)
              return candidates


          def _best_contract(stage_results: Mapping[str, Any]) -> Mapping[str, Any]:
              candidates = _direct_contract_candidates(stage_results)
              if not candidates:
                  candidates = _discover_mappings(_relevant_roots(stage_results), "client_readiness_contract")
              if not candidates:
                  return {}

              def quality(contract: Mapping[str, Any]) -> tuple[int, int, int]:
                  return (
                      1 if _text(contract.get("authoritative_source")) else 0,
                      _safe_int(contract.get("coverage_denominator")),
                      len(_names(contract.get("requested_exact_run_scanners"))),
                  )

              return max(candidates, key=quality)


          def _live_manifest(stage_results: Mapping[str, Any]) -> Mapping[str, Any]:
              dependency = _mapping(stage_results.get("dependency_security_static_analysis"))
              for candidate in (
                  dependency.get("scanner"),
                  _mapping(dependency.get("evidence")).get("scanner"),
                  _mapping(stage_results.get("deep_scanner_triage")).get("scanner_triage"),
              ):
                  if isinstance(candidate, Mapping) and any(
                      field in candidate
                      for field in (
                          "tools_requested",
                          "tools_run",
                          "failed_tools",
                          "unavailable_tools",
                          "timed_out_tools",
                      )
                  ):
                      return candidate
              for key in ("live_scanner_evidence", "scanner_run_summary", "scanner"):
                  candidates = _discover_mappings(_relevant_roots(stage_results), key)
                  for candidate in candidates:
                      if any(
                          field in candidate
                          for field in (
                              "tools_requested",
                              "tools_run",
                              "failed_tools",
                              "unavailable_tools",
                              "timed_out_tools",
                          )
                      ):
                          return candidate
              return {}


          def _scanner_records(stage_results: Mapping[str, Any]) -> list[Mapping[str, Any]]:
              candidates: list[list[Mapping[str, Any]]] = []
              for root in _relevant_roots(stage_results):
                  direct = root.get("scanner_execution_records")
                  if isinstance(direct, list):
                      records = [item for item in direct if isinstance(item, Mapping)]
                      if records:
                          candidates.append(records)
              if not candidates:
                  stack: list[Any] = _relevant_roots(stage_results)
                  visits = 0
                  while stack and visits < _MAX_DISCOVERY_VISITS:
                      node = stack.pop()
                      visits += 1
                      if not isinstance(node, Mapping):
                          continue
                      for raw_key, value in node.items():
                          key = str(raw_key)
                          if key == "scanner_execution_records" and isinstance(value, list):
                              records = [item for item in value if isinstance(item, Mapping)]
                              if records:
                                  candidates.append(records)
                          if key.casefold() in _HEAVY_FIELDS:
                              continue
                          if isinstance(value, Mapping):
                              stack.append(value)
                          elif isinstance(value, list) and len(value) <= 250:
                              stack.extend(item for item in value if isinstance(item, Mapping))
              return max(candidates, key=len) if candidates else []


          def derive_authoritative_scanner_truth(stage_results: Mapping[str, Any]) -> dict[str, Any]:
              requested: set[str] = set()
              completed: set[str] = set()
              hard_incomplete: set[str] = set()
              soft_incomplete: set[str] = set()
              sources: list[str] = []

              records = _scanner_records(stage_results)
              if records:
                  sources.append("direct_scanner_execution_records")
              for record in records:
                  state = v59._scanner_state(record)
                  if state is None:
                      continue
                  name = str(state["scanner_name"])
                  requested.add(name)
                  if state.get("completed") is True:
                      completed.add(name)
                  else:
                      hard_incomplete.add(name)

              live = _live_manifest(stage_results)
              if live:
                  sources.append("live_scanner_manifest")
              live_requested = _names(live.get("tools_requested"))
              live_run = _names(live.get("tools_run"))
              live_failed = (
                  _names(live.get("failed_tools"))
                  | _names(live.get("unavailable_tools"))
                  | _names(live.get("timed_out_tools"))
              )
              requested |= live_requested | live_run | live_failed
              completed |= live_run - live_failed
              hard_incomplete |= live_failed

              contract = _best_contract(stage_results)
              if contract:
                  sources.append("client_readiness_contract")
              contract_requested = _names(contract.get("requested_exact_run_scanners"))
              contract_completed = _names(contract.get("completed_exact_commit_scanners"))
              contract_incomplete = _names(contract.get("incomplete_analyzers"))
              requested |= contract_requested | contract_completed | contract_incomplete
              completed |= contract_completed
              soft_incomplete |= contract_incomplete

              completed -= hard_incomplete
              incomplete = hard_incomplete | (soft_incomplete - completed) | (requested - completed)
              if requested == _REQUIRED_TOOLS:
                  requested = set(_REQUIRED_TOOLS)
              coverage = round(100 * len(completed & requested) / len(requested)) if requested else 0
              return {
                  "version": VERSION,
                  "requested": sorted(requested),
                  "completed": sorted(completed & requested),
                  "incomplete": sorted(incomplete & requested),
                  "coverage": coverage,
                  "authoritative_sources": sources,
                  "truth_available": bool(requested),
                  "human_review_required": True,
                  "client_delivery_allowed": False,
              }


          def _entry_tool(value: Any, requested: set[str]) -> str:
              name = v59._tool(value)
              if name in requested:
                  return name
              text = _text(value).casefold().replace("_", "-")
              for candidate in sorted(requested, key=len, reverse=True):
                  if re.search(rf"(?<![a-z0-9-]){re.escape(candidate)}(?![a-z0-9-])", text):
                      return candidate
              return ""


          def _sanitize_text(
              value: str,
              *,
              requested: set[str],
              incomplete: set[str],
              removed: list[str],
              path: str,
          ) -> Any:
              match = _STALE_FLATTENED_PATH_RE.search(value)
              if not match or not requested:
                  return value
              name = _entry_tool(match.group("value"), requested)
              if not name or name in incomplete:
                  return value
              removed.append(path or "<flattened-text>")
              return _DROP


          def _sanitize_node(
              node: Any,
              *,
              requested: set[str],
              completed: set[str],
              incomplete: set[str],
              coverage: int,
              removed: list[str],
              visits: list[int],
              path: str,
              key_hint: str = "",
              depth: int = 0,
          ) -> tuple[Any, bool]:
              visits[0] += 1
              if visits[0] > _MAX_SANITIZE_VISITS or depth > 10:
                  return node, False
              if isinstance(node, str):
                  sanitized = _sanitize_text(
                      node,
                      requested=requested,
                      incomplete=incomplete,
                      removed=removed,
                      path=path,
                  )
                  return sanitized, sanitized is not node
              if isinstance(node, list):
                  if len(node) > _MAX_GENERIC_LIST_SCAN and key_hint not in (
                      _STRICT_INCOMPLETE_LIST_FIELDS | _BLOCKER_LIST_FIELDS
                  ):
                      return node, False
                  output: list[Any] | None = None
                  for index, item in enumerate(node):
                      sanitized, changed = _sanitize_node(
                          item,
                          requested=requested,
                          completed=completed,
                          incomplete=incomplete,
                          coverage=coverage,
                          removed=removed,
                          visits=visits,
                          path=f"{path}[{index}]",
                          key_hint=key_hint,
                          depth=depth + 1,
                      )
                      if changed and output is None:
                          output = list(node[:index])
                      if output is not None and sanitized is not _DROP:
                          output.append(sanitized)
                  return (output if output is not None else node), output is not None
              if not isinstance(node, Mapping):
                  return node, False

              output: dict[str, Any] | None = None
              items = list(node.items())
              for index, (raw_key, raw_value) in enumerate(items):
                  key = str(raw_key)
                  normalized = key.casefold()
                  current_path = f"{path}.{key}"
                  replacement: Any = raw_value
                  changed = False

                  if normalized in _HEAVY_FIELDS:
                      pass
                  elif normalized in _STRICT_INCOMPLETE_LIST_FIELDS and isinstance(raw_value, list) and requested:
                      retained: list[Any] = []
                      for item_index, item in enumerate(raw_value):
                          name = _entry_tool(item, requested)
                          if name and name not in incomplete:
                              removed.append(f"{current_path}[{item_index}]")
                              changed = True
                              continue
                          retained.append(item)
                      replacement = retained if changed else raw_value
                  elif normalized in _BLOCKER_LIST_FIELDS and isinstance(raw_value, list) and requested:
                      retained = []
                      for item_index, item in enumerate(raw_value):
                          name = _entry_tool(item, requested)
                          if name and name not in incomplete:
                              removed.append(f"{current_path}[{item_index}]")
                              changed = True
                              continue
                          retained.append(item)
                      replacement = retained if changed else raw_value
                  elif normalized in _INCOMPLETE_COUNT_FIELDS and requested:
                      replacement = len(incomplete)
                      changed = replacement != raw_value
                  elif normalized in _COMPLETED_COUNT_FIELDS and requested:
                      replacement = len(completed)
                      changed = replacement != raw_value
                  elif (
                      requested
                      and _COVERAGE_KEY_RE.search(key)
                      and isinstance(raw_value, (int, float))
                      and not isinstance(raw_value, bool)
                  ):
                      replacement = coverage
                      changed = replacement != raw_value
                  else:
                      replacement, changed = _sanitize_node(
                          raw_value,
                          requested=requested,
                          completed=completed,
                          incomplete=incomplete,
                          coverage=coverage,
                          removed=removed,
                          visits=visits,
                          path=current_path,
                          key_hint=normalized,
                          depth=depth + 1,
                      )

                  if changed and output is None:
                      output = {str(k): v for k, v in items[:index]}
                  if output is not None and replacement is not _DROP:
                      output[key] = replacement
              return (output if output is not None else node), output is not None


          def _embed_manifest(stage_results: Mapping[str, Any], manifest: Mapping[str, Any]) -> dict[str, Any]:
              output = dict(stage_results)
              stage_id = (
                  "evidence_reconciliation_and_scoring"
                  if isinstance(stage_results.get("evidence_reconciliation_and_scoring"), Mapping)
                  else "dependency_security_static_analysis"
              )
              stage = _mapping(stage_results.get(stage_id))
              stage_copy = dict(stage)
              evidence = _mapping(stage.get("evidence"))
              evidence_copy = dict(evidence)
              evidence_copy[_MANIFEST_KEY] = dict(manifest)
              stage_copy["evidence"] = evidence_copy
              output[stage_id] = stage_copy
              return output


          def canonicalize_stage_results_before_render(
              stage_results: Mapping[str, Any],
          ) -> tuple[dict[str, Any], dict[str, Any]]:
              started = time.perf_counter()
              existing = _existing_manifest(stage_results)
              if existing:
                  manifest = dict(existing)
                  manifest.update(
                      {
                          "status": "already_applied",
                          "duplicate_canonicalization_skipped": True,
                          "canonicalization_elapsed_ms": round((time.perf_counter() - started) * 1000, 3),
                      }
                  )
                  return dict(stage_results), manifest

              truth = derive_authoritative_scanner_truth(stage_results)
              if truth["truth_available"] is not True:
                  return dict(stage_results), {
                      **truth,
                      "status": "not_applied_no_authoritative_scanner_population",
                      "removed_stale_alias_count": 0,
                      "removed_stale_alias_paths": [],
                      "canonicalization_elapsed_ms": round((time.perf_counter() - started) * 1000, 3),
                  }

              requested = set(truth["requested"])
              completed = set(truth["completed"])
              incomplete = set(truth["incomplete"])
              removed: list[str] = []
              visits = [0]
              output = dict(stage_results)
              changed_stages = 0
              for stage_id, stage in stage_results.items():
                  if stage_id not in _RELEVANT_STAGE_IDS or not isinstance(stage, Mapping):
                      continue
                  sanitized, changed = _sanitize_node(
                      stage,
                      requested=requested,
                      completed=completed,
                      incomplete=incomplete,
                      coverage=int(truth["coverage"]),
                      removed=removed,
                      visits=visits,
                      path=f"stage_results.{stage_id}",
                      key_hint=stage_id,
                  )
                  if changed:
                      output[stage_id] = sanitized
                      changed_stages += 1

              manifest = {
                  **truth,
                  "status": "applied",
                  "removed_stale_alias_count": len(removed),
                  "removed_stale_alias_paths": removed[:100],
                  "pre_flatten_truth_enforced": True,
                  "duplicate_canonicalization_skipped": False,
                  "copy_on_write": True,
                  "changed_stage_count": changed_stages,
                  "nodes_visited": visits[0],
                  "traversal_bounded": visits[0] <= _MAX_SANITIZE_VISITS,
                  "canonicalization_elapsed_ms": round((time.perf_counter() - started) * 1000, 3),
                  "unknown_evidence_preserved_fail_closed": True,
                  "large_artifacts_not_copied_or_scanned": True,
                  "raw_stage_evidence_mutated": False,
                  "report_design_changed": False,
                  "scores_changed": False,
                  "scanner_results_changed": False,
                  "human_review_required": True,
                  "client_delivery_allowed": False,
              }
              return _embed_manifest(output, manifest), manifest


          def _attach_manifest(result: dict[str, Any], manifest: Mapping[str, Any]) -> dict[str, Any]:
              manifest_copy = dict(manifest)
              output = dict(result)
              output[_MANIFEST_KEY] = manifest_copy
              package = output.get("report_package")
              if isinstance(package, Mapping):
                  package_copy = dict(package)
                  package_copy[_MANIFEST_KEY] = dict(manifest_copy)
                  canonical = package_copy.get("json")
                  if isinstance(canonical, Mapping):
                      canonical_copy = dict(canonical)
                      canonical_copy[_MANIFEST_KEY] = dict(manifest_copy)
                      package_copy["json"] = canonical_copy
                  output["report_package"] = package_copy
              assessment = output.get("assessment")
              if isinstance(assessment, Mapping):
                  assessment_copy = dict(assessment)
                  assessment_copy[_MANIFEST_KEY] = dict(manifest_copy)
                  output["assessment"] = assessment_copy
              return output


          def install_pre_render_authoritative_scanner_truth() -> bool:
              from nico import comprehensive_report_package as report_module

              current = report_module.build_comprehensive_report_package
              if getattr(current, _INSTALL_MARKER, False):
                  return False

              @wraps(current)
              def build(
                  *,
                  identity: dict[str, Any],
                  stage_results: dict[str, dict[str, Any]],
              ) -> dict[str, Any]:
                  sanitized, manifest = canonicalize_stage_results_before_render(stage_results)
                  result = current(identity=identity, stage_results=sanitized)
                  return _attach_manifest(result, manifest)

              setattr(build, _INSTALL_MARKER, True)
              setattr(build, "_nico_original_builder", current)
              report_module.build_comprehensive_report_package = build
              native = sys.modules.get("nico.comprehensive_native_providers")
              if native is not None:
                  setattr(native, "build_comprehensive_report_package", build)
              return True


          __all__ = [
              "VERSION",
              "canonicalize_stage_results_before_render",
              "derive_authoritative_scanner_truth",
              "install_pre_render_authoritative_scanner_truth",
          ]
          PY

          cat > nico/comprehensive_final_report_execution_boundary_v4.py <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import os
          import queue
          import threading
          import time
          from copy import deepcopy
          from typing import Any, Mapping

          VERSION = "nico.comprehensive_final_report_execution_boundary.v4"
          FINAL_REPORT_STAGE_ID = "final_comprehensive_report_generation"
          DEFAULT_FINAL_REPORT_TIMEOUT_SECONDS = 240


          def _text(value: Any) -> str:
              return " ".join(str(value or "").split()).strip()


          def _timeout_seconds(value: int | None) -> int:
              if value is not None:
                  return max(1, min(900, int(value)))
              try:
                  configured = int(
                      os.getenv(
                          "NICO_COMPREHENSIVE_FINAL_REPORT_TIMEOUT_SECONDS",
                          str(DEFAULT_FINAL_REPORT_TIMEOUT_SECONDS),
                      )
                  )
              except (TypeError, ValueError):
                  configured = DEFAULT_FINAL_REPORT_TIMEOUT_SECONDS
              return max(30, min(900, configured))


          def _blocked(
              context: Mapping[str, Any],
              *,
              reason: str,
              message: str,
              execution: Mapping[str, Any] | None = None,
          ) -> dict[str, Any]:
              return {
                  "status": "blocked",
                  "reason": reason,
                  "error_code": reason,
                  "error_message": message,
                  "technical_reason": f"{reason}:stage={FINAL_REPORT_STAGE_ID}",
                  "retryable": True,
                  "cancelable": True,
                  "artifacts_available": False,
                  "run_id": _text(context.get("run_id")),
                  "repository": _text(context.get("repository")),
                  "commit_sha": _text(context.get("commit_sha")),
                  "evidence_ledger_id": _text(context.get("evidence_ledger_id")),
                  "human_review_required": True,
                  "client_delivery_allowed": False,
                  "stage_execution": {
                      **dict(execution or {}),
                      "artifact_schema": VERSION,
                      "mode": "atomic_final_report_publication",
                      "canonical_run_write_required": True,
                      "detached_background_execution": False,
                  },
              }


          def _exact_identity_matches(value: Mapping[str, Any], context: Mapping[str, Any]) -> bool:
              for field in ("run_id", "repository", "commit_sha", "evidence_ledger_id"):
                  expected = _text(context.get(field))
                  observed = _text(value.get(field))
                  if expected and observed and expected != observed:
                      return False
              return True


          def _validate_package(
              package: Mapping[str, Any],
              context: Mapping[str, Any],
          ) -> tuple[bool, str, dict[str, Any]]:
              report_id = _text(package.get("report_id"))
              markdown = str(package.get("markdown") or "")
              rendered_html = str(package.get("html") or "")
              pdf_base64 = _text(package.get("pdf_base64"))
              canonical_json = package.get("json")
              if not report_id:
                  return False, "final_report_id_missing", {}
              if not markdown.strip():
                  return False, "final_report_markdown_missing", {}
              if not rendered_html.strip():
                  return False, "final_report_html_missing", {}
              if not isinstance(canonical_json, Mapping):
                  return False, "final_report_json_missing", {}
              if not pdf_base64:
                  return False, "final_report_pdf_missing", {}
              try:
                  pdf = base64.b64decode(pdf_base64, validate=True)
              except Exception:
                  return False, "final_report_pdf_invalid_base64", {}
              if not pdf.startswith(b"%PDF"):
                  return False, "final_report_pdf_invalid", {}
              identity = (
                  canonical_json.get("identity")
                  if isinstance(canonical_json.get("identity"), Mapping)
                  else canonical_json
              )
              if isinstance(identity, Mapping) and not _exact_identity_matches(identity, context):
                  return False, "final_report_identity_mismatch", {}
              return True, "", {
                  "report_id": report_id,
                  "pdf_page_count": package.get("pdf_page_count"),
                  "pdf_sha256": _text(package.get("pdf_sha256")) or hashlib.sha256(pdf).hexdigest(),
                  "markdown_sha256": _text(package.get("markdown_sha256"))
                  or hashlib.sha256(markdown.encode("utf-8")).hexdigest(),
                  "html_sha256": _text(package.get("html_sha256"))
                  or hashlib.sha256(rendered_html.encode("utf-8")).hexdigest(),
                  "canonical_truth_sha256": _text(package.get("canonical_truth_sha256")),
                  "exact_run_identity_verified": True,
                  "pdf_valid": True,
                  "markdown_available": True,
                  "html_available": True,
                  "json_available": True,
              }


          def _execute_bounded(executor, context: Mapping[str, Any], limit: int) -> tuple[str, Any, float]:
              results: queue.Queue[tuple[str, Any]] = queue.Queue(maxsize=1)
              started = time.perf_counter()

              def invoke() -> None:
                  try:
                      # The run service already created an isolated context. The final-report
                      # canonicalizer is copy-on-write, so another full evidence-tree deepcopy
                      # would only multiply large-payload latency.
                      results.put_nowait(("result", executor(dict(context))))
                  except BaseException as exc:
                      try:
                          results.put_nowait(("error", exc))
                      except queue.Full:
                          pass

              worker = threading.Thread(
                  target=invoke,
                  name="nico-atomic-final-report",
                  daemon=True,
              )
              worker.start()
              worker.join(limit)
              elapsed = round(time.perf_counter() - started, 3)
              if worker.is_alive():
                  return "timeout", None, elapsed
              kind, value = results.get_nowait()
              return kind, value, elapsed


          def execute_final_report_stage(
              executor,
              context: Mapping[str, Any],
              *,
              timeout_seconds: int | None = None,
          ) -> dict[str, Any]:
              limit = _timeout_seconds(timeout_seconds)
              kind, value, elapsed = _execute_bounded(executor, context, limit)
              execution = {
                  "artifact_schema": VERSION,
                  "mode": "atomic_final_report_publication",
                  "execution_timeout_seconds": limit,
                  "elapsed_seconds": elapsed,
                  "detached_background_execution": False,
                  "full_context_deepcopy_skipped": True,
              }
              if kind == "timeout":
                  return _blocked(
                      context,
                      reason="final_report_execution_timeout",
                      message=f"Final report generation exceeded the {limit}-second bounded publication window.",
                      execution=execution,
                  )
              if kind == "error":
                  raise value
              if not isinstance(value, Mapping):
                  return _blocked(
                      context,
                      reason="final_report_provider_invalid_result",
                      message="The final report provider did not return a structured result.",
                      execution=execution,
                  )

              output = dict(value)
              prior_execution = (
                  output.get("stage_execution")
                  if isinstance(output.get("stage_execution"), Mapping)
                  else {}
              )
              execution = {**dict(prior_execution), **execution, "completed_within_boundary": True}
              status = _text(output.get("status")).casefold()
              if status != "complete":
                  output.setdefault("run_id", _text(context.get("run_id")))
                  output.setdefault("repository", _text(context.get("repository")))
                  output.setdefault("commit_sha", _text(context.get("commit_sha")))
                  output.setdefault("evidence_ledger_id", _text(context.get("evidence_ledger_id")))
                  output["human_review_required"] = True
                  output["client_delivery_allowed"] = False
                  output["stage_execution"] = execution
                  return output
              if not _exact_identity_matches(output, context):
                  return _blocked(
                      context,
                      reason="final_report_result_identity_mismatch",
                      message="The final report provider result did not match the exact run identity.",
                      execution=execution,
                  )
              package = output.get("report_package")
              if not isinstance(package, Mapping):
                  return _blocked(
                      context,
                      reason="final_report_package_missing",
                      message="The final report provider completed without a retained report package.",
                      execution=execution,
                  )
              valid, reason, evidence = _validate_package(package, context)
              if not valid:
                  return _blocked(
                      context,
                      reason=reason,
                      message=f"The final report package failed validation: {reason}.",
                      execution=execution,
                  )
              output["run_id"] = _text(context.get("run_id"))
              output["repository"] = _text(context.get("repository"))
              output["commit_sha"] = _text(context.get("commit_sha"))
              output["evidence_ledger_id"] = _text(context.get("evidence_ledger_id"))
              output["report_package"] = dict(package)
              output["artifacts_available"] = True
              output["human_review_required"] = True
              output["client_delivery_allowed"] = False
              output["stage_execution"] = {
                  **execution,
                  "canonical_run_write_required": True,
                  "canonical_run_written_only_by_request_thread": True,
                  "artifact_validation_complete": True,
                  "exact_identity_verified": True,
              }
              retained = output.get("evidence") if isinstance(output.get("evidence"), Mapping) else {}
              output["evidence"] = {**dict(retained), **evidence}
              return output


          __all__ = [
              "DEFAULT_FINAL_REPORT_TIMEOUT_SECONDS",
              "FINAL_REPORT_STAGE_ID",
              "VERSION",
              "execute_final_report_stage",
          ]
