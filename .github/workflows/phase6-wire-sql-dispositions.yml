name: Phase 6 Wire SQL Dispositions

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-wire-sql-dispositions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-6/report-deduplication-security-remediation
          fetch-depth: 0
          persist-credentials: true
      - name: Wire source-reviewed SQL dispositions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nico/phase6_canonical_truth_v2.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          import_line = "from nico.phase6_sql_dispositions_v1 import disposition_for, source_review_coverage"
          if import_line not in lines:
              marker = "from nico import phase6_final_remediation_v1 as phase6"
              index = lines.index(marker)
              lines.insert(index + 1, import_line)

          start = next(
              index
              for index, line in enumerate(lines)
              if line.strip().startswith("if path in phase6._SQL_DISPOSITIONS")
          )
          end = start + 1
          while end < len(lines) and (
              lines[end].startswith("        ")
              or not lines[end].strip()
          ):
              if not lines[end].strip():
                  break
              end += 1
          lines[start:end] = [
              "    disposition = disposition_for(path, analyzer_message)",
              "    if disposition:",
              "        item[\"disposition\"] = disposition",
              "        item[\"status\"] = \"approved_nonblocking\"",
              "        item[\"priority\"] = \"P3\"",
              "        item[\"executive_title\"] = \"Source-reviewed SQL construction\"",
              "        item[\"title\"] = \"Source-reviewed SQL construction\"",
              "        item[\"technical_summary\"] = disposition[\"rationale\"]",
              "        item[\"recommendation\"] = disposition[\"verification\"]",
          ]

          coverage_line = '    output["sql_source_review_coverage"] = source_review_coverage()'
          if coverage_line not in lines:
              marker = '    output["canonical_assessment_model"] = VERSION'
              index = lines.index(marker)
              lines.insert(index, coverage_line)

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          rm -f .github/workflows/phase6-wire-sql-dispositions.yml
          python -m py_compile nico/phase6_sql_dispositions_v1.py nico/phase6_canonical_truth_v2.py
          git add -A
          git diff --cached --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 6: wire source-reviewed SQL dispositions"
          git push origin HEAD:phase-6/report-deduplication-security-remediation
