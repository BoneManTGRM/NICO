name: SARA Pilot Bridge Preflight

on:
  push:
    branches:
      - ops/sara-pilot-final-review-bridge
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sara-pilot-bridge-preflight
  cancel-in-progress: true

jobs:
  exact-retained-report-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out bridge branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Verify exact retained SARA report truth
        run: node scripts/sara_pilot_bridge_preflight.mjs