name: Diagnose Spanish runtime v2

on:
  push:
    branches:
      - fix/spanish-final-report-complete-v2

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FRONTEND_URL: https://app.nicoaudit.com
      RUN_ID: comprun_bbe34d179144418288979d08a4f6e0ad
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Capture bounded production failure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/json' \
            -H 'Cache-Control: no-store' \
            "${FRONTEND_URL}/api/nico/assessment/comprehensive-run/${RUN_ID}?diagnostic_probe=${GITHUB_RUN_ID}" \
            -o /tmp/run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload=json.loads(Path('/tmp/run.json').read_text())
          record=payload.get('record') if isinstance(payload.get('record'),dict) else payload
          stage_results=record.get('stage_results') if isinstance(record.get('stage_results'),dict) else {}
          final=stage_results.get('final_comprehensive_report_generation')
          if not isinstance(final,dict):
              final={}
          keys=(
              'status','reason','error_code','error_message','retryable','cancelable',
              'worker_model','worker_exit_code','worker_exit_signal','worker_error_type',
              'worker_error','worker_failure_class','worker_bootstrap',
              'worker_diagnostics_bounded','worker_traceback_exposed',
              'publication_status','publication_lease_id','lease_id','stage_progress_percent',
          )
          output={
              'run_id': os.environ['RUN_ID'],
              'http_payload_operation': payload.get('operation'),
              'status': record.get('status'),
              'terminal': record.get('terminal'),
              'current_stage': record.get('current_stage'),
              'progress_percent': record.get('progress_percent'),
              'completed_stage_count': len(record.get('completed_stages') or []),
              'identity': record.get('identity'),
              'active_stage_execution': record.get('active_stage_execution'),
              'final_stage': {k: final.get(k) for k in keys if k in final},
              'final_stage_keys': sorted(str(k) for k in final.keys()),
              'top_level_keys': sorted(str(k) for k in record.keys()),
          }
          print(json.dumps(output, indent=2, sort_keys=True, ensure_ascii=False))
          PY
