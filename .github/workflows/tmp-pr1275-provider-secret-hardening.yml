name: Temporary PR 1275 provider secret hardening

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-pr1275-provider-secret-hardening
  cancel-in-progress: false

jobs:
  harden-and-verify:
    if: github.head_ref == 'feat/provider-rollout-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/provider-rollout-authority
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Apply credential-boundary hardening and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('nico/provider_rollout_control_v1.py')
          source = source_path.read_text(encoding='utf-8')

          anchor = 'def _text(value: Any) -> str:\n    return " ".join(str(value or "").split()).strip()\n\n\n'
          helper = anchor + '''def _contains_secret_field(value: Any) -> bool:
              if isinstance(value, Mapping):
                  for raw_key, item in value.items():
                      if str(raw_key).casefold() in _SECRET_FIELDS:
                          return True
                      if _contains_secret_field(item):
                          return True
                  return False
              if isinstance(value, (list, tuple, set)):
                  return any(_contains_secret_field(item) for item in value)
              return False


          '''
          if 'def _contains_secret_field(' not in source:
              if source.count(anchor) != 1:
                  raise SystemExit('expected _text anchor exactly once')
              source = source.replace(anchor, helper, 1)

          old_gate = '        if keys & _SECRET_FIELDS:\n            raise ProviderRolloutError("raw_provider_credentials_prohibited")\n'
          new_gate = '        if _contains_secret_field(payload):\n            raise ProviderRolloutError("raw_provider_credentials_prohibited")\n'
          if old_gate in source:
              source = source.replace(old_gate, new_gate, 1)
          elif new_gate not in source:
              raise SystemExit('expected provider secret gate')

          exposed = '            "credential_reference_fingerprint": binding.credential_reference_fingerprint,\n'
          source = source.replace(exposed, '', 1)
          if '"credential_reference_fingerprint": binding.credential_reference_fingerprint' in source:
              raise SystemExit('credential-reference fingerprint remains exposed')
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_provider_rollout_secret_boundary_v1.py')
          test_path.write_text('''from __future__ import annotations

from fastapi import FastAPI
from fastapi.testclient import TestClient

from nico.provider_platform_contract_v1 import ProviderKind
from nico.provider_rollout_control_v1 import (
    ProviderRolloutConfig,
    ProviderRolloutRegistry,
    ProviderRolloutState,
    install_provider_rollout_routes,
)


def _registry() -> ProviderRolloutRegistry:
    configs = {
        provider: ProviderRolloutConfig(
            provider,
            ProviderRolloutState.INTERNAL_TEST,
            True,
            credential_reference_id=f"{provider.value}-server-reference",
            capability_evidence_reference=f"artifact://{provider.value}/engineering",
            native_ci_evidence_supported=True,
        )
        for provider in (
            ProviderKind.GITHUB,
            ProviderKind.GITLAB,
            ProviderKind.BITBUCKET_CLOUD,
            ProviderKind.AZURE_DEVOPS,
        )
    }
    return ProviderRolloutRegistry(configs=configs)


def _payload() -> dict[str, object]:
    return {
        "provider": "github",
        "client_id": "client-1",
        "project_id": "project-1",
        "session_id": "session-1",
        "run_id": "comprun-1",
        "locale": "en-US",
        "onboarding_mode": "internal_test",
    }


def test_nested_raw_credentials_are_rejected_without_echoing_secret(monkeypatch) -> None:
    monkeypatch.setenv("NICO_ADMIN_TOKEN", "operator-token")
    app = FastAPI()
    install_provider_rollout_routes(app, registry=_registry())
    client = TestClient(app)
    secret = "never-return-this-nested-provider-secret"

    response = client.post(
        "/providers/onboarding/preflight",
        headers={"X-NICO-Admin-Token": "operator-token"},
        json={**_payload(), "metadata": {"connection": {"token": secret}}},
    )

    assert response.status_code == 422
    assert response.json()["detail"]["code"] == "raw_provider_credentials_prohibited"
    assert response.json()["detail"]["credential_detail_exposed"] is False
    assert secret not in response.text


def test_preflight_does_not_return_credential_reference_fingerprint(monkeypatch) -> None:
    monkeypatch.setenv("NICO_ADMIN_TOKEN", "operator-token")
    app = FastAPI()
    install_provider_rollout_routes(app, registry=_registry())
    client = TestClient(app)

    response = client.post(
        "/providers/onboarding/preflight",
        headers={"X-NICO-Admin-Token": "operator-token"},
        json=_payload(),
    )

    assert response.status_code == 200
    payload = response.json()
    assert payload["credential_reference_bound"] is True
    assert payload["credential_reference_exposed"] is False
    assert "credential_reference_fingerprint" not in payload
''', encoding='utf-8')
          PY

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-deps -e .

      - name: Run focused rollout and production-import tests
        run: |
          set -euo pipefail
          pytest -q tests/test_provider_rollout_control_v1.py tests/test_provider_rollout_secret_boundary_v1.py
          python -m py_compile nico/provider_rollout_control_v1.py
          python - <<'PY'
          from nico.api.production import app
          routes = {
              (method, route.path)
              for route in app.routes
              for method in (getattr(route, 'methods', set()) or set())
          }
          assert ('GET', '/providers/capabilities') in routes
          assert ('POST', '/providers/onboarding/preflight') in routes
          assert ('POST', '/providers/{provider}/rollout') in routes
          print('Provider rollout production routes verified.')
          PY
          git diff --check

      - name: Commit verified hardening and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-pr1275-provider-secret-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            nico/provider_rollout_control_v1.py \
            tests/test_provider_rollout_secret_boundary_v1.py \
            .github/workflows/tmp-pr1275-provider-secret-hardening.yml
          git diff --cached --check
          git commit -m 'Harden provider credential boundary'
          git push origin HEAD:feat/provider-rollout-authority
