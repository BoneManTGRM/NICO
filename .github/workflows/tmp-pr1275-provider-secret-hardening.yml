name: Temporary PR 1275 provider secret hardening

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-pr1275-provider-secret-hardening
  cancel-in-progress: false

jobs:
  harden-and-verify:
    if: github.head_ref == 'feat/provider-rollout-authority'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/provider-rollout-authority
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Apply credential-boundary hardening and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('nico/provider_rollout_control_v1.py')
          source = source_path.read_text(encoding='utf-8')

          text_anchor = '''def _text(value: Any) -> str:
              return " ".join(str(value or "").split()).strip()


          '''
          helper = text_anchor + '''def _contains_secret_field(value: Any) -> bool:
              if isinstance(value, Mapping):
                  for raw_key, item in value.items():
                      if str(raw_key).casefold() in _SECRET_FIELDS:
                          return True
                      if _contains_secret_field(item):
                          return True
                  return False
              if isinstance(value, (list, tuple, set)):
                  return any(_contains_secret_field(item) for item in value)
              return False


          '''
          if 'def _contains_secret_field(' not in source:
              if source.count(text_anchor) != 1:
                  raise SystemExit('expected _text anchor exactly once')
              source = source.replace(text_anchor, helper, 1)

          old_secret_gate = '''        keys = {str(key).casefold() for key in payload}
              if keys & _SECRET_FIELDS:
                  raise ProviderRolloutError("raw_provider_credentials_prohibited")
          '''
          new_secret_gate = '''        keys = {str(key).casefold() for key in payload}
              if _contains_secret_field(payload):
                  raise ProviderRolloutError("raw_provider_credentials_prohibited")
          '''
          if old_secret_gate in source:
              source = source.replace(old_secret_gate, new_secret_gate, 1)
          elif new_secret_gate not in source:
              raise SystemExit('expected preflight secret-field gate')

          exposed_line = '''            "credential_reference_fingerprint": binding.credential_reference_fingerprint,
          '''
          if exposed_line in source:
              source = source.replace(exposed_line, '', 1)
          if '"credential_reference_fingerprint": binding.credential_reference_fingerprint' in source:
              raise SystemExit('credential-reference fingerprint remains exposed')

          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_provider_rollout_control_v1.py')
          tests = test_path.read_text(encoding='utf-8')

          locale_assertion = '''    assert english["run_id"] == spanish["run_id"]
              assert english["locale"] == "en-US"
          '''
          locale_replacement = '''    assert english["run_id"] == spanish["run_id"]
              assert "credential_reference_fingerprint" not in english
              assert "credential_reference_fingerprint" not in spanish
              assert english["locale"] == "en-US"
          '''
          if 'assert "credential_reference_fingerprint" not in english' not in tests:
              if tests.count(locale_assertion) != 1:
                  raise SystemExit('expected locale-switch assertion anchor')
              tests = tests.replace(locale_assertion, locale_replacement, 1)

          raw_test_anchor = '''def test_controlled_pilot_requires_operator_and_real_provider_evidence(
          '''
          nested_test = '''def test_nested_raw_credentials_are_rejected_without_echoing_secret() -> None:
              registry = _registry()
              app = FastAPI()
              install_provider_rollout_routes(app, registry=registry)
              client = TestClient(app)
              secret = "never-return-this-nested-provider-secret"

              response = client.post(
                  "/providers/onboarding/preflight",
                  json={**_payload(), "metadata": {"connection": {"token": secret}}},
              )

              assert response.status_code == 422
              body = response.json()
              assert body["detail"]["code"] == "raw_provider_credentials_prohibited"
              assert body["detail"]["credential_detail_exposed"] is False
              assert secret not in response.text


          '''
          if 'test_nested_raw_credentials_are_rejected_without_echoing_secret' not in tests:
              if tests.count(raw_test_anchor) != 1:
                  raise SystemExit('expected controlled-pilot test anchor')
              tests = tests.replace(raw_test_anchor, nested_test + raw_test_anchor, 1)

          production_anchor = '''    assert result["credential_reference_exposed"] is False
              assert result["human_review_required"] is True
          '''
          production_replacement = '''    assert result["credential_reference_exposed"] is False
              assert "credential_reference_fingerprint" not in result
              assert result["human_review_required"] is True
          '''
          if 'assert "credential_reference_fingerprint" not in result' not in tests:
              if tests.count(production_anchor) != 1:
                  raise SystemExit('expected production credential assertion anchor')
              tests = tests.replace(production_anchor, production_replacement, 1)

          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-deps -e .

      - name: Run focused rollout and production-import tests
        run: |
          set -euo pipefail
          pytest -q tests/test_provider_rollout_control_v1.py
          python -m py_compile nico/provider_rollout_control_v1.py
          python - <<'PY'
          from nico.api.production import app
          routes = {
              (method, route.path)
              for route in app.routes
              for method in (getattr(route, 'methods', set()) or set())
          }
          assert ('GET', '/providers/capabilities') in routes
          assert ('POST', '/providers/onboarding/preflight') in routes
          assert ('POST', '/providers/{provider}/rollout') in routes
          print('Provider rollout production routes verified.')
          PY
          git diff --check

      - name: Commit verified hardening and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-pr1275-provider-secret-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            nico/provider_rollout_control_v1.py \
            tests/test_provider_rollout_control_v1.py \
            .github/workflows/tmp-pr1275-provider-secret-hardening.yml
          git diff --cached --check
          git commit -m 'Harden provider credential boundary'
          git push origin HEAD:feat/provider-rollout-authority
