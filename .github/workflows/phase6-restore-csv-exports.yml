name: Phase 6 Restore CSV Exports

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-restore-csv-exports.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-6/report-deduplication-security-remediation
          fetch-depth: 0
          persist-credentials: true
      - name: Restore canonical CSV exports
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("nico/comprehensive_decision_grade_html_v5.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import html\n", "import csv\nimport html\nimport io\n", 1)
          marker = '\n\n__all__ = ["VERSION", "_build_html"]\n'
          block = r'''

          def _csv_cell(value: Any) -> str:
              if isinstance(value, (list, tuple, set)):
                  return "; ".join(_text(item, 3000) for item in value)
              if isinstance(value, dict):
                  import json
                  return json.dumps(value, ensure_ascii=False, sort_keys=True)
              return _text(value, 6000)


          def _findings_csv(findings: list[dict[str, Any]]) -> str:
              fields = [
                  "id", "priority", "category", "executive_title", "technical_summary",
                  "analyzer_message", "canonical_path", "canonical_line", "canonical_location",
                  "related_locations", "finding_id", "fact", "evidence", "business_impact",
                  "confidence", "owner_role", "effort", "recommendation", "acceptance_criteria",
                  "cost_of_inaction", "residual_risk", "roadmap_mappings", "backlog_mappings",
                  "backlog_issue_mapping", "status", "source_evidence_fingerprint",
              ]
              stream = io.StringIO()
              writer = csv.DictWriter(stream, fieldnames=fields, extrasaction="ignore")
              writer.writeheader()
              for item in findings:
                  if isinstance(item, dict):
                      writer.writerow({field: _csv_cell(item.get(field)) for field in fields})
              return stream.getvalue()


          def _evidence_csv(stages: list[dict[str, Any]]) -> str:
              stream = io.StringIO()
              writer = csv.writer(stream)
              writer.writerow(["stage_id", "stage_title", "stage_status", "record_type", "record"])
              for stage in stages:
                  if not isinstance(stage, dict):
                      continue
                  for record_type in ("evidence", "findings", "unavailable"):
                      for item in stage.get(record_type) or []:
                          writer.writerow([
                              stage.get("stage_id"), stage.get("title"), stage.get("status"),
                              record_type, _csv_cell(item),
                          ])
              return stream.getvalue()


          __all__ = ["VERSION", "_build_html", "_findings_csv", "_evidence_csv"]
          '''
          if text.count(marker) != 1:
              raise SystemExit(f"HTML export marker count={text.count(marker)}")
          text = text.replace(marker, block)
          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/phase6-restore-csv-exports.yml
          python -m py_compile nico/comprehensive_decision_grade_html_v5.py
          git add -A
          git diff --cached --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 6: restore canonical CSV exports"
          git push origin HEAD:phase-6/report-deduplication-security-remediation
