name: Apply PR 991 compatibility corrections

on:
  push:
    branches:
      - codex/production-final-context-scanner-truth

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/production-final-context-scanner-truth
          fetch-depth: 0

      - name: Preserve v4 schema and source immutability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('nico/comprehensive_final_report_execution_v1.py')
          source = path.read_text(encoding='utf-8')
          replacements = {
              'VERSION = "nico.comprehensive_final_report_execution.v5"':
                  'VERSION = "nico.comprehensive_final_report_execution.v4"',
              '_MARKER = "__nico_comprehensive_final_report_execution_v5__"':
                  '_MARKER = "__nico_comprehensive_final_report_execution_v4__"',
              'canonicalize_stage_results_before_render(source_stages)':
                  'canonicalize_stage_results_before_render(deepcopy(source_stages))',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence of {old!r}, found {count}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify focused contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          pip install -r requirements.txt >/dev/null
          pip install --no-deps -e . >/dev/null
          pytest -q \
            tests/test_cross_format_production_truth_v2.py \
            tests/test_comprehensive_final_report_execution_scanner_truth_v5.py \
            tests/test_comprehensive_final_report_execution_v1.py

      - name: Commit corrected branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/codex-pr991-compat-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve final-report v4 compatibility and source immutability"
          git push origin HEAD:codex/production-final-context-scanner-truth
