name: Live Scanner Register Digest Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-scanner-register-digest-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ID: comprun_8cd6b53230d24b39bc2ad9c3e37fd798
      ORIGIN: https://app.nicoaudit.com
    steps:
      - name: Fetch and compare exact scanner register
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path
          from typing import Any

          origin = os.environ["ORIGIN"].rstrip("/")
          run_id = os.environ["RUN_ID"]
          request = urllib.request.Request(
              f"{origin}/api/nico/assessment/comprehensive-run/{run_id}/report/json",
              headers={
                  "Accept": "application/json",
                  "Cache-Control": "no-store, no-cache, must-revalidate, max-age=0",
                  "Pragma": "no-cache",
                  "User-Agent": "nico-scanner-register-digest-diagnostic",
              },
          )
          with urllib.request.urlopen(request, timeout=120) as response:
              report = json.loads(response.read().decode("utf-8"))

          assessment = report.get("assessment") if isinstance(report.get("assessment"), dict) else {}
          register = assessment.get("canonical_scanner_finding_register")
          register = register if isinstance(register, dict) else {}
          findings = [item for item in register.get("findings") or [] if isinstance(item, dict)]
          actual_digest = hashlib.sha256(
              json.dumps(findings, sort_keys=True, separators=(",", ":"), default=str).encode()
          ).hexdigest()

          def fingerprint(item: dict[str, Any]) -> str:
              canonical = {
                  "commit_sha": str(item.get("exact_commit_sha") or "").casefold(),
                  "scanner": str(item.get("scanner") or "").casefold(),
                  "category": str(item.get("category") or "").casefold(),
                  "rule_id": str(item.get("rule_id") or "").casefold(),
                  "path": str(item.get("source_path") or "").casefold(),
                  "line": item.get("line") or 0,
                  "message": str(item.get("evidence") or "").casefold(),
                  "disposition": str(item.get("disposition") or ""),
              }
              return hashlib.sha256(
                  json.dumps(canonical, sort_keys=True, separators=(",", ":")).encode()
              ).hexdigest()

          mismatches = []
          for item in findings:
              expected = fingerprint(item)
              retained = str(item.get("raw_fingerprint") or "")
              if retained != expected:
                  mismatches.append(
                      {
                          "finding_id": item.get("finding_id"),
                          "scanner": item.get("scanner"),
                          "category": item.get("category"),
                          "rule_id": item.get("rule_id"),
                          "source_path": item.get("source_path"),
                          "line": item.get("line"),
                          "disposition": item.get("disposition"),
                          "evidence_quality": item.get("evidence_quality"),
                          "occurrence_count": item.get("occurrence_count"),
                          "source_record_count": item.get("source_record_count"),
                          "retained_fingerprint": retained,
                          "recomputed_fingerprint": expected,
                          "evidence_preview": str(item.get("evidence") or "")[:300],
                      }
                  )

          coverage = assessment.get("evidence_coverage")
          coverage = coverage if isinstance(coverage, dict) else {}
          summary = assessment.get("scanner_finding_summary")
          summary = summary if isinstance(summary, dict) else {}
          diagnostic = {
              "artifact_schema": "nico.live-scanner-register-digest-diagnostic.v1",
              "run_id": run_id,
              "report_commit_sha": (report.get("identity") or {}).get("commit_sha"),
              "register_commit_sha": register.get("exact_commit_sha"),
              "finding_record_count": len(findings),
              "register_totals": register.get("totals"),
              "stored_digest": register.get("canonical_digest_sha256"),
              "recomputed_rendered_digest": actual_digest,
              "digest_matches": register.get("canonical_digest_sha256") == actual_digest,
              "fingerprint_mismatch_count": len(mismatches),
              "fingerprint_mismatch_preview": mismatches[:20],
              "unique_finding_id_count": len({str(item.get("finding_id") or "") for item in findings}),
              "unique_raw_fingerprint_count": len({str(item.get("raw_fingerprint") or "") for item in findings}),
              "coverage_references": {
                  "canonical_finding_count": coverage.get("canonical_finding_count"),
                  "canonical_scanner_finding_count": coverage.get("canonical_scanner_finding_count"),
                  "canonical_finding_digest_sha256": coverage.get("canonical_finding_digest_sha256"),
                  "canonical_scanner_finding_digest_sha256": coverage.get("canonical_scanner_finding_digest_sha256"),
                  "canonical_finding_register_status": coverage.get("canonical_finding_register_status"),
              },
              "assessment_scanner_summary": summary,
              "register_summary_by_category": register.get("summary_by_category"),
          }
          path = Path("audit-results/live-scanner-register-digest-diagnostic.json")
          path.write_text(json.dumps(diagnostic, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(diagnostic, indent=2, sort_keys=True))
          PY

      - name: Upload bounded diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-scanner-register-digest-diagnostic-${{ github.sha }}
          path: audit-results/live-scanner-register-digest-diagnostic.json
          retention-days: 7
