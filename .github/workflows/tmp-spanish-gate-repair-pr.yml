name: Temporary Spanish artifact validation repair

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-spanish-gate-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    if: github.head_ref == 'fix/spanish-localized-incomplete-analyzer-gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/spanish-localized-incomplete-analyzer-gate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply causal locale-aware validator repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("nico/comprehensive_client_report_render_v60.py")
          source = source_path.read_text(encoding="utf-8")

          import_anchor = '''from nico.comprehensive_report_coverage_synchronization_v63 import (
              synchronize_final_report_coverage,
          )
          '''
          import_replacement = import_anchor + '''from nico.comprehensive_incomplete_analyzer_summary_v1 import (
              canonical_incomplete_analyzer_count,
              canonical_summary_line,
          )
          '''
          if "canonical_summary_line" not in source:
              if source.count(import_anchor) != 1:
                  raise SystemExit("expected report coverage import anchor exactly once")
              source = source.replace(import_anchor, import_replacement, 1)

          text_anchor = '''def _text(value: Any) -> str:
              return " ".join(str(value or "").split()).strip()


          '''
          locale_helper = text_anchor + '''def _is_spanish(canonical: Mapping[str, Any]) -> bool:
              assessment = (
                  canonical.get("assessment")
                  if isinstance(canonical.get("assessment"), Mapping)
                  else {}
              )
              identity = (
                  canonical.get("identity")
                  if isinstance(canonical.get("identity"), Mapping)
                  else {}
              )
              language = _text(
                  canonical.get("report_language")
                  or canonical.get("locale")
                  or assessment.get("report_language")
                  or assessment.get("locale")
                  or identity.get("report_language")
                  or "en"
              ).casefold()
              return language.startswith("es")


          '''
          if "def _is_spanish(canonical:" not in source:
              if source.count(text_anchor) != 1:
                  raise SystemExit("expected _text anchor exactly once")
              source = source.replace(text_anchor, locale_helper, 1)

          old_incomplete = '    incomplete = int(canonical.get("incomplete_applicable_analyzers", 0) or 0)\n'
          new_incomplete = '    incomplete = canonical_incomplete_analyzer_count(canonical)\n'
          if old_incomplete in source:
              source = source.replace(old_incomplete, new_incomplete, 1)
          elif new_incomplete not in source:
              raise SystemExit("expected canonical incomplete-analyzer assignment")

          old_gate = '''        if "Incomplete applicable analyzers: 0" not in combined:
              raise ValueError("client report omitted the canonical incomplete analyzer count")
          '''
          new_gate = '''        canonical = (
              package.get("json") if isinstance(package.get("json"), Mapping) else {}
          )
          expected_summary = canonical_summary_line(
              canonical,
              spanish=_is_spanish(canonical),
          )
          if expected_summary.casefold() not in combined.casefold():
              raise ValueError("client report omitted the canonical incomplete analyzer count")
          '''
          if old_gate in source:
              source = source.replace(old_gate, new_gate, 1)
          elif "expected_summary = canonical_summary_line(" not in source:
              raise SystemExit("expected English-only incomplete-analyzer gate")
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_comprehensive_client_report_render_v60.py")
          tests = test_path.read_text(encoding="utf-8")
          test_anchor = '''def test_final_accuracy_validation_rejects_stale_report_truth() -> None:
          '''
          regression = '''def test_final_accuracy_validation_accepts_spanish_localized_incomplete_count() -> None:
              canonical_package = reconcile_before_existing_report_renderer({"json": _canonical()})
              canonical = canonical_package["json"]
              canonical["report_language"] = "es-MX"
              identity = dict(canonical.get("identity") or {})
              identity["report_language"] = "es-MX"
              canonical["identity"] = identity
              markdown = "\\n".join(
                  (
                      "NICO COMPREHENSIVE",
                      "Canonical Technical Scorecard",
                      "Analyzer execution coverage is 100%",
                      "Analizadores aplicables incompletos: 0",
                      "Maturity Exceptional",
                      "Evidence Appendix",
                      "Human Review and Acceptance Gate",
                  )
              )
              canonical_package.update(
                  {
                      "json": canonical,
                      "markdown": markdown,
                      "html": f"<main>{markdown}</main>",
                      "pdf_base64": base64.b64encode(_pdf(markdown)).decode("ascii"),
                  }
              )

              result = validate_existing_report_accuracy(canonical_package)

              assert result["canonical_incomplete_analyzer_count"] == 0
              assert result["production_pdf_validated"] is True


          '''
          if "test_final_accuracy_validation_accepts_spanish_localized_incomplete_count" not in tests:
              if tests.count(test_anchor) != 1:
                  raise SystemExit("expected stale-report test anchor exactly once")
              tests = tests.replace(test_anchor, regression + test_anchor, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run focused report and localization regression tests
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_comprehensive_client_report_render_v60.py \
            tests/test_comprehensive_incomplete_analyzer_summary_v1.py
          python -m compileall -q \
            nico/comprehensive_client_report_render_v60.py \
            tests/test_comprehensive_client_report_render_v60.py
          git diff --check

      - name: Commit verified repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-spanish-gate-repair-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            nico/comprehensive_client_report_render_v60.py \
            tests/test_comprehensive_client_report_render_v60.py \
            .github/workflows/tmp-spanish-gate-repair-pr.yml
          git diff --cached --check
          git commit -m "Fix Spanish incomplete-analyzer report validation"
          git push origin HEAD:fix/spanish-localized-incomplete-analyzer-gate
