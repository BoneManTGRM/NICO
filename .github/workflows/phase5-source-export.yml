name: Phase 5 Apply Verified Completion

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-5/report-truth-outcomes
          fetch-depth: 1
          persist-credentials: true

      - name: Apply locally verified Phase 5 files
        run: python scripts/apply_phase5_completion_payload.py

      - name: Commit exact verified completion
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Phase 5: complete report truth and measurable remediation"
          git push origin HEAD:phase-5/report-truth-outcomes
