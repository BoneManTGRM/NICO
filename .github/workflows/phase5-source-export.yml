name: Phase 5 Apply Verified Completion

on:
  pull_request:
    paths:
      - ".github/workflows/phase5-source-export.yml"
      - "scripts/apply_phase5_completion_payload.py"
      - "scripts/diagnose_phase5_payload.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5-apply-verified-completion-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-5/report-truth-outcomes
          fetch-depth: 1
          persist-credentials: true

      - name: Verify completion payload integrity
        run: python scripts/diagnose_phase5_payload.py

      - name: Apply locally verified Phase 5 files
        run: python scripts/apply_phase5_completion_payload.py

      - name: Remove temporary completion machinery
        run: |
          rm -f \
            scripts/diagnose_phase5_payload.py \
            scripts/apply_phase5_completion_payload.py \
            .github/workflows/phase5-source-export.yml \
            .github/workflows/phase5-pin-workflow-actions.yml \
            tmp-delete-me3.txt

      - name: Commit exact verified completion
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Phase 5: complete report truth and measurable remediation"
          git push origin HEAD:phase-5/report-truth-outcomes
