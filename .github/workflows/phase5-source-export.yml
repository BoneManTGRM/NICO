name: Phase 5 Exact Source Export

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Create exact-source archive
        run: |
          set -euo pipefail
          archive="/tmp/phase5-exact-source-${GITHUB_SHA}.tar.gz"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=.venv \
            --exclude=venv \
            --exclude='__pycache__' \
            -czf "$archive" .
          cp "$archive" "phase5-exact-source-${GITHUB_SHA}.tar.gz"
          sha256sum "phase5-exact-source-${GITHUB_SHA}.tar.gz" > "phase5-exact-source-${GITHUB_SHA}.sha256"

      - name: Upload exact source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase5-exact-source-${{ github.sha }}
          path: |
            phase5-exact-source-${{ github.sha }}.tar.gz
            phase5-exact-source-${{ github.sha }}.sha256
          if-no-files-found: error
          retention-days: 7
