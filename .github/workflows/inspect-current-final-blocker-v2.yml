name: Inspect Current Final Blocker V2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-final-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 96de8556466ccc51e5a7c8a88dc3844d305d9adc
          fetch-depth: 1

      - name: Retain source context for publication blocker
        run: |
          set -euo pipefail
          mkdir -p audit-results/final-blocker-v2
          {
            grep -RIn --exclude-dir=.git --exclude='*.map' \
              -E 'unapproved review PDF|final-delivery language|FINAL REPORT|APPROVED FINAL|CLIENT DELIVERY AUTHORIZED' \
              nico tests scripts apps .github || true
          } > audit-results/final-blocker-v2/source-matches.txt
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          root = Path('.')
          output = Path('audit-results/final-blocker-v2/source-context.json')
          patterns = [
              re.compile(r'unapproved review PDF', re.I),
              re.compile(r'final-delivery language', re.I),
              re.compile(r'APPROVED FINAL', re.I),
              re.compile(r'CLIENT DELIVERY AUTHORIZED', re.I),
          ]
          matches = []
          for top in ('nico', 'tests', 'scripts', 'apps', '.github'):
              base = root / top
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if not path.is_file() or '.git' in path.parts:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except Exception:
                      continue
                  lines = text.splitlines()
                  for number, line in enumerate(lines, start=1):
                      if not any(pattern.search(line) for pattern in patterns):
                          continue
                      start = max(1, number - 20)
                      end = min(len(lines), number + 20)
                      matches.append({
                          'path': str(path),
                          'line': number,
                          'context_start': start,
                          'context_end': end,
                          'context': '\n'.join(
                              f'{index}: {lines[index - 1]}'
                              for index in range(start, end + 1)
                          ),
                      })
          output.write_text(
              json.dumps(matches, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(matches, indent=2, sort_keys=True))
          PY

      - name: Inspect exact preserved run records
        env:
          ORIGIN: https://app.nicoaudit.com
          CUSTOMER_RUN: comprun_891cf108b297485381cc866c30fc5696
          ACCEPTANCE_RUN: comprun_55483c7c59164d42833945192b086ad5
        run: |
          set -euo pipefail
          mkdir -p audit-results/final-blocker-v2
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          from typing import Any, Mapping

          origin = os.environ["ORIGIN"].rstrip("/")
          output = Path("audit-results/final-blocker-v2")
          runs = [os.environ["CUSTOMER_RUN"], os.environ["ACCEPTANCE_RUN"]]

          def bounded(value: Any, depth: int = 0) -> Any:
              if depth > 10:
                  return "<depth-bounded>"
              if value is None or isinstance(value, (bool, int, float)):
                  return value
              if isinstance(value, str):
                  return value if len(value) <= 50000 else value[:50000] + "..."
              if isinstance(value, list):
                  return [bounded(item, depth + 1) for item in value[:1000]]
              if isinstance(value, Mapping):
                  return {
                      str(key): bounded(item, depth + 1)
                      for index, (key, item) in enumerate(value.items())
                      if index < 1000
                  }
              return str(value)

          for run_id in runs:
              url = (
                  f"{origin}/api/nico/assessment/comprehensive-run/{run_id}"
                  f"?_nico_final_blocker_v2={time.time_ns()}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-store, no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "nico-final-blocker-inspection-v2",
                      "X-NICO-Browser-Projection": "terminal-manifest-v1",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=240) as response:
                      status = response.status
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read()
              try:
                  payload = json.loads(raw.decode("utf-8"))
              except Exception:
                  payload = {"raw_body": raw.decode("utf-8", errors="replace")}
              record = payload.get("record") if isinstance(payload, Mapping) and isinstance(payload.get("record"), Mapping) else payload
              stages = record.get("stage_results") if isinstance(record, Mapping) and isinstance(record.get("stage_results"), Mapping) else {}
              final_stage = stages.get("final_comprehensive_report_generation") if isinstance(stages, Mapping) else {}
              summary = {
                  "run_id": run_id,
                  "http_status": status,
                  "response_status": payload.get("status") if isinstance(payload, Mapping) else None,
                  "terminal": payload.get("terminal") if isinstance(payload, Mapping) else None,
                  "current_stage": payload.get("current_stage") if isinstance(payload, Mapping) else None,
                  "record_terminal": record.get("terminal") if isinstance(record, Mapping) else None,
                  "record_status": record.get("status") if isinstance(record, Mapping) else None,
                  "completed_stages": record.get("completed_stages") if isinstance(record, Mapping) else None,
                  "blockers": bounded(record.get("blockers") if isinstance(record, Mapping) else None),
                  "final_stage": bounded(final_stage),
                  "reports": bounded(payload.get("reports") if isinstance(payload, Mapping) else None),
                  "response_projection": bounded(payload.get("response_projection") if isinstance(payload, Mapping) else None),
              }
              (output / f"{run_id}-full.json").write_text(
                  json.dumps(bounded(payload), indent=2, sort_keys=True, default=str) + "\n",
                  encoding="utf-8",
              )
              (output / f"{run_id}-summary.json").write_text(
                  json.dumps(summary, indent=2, sort_keys=True, default=str) + "\n",
                  encoding="utf-8",
              )
              print(json.dumps(summary, indent=2, sort_keys=True, default=str))
          PY

      - name: Upload inspection evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-blocker-v2-${{ github.run_id }}
          path: audit-results/final-blocker-v2/
          if-no-files-found: error
          retention-days: 7
