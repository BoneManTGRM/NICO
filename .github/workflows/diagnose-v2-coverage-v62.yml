name: Diagnose V2 Coverage v62

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-v2-coverage-v62.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install bounded test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Run exact production-authority regression with full diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_v2_live_production_authority.py -vv --tb=long -s
