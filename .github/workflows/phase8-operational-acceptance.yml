name: Phase 8 Operational Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "nico/phase8_operational_acceptance_v1.py"
      - "nico/phase8_report_quality_v1.py"
      - "nico/final_assessment_truth_v1.py"
      - "nico/comprehensive_phase7_truth_gateway.py"
      - "tests/test_phase8_operational_acceptance_v1.py"
      - "tests/test_phase8_report_quality_v1.py"
      - ".github/workflows/phase8-operational-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "nico/phase8_operational_acceptance_v1.py"
      - "nico/phase8_report_quality_v1.py"
      - "nico/final_assessment_truth_v1.py"
      - "nico/comprehensive_phase7_truth_gateway.py"
      - "tests/test_phase8_operational_acceptance_v1.py"
      - "tests/test_phase8_report_quality_v1.py"
      - ".github/workflows/phase8-operational-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Phase 8 truth and acceptance tests twice
        run: |
          pytest -q \
            tests/test_final_assessment_truth_v1.py \
            tests/test_comprehensive_phase7_truth_gateway.py \
            tests/test_phase8_report_quality_v1.py \
            tests/test_phase8_operational_acceptance_v1.py
          pytest -q \
            tests/test_final_assessment_truth_v1.py \
            tests/test_comprehensive_phase7_truth_gateway.py \
            tests/test_phase8_report_quality_v1.py \
            tests/test_phase8_operational_acceptance_v1.py
