name: Triage 662 Raw Scanner Evidence

on:
  push:
    branches:
      - triage/662-candidates-20260806
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  capture-raw-candidates:
    name: Capture and reconcile all 662 candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: 9c876ba4e3e9bb152de52567232038e52a6bbb3e
      NICO_ALLOW_PROJECT_COMMANDS: "true"
      NICO_NODE_OPTIONS: "--max-old-space-size=2048"
      NICO_MAX_SCANNER_PARSE_BYTES: "268435456"
      NICO_SCANNER_INSTALL_STRICT: "true"
      NICO_REQUIRE_DURABLE_DELIVERY_STORAGE: "false"
      NICO_REQUIRE_DURABLE_ASSESSMENT_STORAGE: "false"
      NICO_ENABLE_SQLITE_DURABLE_STORAGE: "true"
      NICO_SQLITE_PATH: /tmp/nico-triage.sqlite3
      NICO_SCANNER_RAW_ARTIFACT_ROOT: /tmp/nico-triage-scanner-artifacts

    steps:
      - name: Check out scanner implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: runner

      - name: Check out exact assessed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
          path: frozen-source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Install NICO and Semgrep
        working-directory: runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m venv "$RUNNER_TEMP/nico-semgrep"
          "$RUNNER_TEMP/nico-semgrep/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/nico-semgrep/bin/pip" install semgrep==1.170.0
          mkdir -p "$RUNNER_TEMP/nico-tools-bin"
          ln -s "$RUNNER_TEMP/nico-semgrep/bin/semgrep" "$RUNNER_TEMP/nico-tools-bin/semgrep"
          echo "$RUNNER_TEMP/nico-tools-bin" >> "$GITHUB_PATH"

      - name: Install pinned scanner binaries
        working-directory: runner
        env:
          NICO_SCANNER_INSTALL_DIR: ${{ runner.temp }}/nico-scanners
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$NICO_SCANNER_INSTALL_DIR"
          python scripts/install_hosted_scanner_binaries.py
          echo "$NICO_SCANNER_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Install deterministic JavaScript and TypeScript scanner profile
        run: |
          profile_root="$RUNNER_TEMP/nico-eslint-profile"
          npm install --prefix "$profile_root" \
            eslint@9 \
            @eslint/js@9 \
            @typescript-eslint/parser@8 \
            @typescript-eslint/eslint-plugin@8 \
            typescript@5.6.3 \
            --no-audit --no-fund
          parser_entry="$(NODE_PATH="$profile_root/node_modules" node -p "require.resolve('@typescript-eslint/parser')")"
          test -f "$parser_entry"
          echo "$profile_root/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$profile_root/node_modules" >> "$GITHUB_ENV"
          echo "NICO_ESLINT_MODULE_ROOT=$profile_root/node_modules" >> "$GITHUB_ENV"
          echo "NICO_ESLINT_PARSER_ENTRY=$parser_entry" >> "$GITHUB_ENV"

      - name: Verify exact checkout identity
        working-directory: frozen-source
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Run candidate reconciliation unit tests
        working-directory: runner
        run: pytest -q tests/test_build_triage_candidate_register.py

      - name: Run two complete exact-SHA scanner passes
        working-directory: runner
        run: |
          python scripts/frozen_scanner_evidence_proof.py \
            --source ../frozen-source \
            --target-sha "$TARGET_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --output frozen-scanner-proof

      - name: Upload raw scanner evidence immediately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: triage-662-raw-scanner-evidence-${{ env.TARGET_SHA }}
          path: runner/frozen-scanner-proof
          if-no-files-found: error
          retention-days: 90

      - name: Build canonical 662-candidate package
        working-directory: runner
        run: |
          python scripts/build_triage_candidate_register.py \
            --scanner-run-one frozen-scanner-proof/scanner-run-1.json \
            --scanner-run-two frozen-scanner-proof/scanner-run-2.json \
            --scanner-proof frozen-scanner-proof/frozen-scanner-proof.json \
            --repository "$GITHUB_REPOSITORY" \
            --output triage-662-package

      - name: Verify exact count, blocked delivery, and committed package parity
        working-directory: runner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          generated = Path("triage-662-package")
          register = json.loads((generated / "candidate-register.json").read_text(encoding="utf-8"))
          reconciliation = json.loads((generated / "reconciliation.json").read_text(encoding="utf-8"))
          manifest = json.loads((generated / "manifest.json").read_text(encoding="utf-8"))
          assert register["candidate_count"] == 662
          assert register["counts"] == {"dependency": 59, "secret": 17, "static": 586}
          assert register["confirmed_material_findings"] == 0
          assert register["human_review_status"] == "pending"
          assert register["client_delivery_status"] == "blocked"
          assert register["two_run_parity_verified"] is True
          assert reconciliation["raw_nonzero_observation_count"] == 667
          assert reconciliation["excluded_observation_count"] == 5
          assert reconciliation["reconciliation_complete"] is True
          assert reconciliation["no_silent_deletion"] is True
          assert manifest["client_delivery_status"] == "blocked"
          PY
          for name in \
            reconciliation.json \
            comprehensive-triage-report.md \
            manifest.json
          do
            diff -u "evidence/triage-662/$name" "triage-662-package/$name"
          done

      - name: Upload canonical candidate register and report surfaces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: triage-662-canonical-package-${{ env.TARGET_SHA }}
          path: runner/triage-662-package
          if-no-files-found: error
          retention-days: 90
