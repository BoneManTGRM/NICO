name: Diagnose Spanish detached final report

on:
  push:
    branches:
      - fix/spanish-final-report-detached-failure-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read bounded production run diagnostics
        env:
          RUN_ID: comprun_e09e852da83a48a78abe40ffa804177d
          ORIGIN: https://app.nicoaudit.com
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, os, urllib.request

          run_id = os.environ['RUN_ID']
          url = f"{os.environ['ORIGIN']}/api/nico/assessment/comprehensive-run/{run_id}"
          req = urllib.request.Request(url, headers={
              'Accept': 'application/json',
              'Cache-Control': 'no-store',
              'X-NICO-Browser-Projection': 'bounded-v1',
              'User-Agent': 'nico-spanish-detached-diagnostic-v1',
          })
          with urllib.request.urlopen(req, timeout=45) as response:
              payload = json.loads(response.read().decode('utf-8'))

          allowed = {
              'status','terminal','current_stage','stage_id','reason','error_code','error_message',
              'message','diagnostic_code','http_status','original_http_status','recovery_supported',
              'recovery_scope','stage_execution','active_stage_execution','worker_model','worker_pid',
              'worker_exit_code','worker_error_type','worker_error','worker_elapsed_seconds',
              'process_isolation_schema','renderer_lifetime_owner','publication_lease_id','lease_id',
              'deadline_expired','physical_worker_exit_confirmed','worker_termination_confirmed',
          }

          def bounded(value, depth=0):
              if depth > 8:
                  return '<depth-limit>'
              if isinstance(value, dict):
                  out = {}
                  for key, item in value.items():
                      if key in allowed or key in {'record','stage_results','final_comprehensive_report_generation','failure','technical_details'}:
                          out[key] = bounded(item, depth + 1)
                  return out
              if isinstance(value, list):
                  return [bounded(item, depth + 1) for item in value[:12]]
              text = str(value)
              return text[:1600]

          print(json.dumps(bounded(payload), indent=2, sort_keys=True, ensure_ascii=False))
          PY
