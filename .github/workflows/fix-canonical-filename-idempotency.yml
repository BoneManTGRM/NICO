name: Fix canonical filename idempotency

on:
  push:
    branches:
      - fix/canonical-87-85-report-truth

permissions:
  contents: write

jobs:
  patch:
    if: >-
      !contains(github.event.head_commit.message, 'Fix canonical filename normalization') &&
      !contains(github.event.head_commit.message, 'Remove temporary filename repair')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/canonical-87-85-report-truth
          fetch-depth: 0
      - name: Patch the product module
        run: python scripts/fix_canonical_filename_idempotency.py
      - name: Verify the exact source replacement
        run: |
          python -m py_compile nico/comprehensive_canonical_report_truth_v1.py
          grep -q 'if _FINAL_SUFFIX_RE.search(filename):' nico/comprehensive_canonical_report_truth_v1.py
          grep -q 'return _FINAL_SUFFIX_RE.sub("-FINAL-PENDING-APPROVAL.pdf", filename)' nico/comprehensive_canonical_report_truth_v1.py
      - name: Commit the product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nico/comprehensive_canonical_report_truth_v1.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix canonical filename normalization"
          git push origin HEAD:fix/canonical-87-85-report-truth
