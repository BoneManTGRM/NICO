name: Diagnose Cross-Format Run

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-cross-format-run.yml"
      - "scripts/diagnose_cross_format_run.py"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install --disable-pip-version-check pypdf==6.6.0
      - run: python scripts/diagnose_cross_format_run.py
        env:
          RUN_ID: comprun_1d2f294b68be41c7be6a90cbd6ce1663
