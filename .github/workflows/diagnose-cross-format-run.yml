name: Diagnose Cross-Format Run

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-cross-format-run.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - run: python -m pip install --disable-pip-version-check pypdf==6.6.0
      - name: Read compact production truth
        env:
          RUN_ID: comprun_1d2f294b68be41c7be6a90cbd6ce1663
        run: |
          python - <<'PY'
          import base64,io,json,os,urllib.request
          from pypdf import PdfReader
          rid=os.environ['RUN_ID']; data=json.load(urllib.request.urlopen(f'https://app.nicoaudit.com/api/nico/assessment/comprehensive-run/{rid}',timeout=60)); report=data.get('reports') or {}; pdf=base64.b64decode(str(report.get('pdf_base64') or ''),validate=True)
          text=' '.join(' '.join((p.extract_text() or '') for p in PdfReader(io.BytesIO(pdf)).pages[:3]).split())
          def near(label):
              i=text.casefold().find(label.casefold()); return 'NOT_FOUND' if i<0 else text[i:i+260]
          print(json.dumps({'pdf_technical':near('TECHNICAL MATURITY'),'pdf_adjusted':near('EVIDENCE-ADJUSTED'),'pdf_final':near('FINAL REPORT'),'pdf_pending':near('PENDING HUMAN APPROVAL'),'pdf_delivery':near('DELIVERY'),'pdf_pages_first_three_chars':len(text)},separators=(',',':'),sort_keys=True))
          PY
