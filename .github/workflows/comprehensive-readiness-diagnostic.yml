name: Comprehensive Readiness Diagnostic

on:
  push:
    branches:
      - diag/phase2-production-readiness-cause
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    name: Capture exact-main assessment readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NICO_PRODUCTION_FRONTEND_URL: https://app.nicoaudit.com
      TARGET_RELEASE_SHA: ba3363c3e0172be5c95effab6fc2b3d9a41af6f3
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Capture bounded readiness evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          origin = os.environ["NICO_PRODUCTION_FRONTEND_URL"].rstrip("/")
          target_sha = os.environ["TARGET_RELEASE_SHA"]

          def request_json(url: str) -> dict:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-store",
                      "Pragma": "no-cache",
                      "User-Agent": "nico-exact-main-readiness-diagnostic",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read(262_144)
                      status = int(response.status)
              except urllib.error.HTTPError as exc:
                  raw = exc.read(262_144)
                  status = int(exc.code)
              except Exception as exc:
                  return {
                      "http_status": 0,
                      "error_type": type(exc).__name__,
                      "error": str(exc)[:500],
                  }
              try:
                  payload = json.loads(raw.decode("utf-8"))
              except Exception:
                  return {
                      "http_status": status,
                      "json": False,
                      "body_preview": raw.decode("utf-8", errors="replace")[:500],
                  }
              return {"http_status": status, "json": True, "payload": payload}

          release = request_json(
              f"{origin}/api/release?expected_sha={target_sha}&_nico_readiness_probe={time.time_ns()}"
          )
          diagnostic = request_json(
              f"{origin}/api/nico/diagnostics/comprehensive-runtime?_nico_readiness_probe={time.time_ns()}"
          )

          safe_fields = {
              "artifact_schema",
              "service_id",
              "status",
              "configured",
              "reason",
              "persistence_adapter",
              "storage_source",
              "database_url_source",
              "persistence_proof_source",
              "durability_verified",
              "survives_container_replacement_verified",
              "run_store_shared_across_workers",
              "required_capability_count",
              "supplied_capability_count",
              "native_provider_count",
              "missing_capabilities",
              "diagnostics_route_count",
              "route_counts",
              "category_specific_scoring_bound",
              "same_sha_score_deterministic",
              "mutable_operational_history_affects_score",
              "score_truth_scope_bound",
              "score_override_allowed",
              "human_review_required",
              "client_delivery_allowed",
              "upstream_http_status",
              "upstream_status",
              "upstream_reason",
              "upstream_error",
          }

          def bounded_safe_view(observation: dict) -> dict:
              output = {key: value for key, value in observation.items() if key != "payload"}
              payload = observation.get("payload")
              if isinstance(payload, dict):
                  output["payload"] = {
                      key: payload.get(key)
                      for key in sorted(safe_fields)
                      if key in payload
                  }
              return output

          release_payload = release.get("payload") if isinstance(release.get("payload"), dict) else {}
          observed_release_sha = str(release_payload.get("release_sha") or "")
          result = {
              "artifact_schema": "nico.comprehensive_readiness_diagnostic.v1",
              "target_release_sha": target_sha,
              "observed_release_sha": observed_release_sha,
              "release_identity_matches": observed_release_sha == target_sha,
              "release": bounded_safe_view(release),
              "runtime_readiness": bounded_safe_view(diagnostic),
          }
          Path("audit-results").mkdir(parents=True, exist_ok=True)
          Path("audit-results/comprehensive-readiness-diagnostic.json").write_text(
              json.dumps(result, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          if not result["release_identity_matches"]:
              raise SystemExit("Production frontend is not serving the target exact-main SHA")
          PY
      - name: Upload bounded readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comprehensive-readiness-diagnostic-${{ env.TARGET_RELEASE_SHA }}-${{ github.run_id }}
          path: audit-results/comprehensive-readiness-diagnostic.json
          if-no-files-found: error
          retention-days: 30
