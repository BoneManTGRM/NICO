name: Temporary detached-stage production diagnostic

on:
  push:
    branches:
      - diagnostics/detached-stage-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect-production-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact Comprehensive run records and runtime diagnostics
        env:
          NICO_ORIGIN: https://app.nicoaudit.com
          NICO_RUN_IDS: comprun_bbe34d179144418288979d08a4f6e0ad comprun_12d04e09c5ce4068b8924f424282a026
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          origin = os.environ["NICO_ORIGIN"].rstrip("/")
          run_ids = os.environ["NICO_RUN_IDS"].split()
          urls = [
              f"{origin}/api/nico/assessment/comprehensive-run/{run_id}"
              for run_id in run_ids
          ] + [
              f"{origin}/api/nico/diagnostics/comprehensive-runtime",
              f"{origin}/api/nico/health",
              f"{origin}/api/release",
          ]

          for url in urls:
              print(f"\n===== GET {url} =====", flush=True)
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "nico-detached-stage-production-diagnostic",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      status = response.status
                      body = response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  body = exc.read().decode("utf-8", errors="replace")
              except Exception as exc:
                  print(json.dumps({"transport_error": type(exc).__name__, "message": str(exc)}), flush=True)
                  continue

              print(f"HTTP {status}", flush=True)
              try:
                  payload = json.loads(body)
              except Exception:
                  print(body[:50000], flush=True)
              else:
                  print(json.dumps(payload, indent=2, ensure_ascii=False, sort_keys=True)[:100000], flush=True)
          PY
