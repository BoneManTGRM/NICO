name: Bundled Semgrep Rules

on:
  pull_request:
    branches: [main]
    paths:
      - nico/semgrep_rules_v1.yml
      - tests/test_bundled_semgrep_rules_yaml_v1.py
      - .github/workflows/bundled-semgrep-rules.yml
  push:
    branches: [main]
    paths:
      - nico/semgrep_rules_v1.yml
      - tests/test_bundled_semgrep_rules_yaml_v1.py
      - .github/workflows/bundled-semgrep-rules.yml

permissions:
  contents: read

jobs:
  validate-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install the existing pinned Semgrep engine
        run: python -m pip install --disable-pip-version-check semgrep==1.170.0
      - name: Validate all bundled rules and detect unsafe TLS options
        run: |
          set -euo pipefail
          semgrep scan --validate --config nico/semgrep_rules_v1.yml
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import tempfile

          config = Path('nico/semgrep_rules_v1.yml').resolve()
          code = '''function tlsExamples() {
            const https = require("https");
            new https.Agent({rejectUnauthorized: false});
            new https.Agent({keepAlive: true, rejectUnauthorized: false});
            new https.Agent({rejectUnauthorized: true});
            new https.Agent({keepAlive: true});
          }
          '''
          with tempfile.TemporaryDirectory(prefix='nico-semgrep-rules-') as directory:
              target = Path(directory) / 'tls.js'
              target.write_text(code, encoding='utf-8')
              result = subprocess.run(
                  ['semgrep', 'scan', '--config', str(config), '--json',
                   '--metrics=off', '--no-git-ignore', '--no-rewrite-rule-ids', str(target)],
                  cwd=directory, capture_output=True, text=True, timeout=120, check=False,
              )
              assert result.returncode == 0, result.stderr
              report = json.loads(result.stdout)
              assert not report.get('errors'), report.get('errors')
              matches = report.get('results', [])
              assert len(matches) == 2, matches
              assert {item['check_id'] for item in matches} == {
                  'nico.javascript.insecure-tls-validation'
              }, matches
              assert {item['start']['line'] for item in matches} == {3, 4}, matches
          print('Bundled rules validated; two unsafe TLS cases detected; safe cases unflagged.')
          PY
