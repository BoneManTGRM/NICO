name: Phase 9 Comprehensive Production Proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprehensive-production-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PHASE9_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run production integration twice
        run: |
          pytest -q tests/test_phase9_comprehensive_report_integration_v1.py
          pytest -q tests/test_phase9_comprehensive_report_integration_v1.py
          pytest -q tests/test_comprehensive_client_ready_projection_v1.py tests/test_client_pdf_status_sanitizer_v1.py tests/test_client_pdf_compose_v2.py tests/test_client_text_status_sanitizer_v1.py
      - name: Generate retained real-package contract proof
        run: |
          mkdir -p phase9-comprehensive-proof
          python - <<'PY'
          import base64, hashlib, io, json, os
          from pathlib import Path
          from pypdf import PdfReader
          from nico.phase9_comprehensive_report_integration_v1 import finalize_report_package

          revision = os.environ['PHASE9_REVISION']
          finding = {
              'finding_id': 'ARCH-OPS-1',
              'category': 'architecture',
              'title': 'High-complexity code hotspot',
              'location': 'apps/web/app/operations/page.tsx:177',
              'priority': 'P1',
              'status': 'open',
              'recommendation': 'Separate orchestration, state transitions, and presentation concerns.',
              'acceptance_criteria': [
                  'Operations route complexity is reduced [method: static analysis]',
                  'Operations route complexity is reduced [target commit: ' + revision + ']',
              ],
          }
          result = {
              'report_package': {
                  'json': {
                      'identity': {'repository': os.environ.get('GITHUB_REPOSITORY'), 'commit_sha': revision, 'run_id': os.environ.get('GITHUB_RUN_ID')},
                      'findings_register': [finding, dict(finding)],
                      'executive_findings': [{'finding_id': 'ARCH-OPS-1', 'title': finding['title']}],
                      'roadmap': [{'work_packages': [{'finding_id': 'ARCH-OPS-1', 'title': finding['title']}]}],
                      'backlog': [{'finding_id': 'ARCH-OPS-1', 'title': finding['title']}],
                      'assessment': {'executive_summary': 'Exact-revision production proof.'},
                  },
                  'pdf_filename': 'nico-comprehensive-FINAL-PENDING-APPROVAL-FINAL-PENDING-APPROVAL.pdf',
                  'spanish_pdf_filename': 'nico-comprehensive-es-FINAL-PENDING-APPROVAL-FINAL-PENDING-APPROVAL.pdf',
                  'pdf_base64': base64.b64encode(b'%PDF-1.4\nphase9 production proof\n%%EOF').decode(),
              }
          }
          output = finalize_report_package(result)
          package = output['report_package']
          canonical = package['json']
          pdf = base64.b64decode(package['pdf_base64'])
          reader = PdfReader(io.BytesIO(pdf))
          page_count = len(reader.pages)
          pdf_text = '\n'.join(page.extract_text() or '' for page in reader.pages)
          markdown = package['markdown']
          html = package['html']
          assert len(canonical['canonical_findings']) == 1
          assert package['phase9_release_gate']['valid'] is True
          assert package['pdf_filename'].count('AUTOMATED-DRAFT-PENDING-APPROVAL') == 1
          assert package['spanish_pdf_filename'].count('AUTOMATED-DRAFT-PENDING-APPROVAL') == 1
          assert package['report_finality'] == 'automated_draft'
          assert package['approval_status'] == 'pending_human_approval'
          assert package['delivery_status'] == 'blocked_pending_human_approval'
          assert package['client_delivery_allowed'] is False
          assert page_count <= 45
          assert 'AUTOMATED DRAFT' in markdown
          assert 'FINAL REPORT' not in markdown
          assert 'a automated' not in markdown
          assert 'AUTOMATED DRAFT' in html
          assert 'FINAL REPORT' not in html
          assert 'a automated' not in html
          assert 'AUTOMATED DRAFT' in pdf_text
          assert 'FINAL REPORT' not in pdf_text
          assert ' · FINAL' not in pdf_text
          assert 'a automated' not in pdf_text
          assert 'report_contract_reason' not in pdf_text
          assert 'comprehensive_final_report_semantic_contract_failed' not in pdf_text
          assert 'stage_execution.artifact_schema' not in pdf_text
          root = Path('phase9-comprehensive-proof')
          (root / 'canonical.json').write_text(json.dumps(canonical, indent=2, ensure_ascii=False), encoding='utf-8')
          (root / 'release-gate.json').write_text(json.dumps(package['phase9_release_gate'], indent=2), encoding='utf-8')
          (root / 'findings.csv').write_bytes(base64.b64decode(package['findings_csv_base64']))
          (root / 'report-en.pdf').write_bytes(pdf)
          (root / 'report-en.txt').write_text(pdf_text, encoding='utf-8')
          (root / 'report-en.md').write_text(markdown, encoding='utf-8')
          (root / 'report-en.html').write_text(html, encoding='utf-8')
          manifest = {
              'immutable_revision': revision,
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'filenames': {'en': package['pdf_filename'], 'es': package['spanish_pdf_filename']},
              'canonical_truth_sha256': package['canonical_truth_sha256'],
              'artifact_sha256': {},
              'finding_count': len(canonical['canonical_findings']),
              'pdf_page_count': page_count,
              'report_finality': package['report_finality'],
              'approval_status': package['approval_status'],
              'delivery_status': package['delivery_status'],
              'defects_absent': {
                  'duplicate_findings': True,
                  'duplicate_acceptance_criteria': True,
                  'generic_priority_titles': True,
                  'repeated_terminal_filename': True,
                  'unapproved_finality_language': True,
                  'legacy_final_pdf_headers': True,
                  'raw_internal_pdf_fields': True,
                  'bad_automated_draft_grammar': True,
                  'oversized_client_pdf': True,
              },
          }
          for path in sorted(root.iterdir()):
              if path.is_file():
                  manifest['artifact_sha256'][path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          PY
      - name: Verify proof package
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('phase9-comprehensive-proof')
          manifest = json.loads((root / 'manifest.json').read_text())
          text = (root / 'report-en.txt').read_text(encoding='utf-8')
          markdown = (root / 'report-en.md').read_text(encoding='utf-8')
          html = (root / 'report-en.html').read_text(encoding='utf-8')
          assert manifest['immutable_revision'] == os.environ['PHASE9_REVISION']
          assert all(manifest['defects_absent'].values())
          assert manifest['finding_count'] == 1
          assert manifest['pdf_page_count'] <= 45
          assert manifest['report_finality'] == 'automated_draft'
          assert manifest['approval_status'] == 'pending_human_approval'
          assert manifest['delivery_status'] == 'blocked_pending_human_approval'
          for value in (text, markdown, html):
              assert 'FINAL REPORT' not in value
              assert 'a automated' not in value
          assert ' · FINAL' not in text
          assert 'report_contract_reason' not in text
          assert (root / 'report-en.pdf').read_bytes().startswith(b'%PDF')
          assert (root / 'canonical.json').is_file()
          assert (root / 'findings.csv').is_file()
          PY
      - name: Upload comprehensive production proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-comprehensive-production-proof-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: phase9-comprehensive-proof/
