name: Phase 6 Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install Python runtime quietly
        run: |
          set -e
          install_step() {
            label="$1"; shift
            if ! "$@" >"/tmp/${label}.log" 2>&1; then
              echo "INSTALL FAILURE: ${label}"
              tail -80 "/tmp/${label}.log"
              exit 1
            fi
          }
          install_step pip-upgrade python -m pip install --upgrade pip
          install_step pytest pip install pytest
          install_step requirements pip install -r requirements.txt
          install_step editable pip install --no-deps -e .
          echo "install: PASS"
      - name: Diagnose CLI
        run: |
          python -m nico --help
      - name: Diagnose production imports
        run: |
          python - <<'PY'
          import traceback
          try:
              from importlib.metadata import entry_points
              from nico.api.production import app
              from nico.api_runner import main as api_main
              scripts = {item.name: item.value for item in entry_points(group="console_scripts")}
              assert scripts.get("nico") == "nico.__main__:main"
              assert scripts.get("nico-api") == "nico.api_runner:main"
              assert app is not None
              assert callable(api_main)
              print("production import and entry points: PASS")
          except Exception:
              traceback.print_exc()
              raise
          PY
      - name: Run Phase 6 behavior tests
        run: |
          python -m pytest tests/test_phase6_final_remediation.py tests/test_phase6_report_integrity_contracts.py -q --tb=short
      - name: Compile Phase 6 runtime
        run: |
          python -m py_compile nico/phase6_final_remediation_v1.py nico/phase6_pdf_layout_v1.py nico/api/terminal_authority_bootstrap.py
