name: Phase 6 Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install Python runtime quietly
        run: |
          set -e
          install_step() {
            label="$1"; shift
            if ! "$@" >"/tmp/${label}.log" 2>&1; then
              mkdir -p diagnostics
              cp "/tmp/${label}.log" "diagnostics/install-${label}.txt"
              exit 1
            fi
          }
          install_step pip-upgrade python -m pip install --upgrade pip
          install_step pytest pip install pytest
          install_step requirements pip install -r requirements.txt
          install_step editable pip install --no-deps -e .
          mkdir -p diagnostics
          echo "install=0" > diagnostics/status.txt
      - name: Capture CLI diagnostic
        if: always()
        run: |
          set +e
          python -m nico --help > diagnostics/cli.txt 2>&1
          rc=$?
          echo "cli=$rc" >> diagnostics/status.txt
          exit 0
      - name: Capture production import diagnostic
        if: always()
        run: |
          set +e
          python - <<'PY' > diagnostics/production-import.txt 2>&1
          import traceback
          try:
              from importlib.metadata import entry_points
              from nico.api.production import app
              from nico.api_runner import main as api_main
              scripts = {item.name: item.value for item in entry_points(group="console_scripts")}
              assert scripts.get("nico") == "nico.__main__:main"
              assert scripts.get("nico-api") == "nico.api_runner:main"
              assert app is not None
              assert callable(api_main)
              print("production import and entry points: PASS")
          except Exception:
              traceback.print_exc()
              raise
          PY
          rc=$?
          echo "production_import=$rc" >> diagnostics/status.txt
          exit 0
      - name: Capture Phase 6 behavior tests
        if: always()
        run: |
          set +e
          python -m pytest tests/test_phase6_final_remediation.py tests/test_phase6_report_integrity_contracts.py -q --tb=short > diagnostics/phase6-tests.txt 2>&1
          rc=$?
          echo "phase6_tests=$rc" >> diagnostics/status.txt
          exit 0
      - name: Capture compile diagnostic
        if: always()
        run: |
          set +e
          python -m py_compile nico/phase6_final_remediation_v1.py nico/phase6_pdf_layout_v1.py nico/api/terminal_authority_bootstrap.py > diagnostics/compile.txt 2>&1
          rc=$?
          echo "compile=$rc" >> diagnostics/status.txt
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase6-diagnostics
          path: diagnostics/
          if-no-files-found: error
      - name: Enforce diagnostic status
        if: always()
        run: |
          cat diagnostics/status.txt
          if grep -Eq '=(1|2|3|4|5|6|7|8|9|[1-9][0-9]+)$' diagnostics/status.txt; then
            exit 1
          fi
