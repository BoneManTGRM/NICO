name: Phase 6 Diagnostics

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install --no-deps -e .
      - name: Diagnose CLI and production import
        run: |
          set -o pipefail
          nico --help
          python - <<'PY'
          import traceback
          try:
              from nico.api.production import app
              from nico.api_runner import main as api_main
              assert app is not None
              assert callable(api_main)
              print("production import: PASS")
          except Exception:
              traceback.print_exc()
              raise
          PY
      - name: Run Phase 6 behavior tests
        run: |
          python -m pytest tests/test_phase6_final_remediation.py tests/test_phase6_report_integrity_contracts.py -q --tb=short
      - name: Compile Phase 6 runtime
        run: |
          python -m py_compile nico/phase6_final_remediation_v1.py nico/phase6_pdf_layout_v1.py nico/api/terminal_authority_bootstrap.py
