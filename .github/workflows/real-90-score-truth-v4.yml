name: Real 90 Score Truth v4

on:
  pull_request:
    branches: [main]
    paths:
      - "nico/comprehensive_native_providers_v4.py"
      - "nico/comprehensive_score_truth_scope_v4.py"
      - "nico/v2_snapshot_scanner_authority.py"
      - "nico/api/comprehensive_production_bootstrap.py"
      - "tests/test_comprehensive_native_providers_v4.py"
      - "tests/test_comprehensive_score_truth_scope_v4.py"
      - "tests/test_real_90_publication_gate_v4.py"
      - "tests/test_secret_history_scan.py"
      - "tests/test_snapshot_scanner_watchdog_visibility.py"
      - "docs/real-90-scoring-contract-v4.md"
      - ".github/workflows/real-90-score-truth-v4.yml"
  push:
    branches: [main]
    paths:
      - "nico/comprehensive_native_providers_v4.py"
      - "nico/comprehensive_score_truth_scope_v4.py"
      - "nico/v2_snapshot_scanner_authority.py"
      - "nico/api/comprehensive_production_bootstrap.py"
      - "tests/test_comprehensive_native_providers_v4.py"
      - "tests/test_comprehensive_score_truth_scope_v4.py"
      - "tests/test_real_90_publication_gate_v4.py"
      - "tests/test_secret_history_scan.py"
      - "tests/test_snapshot_scanner_watchdog_visibility.py"
      - "docs/real-90-scoring-contract-v4.md"
      - ".github/workflows/real-90-score-truth-v4.yml"
  workflow_dispatch:

concurrency:
  group: real-90-score-truth-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            nico/comprehensive_native_providers_v4.py \
            nico/comprehensive_score_truth_scope_v4.py \
            nico/v2_snapshot_scanner_authority.py \
            nico/api/comprehensive_production_bootstrap.py \
            tests/test_comprehensive_native_providers_v4.py \
            tests/test_comprehensive_score_truth_scope_v4.py \
            tests/test_real_90_publication_gate_v4.py \
            tests/test_secret_history_scan.py

      - name: Run focused score and report truth regressions
        run: |
          python -m pytest -q \
            tests/test_comprehensive_native_providers_v4.py \
            tests/test_comprehensive_score_truth_scope_v4.py \
            tests/test_real_90_publication_gate_v4.py \
            tests/test_secret_history_scan.py \
            tests/test_snapshot_scanner_watchdog_visibility.py \
            tests/test_comprehensive_native_providers_v2.py \
            tests/test_comprehensive_assessment_hardening_v1.py \
            tests/test_comprehensive_native_production_binding.py
