name: Apply mobile terminal metric gate repair

on:
  push:
    branches:
      - fix/mobile-terminal-metric-gate

permissions:
  contents: write

jobs:
  patch:
    if: >-
      !contains(github.event.head_commit.message, 'Apply mobile terminal metric gate') &&
      !contains(github.event.head_commit.message, 'Remove temporary terminal metric patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/mobile-terminal-metric-gate
          fetch-depth: 0
      - name: Apply exact metric gate repair
        run: python scripts/apply_mobile_terminal_metric_gate.py
      - name: Verify repaired proof
        run: |
          python -m py_compile scripts/mobile_restart_live_acceptance_v3.py
          python -m py_compile tests/test_mobile_terminal_metric_gate_v1.py
          grep -q 'MAX_COMPACT_SCROLL_HEIGHT = 7_000' scripts/mobile_restart_live_acceptance_v3.py
          grep -q 'self._terminal_metrics.update(metrics)' scripts/mobile_restart_live_acceptance_v3.py
      - name: Commit proof repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mobile_restart_live_acceptance_v3.py tests/test_mobile_terminal_metric_gate_v1.py
          git diff --cached --quiet && exit 0
          git commit -m "Apply mobile terminal metric gate"
          git push origin HEAD:fix/mobile-terminal-metric-gate
