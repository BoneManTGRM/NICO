name: One-time Release Schema v2 Patch

on:
  push:
    branches:
      - fix/specialist-production-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/specialist-production-acceptance
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Update the exact release-identity schema contract and remove this workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/two-service-production-acceptance.yml')
          source = target.read_text(encoding='utf-8')
          old = 'nico.frontend_production_release_identity.v1'
          new = 'nico.frontend_production_release_identity.v2'
          count = source.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly two v1 release-schema contract references, observed {count}.')
          target.write_text(source.replace(old, new), encoding='utf-8')
          Path('.github/workflows/one-time-release-schema-v2-patch.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/two-service-production-acceptance.yml .github/workflows/one-time-release-schema-v2-patch.yml
          git commit -m 'Align unified acceptance with release identity v2'
          git push origin HEAD:fix/specialist-production-acceptance
