name: Scanner Live Contracts

on:
  push:
    branches: [main, fix/1496-scanner-completion]
  pull_request:
    paths:
      - 'nico/**'
      - 'scripts/install_hosted_scanner_binaries.py'
      - 'scripts/spanish_comprehensive_authenticated_live_acceptance_v1.py'
      - 'tests/test_scanner_live_contracts.py'
      - 'tests/test_scanner_completion_gate.py'
      - 'tests/test_hosted_provider_comprehensive_runtime_v1.py'
      - '.github/workflows/scanner-live-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-live-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-binary-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NICO_SCANNER_INSTALL_STRICT: 'true'
      NICO_SCANNER_INSTALL_DIR: /tmp/nico-pinned-scanners
      NICO_SCANNER_RAW_ARTIFACT_ROOT: /tmp/nico-contract-artifacts
      NICO_LIVE_SCANNER_CONTRACTS: '1'
      NICO_ENABLE_FULL_HISTORY_SECRET_SCAN: 'true'
      NICO_ALLOW_PROJECT_COMMANDS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Retain exact tested source identity
        run: |
          mkdir -p audit-results
          git rev-parse HEAD > audit-results/scanner-tested-commit.txt
      - name: Install checksum-verified pinned scanners
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]'
          python scripts/install_hosted_scanner_binaries.py
          echo /tmp/nico-pinned-scanners >> "$GITHUB_PATH"
      - name: Test real binaries, native provider checkout, and completion gate
        run: python -m pytest -q tests/test_scanner_live_contracts.py tests/test_scanner_completion_gate.py tests/test_hosted_provider_comprehensive_runtime_v1.py --junitxml=audit-results/scanner-contracts.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: scanner-live-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit-results/scanner-contracts.xml
            audit-results/scanner-tested-commit.txt
          if-no-files-found: error
          retention-days: 30
