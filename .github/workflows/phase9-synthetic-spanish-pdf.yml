name: Phase 9 Synthetic Spanish PDF (optional)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/phase9-synthetic-spanish-pdf.yml'
      - 'scripts/phase9_pr_pdf_receipt.py'
      - 'scripts/retain_phase9_synthetic_spanish_pdf.py'
      - 'tests/test_spanish_canonical_report_parity_v87.py'
      - 'tests/seven_row_review_pdf_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optional-synthetic-es-mx-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PHASE9_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact revision without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11.18'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Render and verify a synthetic es-MX draft
        if: ${{ github.event_name != 'pull_request' }}
        run: python -m scripts.retain_phase9_synthetic_spanish_pdf
      - name: Render and verify a synthetic es-MX draft (private PR output)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          if ! (
            python -m scripts.retain_phase9_synthetic_spanish_pdf &&
            python -m scripts.phase9_pr_pdf_receipt spanish
          ) >/dev/null 2>&1; then
            echo "::error::Synthetic PDF check failed; report diagnostics withheld."
            exit 1
          fi
      - name: Upload synthetic es-MX PDF proof
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-synthetic-es-mx-pdf-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: phase9-synthetic-spanish-proof/
      - name: Retain exact owned synthetic parity PDFs
        id: owned_parity
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          NICO_RETAIN_OWNED_PARITY_FIXTURES: '1'
        shell: bash
        run: |
          if ! (
            python -m pytest -q tests/test_spanish_canonical_report_parity_v87.py::test_same_canonical_package_has_exact_spanish_publication_parity &&
            python -m scripts.phase9_pr_pdf_receipt parity
          ) >/dev/null 2>&1; then
            echo "::error::Synthetic PDF check failed; report diagnostics withheld."
            exit 1
          fi
      - name: Verify owned seven-row review PDF in both locales
        id: seven_row_review
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          if ! (
            test "$(git rev-parse HEAD)" = "$PHASE9_REVISION" &&
            owned="$(mktemp -d "${RUNNER_TEMP}/nico-seven-row.XXXXXX")" &&
            env -i PATH="$PATH" LANG=C.UTF-8 HOME="$owned" PYTHONNOUSERSITE=1 PYTHONHASHSEED=0 \
              NICO_HOME="$owned" NICO_SQLITE_PATH="$owned/nico.sqlite3" \
              python -m tests.seven_row_review_pdf_probe \
                --checkout-sha "$PHASE9_REVISION" --output owned-seven-row-pdf-proof &&
            python -m scripts.phase9_pr_pdf_receipt seven-row
          ) >/dev/null 2>&1; then
            echo "::error::Synthetic PDF check failed; report diagnostics withheld."
            exit 1
          fi
      - name: Upload verified spanish receipt only
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-pr-spanish-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/phase9-pr-receipt-spanish/check.json
      - name: Upload verified parity receipt only
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-pr-parity-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/phase9-pr-receipt-parity/check.json
      - name: Upload verified seven-row receipt only
        if: ${{ success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-pr-seven-row-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/phase9-pr-receipt-seven-row/check.json
