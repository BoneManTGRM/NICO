name: Temporary Nanoid Lockfile Repair

on:
  push:
    branches:
      - codex/fix-current-review-candidate-truth-gate

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-current-review-candidate-truth-gate
          fetch-depth: 0

      - name: Repair vulnerable nanoid lock entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/package-lock.json")
          text = path.read_text(encoding="utf-8")
          old = '''    "node_modules/nanoid": {
              "version": "3.3.16",
              "resolved": "https://registry.npmjs.org/nanoid/-/nanoid-3.3.16.tgz",
              "integrity": "sha512-bzlKTyNJ7+LdGIIwy8ijFpIqEQIvafahV7eYykJ8Cvh42EdJeODoJ6gUJXpQJvej1BddH8OqTXZNE/KfbWAu8Q==",'''
          new = '''    "node_modules/nanoid": {
              "version": "3.3.17",
              "resolved": "https://registry.npmjs.org/nanoid/-/nanoid-3.3.17.tgz",
              "integrity": "sha512-xQLf0A3HOMlgHq0n247/LRuAOYmB7dXJ/DvAxGvsSBij45XtBSmQycu+F8ODbHwns/XyFZagyL1+J0Offw1E0g==",'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one vulnerable nanoid lock entry, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/temporary-nanoid-lockfile-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json .github/workflows/temporary-nanoid-lockfile-repair.yml
          git diff --cached --check
          git diff --cached -- apps/web/package-lock.json
          git commit -m "Fix production npm audit nanoid advisory"
          git push origin HEAD:codex/fix-current-review-candidate-truth-gate
