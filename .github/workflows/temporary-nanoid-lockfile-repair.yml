name: Temporary Nanoid Lockfile Repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: temporary-nanoid-lockfile-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/fix-current-review-candidate-truth-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/fix-current-review-candidate-truth-gate
          fetch-depth: 0

      - name: Repair vulnerable nanoid lock entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/package-lock.json")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '"version": "3.3.16"': '"version": "3.3.17"',
              '"resolved": "https://registry.npmjs.org/nanoid/-/nanoid-3.3.16.tgz"': '"resolved": "https://registry.npmjs.org/nanoid/-/nanoid-3.3.17.tgz"',
              '"integrity": "sha512-bzlKTyNJ7+LdGIIwy8ijFpIqEQIvafahV7eYykJ8Cvh42EdJeODoJ6gUJXpQJvej1BddH8OqTXZNE/KfbWAu8Q=="': '"integrity": "sha512-xQLf0A3HOMlgHq0n247/LRuAOYmB7dXJ/DvAxGvsSBij45XtBSmQycu+F8ODbHwns/XyFZagyL1+J0Offw1E0g=="',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new)
              elif count == 0 and new in text:
                  continue
              else:
                  raise SystemExit(f"unexpected nanoid lock value count for {old!r}: {count}")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify only the nanoid lock entry changed
        shell: bash
        run: |
          git diff --check -- apps/web/package-lock.json
          git diff -- apps/web/package-lock.json
          test "$(git diff --numstat -- apps/web/package-lock.json | awk '{print $1+$2}')" = "6"
          grep -A4 '"node_modules/nanoid"' apps/web/package-lock.json | grep -q '"version": "3.3.17"'

      - name: Remove temporary repair files and commit
        shell: bash
        run: |
          rm -f .github/workflows/temporary-nanoid-lockfile-repair.yml
          rm -f .github/nanoid-repair-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json .github/workflows/temporary-nanoid-lockfile-repair.yml .github/nanoid-repair-trigger
          git diff --cached --check
          git commit -m "Fix production npm audit nanoid advisory"
          git push origin HEAD:codex/fix-current-review-candidate-truth-gate
