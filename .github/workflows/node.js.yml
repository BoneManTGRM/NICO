name: Node.js CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/node.js.yml"
      - "scripts/run_phase9_node_scanners.py"
      - "scripts/nico_ci_typescript_check.cjs"
      - "nico/nico_ci_typescript_evidence_v1.py"
  push:
    branches:
      - main
      - upgrade/repair-first-foundation
    paths:
      - "apps/web/**"
      - ".github/workflows/node.js.yml"
      - "scripts/run_phase9_node_scanners.py"
      - "scripts/nico_ci_typescript_check.cjs"
      - "nico/nico_ci_typescript_evidence_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install exact frontend dependencies
        working-directory: apps/web
        timeout-minutes: 6
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Generate npm audit evidence
        working-directory: apps/web
        timeout-minutes: 3
        run: |
          mkdir -p ../../audit-results
          npm audit --audit-level=high --json > ../../audit-results/npm-audit-results.json || true
          test -f ../../audit-results/npm-audit-results.json || echo '{"status":"npm audit unavailable"}' > ../../audit-results/npm-audit-results.json

      - name: Build frontend
        id: build_frontend
        working-directory: apps/web
        timeout-minutes: 6
        run: npm run build

      - name: Lint frontend
        working-directory: apps/web
        timeout-minutes: 3
        run: npm run lint

      - name: Retain post-build TypeScript evidence
        if: always() && !cancelled() && (steps.build_frontend.outcome == 'success' || steps.build_frontend.outcome == 'failure')
        timeout-minutes: 3
        env:
          NICO_BUILD_OUTCOME: ${{ steps.build_frontend.outcome }}
        run: python scripts/run_phase9_node_scanners.py --post-build-typescript --output audit-results/typescript-evidence

      - name: Upload exact-run TypeScript evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nico-typescript-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-results/typescript-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload frontend audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-audit-results-${{ github.run_id }}
          path: audit-results/
          if-no-files-found: error
          retention-days: 7
