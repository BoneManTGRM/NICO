name: Node.js CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/node.js.yml"
      - "scripts/run_phase9_node_scanners.py"
      - "scripts/nico_ci_typescript_check.cjs"
      - "nico/nico_ci_typescript_evidence_v1.py"
  push:
    branches:
      - main
      - upgrade/repair-first-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install exact frontend dependencies
        working-directory: apps/web
        timeout-minutes: 6
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Generate npm audit evidence
        working-directory: apps/web
        timeout-minutes: 3
        run: |
          mkdir -p ../../audit-results
          npm audit --audit-level=high --json > ../../audit-results/npm-audit-results.json || true
          test -f ../../audit-results/npm-audit-results.json || echo '{"status":"npm audit unavailable"}' > ../../audit-results/npm-audit-results.json

      - name: Build frontend
        id: build_frontend
        working-directory: apps/web
        timeout-minutes: 6
        run: npm run build

      - name: Lint frontend
        working-directory: apps/web
        timeout-minutes: 3
        run: npm run lint

      - name: Retain post-build TypeScript evidence
        if: always() && !cancelled() && (steps.build_frontend.outcome == 'success' || steps.build_frontend.outcome == 'failure')
        timeout-minutes: 3
        env:
          NICO_BUILD_OUTCOME: ${{ steps.build_frontend.outcome }}
        run: python scripts/run_phase9_node_scanners.py --post-build-typescript --output audit-results/typescript-evidence

      - name: Upload exact-run TypeScript evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nico-typescript-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-results/typescript-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload frontend audit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frontend-audit-results-${{ github.run_id }}
          path: audit-results/
          if-no-files-found: error
          retention-days: 7

  owned_typescript_build_proof:
    name: Owned TypeScript build input proof
    if: >-
      github.event_name == 'pull_request'
      && github.repository == 'BoneManTGRM/NICO'
      && github.event.pull_request.head.repo.full_name == 'BoneManTGRM/NICO'
      && github.head_ref == 'fix/atlas-nico-typescript-build-proof-20261127'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out reviewed reference, not the assessment worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BoneManTGRM/NICO
          ref: 5eb768b5776f88bae86e972c76267915cc874c85
          persist-credentials: false
      - name: Verify source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 5eb768b5776f88bae86e972c76267915cc874c85
          test "$(git rev-parse 'HEAD^{tree}')" = fd4170b422a9f623c286e9e1f3c08e01b0ec821c
      - name: Set up reference Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.3"
      - name: Verify the toolchain and install the exact lock
        shell: bash
        working-directory: apps/web
        timeout-minutes: 6
        run: |
          test "$(node --version)" = v24.22.3
          test "$(npm --version)" = 11.19.1
          echo "a74cf1dc5d13b017a7f4b9df46cc5aa2420422ee790350ed93c5930fbe634c01  package-lock.json" | sha256sum --check
          npm ci --ignore-scripts --no-audit --no-fund
          node -e 'if (require("next/package.json").version !== "16.4.5" || require("typescript/package.json").version !== "6.0.3") process.exit(1)'
          echo "569177652966bd528c319171c7dd22860dbf72bde116cbc4f644f1d02bb12e39  node_modules/typescript/lib/typescript.js" | sha256sum --check
          echo "9332e97c30d3e53ed54910b89207ed657fb444066484df6e5b6965bf130865e9  node_modules/typescript/package.json" | sha256sum --check
      - name: Reproduce the protected frontend build without publishing output
        shell: bash
        working-directory: apps/web
        timeout-minutes: 6
        run: |
          node ./node_modules/next/dist/bin/next build >"$RUNNER_TEMP/nico-type-build.log" 2>&1 || {
            echo "::error::The reference frontend build did not complete. No output was uploaded."
            exit 1
          }
      - name: Verify five exact build input digests
        shell: bash
        working-directory: apps/web
        run: |
          sha256sum --check <<'EOF'
          091a04fa67c7907b98e106fcff8b964e13129754fce72d24f3025b97c4887fa3  .next/package.json
          7ff7da91491bf851eda28e1269f737c3502b110a9393952ccbc660a896194c76  .next/types/cache-life.d.ts
          f3387dd7800eec3c34273f7a8efad13e864598c7e8f788d321e407390989bb59  .next/types/root-params.d.ts
          b964ddf5bc213e55e4795fb8048fc434d76694903e5ac413747351805364c7a7  .next/types/routes.d.ts
          0a21c29ff7e21ac81833a59f781371089f8f0a12559a7eece4b739f5e26f0da6  .next/types/validator.ts
          1862ac4bbbc5192d4bf562161df66ea547ed3e67173100656ab606ae9797db2b  next-env.d.ts
          4332988fcf404a4e6070511e1ce95a7186f24428c9aea8442bf094ea11e779bb  tsconfig.json
          EOF

      - name: Check out the reviewed compiler proof adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BoneManTGRM/NICO
          ref: ${{ github.event.pull_request.head.sha }}
          path: .owned-typecheck-proof
          sparse-checkout: tools/owned-typecheck-replay
          persist-credentials: false

      - name: Build the read-only runtime proof image
        shell: bash
        timeout-minutes: 4
        run: |
          proof="$GITHUB_WORKSPACE/.owned-typecheck-proof/tools/owned-typecheck-replay"
          ctx="$(mktemp -d "$RUNNER_TEMP/nico-ts-proof.XXXXXX")"
          install -m 0555 "$(command -v node)" "$ctx/node"
          install -m 0444 "$proof/scripts/nico_typecheck_confined_driver_v1.cjs" "$ctx/"
          install -m 0444 "$proof/scripts/nico_typecheck_virtual_host_v1.cjs" "$ctx/"
          install -m 0444 apps/web/node_modules/typescript/lib/typescript.js "$ctx/"
          install -m 0444 apps/web/node_modules/typescript/package.json "$ctx/"
          cat >"$ctx/Dockerfile" <<'DOCKER'
          FROM python:3.11-slim-bookworm
          RUN apt-get update -q && apt-get install -y --no-install-recommends libstdc++6 libatomic1 && rm -rf /var/lib/apt/lists/* \
              && install -d -m 0755 /opt/nico-owned-typecheck-proof/scripts /opt/nico-owned-typecheck-proof/typescript/lib
          COPY --chown=0:0 --chmod=0555 node /opt/nico-owned-typecheck-proof/node
          COPY --chown=0:0 --chmod=0444 nico_typecheck_confined_driver_v1.cjs nico_typecheck_virtual_host_v1.cjs /opt/nico-owned-typecheck-proof/scripts/
          COPY --chown=0:0 --chmod=0444 typescript.js /opt/nico-owned-typecheck-proof/typescript/lib/typescript.js
          COPY --chown=0:0 --chmod=0444 package.json /opt/nico-owned-typecheck-proof/typescript/package.json
          USER 10001:10001
          DOCKER
          docker build --quiet --tag nico-ts-runtime-proof:local "$ctx"
      - name: Exercise the actual compiler bridge in the read-only image
        timeout-minutes: 3
        shell: bash
        env:
          PROOF_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          proof="$GITHUB_WORKSPACE/.owned-typecheck-proof/tools/owned-typecheck-replay"
          docker run --rm --user 10001:10001 --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/reference,readonly" \
            --mount "type=bind,source=$proof,target=/proof,readonly" \
            -e PYTHONPATH=/proof -e PYTHONDONTWRITEBYTECODE=1 \
            nico-ts-runtime-proof:local python /proof/scripts/replay_owned_typescript.py \
              --target /reference --proof-ref "$PROOF_REVISION" --installed /opt/nico-owned-typecheck-proof
