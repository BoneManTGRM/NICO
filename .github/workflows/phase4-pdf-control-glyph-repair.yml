name: Stage Comprehensive PDF control-glyph repair

on:
  push:
    branches:
      - codex/fix-comprehensive-pdf-control-glyph
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: phase4-pdf-control-glyph-repair-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Apply narrow renderer repair and regression
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("nico/comprehensive_rendered_ci_boundary_producer_v79.py")
          source = source_path.read_text(encoding="utf-8")
          old = 'story.append(Paragraph("• " + html.escape(line[2:]), bullet))'
          new = 'story.append(Paragraph("- " + html.escape(line[2:]), bullet))'
          if source.count(old) != 1:
              raise SystemExit(
                  f"Expected exactly one Unicode bullet renderer, found {source.count(old)}"
              )
          source_path.write_text(source.replace(old, new), encoding="utf-8")

          test_path = Path("tests/test_comprehensive_pdf_control_glyph_regression.py")
          test_path.write_text(
              '''from __future__ import annotations

import io

import pytest
from pypdf import PdfReader

from nico import comprehensive_rendered_ci_boundary_producer_v79 as producer


@pytest.mark.parametrize(
    ("spanish", "marker"),
    (
        (False, "A. CI/CD configuration maturity:"),
        (True, "A. Madurez de configuración de CI/CD:"),
    ),
)
def test_ci_boundary_pdf_lists_are_extractable_without_control_glyphs(
    spanish: bool,
    marker: str,
) -> None:
    canonical: dict[str, object] = {
        "report_language": "es-MX" if spanish else "en",
        "identity": {
            "repository": "acme/api",
            "commit_sha": "abc123",
            "run_id": "comprun_control_glyph_fixture",
            "generated_at": "2026-01-01T00:00:00Z",
            "evidence_ledger_id": "ledger_control_glyph_fixture",
        },
        "assessment": {
            "report_language": "es-MX" if spanish else "en",
            "sections": [],
        },
        "stage_summaries": [],
        "canonical_findings": [],
        "findings_register": [],
        "roadmap": [],
        "staffing_plan": [],
        "scanner_execution_records": [],
        "workflow_health": {},
    }

    pdf = producer._boundary_pdf_page(canonical, spanish=spanish)
    text = "\n".join(
        page.extract_text() or ""
        for page in PdfReader(io.BytesIO(pdf)).pages
    )

    assert f"- {marker}" in text
    forbidden = [
        f"U+{ord(character):04X}"
        for character in text
        if (
            ord(character) == 0x7F
            or (ord(character) < 32 and character not in "\n\r\t\f")
        )
    ]
    assert forbidden == []
''',
              encoding="utf-8",
          )

          workflow_path = Path(".github/workflows/phase4-pdf-control-glyph-repair.yml")
          workflow_path.unlink()
          PY

          python -m py_compile \
            nico/comprehensive_rendered_ci_boundary_producer_v79.py \
            tests/test_comprehensive_pdf_control_glyph_regression.py
          git diff --check

      - name: Commit focused repair and remove staging workflow
        run: |
          set -euo pipefail
          git config user.name "Reparodynamics"
          git config user.email "papadenico@yahoo.com"
          git add \
            nico/comprehensive_rendered_ci_boundary_producer_v79.py \
            tests/test_comprehensive_pdf_control_glyph_regression.py \
            .github/workflows/phase4-pdf-control-glyph-repair.yml
          git commit -m "Fix Comprehensive PDF control glyphs"
          git push origin "HEAD:${TARGET_BRANCH}"
