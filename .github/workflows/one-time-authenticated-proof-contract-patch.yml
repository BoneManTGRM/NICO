name: One-time Authenticated Proof Contract Patch

on:
  push:
    branches:
      - fix/specialist-production-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production-acceptance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/specialist-production-acceptance
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Align remaining authenticated proof tests
        env:
          OLD_GATE_B64: 
          NEW_GATE_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path("tests/test_mobile_visibility_lifecycle_proof_v1.py")
          source = path.read_text(encoding="utf-8")
          old = base64.b64decode(os.environ["OLD_GATE_B64"]).decode("utf-8")
          new = base64.b64decode(os.environ["NEW_GATE_B64"]).decode("utf-8")
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("Authoritative visibility test block was not found.")
          path.write_text(source, encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_mobile_visibility_lifecycle_proof_v1.py
          if git diff --cached --quiet; then
            echo 'Proof tests already aligned.'
            exit 0
          fi
          git commit -m 'Align mobile proof tests with authenticated harness'
          git push origin HEAD:fix/specialist-production-acceptance
