name: One-time Authenticated Proof Contract Patch

on:
  push:
    branches:
      - fix/specialist-production-acceptance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production-acceptance branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/specialist-production-acceptance
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Align remaining authenticated proof tests
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_mobile_visibility_lifecycle_proof_v1.py")
          source = path.read_text(encoding="utf-8")

          old_launchers = '''    assert "xvfb-run -a python scripts/spanish_comprehensive_live_acceptance_v3.py" in spanish
    assert "xvfb-run -a python scripts/spanish_comprehensive_existing_run_recovery_v1.py" in spanish
'''
          new_launchers = '''    assert (
        "xvfb-run -a python scripts/"
        "spanish_comprehensive_authenticated_live_acceptance_v1.py"
    ) in spanish
    assert (
        "xvfb-run -a python scripts/"
        "spanish_comprehensive_authenticated_existing_run_recovery_v1.py"
    ) in spanish
'''
          if old_launchers in source:
              source = source.replace(old_launchers, new_launchers, 1)
          elif new_launchers not in source:
              raise SystemExit("Authenticated Spanish launcher contract was not found in either state.")

          old_gate = '''    for workflow_path in (SPANISH_WORKFLOW, MOBILE_WORKFLOW):
        workflow = workflow_path.read_text(encoding="utf-8")
        assert (
            f'visibility["visibility_transition_mechanism"] == "{expected}"'
            in workflow
        )
        assert retired not in workflow
        for contract in required_contracts:
            assert contract in workflow
'''
          new_gate = '''    mobile = MOBILE_WORKFLOW.read_text(encoding="utf-8")
    assert (
        f'visibility["visibility_transition_mechanism"] == "{expected}"'
        in mobile
    )
    assert retired not in mobile
    for contract in required_contracts:
        assert contract in mobile

    spanish = SPANISH_WORKFLOW.read_text(encoding="utf-8")
    assert retired not in spanish
    assert "spanish_comprehensive_authenticated_live_acceptance_v1.py" in spanish
    assert "spanish_comprehensive_authenticated_existing_run_recovery_v1.py" in spanish
    for contract in (
        'visibility["browser_engine"] == "chromium"',
        'visibility["browser_launch_mode"] == "headed_xvfb"',
        'visibility["document_hidden_observed"] is True',
        'visibility["document_visible_after_foreground"] is True',
        'visibility["observed_visibility_transitions"][-2:] == ["hidden", "visible"]',
    ):
        assert contract in spanish
'''
          if old_gate in source:
              source = source.replace(old_gate, new_gate, 1)
          elif new_gate not in source:
              raise SystemExit("Authoritative visibility gate contract was not found in either state.")

          path.write_text(source, encoding="utf-8")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_mobile_visibility_lifecycle_proof_v1.py
          if git diff --cached --quiet; then
            echo 'Proof tests already aligned.'
            exit 0
          fi
          git commit -m 'Align mobile proof tests with authenticated harness'
          git push origin HEAD:fix/specialist-production-acceptance
