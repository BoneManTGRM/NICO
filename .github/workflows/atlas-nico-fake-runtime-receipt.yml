name: NICO fake-only tested runtime receipt
on:
  push:
    branches: [atlas-synthetic-restore-20261119]
    paths: [.github/workflows/atlas-nico-fake-runtime-receipt.yml, .github/nico-ams-artifact/**]
permissions:
  contents: read
jobs:
  fixture:
    if: github.repository == 'BoneManTGRM/NICO'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash .github/nico-ams-artifact/export.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nico-fake-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/nico-fake-runtime-output/fake-runtime.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
