name: Isolated Native Timeout Diagnostic

on:
  pull_request:
    paths:
      - 'scripts/native_timeout_diagnostic.py'
      - 'tests/test_native_timeout_diagnostic.py'
      - '.github/workflows/native-timeout-diagnostic.yml'

permissions:
  contents: read
  actions: read

# A stacked diagnostic PR still shares PR1722's full-qualification lock.
concurrency:
  group: cpp-full-project-integration-refs/pull/1722/merge
  # Keep waiting diagnostics and qualification runs; false alone protects only the running one.
  queue: max
  cancel-in-progress: false

jobs:
  isolated-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'diagnostic/current-primary-38380333159' && github.event.pull_request.base.ref == 'repair/ast-boundary-independent-fc9a0a75-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve the current qualification and skip an unnecessary diagnostic
        id: need
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p native-diagnostic-evidence
          gh api repos/BoneManTGRM/NICO/actions/runs/38380333159 > native-diagnostic-evidence/predecessor.json
          status=$(jq -r .status native-diagnostic-evidence/predecessor.json)
          conclusion=$(jq -r .conclusion native-diagnostic-evidence/predecessor.json)
          test "$status" = completed
          test "$(jq -r .head_sha native-diagnostic-evidence/predecessor.json)" = 2bd1ea9dac2d38b721661eab68a26ef7d9747e33
          case "$conclusion" in
            success) echo 'required=false' >> "$GITHUB_OUTPUT" ;;
            failure) echo 'required=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'Predecessor is not a completed success or failure; no native work launched.'; exit 1 ;;
          esac
          git rev-parse HEAD > native-diagnostic-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > native-diagnostic-evidence/source-tree.txt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.need.outputs.required == 'true'
        with:
          python-version: '3.11'
      - name: Verify diagnostic contracts
        if: steps.need.outputs.required == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pytest -q tests/test_native_timeout_diagnostic.py tests/test_native_stage_counters.py tests/test_native_specialization_groups.py tests/test_cpp_project_static_stage.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.need.outputs.required == 'true'
        with:
          repository: cppcheck-opensource/cppcheck
          ref: ac9db3069b9f90e81e126a090b99ad456e122cf8
          path: toolchain/full-project/cppcheck
          persist-credentials: false
      - name: Reuse the exact existing tool recipe
        if: steps.need.outputs.required == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.native_timeout_diagnostic import provision_script
          workflow=Path('.github/workflows/cpp-full-project-integration.yml').read_text()
          for label,filename in [('Provision exact tools without assessed source or runtime network','provision.sh')]:
              Path('native-diagnostic-evidence',filename).write_text(provision_script(workflow,label))
          PY
          bash native-diagnostic-evidence/provision.sh
      - name: Exercise the owned static-only boundary first
        if: steps.need.outputs.required == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.native_timeout_diagnostic import owned_primary_control
          owned_primary_control(Path('full-project-image-id.txt').read_text().strip(), Path('native-diagnostic-evidence/owned'))
          PY
      - name: Build and bind the separate instrumented diagnostic image
        if: steps.need.outputs.required == 'true'
        run: |
          set -euo pipefail
          python -m scripts.native_stage_counters.build prepare --context toolchain/full-project --recipe docker/assessment-full-project-fuzz.Dockerfile --output native-diagnostic-evidence/stage.Dockerfile
          timeout --kill-after=5s 205s docker build --network=none --iidfile native-diagnostic-evidence/stage-image-id.txt -f native-diagnostic-evidence/stage.Dockerfile toolchain/full-project
          docker image inspect "$(cat native-diagnostic-evidence/stage-image-id.txt)" > native-diagnostic-evidence/stage-image.json
          python -m scripts.native_stage_counters.build capture --original-image "$(cat full-project-image-id.txt)" --image "$(cat native-diagnostic-evidence/stage-image-id.txt)" --output native-diagnostic-evidence/stage-binding --recipe native-diagnostic-evidence/stage.Dockerfile
      - name: Prove analyzer opt-in and absence on owned source before acquisition
        if: steps.need.outputs.required == 'true'
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from scripts.native_timeout_diagnostic import owned_primary_control
          from scripts.native_stage_counters.binding import load_binding
          image=Path('native-diagnostic-evidence/stage-image-id.txt').read_text().strip()
          binding_sha=Path('native-diagnostic-evidence/stage-binding/binding.sha256').read_text().strip()
          original_image=Path('full-project-image-id.txt').read_text().strip()
          binding=load_binding(Path('native-diagnostic-evidence/stage-binding/binding.json'),image,binding_sha,original_image)
          owned_primary_control(image,Path('native-diagnostic-evidence/owned-stage'),stage_binding=binding,stage_binding_sha256=binding_sha,original_image=original_image)
          PYCODE
      - name: Retrieve the immutable failed evidence
        if: steps.need.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/BoneManTGRM/NICO/actions/artifacts/11811288494/zip > retained-timeout.zip
          echo 'dbf890120e44a7d0f99133d69f316c9e8d7dce0210f3ae627e248ffa1c4e7e92  retained-timeout.zip' | sha256sum -c -
          test "$(wc -c < retained-timeout.zip)" -eq 22698583
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.need.outputs.required == 'true'
        with:
          repository: bitcoin/bitcoin
          ref: bb5296576e8f1a9fc11c19d9a25ba02ed4547e24
          path: qualification-input
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Measure only the three current primary contexts
        if: steps.need.outputs.required == 'true'
        run: >-
          python -m scripts.native_timeout_diagnostic
          --mode current-primary
          --archive retained-timeout.zip
          --archive-sha256 dbf890120e44a7d0f99133d69f316c9e8d7dce0210f3ae627e248ffa1c4e7e92
          --qualification-source qualification-input
          --qualification-manifest tests/fixtures/cpp/bitcoin-configuration-benchmark.json
          --image "$(cat native-diagnostic-evidence/stage-image-id.txt)"
          --stage-runtime-binding native-diagnostic-evidence/stage-binding/binding.json
          --stage-runtime-binding-sha256 "$(cat native-diagnostic-evidence/stage-binding/binding.sha256)"
          --original-image "$(cat full-project-image-id.txt)"
          --output native-diagnostic-evidence/isolated
      - name: Preserve evidence including actual failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isolated-native-timeout-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-diagnostic-evidence/
            full-project-image-id.txt
            full-project-image.json
            toolchain/full-project/llvm/receipt.json
            toolchain/full-project/project-dependencies/receipt.json
            toolchain/full-project/capnp-source/receipt.json
            toolchain/full-project/runtime-dependencies/receipt.json
          if-no-files-found: error
          retention-days: 30
