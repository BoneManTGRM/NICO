name: Isolated Native Timeout Diagnostic

on:
  pull_request:
    paths:
      - 'scripts/native_timeout_diagnostic.py'
      - 'tests/test_native_timeout_diagnostic.py'
      - '.github/workflows/native-timeout-diagnostic.yml'

permissions:
  contents: read
  actions: read

# The same PR ref/group prevents overlap with the preserved full qualification.
concurrency:
  group: cpp-full-project-integration-${{ github.ref }}
  # Keep waiting diagnostics and qualification runs; false alone protects only the running one.
  queue: max
  cancel-in-progress: false

jobs:
  isolated-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/cpp-runtime-scratch-retention'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve the current qualification and skip an unnecessary diagnostic
        id: need
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p native-diagnostic-evidence
          gh api repos/BoneManTGRM/NICO/actions/runs/36177497388 > native-diagnostic-evidence/predecessor.json
          status=$(jq -r .status native-diagnostic-evidence/predecessor.json)
          conclusion=$(jq -r .conclusion native-diagnostic-evidence/predecessor.json)
          test "$status" = completed
          test "$(jq -r .head_sha native-diagnostic-evidence/predecessor.json)" = f4abf2cb29ff9371b3da7230190a0d99c111117c
          case "$conclusion" in
            success) echo 'required=false' >> "$GITHUB_OUTPUT" ;;
            failure) echo 'required=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'Predecessor is not a completed success or failure; no native work launched.'; exit 1 ;;
          esac
          git rev-parse HEAD > native-diagnostic-evidence/source-commit.txt
          git rev-parse HEAD^{tree} > native-diagnostic-evidence/source-tree.txt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.need.outputs.required == 'true'
        with:
          python-version: '3.11'
      - name: Verify diagnostic contracts
        if: steps.need.outputs.required == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pytest -q tests/test_native_timeout_diagnostic.py tests/test_cpp_clang_fallback.py tests/test_cpp_project_static_stage.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.need.outputs.required == 'true'
        with:
          repository: cppcheck-opensource/cppcheck
          ref: ac9db3069b9f90e81e126a090b99ad456e122cf8
          path: toolchain/full-project/cppcheck
          persist-credentials: false
      - name: Reuse the exact existing tool recipe
        if: steps.need.outputs.required == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.native_timeout_diagnostic import provision_script
          workflow=Path('.github/workflows/cpp-full-project-integration.yml').read_text()
          for label,filename in [('Provision exact tools without assessed source or runtime network','provision.sh'),
                                 ('Stage the pinned unit-test asset outside the assessed source','asset.sh')]:
              Path('native-diagnostic-evidence',filename).write_text(provision_script(workflow,label))
          PY
          bash native-diagnostic-evidence/provision.sh
          bash native-diagnostic-evidence/asset.sh
      - name: Exercise the owned diagnostic boundary first
        if: steps.need.outputs.required == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.native_timeout_diagnostic import owned_control
          owned_control(Path('full-project-image-id.txt').read_text().strip(), Path('native-diagnostic-evidence/owned'))
          PY
      - name: Retrieve the immutable failed evidence
        if: steps.need.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/BoneManTGRM/NICO/actions/artifacts/10883294546/zip > retained-timeout.zip
          echo 'd4933e0120105b8427ebe813cfec2f8487e5d801b980e7cbfbc942adc0ffd41e  retained-timeout.zip' | sha256sum -c -
          test "$(wc -c < retained-timeout.zip)" -eq 20434872
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.need.outputs.required == 'true'
        with:
          repository: bitcoin/bitcoin
          ref: bb5296576e8f1a9fc11c19d9a25ba02ed4547e24
          path: qualification-input
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Measure only the two retained timeout cases
        if: steps.need.outputs.required == 'true'
        run: >-
          python -m scripts.native_timeout_diagnostic
          --archive retained-timeout.zip
          --archive-sha256 d4933e0120105b8427ebe813cfec2f8487e5d801b980e7cbfbc942adc0ffd41e
          --qualification-source qualification-input
          --qualification-manifest tests/fixtures/cpp/bitcoin-configuration-benchmark.json
          --runtime-scope tests/fixtures/cpp/bitcoin-runtime-scope.json
          --unit-test-data qualification-unit-test-data
          --image "$(cat full-project-image-id.txt)"
          --test cluster_linearize_tests
          --context c2d48aa8de514849e4167b32061fe921be8df2b06bca621bb2c96ba4990ef65e
          --output native-diagnostic-evidence/isolated
      - name: Preserve evidence including actual failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isolated-native-timeout-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-diagnostic-evidence/
            full-project-image-id.txt
            full-project-image.json
            toolchain/full-project/llvm/receipt.json
            toolchain/full-project/project-dependencies/receipt.json
            toolchain/full-project/capnp-source/receipt.json
            toolchain/full-project/runtime-dependencies/receipt.json
          if-no-files-found: error
          retention-days: 30
