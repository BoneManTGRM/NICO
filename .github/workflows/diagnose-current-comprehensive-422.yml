name: Repair Comprehensive Browser Projection 422

on:
  push:
    branches:
      - fix/comprehensive-422-final-closure-20260827

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/comprehensive-422-final-closure-20260827
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Apply exact response-wrapper compatibility repair
        shell: bash
        env:
          OLD_B64: 
          NEW_B64: 
          TEST_B64: 
        run: |
          set -euo pipefail
          python -c 'import base64, os; from pathlib import Path; p=Path("nico/comprehensive_final_report_process_isolation_v1.py"); t=p.read_text(encoding="utf-8"); old=base64.b64decode(os.environ["OLD_B64"]).decode(); new=base64.b64decode(os.environ["NEW_B64"]).decode(); assert t.count(old)==1, "expected exactly one legacy wrapper"; p.write_text(t.replace(old,new,1),encoding="utf-8"); Path("tests/test_comprehensive_process_isolation_browser_projection_compatibility.py").write_bytes(base64.b64decode(os.environ["TEST_B64"]))'

      - name: Install targeted test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          if [ -f requirements.txt ]; then python -m pip install --disable-pip-version-check -r requirements.txt; fi
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Verify exact repair and existing projection contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile nico/comprehensive_final_report_process_isolation_v1.py
          python -m pytest -q \
            tests/test_comprehensive_process_isolation_browser_projection_compatibility.py \
            tests/test_final_ship_blocker_metadata_and_browser_projection.py \
            tests/test_comprehensive_response_projection.py

      - name: Commit only the bounded production repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/diagnose-current-comprehensive-422.yml
          git config user.name 'Reparodynamics'
          git config user.email 'papadenico@yahoo.com'
          git add nico/comprehensive_final_report_process_isolation_v1.py tests/test_comprehensive_process_isolation_browser_projection_compatibility.py .github/workflows/diagnose-current-comprehensive-422.yml
          git diff --cached --check
          git commit -m 'Fix browser projection compatibility in process-isolation response wrapper'
          git push origin HEAD:fix/comprehensive-422-final-closure-20260827
