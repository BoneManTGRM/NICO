name: Internal Capability Package 4 Indent Fix

on:
  push:
    branches:
      - internal-capabilities/04-scanner-candidate-reliability

permissions:
  contents: write

jobs:
  fix-source:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-indent-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: internal-capabilities/04-scanner-candidate-reliability
          fetch-depth: 1
      - name: Repair scanner worker block indentation
        shell: python
        run: |
          from pathlib import Path

          path = Path("nico/snapshot_scanner_worker.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "                    except Exception as exc:  # pragma: no cover - defensive per-tool boundary\n"
          end_marker = "                results.append(result)\n"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("scanner worker block not found")
          end += len(end_marker)
          lines = [
              "                    except Exception as exc:  # pragma: no cover - defensive per-tool boundary",
              "                        result = attach_scanner_execution_contract(",
              "                            {",
              "                                \"tool\": spec.name,",
              "                                \"status\": \"failed\",",
              "                                \"category\": spec.category,",
              "                                \"reason\": f\"{spec.name} failed safely inside the snapshot worker: {type(exc).__name__}\",",
              "                                \"findings\": [],",
              "                                \"verified_for_this_report\": False,",
              "                                \"current_run\": True,",
              "                                \"scans_git_history\": spec.scans_git_history,",
              "                                \"output_capture_complete\": False,",
              "                                \"timed_out\": False,",
              "                            },",
              "                            spec,",
              "                        )",
              "                    expected_commit = str(payload.get(\"snapshot_commit_sha\") or \"\").lower()",
              "                    result[\"snapshot_commit_sha\"] = expected_commit",
              "                    result[\"actual_commit_sha\"] = actual_commit_sha",
              "                    result[\"exact_commit_match\"] = bool(actual_commit_sha) and actual_commit_sha == expected_commit",
              "                    result = persist_redacted_scanner_artifact(result, scan_id=scan_id)",
              "                    validation = validate_scanner_execution_record(",
              "                        result,",
              "                        expected_commit_sha=expected_commit,",
              "                    )",
              "                    result[\"execution_contract_validation\"] = validation",
              "                    if validation[\"status\"] != \"valid\":",
              "                        result[\"status\"] = \"failed\"",
              "                        result[\"verified_for_this_report\"] = False",
              "                        result[\"reason\"] = (",
              "                            \"scanner execution contract failed: \"",
              "                            + \",\".join(validation[\"validation_errors\"])",
              "                        )",
              "                    redaction_applied = redaction_applied or \"[REDACTED]\" in str(result)",
              "                    results.append(result)",
              "",
          ]
          path.write_text(text[:start] + "\n".join(lines) + text[end:], encoding="utf-8")
          Path(".github/workflows/internal-capability-package4-indent-fix.yml").unlink()
      - name: Commit repaired source
        run: |
          set -euo pipefail
          python -m py_compile nico/snapshot_scanner_worker.py nico/scanner_tool_runners.py nico/scanner_execution_contract_v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nico/snapshot_scanner_worker.py .github/workflows/internal-capability-package4-indent-fix.yml
          git commit -m "Repair scanner worker contract indentation [scanner-indent-fixed]"
          git push origin HEAD:internal-capabilities/04-scanner-candidate-reliability
