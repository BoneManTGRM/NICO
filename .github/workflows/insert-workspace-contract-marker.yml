name: Insert workspace contract marker

on:
  push:
    branches:
      - fix/true-compact-mobile-assessment

permissions:
  contents: write

jobs:
  patch:
    if: >-
      !contains(github.event.head_commit.message, 'Restore workspace source contract marker') &&
      !contains(github.event.head_commit.message, 'Remove temporary workspace marker patcher')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/true-compact-mobile-assessment
          fetch-depth: 0
      - run: python scripts/insert_workspace_contract_marker.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/assessment/AssessmentWorkspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Restore workspace source contract marker"
          git push origin HEAD:fix/true-compact-mobile-assessment
