name: Apply compact mobile proof selector patch

on:
  push:
    branches:
      - fix/mobile-proof-compact-identity-selector

permissions:
  contents: write

jobs:
  patch:
    if: >-
      !contains(github.event.head_commit.message, 'Apply compact mobile proof selector') &&
      !contains(github.event.head_commit.message, 'Remove compact mobile proof patcher')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/mobile-proof-compact-identity-selector
          fetch-depth: 0

      - name: Apply exact proof repair
        run: python scripts/apply_mobile_proof_compact_identity_patch.py

      - name: Verify repaired proof contracts
        run: |
          python -m py_compile scripts/mobile_restart_live_acceptance_v1.py
          python -m py_compile tests/test_mobile_restart_compact_identity_contract_v1.py
          grep -q "querySelectorAll('article, details p')" scripts/mobile_restart_live_acceptance_v1.py
          grep -q 'Internal review required' scripts/mobile_restart_live_acceptance_v1.py

      - name: Commit repaired proof and contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/mobile_restart_live_acceptance_v1.py \
            .github/workflows/mobile-restart-production-proof.yml \
            .github/workflows/ios-webkit-paint-proof.yml \
            tests/test_mobile_restart_compact_identity_contract_v1.py
          git diff --cached --quiet && exit 0
          git commit -m "Apply compact mobile proof selector"
          git push origin HEAD:fix/mobile-proof-compact-identity-selector
