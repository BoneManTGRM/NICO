name: Diagnose Client Ready Post 972 v62

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-client-ready-post972-v62.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORIGIN: https://app.nicoaudit.com
      RUN_ID: comprun_b29d68d81b6341a99eedc48b08fa1ec4
    steps:
      - name: Fetch persisted run and report endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          base="${ORIGIN}/api/nico/assessment/comprehensive-run/${RUN_ID}"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --retry-all-errors --max-time 120 \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "${base}" -o diagnostic/run-status.json
          for suffix in report/json report/markdown report/pdf; do
            name="$(printf '%s' "${suffix}" | tr '/' '-')"
            if ! curl --fail-with-body --silent --show-error \
              --retry 1 --retry-delay 2 --retry-all-errors --max-time 90 \
              -H 'Accept: application/json, text/plain, application/pdf' \
              -H 'Cache-Control: no-cache' \
              "${base}/${suffix}" -o "diagnostic/${name}"; then
              rm -f "diagnostic/${name}"
              printf '%s\n' unavailable > "diagnostic/${name}.status"
            fi
          done

      - name: Extract exact failure and report validation evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('diagnostic/run-status.json').read_text(encoding='utf-8'))
          record = status.get('record') if isinstance(status.get('record'), dict) else status
          stages = record.get('stage_results') if isinstance(record.get('stage_results'), dict) else status.get('stage_results')
          stages = stages if isinstance(stages, dict) else {}
          summary = {
              'artifact_schema': 'nico.client_ready_post972_failure.v62',
              'run_id': status.get('run_id') or record.get('identity', {}).get('run_id'),
              'status': status.get('status') or record.get('status'),
              'current_stage': status.get('current_stage') or record.get('current_stage'),
              'terminal': status.get('terminal', record.get('terminal')),
              'revision': status.get('revision') or record.get('revision'),
              'failure': status.get('failure') or record.get('failure'),
              'error': status.get('error') or record.get('error'),
              'message': status.get('message') or record.get('message'),
              'final_comprehensive_report_generation': stages.get('final_comprehensive_report_generation'),
              'cross_format_truth_verification': stages.get('cross_format_truth_verification'),
              'dependency_security_static_analysis': stages.get('dependency_security_static_analysis'),
              'evidence_reconciliation_and_scoring': stages.get('evidence_reconciliation_and_scoring'),
              'report_json_available': Path('diagnostic/report-json').exists(),
              'report_markdown_available': Path('diagnostic/report-markdown').exists(),
              'report_pdf_available': Path('diagnostic/report-pdf').exists(),
          }
          Path('diagnostic/diagnostic-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True, default=str) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True, default=str))
          PY

      - name: Upload immutable diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: client-ready-post972-v62-${{ github.sha }}
          path: diagnostic/
          if-no-files-found: error
          retention-days: 30
