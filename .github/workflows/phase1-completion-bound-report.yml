name: Phase 1 Complete Comprehensive Report

on:
  workflow_run:
    workflows: ["Unified Production Acceptance"]
    types:
      - completed

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: four-phase-complete-comprehensive-report-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  bind:
    name: Bind final four-phase engineering evidence into one NICO Comprehensive report
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      SOURCE_ARTIFACT_NAME: unified-production-acceptance-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
      BACKEND_STATUS_CONTEXT: ${{ vars.NICO_PRODUCTION_BACKEND_STATUS_CONTEXT || 'successful-cat - NICO' }}
      STATUS_CONTEXT: NICO Phase 1 Complete Report
    steps:
      - name: Check out exact accepted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install deterministic completion-report dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "pypdf>=5,<7" \
            "reportlab>=4,<5"
          python -m py_compile \
            nico/phase1_completion_report_contract_v1.py \
            nico/phase1_completion_report_pdf_v1.py \
            nico/four_phase_completion_report_pdf_v1.py \
            scripts/phase1_completion_report_binder_v1.py \
            scripts/four_phase_completion_report_extender_v1.py

      - name: Download exact successful acceptance artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: source-acceptance
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Wait for and capture every exact-current-head production context
        id: current_head
        run: |
          set -euo pipefail
          mkdir -p bound-report
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          run_id = os.environ["SOURCE_RUN_ID"]
          run_attempt = os.environ["SOURCE_RUN_ATTEMPT"]
          artifact_name = os.environ["SOURCE_ARTIFACT_NAME"]
          backend_context = os.environ["BACKEND_STATUS_CONTEXT"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nico-four-phase-complete-report-binder",
          }

          def fetch(url: str) -> dict:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.loads(response.read().decode("utf-8"))

          acceptance_path = Path(
              "source-acceptance/two-service-live-acceptance.json"
          )
          acceptance = json.loads(acceptance_path.read_text(encoding="utf-8"))
          if (
              str(acceptance.get("expected_deployed_sha") or "") != sha
              or str(acceptance.get("source_workflow_run_id") or "").strip() == ""
              or str(acceptance.get("source_workflow_run_attempt") or "").strip() == ""
          ):
              raise SystemExit(
                  "Unified acceptance omitted its exact Spanish source run binding"
              )
          spanish_source_run_id = str(acceptance["source_workflow_run_id"])
          spanish_source_run_attempt = str(
              acceptance["source_workflow_run_attempt"]
          )
          source_marker = (
              f"source:{spanish_source_run_id}:{spanish_source_run_attempt}"
          )

          required = [
              "Vercel",
              backend_context,
              "NICO Mobile Restart Production Proof",
              "NICO iOS WebKit Paint Proof",
              "NICO Spanish Comprehensive Production Proof",
              "NICO Two-Service Production Acceptance",
              "NICO Production Acceptance Green Watch",
          ]
          derived_context = "NICO Production Acceptance Green Watch"
          source_bound_contexts = {
              "NICO Mobile Restart Production Proof",
              "NICO iOS WebKit Paint Proof",
              "NICO Spanish Comprehensive Production Proof",
              "NICO Two-Service Production Acceptance",
              derived_context,
          }
          deadline = time.time() + 60 * 60
          observed = {}
          while time.time() < deadline:
              status_payload = fetch(f"https://api.github.com/repos/{repository}/commits/{sha}/status?per_page=100")
              matching = {name: [] for name in required}
              for item in status_payload.get("statuses") or []:
                  context = str(item.get("context") or "")
                  description = str(item.get("description") or "")
                  if context not in matching:
                      continue
                  if (
                      context in source_bound_contexts
                      and not description.startswith(source_marker + " ")
                  ):
                      continue
                  matching[context].append({
                          "state": str(item.get("state") or "unknown"),
                          "description": description,
                          "target_url": str(item.get("target_url") or ""),
                          "created_at": str(item.get("created_at") or ""),
                          "updated_at": str(item.get("updated_at") or ""),
                          "id": int(item.get("id") or 0),
                      })
              latest = {
                  name: max(
                      values,
                      key=lambda item: (item["created_at"], item["id"]),
                      default={"state": "missing"},
                  )
                  for name, values in matching.items()
              }
              observed = {name: latest[name] for name in required}
              hard_failures = {
                  name: item.get("state")
                  for name, item in observed.items()
                  if name != derived_context and item.get("state") in {"failure", "error"}
              }
              if hard_failures:
                  raise SystemExit(
                      "A causal exact-current-head production context failed: "
                      + json.dumps(hard_failures, sort_keys=True)
                  )
              blocking = {
                  name: item.get("state")
                  for name, item in observed.items()
                  if item.get("state") != "success"
              }
              print("Exact-current-head closure contexts: " + json.dumps({name: item.get("state") for name, item in observed.items()}, sort_keys=True), flush=True)
              if not blocking:
                  break
              time.sleep(20)
          else:
              raise SystemExit(
                  "Timed out waiting for exact-current-head production closure contexts: "
                  + json.dumps({name: item.get("state") for name, item in observed.items()}, sort_keys=True)
              )

          artifacts = fetch(f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/artifacts")
          artifact = next((item for item in artifacts.get("artifacts") or [] if item.get("name") == artifact_name), None)
          if not isinstance(artifact, dict):
              raise SystemExit(f"Exact source acceptance artifact was not found: {artifact_name}")

          snapshot = {
              "artifact_schema": "nico.phase1-current-head-status.v1",
              "repository": repository,
              "commit_sha": sha,
              "source_workflow_run_id": int(run_id),
              "source_workflow_run_attempt": int(run_attempt),
              "spanish_source_workflow_run_id": int(spanish_source_run_id),
              "spanish_source_workflow_run_attempt": int(spanish_source_run_attempt),
              "spanish_source_binding": source_marker.removeprefix("source:"),
              "required_contexts": required,
              "contexts": observed,
              "source_acceptance_artifact": {
                  "id": artifact.get("id"),
                  "name": artifact.get("name"),
                  "digest": artifact.get("digest") or "",
                  "size_in_bytes": artifact.get("size_in_bytes"),
                  "expired": artifact.get("expired"),
              },
              "captured_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          Path("bound-report/current-head-status.json").write_text(
              json.dumps(snapshot, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          def run_id_from(context: str) -> str:
              target = str(observed.get(context, {}).get("target_url") or "")
              match = re.search(r"/actions/runs/(\d+)", target)
              return match.group(1) if match else ""

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"mobile_run_id={run_id_from('NICO Mobile Restart Production Proof')}\n")
              stream.write(f"ios_run_id={run_id_from('NICO iOS WebKit Paint Proof')}\n")
              stream.write(f"spanish_run_id={run_id_from('NICO Spanish Comprehensive Production Proof')}\n")
              stream.write(f"green_watch_run_id={run_id_from('NICO Production Acceptance Green Watch')}\n")
              stream.write(f"artifact_id={artifact.get('id') or ''}\n")
              stream.write(f"artifact_name={artifact.get('name') or ''}\n")
              stream.write(f"artifact_digest={artifact.get('digest') or ''}\n")
          PY

      - name: Bind Phase 1 and Phase 2 completion truth into the existing Comprehensive report
        run: |
          set -euo pipefail
          python scripts/phase1_completion_report_binder_v1.py \
            --source-pdf source-acceptance/two-service-live-artifacts/pass-2-comprehensive.pdf \
            --acceptance-json source-acceptance/two-service-live-acceptance.json \
            --audit-json source-acceptance/phase1-structured-artifact-audit.json \
            --release-json source-acceptance/frontend-production-release-identity.json \
            --status-json bound-report/current-head-status.json \
            --expected-sha "${RELEASE_SHA}" \
            --workflow-run-id "${SOURCE_RUN_ID}" \
            --mobile-run-id "${{ steps.current_head.outputs.mobile_run_id }}" \
            --ios-run-id "${{ steps.current_head.outputs.ios_run_id }}" \
            --artifact-id "${{ steps.current_head.outputs.artifact_id }}" \
            --artifact-name "${{ steps.current_head.outputs.artifact_name }}" \
            --artifact-digest "${{ steps.current_head.outputs.artifact_digest }}" \
            --acceptance-completed-at "${{ github.event.workflow_run.updated_at }}" \
            --output-pdf bound-report/NICO-COMPREHENSIVE-PHASE-1-COMPLETE.pdf \
            --output-manifest bound-report/NICO-COMPREHENSIVE-PHASE-1-COMPLETE.manifest.json

      - name: Verify one-report product, Phase 1 closure, and Phase 2 software closure
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from pypdf import PdfReader

          root = Path("bound-report")
          pdf_path = root / "NICO-COMPREHENSIVE-PHASE-1-COMPLETE.pdf"
          manifest_path = root / "NICO-COMPREHENSIVE-PHASE-1-COMPLETE.manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          pdf_bytes = pdf_path.read_bytes()
          pdf = PdfReader(str(pdf_path))
          appended_page_count = len(pdf.pages) - manifest["source_report_page_count"]
          assert appended_page_count >= 3
          text = "\n".join(page.extract_text() or "" for page in pdf.pages[-appended_page_count:])

          assert manifest["artifact_schema"] == "nico.phase1-completion-bound-report.v1"
          assert manifest["status"] == "passed"
          assert manifest["report_product"] == "NICO COMPREHENSIVE"
          assert manifest["additional_report_product_created"] is False
          assert manifest["source_report_preserved"] is True
          assert manifest["commit_sha"] == "${{ github.event.workflow_run.head_sha }}"
          assert len(manifest["phase1_definition_of_done"]) == 9
          assert all(item["status"] == "passed" for item in manifest["phase1_definition_of_done"])
          assert manifest["phase1_definition_of_done"][8]["status"] == "passed"
          phase2 = manifest["phase2_completion"]
          assert phase2["software_status"] == "complete"
          assert phase2["empirical_specialist_effort_status"] == "not_yet_measured"
          assert phase2["empirical_specialist_effort_tracking_issue"] == 1169
          assert [item["pull_request"] for item in phase2["implementation_pull_requests"]] == [1166, 1170]
          assert all(phase2["software_definition_of_done"].values())
          assert phase2["automation_can_create_human_disposition"] is False
          assert phase2["automation_can_create_final_approval"] is False
          assert phase2["automation_can_authorize_client_delivery"] is False
          assert manifest["human_review_required"] is True
          assert manifest["human_approval_status"] == "pending"
          assert manifest["client_delivery_allowed"] is False
          assert manifest["final_report_page_count"] == len(pdf.pages)
          assert len(pdf.pages) > manifest["source_report_page_count"]
          assert manifest["final_report_sha256"] == hashlib.sha256(pdf_bytes).hexdigest()
          assert "Phase 1 Definition-of-Done Closure" in text
          assert "9. Required current-head checks pass" in text
          assert "PHASE 1 COMPLETE" in text
          assert "Phase 2 Human Review by Exception Closure" in text
          assert "#1166" in text and "#1170" in text
          assert "Issue #1169" in text
          assert "not_yet_measured" in text
          assert "PHASE 2 SOFTWARE COMPLETE" in text
          assert "HUMAN APPROVAL PENDING" in text
          assert "CLIENT DELIVERY BLOCKED" in text
          PY

      - name: Extend the same Comprehensive report with Phase 3 and Phase 4 Engineering closure
        run: |
          set -euo pipefail
          python scripts/four_phase_completion_report_extender_v1.py \
            --source-pdf bound-report/NICO-COMPREHENSIVE-PHASE-1-COMPLETE.pdf \
            --source-manifest bound-report/NICO-COMPREHENSIVE-PHASE-1-COMPLETE.manifest.json \
            --phase3-json docs/phase3-completion-observation.json \
            --phase4-json docs/phase4-controlled-pilot-readiness-observation.json \
            --status-json bound-report/current-head-status.json \
            --expected-sha "${RELEASE_SHA}" \
            --spanish-run-id "${{ steps.current_head.outputs.spanish_run_id }}" \
            --green-watch-run-id "${{ steps.current_head.outputs.green_watch_run_id }}" \
            --output-pdf bound-report/NICO-COMPREHENSIVE-FOUR-PHASE-ENGINEERING-COMPLETE.pdf \
            --output-manifest bound-report/NICO-COMPREHENSIVE-FOUR-PHASE-ENGINEERING-COMPLETE.manifest.json

      - name: Verify all four engineering phases, durability, and truthful pilot boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from pypdf import PdfReader

          root = Path("bound-report")
          pdf_path = root / "NICO-COMPREHENSIVE-FOUR-PHASE-ENGINEERING-COMPLETE.pdf"
          manifest_path = root / "NICO-COMPREHENSIVE-FOUR-PHASE-ENGINEERING-COMPLETE.manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          pdf_bytes = pdf_path.read_bytes()
          pdf = PdfReader(str(pdf_path))
          text = "\n".join(page.extract_text() or "" for page in pdf.pages[-4:])

          assert manifest["artifact_schema"] == "nico.four-phase-completion-bound-report.v1"
          assert manifest["status"] == "passed"
          assert manifest["report_product"] == "NICO COMPREHENSIVE"
          assert manifest["additional_report_product_created"] is False
          assert manifest["commit_sha"] == "${{ github.event.workflow_run.head_sha }}"
          assert manifest["phase3_completion"]["status"] == "satisfied"
          assert manifest["phase4_engineering_completion"]["engineering_status"] == "satisfied"
          assert manifest["production_operability_durability_status"] == "satisfied"
          assert manifest["controlled_outside_repository_pilot_status"] == "not_executed"
          assert manifest["human_review_required"] is True
          assert manifest["human_approval_status"] == "pending"
          assert manifest["client_delivery_allowed"] is False
          assert manifest["final_report_sha256"] == hashlib.sha256(pdf_bytes).hexdigest()
          assert "PHASE 3 ENGINEERING SATISFIED" in text
          assert "PHASE 4 ENGINEERING: SATISFIED" in text
          assert "REAL OUTSIDE-REPOSITORY PILOT NOT EXECUTED" in text
          assert "HUMAN APPROVAL PENDING" in text
          assert "CLIENT DELIVERY BLOCKED" in text
          PY

      - name: Upload the one four-phase-complete NICO Comprehensive report package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nico-comprehensive-four-phase-engineering-complete-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}
          path: |
            bound-report/NICO-COMPREHENSIVE-FOUR-PHASE-ENGINEERING-COMPLETE.pdf
            bound-report/NICO-COMPREHENSIVE-FOUR-PHASE-ENGINEERING-COMPLETE.manifest.json
            bound-report/current-head-status.json
            docs/phase2-completion-observation.json
            docs/phase3-completion-observation.json
            docs/phase4-controlled-pilot-readiness-observation.json
            source-acceptance/frontend-production-release-identity.json
            source-acceptance/two-service-live-acceptance.json
            source-acceptance/phase1-structured-artifact-audit.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish successful bound-report status
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json
          import os
          print(json.dumps({
              "state": "success",
              "context": os.environ["STATUS_CONTEXT"],
              "description": "One NICO Comprehensive report proves all four engineering phases; real pilot remains separate",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/status.json

      - name: Publish failed bound-report status
        if: failure()
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json
          import os
          print(json.dumps({
              "state": "failure",
              "context": os.environ["STATUS_CONTEXT"],
              "description": "Four-phase Comprehensive completion evidence could not be bound without weakening truth",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/status.json
