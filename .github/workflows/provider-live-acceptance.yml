name: Provider Live Acceptance

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Public provider to verify
        required: true
        type: choice
        options:
          - github
          - gitlab
          - bitbucket_cloud
          - azure_devops
      repository:
        description: Native repository identifier
        required: true
        type: string
      revision:
        description: Optional immutable revision; empty pins the first observed revision
        required: false
        type: string
      access_mode:
        description: Provider access contract
        required: true
        default: anonymous_public
        type: choice
        options:
          - anonymous_public
          - authenticated_read_only
      expected_outcome:
        description: Expected source-acquisition outcome
        required: true
        default: success
        type: choice
        options:
          - success
          - authentication_required

permissions:
  contents: read

concurrency:
  group: provider-live-acceptance-${{ inputs.provider }}-${{ inputs.access_mode }}
  cancel-in-progress: false

jobs:
  anonymous-public:
    if: inputs.access_mode == 'anonymous_public'
    name: Anonymous public two-pass proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: provider-live-acceptance
    env:
      NICO_GITLAB_URL: ${{ vars.NICO_GITLAB_URL }}
      NICO_BITBUCKET_CLOUD_URL: ${{ vars.NICO_BITBUCKET_CLOUD_URL }}
      NICO_AZURE_DEVOPS_URL: ${{ vars.NICO_AZURE_DEVOPS_URL }}
      NICO_AZURE_DEVOPS_ORGANIZATION: ${{ vars.NICO_AZURE_DEVOPS_ORGANIZATION }}
      NICO_AZURE_DEVOPS_PROJECT: ${{ vars.NICO_AZURE_DEVOPS_PROJECT }}
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install NICO
        run: python -m pip install --disable-pip-version-check --no-cache-dir -e .

      - name: Run isolated anonymous two-pass proof
        id: acceptance
        continue-on-error: true
        env:
          ACCEPTANCE_PROVIDER: ${{ inputs.provider }}
          ACCEPTANCE_REPOSITORY: ${{ inputs.repository }}
          ACCEPTANCE_REVISION: ${{ inputs.revision }}
          ACCEPTANCE_OUTCOME: ${{ inputs.expected_outcome }}
        run: |
          set -euo pipefail
          unset NICO_GITHUB_TOKEN GITHUB_TOKEN GH_TOKEN
          unset NICO_GITLAB_TOKEN GITLAB_TOKEN
          unset NICO_BITBUCKET_CLOUD_TOKEN BITBUCKET_TOKEN
          unset NICO_AZURE_DEVOPS_TOKEN AZURE_DEVOPS_TOKEN AZURE_DEVOPS_EXT_PAT SYSTEM_ACCESSTOKEN
          python scripts/provider_live_acceptance.py \
            --provider "${ACCEPTANCE_PROVIDER}" \
            --repository "${ACCEPTANCE_REPOSITORY}" \
            --revision "${ACCEPTANCE_REVISION}" \
            --access-mode anonymous_public \
            --expected-outcome "${ACCEPTANCE_OUTCOME}" \
            --passes 2 \
            --workflow-sha "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output audit-results/provider-live-acceptance.json

      - name: Upload immutable anonymous evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-live-anonymous-${{ inputs.provider }}-${{ github.sha }}-${{ github.run_id }}
          path: audit-results/provider-live-acceptance.json
          if-no-files-found: error
          retention-days: 90

      - name: Require safe anonymous evidence
        if: always()
        env:
          ACCEPTANCE_STEP_OUTCOME: ${{ steps.acceptance.outcome }}
          EXPECTED_OUTCOME: ${{ inputs.expected_outcome }}
        run: |
          set -euo pipefail
          unset NICO_GITHUB_TOKEN GITHUB_TOKEN GH_TOKEN
          unset NICO_GITLAB_TOKEN GITLAB_TOKEN
          unset NICO_BITBUCKET_CLOUD_TOKEN BITBUCKET_TOKEN
          unset NICO_AZURE_DEVOPS_TOKEN AZURE_DEVOPS_TOKEN AZURE_DEVOPS_EXT_PAT SYSTEM_ACCESSTOKEN
          test "${ACCEPTANCE_STEP_OUTCOME}" = success
          python scripts/provider_live_acceptance.py \
            --verify-artifact audit-results/provider-live-acceptance.json \
            --access-mode anonymous_public \
            --expected-outcome "${EXPECTED_OUTCOME}" \
            --workflow-sha "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"

  authenticated-read-only:
    if: inputs.access_mode == 'authenticated_read_only'
    name: Optional authenticated read-only proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: provider-live-acceptance
    env:
      NICO_GITHUB_TOKEN: ${{ secrets.NICO_GITHUB_TOKEN }}
      NICO_GITLAB_URL: ${{ vars.NICO_GITLAB_URL }}
      NICO_GITLAB_TOKEN: ${{ secrets.NICO_GITLAB_TOKEN }}
      NICO_BITBUCKET_CLOUD_URL: ${{ vars.NICO_BITBUCKET_CLOUD_URL }}
      NICO_BITBUCKET_CLOUD_TOKEN: ${{ secrets.NICO_BITBUCKET_CLOUD_TOKEN }}
      NICO_AZURE_DEVOPS_URL: ${{ vars.NICO_AZURE_DEVOPS_URL }}
      NICO_AZURE_DEVOPS_ORGANIZATION: ${{ vars.NICO_AZURE_DEVOPS_ORGANIZATION }}
      NICO_AZURE_DEVOPS_PROJECT: ${{ vars.NICO_AZURE_DEVOPS_PROJECT }}
      NICO_AZURE_DEVOPS_TOKEN: ${{ secrets.NICO_AZURE_DEVOPS_TOKEN }}
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install NICO
        run: python -m pip install --disable-pip-version-check --no-cache-dir -e .

      - name: Run optional authenticated proof
        id: acceptance
        continue-on-error: true
        env:
          ACCEPTANCE_PROVIDER: ${{ inputs.provider }}
          ACCEPTANCE_REPOSITORY: ${{ inputs.repository }}
          ACCEPTANCE_REVISION: ${{ inputs.revision }}
          ACCEPTANCE_OUTCOME: ${{ inputs.expected_outcome }}
        run: |
          set -euo pipefail
          python scripts/provider_live_acceptance.py \
            --provider "${ACCEPTANCE_PROVIDER}" \
            --repository "${ACCEPTANCE_REPOSITORY}" \
            --revision "${ACCEPTANCE_REVISION}" \
            --access-mode authenticated_read_only \
            --expected-outcome "${ACCEPTANCE_OUTCOME}" \
            --passes 2 \
            --workflow-sha "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output audit-results/provider-live-acceptance.json

      - name: Upload immutable authenticated evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-live-authenticated-${{ inputs.provider }}-${{ github.sha }}-${{ github.run_id }}
          path: audit-results/provider-live-acceptance.json
          if-no-files-found: error
          retention-days: 90

      - name: Require safe authenticated evidence
        if: always()
        env:
          ACCEPTANCE_STEP_OUTCOME: ${{ steps.acceptance.outcome }}
          EXPECTED_OUTCOME: ${{ inputs.expected_outcome }}
        run: |
          set -euo pipefail
          test "${ACCEPTANCE_STEP_OUTCOME}" = success
          python scripts/provider_live_acceptance.py \
            --verify-artifact audit-results/provider-live-acceptance.json \
            --access-mode authenticated_read_only \
            --expected-outcome "${EXPECTED_OUTCOME}" \
            --workflow-sha "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"
