name: Specialist Production Proof Finalizer

on:
  workflow_run:
    workflows:
      - Spanish Comprehensive Production Proof
    types:
      - completed

permissions:
  contents: read
  actions: read
  statuses: write
  id-token: write

concurrency:
  group: nico-specialist-production-finalizer-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  authenticated-mobile-webkit:
    name: Authenticate and finalize mobile and WebKit production proofs
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NICO_PRODUCTION_FRONTEND_URL: https://app.nicoaudit.com
      NICO_PRODUCTION_SMOKE_REPOSITORY: https://gitlab.com/gitlab-org/gitlab-test
      NICO_PRODUCTION_BACKEND_STATUS_CONTEXT: successful-cat - NICO
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      NICO_PROOF_HEADED_CHROMIUM: "1"
      NICO_PROOF_NATIVE_VISIBILITY: "1"
      NICO_PROOF_WEBKIT_NATIVE_VISIBILITY: "1"
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Require exact current main and successful deployments
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nico-specialist-production-finalizer",
          }
          with urllib.request.urlopen(
              urllib.request.Request(f"https://api.github.com/repos/{repo}/branches/main", headers=headers),
              timeout=30,
          ) as response:
              main = json.loads(response.read().decode("utf-8"))["commit"]["sha"]
          if main != sha:
              raise SystemExit(f"Source release {sha} is no longer exact main {main}")
          required = {"Vercel", os.environ["NICO_PRODUCTION_BACKEND_STATUS_CONTEXT"]}
          deadline = time.time() + 30 * 60
          while time.time() < deadline:
              with urllib.request.urlopen(
                  urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/commits/{sha}/status",
                      headers=headers,
                  ),
                  timeout=30,
              ) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              latest = {}
              for item in payload.get("statuses") or []:
                  latest.setdefault(str(item.get("context") or ""), str(item.get("state") or "unknown"))
              observed = {name: latest.get(name, "missing") for name in required}
              print(f"Deployment statuses: {observed}", flush=True)
              if all(value == "success" for value in observed.values()):
                  break
              if any(value in {"failure", "error"} for value in observed.values()):
                  raise SystemExit(f"Exact-main deployment failure: {observed}")
              time.sleep(20)
          else:
              raise SystemExit("Timed out waiting for exact-main Vercel and Railway deployments")
          PY

      - name: Wait for legacy mobile and iOS attempts to become terminal
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nico-specialist-finalizer-serialization",
          }
          required = {
              "NICO Mobile Restart Production Proof",
              "NICO iOS WebKit Paint Proof",
          }
          deadline = time.time() + 25 * 60
          while time.time() < deadline:
              with urllib.request.urlopen(
                  urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/commits/{sha}/status",
                      headers=headers,
                  ),
                  timeout=30,
              ) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              latest = {}
              for item in payload.get("statuses") or []:
                  latest.setdefault(str(item.get("context") or ""), str(item.get("state") or "unknown"))
              observed = {name: latest.get(name, "missing") for name in required}
              print(f"Legacy proof statuses: {observed}", flush=True)
              if all(value in {"success", "failure", "error"} for value in observed.values()):
                  break
              time.sleep(20)
          else:
              raise SystemExit("Legacy mobile/iOS proof attempts did not become terminal in time")
          PY

      - name: Download sole Spanish Comprehensive run handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spanish-comprehensive-production-proof-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: source-proof
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install pinned browser proof runtimes
        timeout-minutes: 25
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            . "playwright==1.61.0" "pypdf==6.15.0"
          python scripts/prepare_playwright_native_visibility_v1.py
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "${apt_source}" ] || continue
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              "${apt_source}"
          done
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99nico-ci-network >/dev/null
          timeout --signal=TERM --kill-after=30s 18m python -m playwright install --with-deps chromium webkit
          python scripts/prepare_playwright_webkit_native_visibility_v1.py

      - name: Validate immutable source handoff
        run: |
          set -euo pipefail
          PROOF_TOOL_SHA="$(git rev-parse HEAD)"
          python scripts/comprehensive_production_run_handoff_v1.py \
            --source-proof source-proof/spanish-comprehensive-live-proof.json \
            --expected-sha "${RELEASE_SHA}" \
            --repository "${NICO_PRODUCTION_SMOKE_REPOSITORY}" \
            --source-workflow-run-id "${SOURCE_RUN_ID}" \
            --source-workflow-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --expected-proof-tool-sha "${PROOF_TOOL_SHA}" \
            --output audit-results/comprehensive-run-handoff.json

      - name: Publish authenticated mobile proof pending
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/mobile-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "NICO Mobile Restart Production Proof",
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated mobile proof running",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/mobile-status.json

      - name: Prove authenticated mobile recovery and review PDF
        id: mobile
        continue-on-error: true
        run: |
          set -euo pipefail
          command -v xvfb-run
          PROOF_TOOL_SHA="$(git rev-parse HEAD)"
          xvfb-run -a python scripts/mobile_restart_authenticated_live_acceptance_v1.py \
            --frontend-url "${NICO_PRODUCTION_FRONTEND_URL}" \
            --repository "${NICO_PRODUCTION_SMOKE_REPOSITORY}" \
            --expected-sha "${RELEASE_SHA}" \
            --source-proof source-proof/spanish-comprehensive-live-proof.json \
            --source-workflow-run-id "${SOURCE_RUN_ID}" \
            --source-workflow-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --expected-proof-tool-sha "${PROOF_TOOL_SHA}" \
            --observation-seconds 90 \
            --ui-locale en \
            --output audit-results/mobile-restart-live-proof.json

      - name: Require authenticated mobile proof and publish success
        if: steps.mobile.outcome == 'success'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path("audit-results/mobile-restart-live-proof.json").read_text())
          assert payload["status"] == "passed", payload
          assert payload["expected_sha"] == os.environ["RELEASE_SHA"], payload
          assert payload["source_workflow_run_id"] == os.environ["SOURCE_RUN_ID"], payload
          assert payload["source_workflow_run_attempt"] == os.environ["SOURCE_RUN_ATTEMPT"], payload
          assert payload["fresh_assessment_count"] == 0, payload
          assert payload["continuation_post_count"] == 0, payload
          assert payload["terminal_restart_recovery_verified"] is True, payload
          assert payload["clean_context_reopen_verified"] is True, payload
          assert payload["ui_review_pdf_download_verified"] is True, payload
          assert payload["professional_review_navigation_verified"] is True, payload
          assert payload["client_delivery_allowed"] is False, payload
          PY
          python - <<'PY' >/tmp/mobile-status.json
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "NICO Mobile Restart Production Proof",
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated mobile proof passed",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/mobile-status.json

      - name: Publish authenticated mobile proof failure
        if: steps.mobile.outcome != 'success'
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/mobile-status.json
          import json, os
          print(json.dumps({
              "state": "failure",
              "context": "NICO Mobile Restart Production Proof",
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated mobile proof failed",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/mobile-status.json
          exit 1

      - name: Publish authenticated WebKit proof pending
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/ios-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": "NICO iOS WebKit Paint Proof",
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated WebKit proof running",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/ios-status.json

      - name: Prove authenticated iPhone WebKit recovery and review PDF
        id: ios
        continue-on-error: true
        run: |
          set -euo pipefail
          PROOF_TOOL_SHA="$(git rev-parse HEAD)"
          python scripts/ios_webkit_authenticated_live_acceptance_v1.py \
            --frontend-url "${NICO_PRODUCTION_FRONTEND_URL}" \
            --repository "${NICO_PRODUCTION_SMOKE_REPOSITORY}" \
            --expected-sha "${RELEASE_SHA}" \
            --source-proof source-proof/spanish-comprehensive-live-proof.json \
            --source-workflow-run-id "${SOURCE_RUN_ID}" \
            --source-workflow-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --expected-proof-tool-sha "${PROOF_TOOL_SHA}" \
            --observation-seconds 90 \
            --ui-locale es-MX \
            --output audit-results/ios-webkit-live-proof.json

      - name: Require authenticated WebKit proof and publish success
        if: steps.ios.outcome == 'success'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path("audit-results/ios-webkit-live-proof.json").read_text())
          assert payload["status"] == "passed", payload
          assert payload["expected_sha"] == os.environ["RELEASE_SHA"], payload
          assert payload["source_workflow_run_id"] == os.environ["SOURCE_RUN_ID"], payload
          assert payload["source_workflow_run_attempt"] == os.environ["SOURCE_RUN_ATTEMPT"], payload
          assert payload["browser_engine"] == "webkit", payload
          assert payload["fresh_assessment_count"] == 0, payload
          assert payload["continuation_post_count"] == 0, payload
          assert payload["terminal_restart_recovery_verified"] is True, payload
          assert payload["webkit_intake_paint_stability_verified"] is True, payload
          assert payload["terminal_failure_layout_viewports_verified"] is True, payload
          assert payload["ui_review_pdf_download_verified"] is True, payload
          assert payload["client_delivery_allowed"] is False, payload
          PY
          python - <<'PY' >/tmp/ios-status.json
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "NICO iOS WebKit Paint Proof",
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated WebKit proof passed",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/ios-status.json

      - name: Publish authenticated WebKit proof failure
        if: steps.ios.outcome != 'success'
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/ios-status.json
          import json, os
          print(json.dumps({
              "state": "failure",
              "context": "NICO iOS WebKit Paint Proof",
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated WebKit proof failed",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/ios-status.json
          exit 1

      - name: Upload authenticated finalizer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: specialist-production-proof-finalizer-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit-results/comprehensive-run-handoff.json
            audit-results/mobile-restart-live-proof.json
            audit-results/mobile-restart-live-proof.png
            audit-results/ios-webkit-live-proof.json
            audit-results/ios-webkit-live-proof.png
            audit-results/ios-webkit-live-proof-intake-top.png
            audit-results/ios-webkit-live-proof-intake-bottom.png
            audit-results/ios-webkit-live-proof-failure-*.png
          if-no-files-found: warn
          retention-days: 90
