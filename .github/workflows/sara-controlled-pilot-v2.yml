name: SARA Controlled Pilot V2

on:
  push:
    branches:
      - ops/sara-pilot-final-review-bridge
    paths:
      - .github/workflows/sara-controlled-pilot-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sara-controlled-pilot-v2
  cancel-in-progress: false

jobs:
  run-production-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NICO_ORIGIN: https://app.nicoaudit.com
      NICO_RUN_ID: comprun_2ba62f37f4ab4b7988c609f27398c63e
      SARA_REPOSITORY: BoneManTGRM/SARA
      SARA_COMMIT_SHA: d63f09d3d5d6e4a53860faec0ea5cb372a37c381
      CUSTOMER_ID: boneman-sara-client
      PROJECT_ID: sara-controlled-pilot-001
    steps:
      - name: Start and complete exact production assessment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          origin = os.environ["NICO_ORIGIN"].rstrip("/")
          run_id = os.environ["NICO_RUN_ID"]
          repository = os.environ["SARA_REPOSITORY"]
          commit_sha = os.environ["SARA_COMMIT_SHA"].lower()
          customer_id = os.environ["CUSTOMER_ID"]
          project_id = os.environ["PROJECT_ID"]
          transient = {408, 425, 429, 500, 502, 503, 504}

          def call(method, path, payload=None, *, attempts=5):
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {
                  "Accept": "application/json",
                  "X-NICO-Browser-Projection": "terminal-manifest-v1",
                  "User-Agent": "NICO-SARA-Controlled-Pilot-V2/3.0",
              }
              if body is not None:
                  headers["Content-Type"] = "application/json"
              for attempt in range(1, attempts + 1):
                  request = urllib.request.Request(
                      origin + path,
                      data=body,
                      headers=headers,
                      method=method,
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=270) as response:
                          raw = response.read()
                          return response.status, json.loads(raw.decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      raw = exc.read().decode("utf-8", errors="replace")
                      if exc.code in transient and attempt < attempts:
                          print(
                              f"Transient HTTP {exc.code} for {method} {path}; "
                              f"retry {attempt}/{attempts}"
                          )
                          time.sleep(min(30, attempt * 5))
                          continue
                      try:
                          detail = json.loads(raw)
                      except Exception:
                          detail = raw[:4000]
                      raise RuntimeError(
                          f"HTTP {exc.code} for {method} {path}: {detail}"
                      ) from exc
                  except (TimeoutError, urllib.error.URLError) as exc:
                      if attempt < attempts:
                          print(
                              f"Transient transport failure for {method} {path}: "
                              f"{exc}; retry {attempt}/{attempts}"
                          )
                          time.sleep(min(30, attempt * 5))
                          continue
                      raise
              raise RuntimeError(f"Request attempts exhausted: {method} {path}")

          def first_text(value):
              values = value if isinstance(value, (list, tuple)) else [value]
              for item in values:
                  text = str(item or "")
                  if text:
                      return text
              return ""

          observed_at = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          customer_name = "SARA / BoneManTGRM"
          project_name = "SARA — First Controlled Production Pilot"
          contact = "Cody Ryan Jenkins (GitHub: BoneManTGRM)"
          access_method = (
              "Authorized public GitHub repository using anonymous read-only access; "
              "no write permissions or provider credential supplied."
          )
          scope = (
              f"Read-only technical assessment of {repository} at exact commit "
              f"{commit_sha} only. No writes, deployments, account changes, outreach, "
              "or access outside this repository and SHA."
          )

          # Phase 3 reads the direct stakeholder_context input shape. Its three
          # client-engagement fields are arrays; NICO then normalizes the module into
          # the durable human_evidence.modules report shape.
          human_evidence = {
              "stakeholder_context": {
                  "reviewer": "Cody Ryan Jenkins",
                  "observed_at": observed_at,
                  "source_reference": (
                      "Explicit owner authorization for an owner-controlled client "
                      "pilot provided in the active ChatGPT work session on 2026-09-03."
                  ),
                  "evidence": {
                      "objectives": [
                          "Complete NICO's first owner-controlled production client pilot.",
                          (
                              "Produce the exact human-approved final report and "
                              "certified delivery package."
                          ),
                      ],
                      "constraints": [
                          "One authorized public repository and one immutable commit only.",
                          (
                              "Read-only access; no writes, deployments, account changes, "
                              "outreach, or broader access."
                          ),
                          (
                              "Human approval and client-delivery authorization remain "
                              "separate explicit actions."
                          ),
                      ],
                      "primary_technical_contact": [contact],
                      "access_method": [access_method],
                      "authorized_scope": [scope],
                  },
              }
          }

          intake = {
              "run_id": run_id,
              "repository": repository,
              "provider": "github",
              "provider_access_mode": "anonymous_public",
              "expected_commit_sha": commit_sha,
              "customer_id": customer_id,
              "project_id": project_id,
              "client_name": customer_name,
              "project_name": project_name,
              "assessment_depth": "strategic",
              "report_language": "en",
              "authorized": True,
              "authorization_confirmed": True,
              "authorized_by": "Cody Ryan Jenkins / BoneManTGRM",
              "authorization_scope": scope,
              "human_evidence": human_evidence,
          }

          _, started = call(
              "POST",
              "/api/nico/assessment/comprehensive-intake",
              intake,
          )
          returned_run_id = str(
              started.get("run_id")
              or started.get("identity", {}).get("run_id")
              or ""
          )
          if returned_run_id and returned_run_id != run_id:
              raise RuntimeError(
                  f"Intake returned the wrong run ID: {returned_run_id}"
              )
          print(f"Production intake accepted for {run_id}")

          last = started
          for tick in range(1, 181):
              _, status = call(
                  "GET",
                  f"/api/nico/assessment/comprehensive-run/{run_id}",
              )
              last = status
              identity = (
                  status.get("identity")
                  if isinstance(status.get("identity"), dict)
                  else {}
              )
              resolved_run = str(
                  status.get("run_id") or identity.get("run_id") or ""
              )
              resolved_sha = str(
                  status.get("commit_sha") or identity.get("commit_sha") or ""
              ).lower()
              if resolved_run and resolved_run != run_id:
                  raise RuntimeError(
                      f"Status resolved the wrong run ID: {resolved_run}"
                  )
              if resolved_sha and resolved_sha != commit_sha:
                  raise RuntimeError(
                      f"Status resolved the wrong commit SHA: {resolved_sha}"
                  )

              terminal = status.get("terminal") is True
              state = str(
                  status.get("status")
                  or status.get("canonical_status")
                  or "unknown"
              )
              print(
                  f"tick={tick} status={state} terminal={terminal} "
                  f"stage={status.get('current_stage')} "
                  f"progress={status.get('progress_percent')}"
              )
              if terminal:
                  if state not in {"review_required", "complete", "completed"}:
                      raise RuntimeError(
                          "Production assessment reached an unexpected terminal state: "
                          + json.dumps(status, sort_keys=True)[:5000]
                      )
                  break

              try:
                  _, last = call(
                      "POST",
                      f"/api/nico/assessment/comprehensive-run/{run_id}/continue",
                      {"max_stages": 1},
                      attempts=2,
                  )
              except RuntimeError as exc:
                  print(
                      "Continuation outcome requires exact-status recovery: "
                      f"{exc}"
                  )
              time.sleep(5)
          else:
              raise RuntimeError(
                  "Timed out waiting for production assessment human-review boundary."
              )

          _, report = call(
              "GET",
              f"/api/nico/assessment/comprehensive-run/{run_id}/report/json",
              attempts=5,
          )
          identity = (
              report.get("identity")
              if isinstance(report.get("identity"), dict)
              else {}
          )
          assessment = (
              report.get("assessment")
              if isinstance(report.get("assessment"), dict)
              else {}
          )
          engagement = (
              report.get("engagement_metadata")
              if isinstance(report.get("engagement_metadata"), dict)
              else {}
          )
          human = (
              report.get("human_evidence")
              if isinstance(report.get("human_evidence"), dict)
              else {}
          )
          modules = (
              human.get("modules")
              if isinstance(human.get("modules"), dict)
              else {}
          )
          stakeholder = (
              modules.get("stakeholder_context")
              if isinstance(modules.get("stakeholder_context"), dict)
              else {}
          )
          evidence = (
              stakeholder.get("evidence")
              if isinstance(stakeholder.get("evidence"), dict)
              else {}
          )

          normalized = {
              "engagement_mode": first_text(evidence.get("engagement_mode")),
              "client_identity": first_text(evidence.get("client_identity")),
              "project_identity": first_text(evidence.get("project_identity")),
              "primary_technical_contact": first_text(
                  evidence.get("primary_technical_contact")
              ),
              "access_method": first_text(evidence.get("access_method")),
              "authorized_scope": first_text(evidence.get("authorized_scope")),
          }
          checks = {
              "run_id": str(identity.get("run_id") or "") == run_id,
              "commit_sha": (
                  str(identity.get("commit_sha") or "").lower() == commit_sha
              ),
              "customer_id": (
                  str(identity.get("customer_id") or "") == customer_id
              ),
              "project_id": (
                  str(identity.get("project_id") or "") == project_id
              ),
              "repository": (
                  str(identity.get("repository") or "").casefold()
                  == repository.casefold()
              ),
              "engagement_mode": (
                  normalized["engagement_mode"].casefold() == "client"
              ),
              "client_identity": (
                  normalized["client_identity"] == customer_name
              ),
              "project_identity": (
                  normalized["project_identity"] == project_name
              ),
              "primary_technical_contact": (
                  normalized["primary_technical_contact"] == contact
              ),
              "access_method": (
                  normalized["access_method"] == access_method
              ),
              "authorized_scope": (
                  normalized["authorized_scope"] == scope
              ),
              "display_client_name": (
                  str(engagement.get("client_name") or "") == customer_name
              ),
              "display_project_name": (
                  str(engagement.get("project_name") or "") == project_name
              ),
              "review_required_candidates_zero": (
                  int(assessment.get("review_required_candidate_count") or 0)
                  == 0
              ),
              "canonical_findings_zero": (
                  int(assessment.get("canonical_finding_count") or 0) == 0
              ),
              "approval_still_required": (
                  report.get("client_delivery_allowed") is not True
              ),
          }
          failed = sorted(
              name for name, passed in checks.items() if not passed
          )
          if failed:
              raise RuntimeError(
                  f"Terminal report preflight failed: {failed}; "
                  f"identity={identity}; engagement={engagement}; "
                  f"normalized_stakeholder={normalized}"
              )

          summary = {
              "run_id": run_id,
              "repository": repository,
              "commit_sha": commit_sha,
              "customer_id": customer_id,
              "project_id": project_id,
              "status": str(last.get("status") or "review_required"),
              "score": assessment.get("score"),
              "review_required_candidate_count": assessment.get(
                  "review_required_candidate_count"
              ),
              "canonical_finding_count": assessment.get(
                  "canonical_finding_count"
              ),
              "engagement": normalized,
              "client_delivery_identity_preflight": "passed",
              "client_delivery_allowed_before_human_approval": report.get(
                  "client_delivery_allowed"
              ),
          }
          print(
              "SARA_CONTROLLED_PILOT_V2_TERMINAL="
              + json.dumps(summary, sort_keys=True)
          )
          with open(
              "sara-controlled-pilot-v2-summary.json",
              "w",
              encoding="utf-8",
          ) as handle:
              json.dump(summary, handle, indent=2, sort_keys=True)
          PY

      - name: Upload terminal pilot summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sara-controlled-pilot-v2-summary
          path: sara-controlled-pilot-v2-summary.json
          if-no-files-found: error
          retention-days: 30