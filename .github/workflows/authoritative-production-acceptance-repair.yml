name: Unified Production Acceptance Repair

on:
  workflow_run:
    workflows: ["Unified Production Acceptance"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: unified-production-acceptance-repair-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  repair-proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production-smoke
    env:
      NICO_PRODUCTION_FRONTEND_URL: ${{ vars.NICO_PRODUCTION_FRONTEND_URL || 'https://app.nicoaudit.com' }}
      NICO_PRODUCTION_SMOKE_REPOSITORY: ${{ vars.NICO_PRODUCTION_SMOKE_REPOSITORY || 'BoneManTGRM/NICO' }}
      NICO_PRODUCTION_BACKEND_STATUS_CONTEXT: ${{ vars.NICO_PRODUCTION_BACKEND_STATUS_CONTEXT || 'successful-cat - NICO' }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      STATUS_CONTEXT: NICO Two-Service Production Acceptance
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 1

      - name: Validate authoritative repair contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/unified_production_acceptance_authoritative.py
          python - <<'PY'
          from pathlib import Path
          source = Path('scripts/unified_production_acceptance_authoritative.py').read_text(encoding='utf-8')
          assert 'collapsed identity' in source
          assert 'expected_commit_sha' in source
          assert 'run_id' in source
          assert 'production.canonical_ui_state = authoritative_ui_state' in source
          PY

      - name: Wait for exact frontend and backend deployments
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          repository = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['RELEASE_SHA']
          token = os.environ['GITHUB_TOKEN']
          required = {'Vercel', os.environ['NICO_PRODUCTION_BACKEND_STATUS_CONTEXT']}
          deadline = time.time() + 30 * 60
          while time.time() < deadline:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/commits/{sha}/status',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'nico-authoritative-acceptance-repair',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode('utf-8'))
              states = {}
              for item in payload.get('statuses') or []:
                  states.setdefault(str(item.get('context') or ''), str(item.get('state') or 'unknown'))
              observed = {context: states.get(context, 'missing') for context in required}
              print(f'Deployment statuses: {observed}', flush=True)
              if all(observed[context] == 'success' for context in required):
                  break
              if any(observed[context] in {'error', 'failure'} for context in required):
                  raise SystemExit(f'Deployment failed for exact SHA {sha}: {observed}')
              time.sleep(20)
          else:
              raise SystemExit(f'Timed out waiting for exact SHA deployments: {states}')
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install pinned proof dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.61.0" "pypdf>=5,<7"
          python -m playwright install --with-deps chromium

      - name: Run two authoritative production passes
        id: acceptance
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/unified_production_acceptance_authoritative.py \
            --frontend-url "${NICO_PRODUCTION_FRONTEND_URL}" \
            --repository "${NICO_PRODUCTION_SMOKE_REPOSITORY}" \
            --expected-sha "${RELEASE_SHA}" \
            --passes 2 \
            --output audit-results/authoritative-live-acceptance.json \
            --screenshot-dir audit-results/authoritative-live-screenshots \
            --artifact-dir audit-results/authoritative-live-artifacts

      - name: Upload authoritative acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: authoritative-production-acceptance-${{ env.RELEASE_SHA }}-${{ github.run_id }}
          path: |
            audit-results/authoritative-live-acceptance.json
            audit-results/authoritative-live-screenshots/
            audit-results/authoritative-live-artifacts/
          if-no-files-found: warn
          retention-days: 90

      - name: Require authoritative proof and publish status
        if: always()
        run: |
          set -euo pipefail
          state=failure
          description="Authoritative production acceptance failed; release requires repair"
          if test "${{ steps.acceptance.outcome }}" = "success"; then
            python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('audit-results/authoritative-live-acceptance.json').read_text(encoding='utf-8'))
          assert payload['artifact_schema'] == 'nico.unified_live_acceptance.v1'
          assert payload['status'] == 'passed'
          assert payload['passes_completed'] == 2
          assert all(item['commit_sha'] == payload['expected_deployed_sha'] for item in payload['runs'])
          assert all(item['human_review_required'] is True for item in payload['runs'])
          assert all(item['client_delivery_allowed'] is False for item in payload['runs'])
          assert all(item['report']['semantic_contract']['stale_draft_language_absent'] is True for item in payload['runs'])
          PY
            state=success
            description="Two authoritative production assessment passes succeeded"
          fi
          python - "$state" "$description" <<'PY' > /tmp/status.json
          import json, os, sys
          print(json.dumps({
              'state': sys.argv[1],
              'context': os.environ['STATUS_CONTEXT'],
              'description': sys.argv[2],
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/status.json
          test "$state" = success
