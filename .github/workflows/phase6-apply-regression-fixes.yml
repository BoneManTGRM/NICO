name: Phase 6 Apply Regression Fixes

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-apply-regression-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-6/report-deduplication-security-remediation
          fetch-depth: 0
          persist-credentials: true
      - name: Execute the deterministic Phase 6 source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/phase6-fix-regressions.yml")
          text = workflow.read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n          rm -f .github/workflows/phase6-fix-regressions.yml"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          exec(compile(script, str(workflow), "exec"), {"__name__": "__main__"})
          PY
          rm -f .github/workflows/phase6-fix-regressions.yml
          rm -f .github/workflows/phase6-apply-regression-fixes.yml
          python -m py_compile nico/phase6_canonical_truth_v2.py nico/comprehensive_decision_grade_html_v5.py nico/comprehensive_decision_grade_pdf_v5.py
          git add -A
          git diff --cached --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 6: repair report and frontend regression contracts"
          git push origin HEAD:phase-6/report-deduplication-security-remediation
