name: Bounded closeout refinement transfer

on:
  push:
    branches: [fix/final-three-defect-closeout-20260917]
    paths: [.github/workflows/authorized-phase-font-recovery.yml]

permissions:
  contents: write

jobs:
  transfer:
    if: github.repository == 'BoneManTGRM/NICO' && github.ref == 'refs/heads/fix/final-three-defect-closeout-20260917'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify and apply exact bounded refinement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e7ad7e01594a09bd2c5ffeab9fa5cb1b7991c48c
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          sha = 'd3f86af06ec6785d490cc22560a37f67148bffe9'
          obj = json.loads(subprocess.check_output(['gh', 'api', 'repos/BoneManTGRM/NICO/git/blobs/' + sha]))
          data = base64.b64decode(obj['content'])
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
          patch = gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == '3c6312103246ba6f5b65e5d63beafdcc40e93bb7ab025b611056f66e4228476f'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nico-closeout-refinement.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          expected = {
              'nico/comprehensive_coverage_reconciliation_v1.py': '739903ea11379b4dbe153535fdfffe2b48a017d18e72b46998625ead031337f6',
              'nico/comprehensive_spanish_canonical_report_v87.py': '85862fe51032e55d9b7a03d11d4a8b8dff757e18ad9f77691f2a0c21cc3ae6c9',
              'scripts/security_audit_gate.py': '19f825a65a8cd036671d5801b2bf27b06304233afe36c638f9ba0ba48c61c152',
              'tests/test_report_coverage_reconciliation_v1.py': '3124810a5f9c4ad6a5c6a976a410e931e309eaa44c888d53964fe577d789f3e4',
              'tests/test_security_audit_gate.py': '89a965be85a4ad03f96e866abd2901eb5cb1289ab922950dab222f6e2cbadc45',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed == set(expected), sorted(changed)
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          PY
          git rm -- .github/workflows/authorized-phase-font-recovery.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Reconcile collection-note labels and retain verified deployment identifier evidence' -m 'R3: distinguish source acquisition notes from remaining limitations using retained count-matched records. Introduced checkpoint regression: exact path/detector/value digest disposition for independently verified Railway deployment metadata, retaining observation and all negative controls. No dependency or authentication changes. Remove temporary transfer workflow.'
          git push origin HEAD:refs/heads/fix/final-three-defect-closeout-20260917
