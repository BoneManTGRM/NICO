name: Three-defect closeout workspace recovery

on:
  push:
    branches: [fix/final-three-defect-closeout-20260917]
    paths: [.github/workflows/authorized-phase-font-recovery.yml]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive tracked source and pinned PDF dependencies
        run: |
          mkdir -p recovery-output/wheels
          git archive --format=tar --output=recovery-output/nico-source.tar HEAD
          git rev-parse HEAD > recovery-output/source-commit.txt
          python -m pip download --no-deps --dest recovery-output/wheels pypdf==6.16.2 reportlab==5.0.1
          sha256sum recovery-output/nico-source.tar recovery-output/wheels/* > recovery-output/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nico-three-defect-source
          path: recovery-output/
          retention-days: 1
          if-no-files-found: error
