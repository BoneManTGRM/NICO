name: Fix PR 981 coverage validation compatibility

on:
  push:
    branches:
      - codex/final-coverage-synchronization

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: codex/final-coverage-synchronization
          fetch-depth: 0

      - name: Preserve canonical unsynchronized validation compatibility
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("nico/comprehensive_client_report_render_v60.py")
          source = path.read_text(encoding="utf-8")
          old = '''    coverage_sync = (
        package.get("coverage_synchronization")
        if isinstance(package.get("coverage_synchronization"), Mapping)
        else {}
    )
    if scanner_backed_report and int(coverage_sync.get("canonical_coverage_value", -1)) != coverage:
        raise ValueError("final report coverage synchronization did not bind canonical truth")

    return {
'''
          new = '''    coverage_sync = (
        package.get("coverage_synchronization")
        if isinstance(package.get("coverage_synchronization"), Mapping)
        else {}
    )
    coverage_sync_applied = bool(coverage_sync)
    coverage_sync_matches = (
        not coverage_sync_applied
        or int(coverage_sync.get("canonical_coverage_value", -1)) == coverage
    )
    if scanner_backed_report and not coverage_sync_matches:
        raise ValueError("final report coverage synchronization did not bind canonical truth")

    return {
'''
          if source.count(old) != 1:
              raise SystemExit(f"expected one validation block, found {source.count(old)}")
          source = source.replace(old, new, 1)
          old_result = '''        "conflicting_coverage_absent": True,
        "coverage_synchronization_verified": bool(coverage_sync),
        "false_incomplete_analyzers_absent": True,
'''
          new_result = '''        "conflicting_coverage_absent": True,
        "coverage_synchronization_applied": coverage_sync_applied,
        "coverage_synchronization_verified": coverage_sync_matches,
        "false_incomplete_analyzers_absent": True,
'''
          if source.count(old_result) != 1:
              raise SystemExit(f"expected one validation result block, found {source.count(old_result)}")
          path.write_text(source.replace(old_result, new_result, 1), encoding="utf-8")
          PY

      - name: Run focused coverage and renderer tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m pip install --disable-pip-version-check -q --no-deps -e .
          python -m pytest -q \
            tests/test_comprehensive_client_report_render_v60.py \
            tests/test_comprehensive_report_coverage_synchronization_v63.py

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-pr981-coverage-validation.yml
          rm -f docs/.pr981-coverage-validation-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve canonical report validation before synchronization"
          git push origin HEAD:codex/final-coverage-synchronization
