name: Postgres Restart Proof

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-restart-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restart-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nico
          POSTGRES_PASSWORD: nico
          POSTGRES_DB: nico
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nico -d nico"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      NICO_TEST_DATABASE_URL: postgresql://nico:nico@127.0.0.1:5432/nico
      PYTHONPATH: .
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install NICO runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run synthetic restart and tenant-isolation proof
        run: |
          python scripts/postgres_restart_proof.py \
            --database-url "$NICO_TEST_DATABASE_URL" \
            --output audit-results/postgres-restart-proof.json

      - name: Run real Postgres public-intake reservation proof
        run: |
          python scripts/postgres_intake_reservation_proof.py \
            --database-url "$NICO_TEST_DATABASE_URL" \
            --output audit-results/postgres-intake-reservation-proof.json

      - name: Prove original scanner BYTEA survives filesystem loss and reconnect
        run: python scripts/postgres_scanner_artifact_proof.py --output audit-results/postgres-scanner-artifact-proof.json
      - name: Prove durable worker ownership, restart and cancellation on real Postgres
        run: |
          python scripts/postgres_worker_job_proof.py \
            --database-url "$NICO_TEST_DATABASE_URL" \
            --output audit-results/postgres-worker-job-proof.json
      - name: Prove authenticated worker receipt publication and durable polling
        run: python scripts/postgres_worker_protocol_proof.py --evidence audit-results/postgres-worker-protocol-proof.json
      - name: Prove one-artifact qualification capacity on existing synthetic Postgres
        timeout-minutes: 4
        run: python scripts/postgres_review_pdf_capacity_proof.py --synthetic-ci-proof --output audit-results/postgres-review-pdf-capacity-proof.json
      - name: Prove retained review-PDF ledger ownership on existing Postgres
        run: python scripts/postgres_review_pdf_preparation_proof.py --output audit-results/postgres-review-pdf-preparation-proof.json
      - name: Prove synthetic full retained PDF lifecycle on existing Postgres
        timeout-minutes: 4
        run: python scripts/postgres_review_pdf_lifecycle_proof.py --output audit-results/postgres-review-pdf-lifecycle-proof.json
      - name: Qualify near-cap run save and fresh-process reload on real Postgres
        run: |
          python scripts/postgres_run_storage_capacity_proof.py --transport v2 --output audit-results/run-storage-capacity-v2.json
          python scripts/postgres_run_storage_capacity_proof.py --transport v3 --output audit-results/run-storage-capacity-v3.json
      - name: Verify evidence is bounded and passing
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("audit-results/postgres-restart-proof.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["status"] == "passed"
          assert payload["synthetic"] is True
          assert payload["live_production_claim"] is False
          assert payload["proof"]["fresh_adapter_reconnected"] is True
          assert payload["proof"]["exact_tenant_scope_preserved"] is True
          assert payload["proof"]["human_approval_unchanged"] is True
          serialized = json.dumps(payload)
          assert "postgresql://" not in serialized
          assert "NICO_TEST_DATABASE_URL" not in serialized

          reservation_path = Path("audit-results/postgres-intake-reservation-proof.json")
          reservation = json.loads(reservation_path.read_text(encoding="utf-8"))
          assert reservation["status"] == "passed"
          assert reservation["proof"]["exactly_one_lease_owner"] is True
          assert reservation["proof"]["active_heartbeat_prevented_reclaim"] is True
          assert reservation["proof"]["terminal_payload_scrubbed"] is True
          assert reservation["proof"]["human_approval"] is False
          assert reservation["proof"]["client_delivery_allowed"] is False
          reservation_serialized = json.dumps(reservation)
          assert "postgresql://" not in reservation_serialized
          assert "NICO_TEST_DATABASE_URL" not in reservation_serialized
          scanner = json.loads(Path("audit-results/postgres-scanner-artifact-proof.json").read_text(encoding="utf-8"))
          assert scanner["status"] == "passed"
          assert scanner["synthetic"] is True
          assert scanner["live_production_claim"] is False
          assert scanner["application_commit"] == os.environ["GITHUB_SHA"]
          for key in ("fresh_adapter_reconnected", "original_bytes_preserved", "filesystem_removed", "source_binding_enforced", "checksum_binding_enforced", "conflicting_overwrite_rejected", "bounded_bytea_read"):
              assert scanner["proof"][key] is True
          assert scanner["proof"]["human_approval"] is False
          assert scanner["proof"]["client_delivery_allowed"] is False
          scanner_serialized = json.dumps(scanner)
          assert "postgresql://" not in scanner_serialized
          assert "NICO_TEST_DATABASE_URL" not in scanner_serialized
          worker = json.loads(Path("audit-results/postgres-worker-job-proof.json").read_text(encoding="utf-8"))
          assert worker["status"] == "passed"
          assert worker["synthetic"] is True
          assert worker["live_production_claim"] is False
          assert worker["repository_executed"] is False
          assert worker["human_approval"] is False
          assert worker["client_delivery_authorized"] is False
          assert len(worker["checks"]) == 18
          assert all(value is True for value in worker["checks"].values())
          protocol = json.loads(Path("audit-results/postgres-worker-protocol-proof.json").read_text())
          assert protocol["synthetic"] is True
          assert protocol["live_production"] is False
          assert protocol["repository_executed"] is False
          assert protocol["analyzer_executed"] is False
          assert protocol["human_approval_proven"] is False
          assert protocol["client_delivery_allowed"] is False
          assert len(protocol["checks"]) == 33
          assert all(value is True for value in protocol["checks"].values())
          capacity = json.loads(Path("audit-results/postgres-review-pdf-capacity-proof.json").read_text())
          from scripts.postgres_review_pdf_capacity_proof import REQUIRED_CHECKS
          assert capacity["status"] == "passed" and capacity["synthetic"] is True
          assert capacity["live_production_claim"] is False
          assert capacity["assessment_executed"] is False
          assert capacity["client_delivery_allowed"] is False
          assert capacity["successful_ready_publication_proven"] is False
          assert set(capacity["checks"]) == set(REQUIRED_CHECKS)
          assert all(value is True for value in capacity["checks"].values())
          assert "postgresql://" not in json.dumps(capacity)
          assert "NICO_TEST_DATABASE_URL" not in json.dumps(capacity)
          review_pdf = json.loads(Path("audit-results/postgres-review-pdf-preparation-proof.json").read_text())
          assert review_pdf["status"] == "passed"
          assert review_pdf["synthetic"] is True
          assert review_pdf["live_production_claim"] is False
          assert review_pdf["repository_executed"] is False
          assert review_pdf["human_approval"] is False
          assert review_pdf["client_delivery_allowed"] is False
          assert len(review_pdf["checks"]) == 10
          assert all(value is True for value in review_pdf["checks"].values())
          import subprocess
          assert review_pdf["commit_sha"] == subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert "postgresql://" not in json.dumps(review_pdf)
          assert "NICO_TEST_DATABASE_URL" not in json.dumps(review_pdf)
          lifecycle = json.loads(Path("audit-results/postgres-review-pdf-lifecycle-proof.json").read_text())
          assert lifecycle["status"] == "passed" and lifecycle["synthetic"] is True
          assert lifecycle["live_production_claim"] is False
          assert lifecycle["actual_retained_report_timing"] is False
          assert lifecycle["assessment_executed"] is False
          assert lifecycle["client_delivery_allowed"] is False
          assert lifecycle["commit_sha"] == review_pdf["commit_sha"] == capacity["commit_sha"]
          assert all(value is True for value in lifecycle["checks"].values())
          for key in ("fresh_process_retrieved_exact_bytes", "identity_hash_and_gates_verified",
                      "real_store_restore", "real_child_render", "locked_ready_publication",
                      "source_and_history_unchanged_during_preparation", "feature_flags_off",
                      "stale_source_rejected", "stale_owner_rejected", "cancelled_job_not_rendered",
                      "mutated_source_cannot_retrieve_old_pdf"):
              assert lifecycle["checks"][key] is True
          assert "postgresql://" not in json.dumps(lifecycle)
          assert "NICO_TEST_DATABASE_URL" not in json.dumps(lifecycle)
          PY

      - name: Upload restart proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-restart-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit-results/postgres-restart-proof.json
            audit-results/postgres-intake-reservation-proof.json
            audit-results/postgres-scanner-artifact-proof.json
            audit-results/postgres-worker-job-proof.json
            audit-results/postgres-worker-protocol-proof.json
            audit-results/postgres-review-pdf-capacity-proof.json
            audit-results/postgres-review-pdf-preparation-proof.json
            audit-results/postgres-review-pdf-lifecycle-proof.json
          if-no-files-found: error
          retention-days: 30
