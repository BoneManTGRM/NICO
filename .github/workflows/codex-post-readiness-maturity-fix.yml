name: Apply post-readiness maturity text reconciliation

on:
  push:
    branches:
      - codex/post-readiness-maturity-text-truth

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/post-readiness-maturity-text-truth
          fetch-depth: 0

      - name: Patch post-readiness maturity strings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return source.replace(old, new, 1)

          helper_path = Path('nico/comprehensive_maturity_label_truth_v1.py')
          helper = helper_path.read_text(encoding='utf-8')
          public_helper = '''\n\ndef synchronize_explicit_maturity_text(value: str, canonical_label: str) -> str:\n    """Synchronize explicit maturity aliases after readiness scoring is known.\n\n    This is intentionally narrow: it changes only text matching the explicit maturity\n    label patterns and leaves general seniority or ordinary prose untouched.\n    """\n\n    label = _candidate_label(canonical_label)\n    if not label or label.casefold() == "not scored":\n        return value\n    replacements: list[dict[str, str]] = []\n    return _replace_text(\n        value,\n        canonical_label=label,\n        path="post_readiness_text",\n        replacements=replacements,\n    )\n'''
          helper = replace_once(
              helper,
              '\n\ndef _synchronize_node(\n',
              public_helper + '\n\ndef _synchronize_node(\n',
              'public maturity text helper',
          )
          helper = replace_once(
              helper,
              '    "derive_canonical_maturity_label",\n    "synchronize_maturity_label_truth",\n',
              '    "derive_canonical_maturity_label",\n    "synchronize_explicit_maturity_text",\n    "synchronize_maturity_label_truth",\n',
              'helper export',
          )
          helper_path.write_text(helper, encoding='utf-8')

          readiness_path = Path('nico/comprehensive_client_readiness_v59.py')
          readiness = readiness_path.read_text(encoding='utf-8')
          readiness = replace_once(
              readiness,
              'from nico import comprehensive_report_truth_stabilization_v52 as legacy_truth\n',
              'from nico import comprehensive_report_truth_stabilization_v52 as legacy_truth\nfrom nico.comprehensive_maturity_label_truth_v1 import (\n    synchronize_explicit_maturity_text,\n)\n',
              'readiness helper import',
          )
          readiness = replace_once(
              readiness,
              'def _repair_symbols(text: str, symbols: set[str], coverage: int) -> str:\n',
              'def _repair_symbols(\n    text: str,\n    symbols: set[str],\n    coverage: int,\n    maturity_label: str = "",\n) -> str:\n',
              'repair symbols signature',
          )
          readiness = replace_once(
              readiness,
              '    repaired = _COVERAGE_PREFIX_RE.sub(\n        lambda match: f"{coverage}{match.group(\'pct\')}{match.group(\'tail\')}",\n        repaired,\n    )\n    return repaired\n',
              '    repaired = _COVERAGE_PREFIX_RE.sub(\n        lambda match: f"{coverage}{match.group(\'pct\')}{match.group(\'tail\')}",\n        repaired,\n    )\n    repaired = synchronize_explicit_maturity_text(repaired, maturity_label)\n    return repaired\n',
              'post-readiness maturity repair',
          )
          readiness = replace_once(
              readiness,
              '    if isinstance(node, str):\n        return _repair_symbols(node, symbols, coverage)\n',
              '    if isinstance(node, str):\n        maturity_label = (\n            _maturity_label(technical_score)\n            if technical_score is not None\n            else ""\n        )\n        return _repair_symbols(node, symbols, coverage, maturity_label)\n',
              'string normalization maturity label',
          )
          readiness_path.write_text(readiness, encoding='utf-8')
          PY

      - name: Run focused regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip >/dev/null
          pip install -r requirements.txt >/dev/null
          pytest -q \
            tests/test_post_readiness_maturity_text_truth_v1.py \
            tests/test_comprehensive_maturity_label_truth_v1.py \
            tests/test_comprehensive_client_report_render_v60.py

      - name: Commit corrected branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/codex-post-readiness-maturity-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile maturity text after client readiness scoring"
          git push origin HEAD:codex/post-readiness-maturity-text-truth
