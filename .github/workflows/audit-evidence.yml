name: Audit Evidence

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-evidence:
    name: Audit evidence collection
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Collect pip-audit evidence
        run: |
          mkdir -p audit-results
          python -m pip_audit --format json --output audit-results/pip-audit-results.json || true
          test -f audit-results/pip-audit-results.json || echo '{"status":"pip-audit unavailable"}' > audit-results/pip-audit-results.json

      - name: Collect npm audit evidence
        working-directory: apps/web
        run: |
          mkdir -p ../../audit-results
          if npm install --legacy-peer-deps; then
            npm audit --audit-level=high --json > ../../audit-results/npm-audit-results.json || true
          else
            echo '{"status":"npm install unavailable","audit":"not_run"}' > ../../audit-results/npm-audit-results.json
          fi
          test -f ../../audit-results/npm-audit-results.json || echo '{"status":"npm audit unavailable"}' > ../../audit-results/npm-audit-results.json

      - name: Upload audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: audit-evidence-results
          path: audit-results/
