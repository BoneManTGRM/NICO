name: Internal Capability Package 3 Source Patch

on:
  push:
    branches:
      - internal-capabilities/03-canonical-deployment-population

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ !contains(github.event.head_commit.message, '[canonical-deployment-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: internal-capabilities/03-canonical-deployment-population
          fetch-depth: 1

      - name: Patch canonical source producers
        shell: python
        run: |
          from pathlib import Path

          cleanup_path = Path("nico/comprehensive_human_review_package_cleanup_v1.py")
          cleanup = cleanup_path.read_text(encoding="utf-8")
          import_anchor = "from pypdf import PdfReader\n"
          helper_import = '''from nico.comprehensive_operational_evidence_v1 import (
              deployment_population_from_context,
              format_deployment_classification,
          )
          '''
          if helper_import not in cleanup:
              if import_anchor not in cleanup:
                  raise SystemExit("cleanup import anchor not found")
              cleanup = cleanup.replace(
                  import_anchor,
                  import_anchor + "\n" + helper_import,
                  1,
              )

          old_block = '''    deployments = _integer(context.get("deployments_observed"))
              successful_deployments = _integer(context.get("successful_deployments"))
              non_success_raw = context.get("non_success_deployments")
              non_success = _integer(non_success_raw) if _meaningful(non_success_raw) else None
              if deployments is not None:
                  if successful_deployments is not None:
                      evidence.append(
                          f"Deployments: {successful_deployments} successful of {deployments} observed "
                          f"({_percent(successful_deployments, deployments)})."
                      )
                  else:
                      evidence.append(f"Deployments: {deployments} observed; successful count: Not available.")
                  evidence.append(
                      "Non-success deployment classification: "
                      + (str(non_success) if non_success is not None else "Not available")
                      + "."
                  )
          '''
          new_block = '''    population = deployment_population_from_context(context)
              deployments = population.get("deployments_observed")
              successful_deployments = population.get("successful_deployments")
              non_success_or_unresolved = population.get(
                  "non_success_or_unresolved_deployments"
              )
              if deployments is not None:
                  if successful_deployments is not None:
                      evidence.append(
                          f"Deployments: {successful_deployments} successful of {deployments} observed "
                          f"({_percent(successful_deployments, deployments)})."
                      )
                  else:
                      evidence.append(
                          f"Deployments: {deployments} observed; successful count: Not available."
                      )
                  if non_success_or_unresolved is not None:
                      evidence.append(
                          "Non-success or unresolved deployment observations: "
                          f"{non_success_or_unresolved}."
                      )
                  else:
                      evidence.append(
                          "Non-success or unresolved deployment observations: Not available."
                      )
                  evidence.append(
                      "Outcome classification breakdown: "
                      + format_deployment_classification(population)
                      + "."
                  )
          '''
          if old_block not in cleanup:
              raise SystemExit("direct deployment producer block not found")
          cleanup = cleanup.replace(old_block, new_block, 1)
          cleanup_path.write_text(cleanup, encoding="utf-8")

          completion_path = Path("nico/client_report_completion_v2.py")
          completion = completion_path.read_text(encoding="utf-8")
          completion_import_anchor = '''from nico.comprehensive_canonical_evidence_v1 import (
              assert_canonical_evidence_manifest,
              attach_canonical_evidence_manifest,
          )
          '''
          completion_helper_import = '''from nico.comprehensive_operational_evidence_v1 import (
              attach_canonical_deployment_population,
          )
          '''
          if completion_helper_import not in completion:
              if completion_import_anchor not in completion:
                  raise SystemExit("completion import anchor not found")
              completion = completion.replace(
                  completion_import_anchor,
                  completion_import_anchor + completion_helper_import,
                  1,
              )
          old_attach = "    canonical = attach_canonical_evidence_manifest(canonical)\n"
          new_attach = (
              "    canonical = attach_canonical_deployment_population(canonical)\n"
              + old_attach
          )
          occurrences = completion.count(old_attach)
          if occurrences != 2:
              raise SystemExit(
                  f"expected two canonical manifest attachment seams, found {occurrences}"
              )
          completion = completion.replace(old_attach, new_attach)
          completion_path.write_text(completion, encoding="utf-8")

          Path(".github/workflows/internal-capability-package3-source-patch.yml").unlink()

      - name: Commit patched source and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nico/comprehensive_human_review_package_cleanup_v1.py \
            nico/client_report_completion_v2.py \
            .github/workflows/internal-capability-package3-source-patch.yml
          git commit -m "Reconcile deployment population at canonical producer [canonical-deployment-patched]"
          git push origin HEAD:internal-capabilities/03-canonical-deployment-population
