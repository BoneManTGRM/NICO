name: SARA Client Delivery Identity Proof

on:
  push:
    branches:
      - ops/sara-pilot-final-review-bridge
    paths:
      - .github/workflows/sara-client-delivery-identity-proof.yml
      - apps/web/app/api/pilot/sara-finalize/**
      - apps/web/app/operations/sara-pilot-finalize/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sara-client-delivery-identity-proof
  cancel-in-progress: true

jobs:
  prove-live-client-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact live report identity and approval boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request

          run_id = "comprun_2ba62f37f4ab4b7988c609f27398c63e"
          repository = "BoneManTGRM/SARA"
          commit_sha = "d63f09d3d5d6e4a53860faec0ea5cb372a37c381"
          customer_id = "boneman-sara-client"
          project_id = "sara-controlled-pilot-001"
          client_name = "SARA / BoneManTGRM"
          project_name = "SARA — First Controlled Production Pilot"
          contact = "Cody Ryan Jenkins (GitHub: BoneManTGRM)"
          access_method = (
              "Authorized public GitHub repository using anonymous read-only access; "
              "no write permissions or provider credential supplied."
          )
          scope = (
              f"Read-only technical assessment of {repository} at exact commit {commit_sha} only. "
              "No writes, deployments, account changes, outreach, or access outside this repository and SHA."
          )
          metadata_sha = "c486348bd6b69e3406198c66383a635f3a3c2455b47ed77efb8cb17308f8af58"
          url = f"https://app.nicoaudit.com/api/nico/assessment/comprehensive-run/{run_id}/report/json"

          request = urllib.request.Request(
              url,
              headers={"Accept": "application/json", "User-Agent": "NICO-SARA-Identity-Proof/1.0"},
          )
          with urllib.request.urlopen(request, timeout=240) as response:
              report = json.load(response)

          identity = report.get("identity") or {}
          engagement = report.get("engagement_metadata") or {}
          assessment = report.get("assessment") or {}
          artifacts = report.get("artifacts") or {}
          pdf = artifacts.get("comprehensive_pdf") or {}

          expected_identity = {
              "run_id": run_id,
              "repository": repository,
              "commit_sha": commit_sha,
              "customer_id": customer_id,
              "project_id": project_id,
              "customer_name": client_name,
              "project_name": project_name,
              "primary_technical_contact": contact,
              "access_method": access_method,
              "authorized_scope": scope,
              "engagement_metadata_source": "client_supplied_intake",
              "engagement_metadata_sha256": metadata_sha,
          }
          expected_engagement = {
              "client_name": client_name,
              "project_name": project_name,
              "primary_technical_contact": contact,
              "access_method": access_method,
              "authorized_scope": scope,
              "source": "client_supplied_intake",
              "sha256": metadata_sha,
          }

          failures = []
          for key, expected in expected_identity.items():
              if identity.get(key) != expected:
                  failures.append(f"identity.{key}")
          for key, expected in expected_engagement.items():
              if engagement.get(key) != expected:
                  failures.append(f"engagement_metadata.{key}")
          if int(assessment.get("canonical_finding_count") or 0) != 0:
              failures.append("assessment.canonical_finding_count")
          if int(assessment.get("review_required_candidate_count") or 0) != 0:
              failures.append("assessment.review_required_candidate_count")
          if report.get("findings") != []:
              failures.append("findings")
          pdf_sha = str(pdf.get("sha256") or "").lower()
          if len(pdf_sha) != 64 or any(char not in "0123456789abcdef" for char in pdf_sha):
              failures.append("artifacts.comprehensive_pdf.sha256")
          if report.get("client_delivery_allowed") is not False:
              failures.append("client_delivery_allowed_before_human_authorization")
          if str(report.get("review_status") or "").lower() not in {"pending", "approved"}:
              failures.append("review_status")

          if failures:
              raise SystemExit("SARA client-delivery identity proof failed: " + ",".join(failures))

          print("SARA_CLIENT_DELIVERY_IDENTITY_PREFLIGHT=passed")
          print(json.dumps({
              "run_id": run_id,
              "repository": repository,
              "commit_sha": commit_sha,
              "customer_id": customer_id,
              "project_id": project_id,
              "client_name": client_name,
              "project_name": project_name,
              "score": assessment.get("score"),
              "canonical_finding_count": assessment.get("canonical_finding_count"),
              "review_required_candidate_count": assessment.get("review_required_candidate_count"),
              "draft_pdf_sha256": pdf_sha,
              "review_status": report.get("review_status"),
              "client_delivery_allowed": report.get("client_delivery_allowed"),
          }, sort_keys=True))
          PY
