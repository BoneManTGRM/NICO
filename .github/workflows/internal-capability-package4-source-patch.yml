name: Internal Capability Package 4 Source Patch

on:
  push:
    branches:
      - internal-capabilities/04-scanner-candidate-reliability

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ !contains(github.event.head_commit.message, '[scanner-contract-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out package branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: internal-capabilities/04-scanner-candidate-reliability
          fetch-depth: 1

      - name: Patch scanner execution and snapshot retention seams
        shell: python
        run: |
          from pathlib import Path

          runners_path = Path("nico/scanner_tool_runners.py")
          runners = runners_path.read_text(encoding="utf-8")
          import_anchor = "from nico.scanner_worker_artifacts import normalize_scanner_worker_artifact\n"
          helper_import = '''from nico.scanner_execution_contract_v1 import (
              attach_scanner_execution_contract,
              scanner_suite_contract,
          )
          '''
          if helper_import not in runners:
              if import_anchor not in runners:
                  raise SystemExit("scanner runner import anchor not found")
              runners = runners.replace(import_anchor, import_anchor + helper_import, 1)

          function_anchor = "def run_scanner_tool(\n"
          if runners.count(function_anchor) != 1:
              raise SystemExit("expected one run_scanner_tool source function")
          runners = runners.replace(
              function_anchor,
              "def _run_scanner_tool_uncontracted(\n",
              1,
          )
          next_anchor = "\n\ndef run_scanner_tools(\n"
          wrapper = '''

          def run_scanner_tool(
              spec: ScannerToolSpec,
              workspace: WorkerWorkspace,
              *,
              runner: Callable[..., WorkerCommandResult] = run_command,
              preparation: ProjectCommandPreparation | None = None,
          ) -> dict[str, Any]:
              """Run one scanner and bind its immutable execution contract."""

              result = _run_scanner_tool_uncontracted(
                  spec,
                  workspace,
                  runner=runner,
                  preparation=preparation,
              )
              return attach_scanner_execution_contract(result, spec)
          '''
          if next_anchor not in runners:
              raise SystemExit("run_scanner_tools insertion anchor not found")
          runners = runners.replace(next_anchor, wrapper + next_anchor, 1)

          return_anchor = '''    return {
                  "artifact_schema": "nico.scanner_worker.v2",
                  "tools": {item["tool"]: item for item in tool_results if isinstance(item, dict) and item.get("tool")},
          '''
          return_replacement = '''    return {
                  "artifact_schema": "nico.scanner_worker.v2",
                  "scanner_suite_contract": scanner_suite_contract(specs),
                  "tools": {item["tool"]: item for item in tool_results if isinstance(item, dict) and item.get("tool")},
          '''
          if return_anchor not in runners:
              raise SystemExit("scanner suite return anchor not found")
          runners = runners.replace(return_anchor, return_replacement, 1)
          runners_path.write_text(runners, encoding="utf-8")

          worker_path = Path("nico/snapshot_scanner_worker.py")
          worker = worker_path.read_text(encoding="utf-8")
          worker_import_anchor = "from nico.dependency_materiality import classify_dependency_finding\n"
          worker_helper_import = '''from nico.scanner_execution_contract_v1 import (
              attach_scanner_execution_contract,
              persist_redacted_scanner_artifact,
              scanner_suite_contract,
              validate_scanner_execution_record,
          )
          '''
          if worker_helper_import not in worker:
              if worker_import_anchor not in worker:
                  raise SystemExit("snapshot worker import anchor not found")
              worker = worker.replace(
                  worker_import_anchor,
                  worker_import_anchor + worker_helper_import,
                  1,
              )

          exception_anchor = '''                    except Exception as exc:  # pragma: no cover - defensive per-tool boundary
                              result = {
                                  "tool": spec.name,
                                  "status": "failed",
                                  "category": spec.category,
                                  "reason": f"{spec.name} failed safely inside the snapshot worker: {type(exc).__name__}",
                                  "findings": [],
                                  "verified_for_this_report": False,
                                  "current_run": True,
                                  "scans_git_history": spec.scans_git_history,
                              }
                          redaction_applied = redaction_applied or "[REDACTED]" in str(result)
                          results.append(result)
          '''
          exception_replacement = '''                    except Exception as exc:  # pragma: no cover - defensive per-tool boundary
                              result = attach_scanner_execution_contract(
                                  {
                                      "tool": spec.name,
                                      "status": "failed",
                                      "category": spec.category,
                                      "reason": f"{spec.name} failed safely inside the snapshot worker: {type(exc).__name__}",
                                      "findings": [],
                                      "verified_for_this_report": False,
                                      "current_run": True,
                                      "scans_git_history": spec.scans_git_history,
                                      "output_capture_complete": False,
                                      "timed_out": False,
                                  },
                                  spec,
                              )
                          expected_commit = str(payload.get("snapshot_commit_sha") or "").lower()
                          result["snapshot_commit_sha"] = expected_commit
                          result["actual_commit_sha"] = actual_commit_sha
                          result["exact_commit_match"] = bool(actual_commit_sha) and actual_commit_sha == expected_commit
                          result = persist_redacted_scanner_artifact(
                              result,
                              scan_id=scan_id,
                          )
                          validation = validate_scanner_execution_record(
                              result,
                              expected_commit_sha=expected_commit,
                          )
                          result["execution_contract_validation"] = validation
                          if validation["status"] != "valid":
                              result["status"] = "failed"
                              result["verified_for_this_report"] = False
                              result["reason"] = (
                                  "scanner execution contract failed: "
                                  + ",".join(validation["validation_errors"])
                              )
                          redaction_applied = redaction_applied or "[REDACTED]" in str(result)
                          results.append(result)
          '''
          if exception_anchor not in worker:
              raise SystemExit("snapshot scanner result anchor not found")
          worker = worker.replace(exception_anchor, exception_replacement, 1)

          update_anchor = '''            "tools_requested": [spec.name for spec in specs],
                      "tools_run": completed,
          '''
          update_replacement = '''            "tools_requested": [spec.name for spec in specs],
                      "scanner_suite_contract": scanner_suite_contract(specs),
                      "tools_run": completed,
          '''
          if update_anchor not in worker:
              raise SystemExit("snapshot update suite anchor not found")
          worker = worker.replace(update_anchor, update_replacement, 1)

          evidence_anchor = '''                "tools_requested": len(specs),
                          "tools_run": len(completed),
          '''
          evidence_replacement = '''                "tools_requested": len(specs),
                          "scanner_suite_contract_sha256": scanner_suite_contract(specs)["suite_contract_sha256"],
                          "all_executor_versions_bound": scanner_suite_contract(specs)["all_executor_versions_bound"],
                          "all_rulesets_immutable": scanner_suite_contract(specs)["all_rulesets_immutable"],
                          "tools_run": len(completed),
          '''
          if evidence_anchor not in worker:
              raise SystemExit("snapshot evidence suite anchor not found")
          worker = worker.replace(evidence_anchor, evidence_replacement, 1)
          worker_path.write_text(worker, encoding="utf-8")

          Path(".github/workflows/internal-capability-package4-source-patch.yml").unlink()

      - name: Commit patched source and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nico/scanner_tool_runners.py \
            nico/snapshot_scanner_worker.py \
            .github/workflows/internal-capability-package4-source-patch.yml
          git commit -m "Bind scanner executions and retain redacted evidence [scanner-contract-patched]"
          git push origin HEAD:internal-capabilities/04-scanner-candidate-reliability
