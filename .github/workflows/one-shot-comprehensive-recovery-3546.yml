name: One-Shot Comprehensive Recovery 3546

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  recover-preserved-run:
    name: Recover preserved Comprehensive run 3546
    if: contains(github.event.head_commit.message, '[recover-comprun-3546]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production-smoke
    env:
      NICO_PRODUCTION_FRONTEND_URL: ${{ vars.NICO_PRODUCTION_FRONTEND_URL || 'https://app.nicoaudit.com' }}
      NICO_PRODUCTION_BACKEND_STATUS_CONTEXT: ${{ vars.NICO_PRODUCTION_BACKEND_STATUS_CONTEXT || 'successful-cat - NICO' }}
      TARGET_RUN_ID: comprun_3546b60fbb744bbea5fcf3c5c89b7ecd
      RELEASE_SHA: ${{ github.sha }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Check out exact recovery release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Wait for exact frontend and backend deployments
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          required = {"Vercel", os.environ["NICO_PRODUCTION_BACKEND_STATUS_CONTEXT"]}
          deadline = time.time() + 30 * 60
          last = {}
          while time.time() < deadline:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/commits/{sha}/status",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "nico-one-shot-comprehensive-recovery",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              last = {}
              for item in payload.get("statuses") or []:
                  last.setdefault(str(item.get("context") or ""), str(item.get("state") or "unknown"))
              observed = {context: last.get(context, "missing") for context in required}
              print(f"Exact-SHA deployment statuses: {observed}", flush=True)
              if all(observed[context] == "success" for context in required):
                  break
              if any(observed[context] in {"error", "failure"} for context in required):
                  raise SystemExit(f"Exact-SHA deployment failed: {observed}")
              time.sleep(20)
          else:
              raise SystemExit(f"Timed out waiting for exact-SHA deployments: {last}")
          PY

      - name: Recover and continue the exact preserved Comprehensive run
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          from typing import Any

          origin = os.environ["NICO_PRODUCTION_FRONTEND_URL"].rstrip("/")
          run_id = os.environ["TARGET_RUN_ID"]
          endpoint = f"{origin}/api/nico/assessment/comprehensive-run/{run_id}"
          blocked_states = {"blocked", "failed", "error", "interrupted", "rejected"}

          def request_json(method: str, url: str, payload: dict[str, Any] | None = None, timeout: int = 270) -> dict[str, Any]:
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              headers = {
                  "Accept": "application/json",
                  "Cache-Control": "no-store",
                  "User-Agent": "nico-one-shot-comprehensive-recovery",
                  "X-NICO-Browser-Projection": "terminal-manifest-v1",
              }
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"HTTP {exc.code} {method} {url}: {body[:3000]}") from exc
              value = json.loads(raw.decode("utf-8"))
              if not isinstance(value, dict):
                  raise RuntimeError(f"Expected JSON object from {method} {url}")
              return value

          def projection(payload: dict[str, Any]) -> dict[str, Any]:
              record = payload.get("record") if isinstance(payload.get("record"), dict) else {}
              identity = record.get("identity") if isinstance(record.get("identity"), dict) else {}
              return {
                  "run_id": str(payload.get("run_id") or identity.get("run_id") or ""),
                  "repository": str(payload.get("repository") or identity.get("repository") or ""),
                  "commit_sha": str(payload.get("commit_sha") or identity.get("commit_sha") or ""),
                  "status": str(payload.get("status") or record.get("status") or "unknown"),
                  "terminal": bool(payload.get("terminal") if "terminal" in payload else record.get("terminal")),
                  "current_stage": str(payload.get("current_stage") or record.get("current_stage") or ""),
                  "progress_percent": payload.get("progress_percent", record.get("progress_percent")),
                  "human_review_required": bool(payload.get("human_review_required", record.get("human_review_required", True))),
                  "client_delivery_allowed": bool(payload.get("client_delivery_allowed", record.get("client_delivery_allowed", False))),
              }

          def exact(payload: dict[str, Any]) -> dict[str, Any]:
              view = projection(payload)
              if view["run_id"] != run_id:
                  raise RuntimeError(f"Exact-run identity changed: expected={run_id} observed={view['run_id']}")
              return view

          initial_payload = request_json("GET", endpoint, timeout=90)
          initial = exact(initial_payload)
          print("Initial exact-run state:", json.dumps(initial, sort_keys=True), flush=True)

          history: list[dict[str, Any]] = [initial]
          current = initial
          if current["terminal"] and current["status"].lower() not in blocked_states:
              final = current
          else:
              final = current
              for attempt in range(1, 31):
                  if final["terminal"] and final["status"].lower() in blocked_states:
                      print(
                          f"Recovery continuation {attempt}: re-entering blocked exact run at {final['current_stage']}",
                          flush=True,
                      )
                  try:
                      continued_payload = request_json(
                          "POST",
                          f"{endpoint}/continue",
                          {"max_stages": 1},
                          timeout=270,
                      )
                  except Exception as exc:
                      # A continuation is deliberately single-attempt. Never blindly replay
                      # an ambiguous write. Re-read durable truth first and proceed only from
                      # the exact persisted state returned by the canonical backend.
                      print(f"Continuation transport returned {exc}; reconciling exact durable state.", flush=True)
                      time.sleep(5)
                      reconciled_payload = request_json("GET", endpoint, timeout=90)
                      final = exact(reconciled_payload)
                      history.append(final)
                      print("Reconciled exact-run state:", json.dumps(final, sort_keys=True), flush=True)
                      if final["terminal"]:
                          break
                      continue

                  final = exact(continued_payload)
                  history.append(final)
                  print(
                      f"Continuation {attempt}: {json.dumps(final, sort_keys=True)}",
                      flush=True,
                  )
                  if final["terminal"]:
                      break
                  time.sleep(2)
              else:
                  raise RuntimeError("Exact run did not reach a terminal boundary within 30 bounded stage continuations")

          proof = {
              "artifact_schema": "nico.one_shot_comprehensive_recovery.v1",
              "release_sha": os.environ["RELEASE_SHA"],
              "run_id": run_id,
              "initial": initial,
              "final": final,
              "continuation_observations": history,
              "same_run_identity_preserved": all(item["run_id"] == run_id for item in history),
              "human_review_required": final["human_review_required"],
              "client_delivery_allowed": final["client_delivery_allowed"],
          }
          Path("audit-results/exact-comprehensive-recovery-3546.json").write_text(
              json.dumps(proof, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          status = final["status"].lower()
          if not final["terminal"]:
              raise RuntimeError(f"Exact run is still nonterminal after bounded continuation: {final}")
          if status in blocked_states:
              raise RuntimeError(f"Exact run exposed a new terminal blocker after recovery: {final}")
          if not final["human_review_required"]:
              raise RuntimeError(f"Human-review gate unexpectedly weakened: {final}")
          if final["client_delivery_allowed"]:
              raise RuntimeError(f"Client delivery became allowed without review: {final}")
          if initial["current_stage"] == final["current_stage"] and initial["status"] == final["status"]:
              raise RuntimeError(f"Exact run did not advance beyond the stale production failure: {final}")

          print("Exact preserved Comprehensive run reached its post-automation review boundary.", flush=True)
          print(json.dumps(final, indent=2, sort_keys=True), flush=True)
          PY

      - name: Upload bounded exact-run recovery proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exact-comprehensive-recovery-3546-${{ github.sha }}-${{ github.run_id }}
          path: audit-results/exact-comprehensive-recovery-3546.json
          if-no-files-found: warn
          retention-days: 90
