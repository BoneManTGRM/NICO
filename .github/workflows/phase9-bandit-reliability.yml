name: Phase 9 Bandit Reliability

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit-exact-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'bandit==1.9.4'
      - name: Run Bandit reliably
        run: python scripts/run_bandit_reliably.py
      - name: Verify retained Bandit record
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          record = json.loads(Path('scanner-evidence/bandit/bandit-execution-record.json').read_text())
          assert record['scanner'] == 'bandit'
          assert record['status'] == 'completed', record
          assert record['verified_complete'] is True, record
          assert record['exact_commit_match'] is True, record
          assert record['commit_sha'] == os.environ['EXPECTED_COMMIT_SHA'], record
          assert record['raw_exit_code'] in (0, 1), record
          assert record['artifact_sha256'], record
          assert Path(record['artifact_path']).is_file(), record
          print({'bandit': 'working', 'findings': record['finding_count'], 'revision': record['commit_sha']})
          PY
      - name: Upload Bandit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-bandit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: scanner-evidence/bandit/
