name: Apply internal review and evidence truth

on:
  push:
    branches:
      - feature/internal-review-and-evidence-truth

permissions:
  contents: write

jobs:
  patch:
    if: >-
      !contains(github.event.head_commit.message, 'Implement internal review and evidence truth') &&
      !contains(github.event.head_commit.message, 'Remove temporary internal review patcher')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v7
        with:
          ref: feature/internal-review-and-evidence-truth
          fetch-depth: 0

      - name: Apply exact production update
        run: python scripts/apply_internal_review_and_evidence_truth.py

      - name: Verify source contracts
        run: |
          python -m py_compile nico/comprehensive_canonical_report_truth_v1.py
          python -m py_compile tests/test_internal_review_and_evidence_truth_v1.py
          grep -q 'data-assessment-internal-review="true"' apps/web/app/assessment/AssessmentWorkspace.tsx
          grep -q 'def _evidence_completion_contract' nico/comprehensive_canonical_report_truth_v1.py
          grep -q 'INTERNAL REVIEW' nico/comprehensive_express_quality_v7.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/assessment/AssessmentWorkspace.tsx \
            apps/web/app/assessment/assessmentCopy.ts \
            apps/web/app/assessment/assessmentModel.ts \
            apps/web/app/assessment/engagementWorkspace.module.css \
            apps/web/app/operations/final-review/FinalReviewWorkspace.tsx \
            nico/comprehensive_api_routes.py \
            nico/comprehensive_canonical_report_truth_v1.py \
            nico/comprehensive_express_quality_v7.py \
            nico/comprehensive_premium_pdf_v6.py \
            tests/test_internal_review_and_evidence_truth_v1.py
          git diff --cached --quiet && exit 0
          git commit -m "Implement internal review and evidence truth"
          git push origin HEAD:feature/internal-review-and-evidence-truth
