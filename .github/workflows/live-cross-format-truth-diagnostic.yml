name: Live Cross-Format Truth Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-cross-format-truth-diagnostic.yml"
      - "nico/comprehensive_final_artifact_truth_v53.py"
      - "tests/test_comprehensive_final_artifact_truth_v53.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ID: comprun_8cd6b53230d24b39bc2ad9c3e37fd798
      ORIGIN: https://app.nicoaudit.com
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch bounded exact-run truth evidence
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path
          from typing import Any

          origin = os.environ["ORIGIN"].rstrip("/")
          run_id = os.environ["RUN_ID"]
          headers = {
              "Accept": "application/json",
              "Cache-Control": "no-store, no-cache, must-revalidate, max-age=0",
              "Pragma": "no-cache",
              "User-Agent": "nico-live-cross-format-truth-diagnostic",
          }

          def fetch(path: str, timeout: int = 90) -> tuple[int, Any]:
              request = urllib.request.Request(origin + path, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      status = int(response.status)
                      raw = response.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  status = int(exc.code)
                  raw = exc.read().decode("utf-8", errors="replace")
              try:
                  return status, json.loads(raw)
              except json.JSONDecodeError:
                  return status, {"invalid_json_preview": raw[:1000]}

          def record(value: Any) -> dict[str, Any]:
              return value if isinstance(value, dict) else {}

          def compact(value: Any, depth: int = 0) -> Any:
              if depth > 7:
                  return "<depth-limited>"
              if isinstance(value, dict):
                  output: dict[str, Any] = {}
                  for key, item in value.items():
                      name = str(key)
                      if name in {"pdf_base64", "markdown", "html"}:
                          output[name] = {
                              "retained": bool(item),
                              "character_count": len(str(item or "")),
                          }
                      elif name in {"findings", "stage_summaries", "sections"} and isinstance(item, list) and len(item) > 80:
                          output[name] = {
                              "item_count": len(item),
                              "preview": compact(item[:12], depth + 1),
                          }
                      else:
                          output[name] = compact(item, depth + 1)
                  return output
              if isinstance(value, list):
                  return [compact(item, depth + 1) for item in value[:120]]
              if isinstance(value, str) and len(value) > 4000:
                  return value[:4000] + "<truncated>"
              return value

          run_status, run_payload = fetch(f"/api/nico/assessment/comprehensive-run/{run_id}")
          run = record(run_payload)
          record_payload = record(run.get("record"))
          stages = record(record_payload.get("stage_results"))
          final_stage = record(stages.get("final_comprehensive_report_generation"))
          cross_stage = record(stages.get("cross_format_truth_verification"))
          scoring_stage = record(stages.get("evidence_reconciliation_and_scoring"))
          package = record(final_stage.get("report_package") or final_stage.get("reports"))
          canonical = record(package.get("json"))
          assessment = record(canonical.get("assessment") or final_stage.get("assessment"))

          report_status, report_payload = fetch(
              f"/api/nico/assessment/comprehensive-run/{run_id}/report/json"
          )

          evidence = {
              "artifact_schema": "nico.live-cross-format-truth-diagnostic.v1",
              "run_id": run_id,
              "run_http_status": run_status,
              "run_status": run.get("status"),
              "current_stage": run.get("current_stage") or record_payload.get("current_stage"),
              "run_reason": run.get("reason") or record_payload.get("reason"),
              "commit_sha": run.get("commit_sha") or record(record_payload.get("identity")).get("commit_sha"),
              "cross_format_stage": compact(cross_stage),
              "final_report_stage_contract": compact({
                  key: value
                  for key, value in final_stage.items()
                  if key not in {"report_package", "reports", "assessment"}
              }),
              "report_package_contract": compact({
                  key: value
                  for key, value in package.items()
                  if key not in {"pdf_base64", "markdown", "html", "json"}
              }),
              "canonical_identity": compact(canonical.get("identity")),
              "canonical_delivery": {
                  "human_review_required": canonical.get("human_review_required"),
                  "client_delivery_allowed": canonical.get("client_delivery_allowed"),
                  "assessment_human_review_required": assessment.get("human_review_required"),
                  "assessment_client_delivery_allowed": assessment.get("client_delivery_allowed"),
                  "package_human_review_required": package.get("human_review_required"),
                  "package_client_delivery_allowed": package.get("client_delivery_allowed"),
              },
              "score_truth": compact({
                  "technical_score": assessment.get("technical_score"),
                  "canonical_technical_score": assessment.get("canonical_technical_score"),
                  "evidence_adjusted_score": assessment.get("evidence_adjusted_score"),
                  "canonical_evidence_adjusted_score": assessment.get("canonical_evidence_adjusted_score"),
                  "maturity_signal": assessment.get("maturity_signal"),
                  "score_contract": assessment.get("score_contract"),
                  "score_reconciliation": assessment.get("score_reconciliation"),
                  "scoring_weights": assessment.get("scoring_weights"),
              }),
              "scanner_register_truth": compact({
                  "scanner_finding_summary": assessment.get("scanner_finding_summary"),
                  "evidence_coverage": assessment.get("evidence_coverage"),
                  "canonical_scanner_finding_register": assessment.get("canonical_scanner_finding_register"),
              }),
              "ci_truth": compact({
                  "ci_cd_operational_health": assessment.get("ci_cd_operational_health"),
                  "ci_section": next(
                      (
                          item for item in assessment.get("sections") or []
                          if isinstance(item, dict) and item.get("id") == "ci_cd"
                      ),
                      {},
                  ),
              }),
              "scoring_stage": compact(scoring_stage),
              "report_json_http_status": report_status,
              "report_json_contract": compact(report_payload),
          }
          destination = Path("audit-results/live-cross-format-truth-diagnostic.json")
          destination.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Upload bounded diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-cross-format-truth-diagnostic-${{ github.sha }}
          path: audit-results/live-cross-format-truth-diagnostic.json
          retention-days: 7
