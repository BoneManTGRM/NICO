name: Mobile Restart Production Proof

on:
  pull_request:
  workflow_run:
    workflows:
      - Spanish Comprehensive Production Proof
    types:
      - completed

permissions:
  contents: read
  actions: read
  statuses: write
  id-token: write

concurrency:
  group: nico-mobile-restart-proof-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate authenticated mobile proof contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require successful main Spanish source proof
        if: github.event_name == 'workflow_run'
        env:
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          test "${SOURCE_CONCLUSION}" = "success"
          test "${SOURCE_HEAD_BRANCH}" = "main"

      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compile authenticated mobile proof
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/github_actions_proof_session_v1.py \
            scripts/authenticated_proof_browser_v1.py \
            scripts/production_specialist_release_identity_v1.py \
            scripts/comprehensive_production_run_handoff_v1.py \
            scripts/mobile_restart_live_acceptance_v1.py \
            scripts/mobile_restart_live_acceptance_v3.py \
            scripts/mobile_restart_live_acceptance_v5.py \
            scripts/mobile_restart_authenticated_live_acceptance_v7.py
          python - <<'PY'
          from pathlib import Path
          wrapper = Path("scripts/mobile_restart_authenticated_live_acceptance_v7.py").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/mobile-restart-production-proof.yml").read_text(encoding="utf-8")
          assert "AuthenticatedProofBrowser" in wrapper
          assert "github_actions_proof_sessions" in wrapper
          assert "id-token: write" in workflow
          assert "mobile_restart_authenticated_live_acceptance_v7.py" in workflow
          PY

  live-production:
    name: Reload authenticated mobile assessment and verify exact review PDF
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production-smoke
    env:
      NICO_PRODUCTION_FRONTEND_URL: ${{ vars.NICO_PRODUCTION_FRONTEND_URL || 'https://app.nicoaudit.com' }}
      NICO_PRODUCTION_SMOKE_REPOSITORY: https://gitlab.com/gitlab-org/gitlab-test
      NICO_PRODUCTION_BACKEND_STATUS_CONTEXT: ${{ vars.NICO_PRODUCTION_BACKEND_STATUS_CONTEXT || 'successful-cat - NICO' }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      STATUS_CONTEXT: NICO Mobile Restart Production Proof
      NICO_PROOF_HEADED_CHROMIUM: "1"
      NICO_PROOF_NATIVE_VISIBILITY: "1"
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Download sole Comprehensive run handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spanish-comprehensive-production-proof-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: source-proof
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish pending mobile proof status
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/mobile-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": os.environ["STATUS_CONTEXT"],
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated mobile recovery proof running",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/mobile-status.json

      - name: Wait for exact frontend and backend deployments
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          required = {"Vercel", os.environ["NICO_PRODUCTION_BACKEND_STATUS_CONTEXT"]}
          deadline = time.time() + 30 * 60
          last = {}
          while time.time() < deadline:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/commits/{sha}/status",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "nico-authenticated-mobile-proof",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              latest = {}
              for item in payload.get("statuses") or []:
                  latest.setdefault(str(item.get("context") or ""), str(item.get("state") or "unknown"))
              observed = {context: latest.get(context, "missing") for context in required}
              print(f"Deployment statuses: {observed}", flush=True)
              if all(observed[context] == "success" for context in required):
                  break
              if any(observed[context] in {"error", "failure"} for context in required):
                  raise SystemExit(f"Deployment failed for exact SHA {sha}: {observed}")
              time.sleep(20)
          else:
              raise SystemExit(f"Timed out waiting for exact SHA deployments: {observed}")
          PY

      - name: Verify exact specialist-gated frontend release
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python scripts/production_specialist_release_identity_v1.py \
            --origin "${NICO_PRODUCTION_FRONTEND_URL}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-ui-contract "expert-engagement-v2" \
            --timeout-seconds 900 \
            --interval-seconds 15 \
            --output audit-results/mobile-restart-frontend-release.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install pinned headed Chromium proof runtime
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            . "playwright==1.61.0" "pypdf==6.15.0" "pytest==9.1.1"
          python scripts/prepare_playwright_native_visibility_v1.py
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "${apt_source}" ] || continue
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              "${apt_source}"
          done
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99nico-ci-network >/dev/null
          timeout --signal=TERM --kill-after=30s 12m python -m playwright install --with-deps chromium
          command -v xvfb-run

      - name: Validate sole Comprehensive run handoff
        run: |
          set -euo pipefail
          PROOF_TOOL_SHA="$(git rev-parse HEAD)"
          python scripts/comprehensive_production_run_handoff_v1.py \
            --source-proof source-proof/spanish-comprehensive-live-proof.json \
            --expected-sha "${RELEASE_SHA}" \
            --repository "${NICO_PRODUCTION_SMOKE_REPOSITORY}" \
            --source-workflow-run-id "${SOURCE_RUN_ID}" \
            --source-workflow-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --expected-proof-tool-sha "${PROOF_TOOL_SHA}" \
            --output audit-results/comprehensive-run-handoff.json

      - name: Prove authenticated recovery and exact review PDF download
        id: restart_proof
        continue-on-error: true
        timeout-minutes: 120
        run: |
          set -euo pipefail
          PROOF_TOOL_SHA="$(git rev-parse HEAD)"
          xvfb-run -a python scripts/mobile_restart_authenticated_live_acceptance_v7.py \
            --frontend-url "${NICO_PRODUCTION_FRONTEND_URL}" \
            --repository "${NICO_PRODUCTION_SMOKE_REPOSITORY}" \
            --expected-sha "${RELEASE_SHA}" \
            --source-proof source-proof/spanish-comprehensive-live-proof.json \
            --source-workflow-run-id "${SOURCE_RUN_ID}" \
            --source-workflow-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --expected-proof-tool-sha "${PROOF_TOOL_SHA}" \
            --observation-seconds 90 \
            --ui-locale en \
            --output audit-results/mobile-restart-live-proof.json

      - name: Upload immutable mobile restart proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-restart-production-proof-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit-results/comprehensive-run-handoff.json
            audit-results/mobile-restart-frontend-release.json
            audit-results/mobile-restart-live-proof.json
            audit-results/mobile-restart-live-proof.png
          if-no-files-found: warn
          retention-days: 90

      - name: Require passing authenticated mobile evidence
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.restart_proof.outcome }}" = "success"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path("audit-results/mobile-restart-live-proof.json").read_text(encoding="utf-8"))
          assert payload["artifact_schema"] == "nico.mobile_restart_live_acceptance.v1"
          assert payload["acceptance_version"] == "nico.mobile_restart_live_acceptance.single_dispatch.v3"
          assert payload["status"] == "passed"
          assert payload["expected_sha"] == os.environ["RELEASE_SHA"]
          assert payload["source_workflow_run_id"] == os.environ["SOURCE_RUN_ID"]
          assert payload["source_workflow_run_attempt"] == os.environ["SOURCE_RUN_ATTEMPT"]
          assert payload["authenticated_production_proof"] is True
          sessions = payload["github_actions_proof_sessions"]
          assert isinstance(sessions, list) and sessions
          for session in sessions:
              assert session["status"] == "authenticated"
              assert session["release_sha"] == os.environ["RELEASE_SHA"]
              assert session["workflow_file"] == ".github/workflows/mobile-restart-production-proof.yml"
              assert session["session_cookie_present"] is True
              assert session["human_review_required"] is True
              assert session["client_delivery_allowed"] is False
          assert payload["fresh_assessment_count"] == 0
          assert payload["start_request_count"] == 0
          assert payload["continuation_post_count"] == 0
          assert payload["terminal_restart_recovery_verified"] is True
          assert payload["ui_review_pdf_download_verified"] is True
          assert payload["human_review_required"] is True
          assert payload["client_delivery_allowed"] is False
          PY

      - name: Publish successful mobile proof status
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/mobile-success.json
          import json, os
          print(json.dumps({
              "state": "success",
              "context": os.environ["STATUS_CONTEXT"],
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated mobile recovery proof passed",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/mobile-success.json

      - name: Publish failed mobile proof status
        if: failure() || cancelled()
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/mobile-failure.json
          import json, os
          print(json.dumps({
              "state": "failure",
              "context": os.environ["STATUS_CONTEXT"],
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated mobile recovery proof failed",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/mobile-failure.json
