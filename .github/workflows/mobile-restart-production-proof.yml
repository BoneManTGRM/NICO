name: Mobile Restart Production Proof

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: mobile-restart-production-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate mobile restart proof contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile and verify recovery proof
        run: |
          set -euo pipefail
          python -m py_compile scripts/mobile_restart_live_acceptance_v1.py
          python - <<'PY'
          from pathlib import Path

          proof = Path("scripts/mobile_restart_live_acceptance_v1.py").read_text(encoding="utf-8")
          hook = Path("apps/web/app/assessment/useAssessmentRun.ts").read_text(encoding="utf-8")
          proxy = Path("apps/web/app/api/nico/[...path]/route.ts").read_text(encoding="utf-8")
          backend = Path("nico/comprehensive_mobile_recovery_v1.py").read_text(encoding="utf-8")

          assert 'nico.mobile_restart_live_acceptance.v1' in proof
          assert 'viewport={"width": 390, "height": 844}' in proof
          assert '_reload_and_restore(page, run_id' in proof
          assert 'Running-page reload created a duplicate assessment' in proof
          assert 'Terminal-page reload created a duplicate assessment' in proof
          assert 'terminal_manifest_size_bytes' in proof
          assert 'Projected browser response embedded' in proof
          assert 'Exact-run report did not have a PDF signature' in proof
          assert 'ACTIVE_RUN_STORAGE_KEY = "nico.comprehensive.active-run.v1"' in hook
          assert 'window.addEventListener("pageshow", restoreAfterPageResume)' in hook
          assert 'BROWSER_PROJECTION_VALUE = "terminal-manifest-v1"' in hook
          assert 'COMPREHENSIVE_REPORT_ARTIFACT' in proxy
          assert 'headers.set("X-NICO-Browser-Projection", BROWSER_PROJECTION_VALUE)' in proxy
          assert 'artifact_delivery": "on_demand_exact_run"' in backend
          PY

  live-production:
    name: Reload active and terminal mobile assessment
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production-smoke
    env:
      NICO_PRODUCTION_FRONTEND_URL: ${{ vars.NICO_PRODUCTION_FRONTEND_URL || 'https://app.nicoaudit.com' }}
      NICO_PRODUCTION_SMOKE_REPOSITORY: ${{ vars.NICO_PRODUCTION_SMOKE_REPOSITORY || 'BoneManTGRM/NICO' }}
      NICO_PRODUCTION_BACKEND_STATUS_CONTEXT: ${{ vars.NICO_PRODUCTION_BACKEND_STATUS_CONTEXT || 'successful-cat - NICO' }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      STATUS_CONTEXT: NICO Mobile Restart Production Proof
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Publish pending proof status
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/mobile-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": os.environ["STATUS_CONTEXT"],
              "description": "Waiting for exact-SHA mobile restart recovery proof",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/mobile-status.json

      - name: Validate configured production scope
        run: |
          set -euo pipefail
          test "${NICO_PRODUCTION_FRONTEND_URL}" = "https://app.nicoaudit.com"
          test "${NICO_PRODUCTION_SMOKE_REPOSITORY}" = "BoneManTGRM/NICO"
          test -n "${NICO_PRODUCTION_BACKEND_STATUS_CONTEXT}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"

      - name: Wait for exact frontend and backend deployments
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          required = {"Vercel", os.environ["NICO_PRODUCTION_BACKEND_STATUS_CONTEXT"]}
          deadline = time.time() + 30 * 60
          last = {}
          while time.time() < deadline:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/commits/{sha}/status",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "nico-mobile-restart-proof",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              last = {}
              for item in payload.get("statuses") or []:
                  context = str(item.get("context") or "")
                  last.setdefault(context, str(item.get("state") or "unknown"))
              observed = {context: last.get(context, "missing") for context in required}
              print(f"Deployment statuses: {observed}", flush=True)
              if all(observed[context] == "success" for context in required):
                  break
              if any(observed[context] in {"error", "failure"} for context in required):
                  raise SystemExit(f"Deployment failed for exact SHA {sha}: {observed}")
              time.sleep(20)
          else:
              raise SystemExit(f"Timed out waiting for exact SHA deployments: {last}")
          PY

      - name: Verify exact frontend release identity
        run: |
          set -euo pipefail
          python scripts/production_frontend_release_identity.py \
            --origin "${NICO_PRODUCTION_FRONTEND_URL}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-ui-contract "expert-engagement-v2" \
            --expected-deployment-environment "production" \
            --timeout-seconds 900 \
            --interval-seconds 15 \
            --output audit-results/mobile-restart-frontend-release.json

      - name: Verify durable assessment readiness
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          origin = os.environ["NICO_PRODUCTION_FRONTEND_URL"].rstrip("/")
          request = urllib.request.Request(
              origin + "/api/nico/diagnostics/comprehensive-runtime",
              headers={"Accept": "application/json", "User-Agent": "nico-mobile-restart-proof"},
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              payload = json.loads(response.read().decode("utf-8"))
          persistence = payload.get("persistence") if isinstance(payload.get("persistence"), dict) else {}
          replacement_safe = bool(
              payload.get("survives_container_replacement_verified") is True
              or persistence.get("survives_container_replacement_verified") is True
          )
          assert str(payload.get("status") or "").lower() == "ready"
          assert replacement_safe is True
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pinned browser proof dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.61.0"
          python -m playwright install --with-deps chromium

      - name: Prove recovery across running and terminal page restarts
        id: restart_proof
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/mobile_restart_live_acceptance_v1.py \
            --frontend-url "${NICO_PRODUCTION_FRONTEND_URL}" \
            --repository "${NICO_PRODUCTION_SMOKE_REPOSITORY}" \
            --expected-sha "${RELEASE_SHA}" \
            --output audit-results/mobile-restart-live-proof.json

      - name: Upload immutable mobile restart proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-restart-production-proof-${{ github.sha }}-${{ github.run_id }}
          path: |
            audit-results/mobile-restart-frontend-release.json
            audit-results/mobile-restart-live-proof.json
            audit-results/mobile-restart-live-proof.png
          if-no-files-found: warn
          retention-days: 90

      - name: Require passing mobile restart evidence
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.restart_proof.outcome }}" = "success"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("audit-results/mobile-restart-live-proof.json").read_text(encoding="utf-8"))
          assert payload["artifact_schema"] == "nico.mobile_restart_live_acceptance.v1"
          assert payload["status"] == "passed"
          assert payload["expected_sha"] == "${{ github.sha }}"
          assert payload["start_request_count"] == 1
          assert payload["duplicate_intake_absent"] is True
          assert payload["running_restart_recovery_verified"] is True
          assert payload["terminal_restart_recovery_verified"] is True
          assert payload["exact_run_identity_preserved"] is True
          assert payload["report_actions_recovered"] is True
          assert payload["terminal_manifest_bounded"] is True
          assert payload["terminal_manifest_size_bytes"] < 200000
          assert payload["report_artifact_delivery"] == "on_demand_exact_run"
          assert payload["pdf_signature_verified"] is True
          assert payload["pdf_run_identity_verified"] is True
          assert payload["terminal_before_reload"]["commit_sha"] == payload["expected_sha"]
          assert payload["terminal_after_reload"]["commit_sha"] == payload["expected_sha"]
          assert payload["terminal_after_reload"]["pdf_enabled"] == "true"
          assert payload["terminal_after_reload"]["markdown_enabled"] == "true"
          PY

      - name: Publish successful proof status
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/mobile-status.json
          import json, os
          print(json.dumps({
              "state": "success",
              "context": os.environ["STATUS_CONTEXT"],
              "description": "Mobile restart preserved one exact run and streamed the terminal report",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/mobile-status.json

      - name: Publish failed proof status
        if: failure()
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/mobile-status.json
          import json, os
          print(json.dumps({
              "state": "failure",
              "context": os.environ["STATUS_CONTEXT"],
              "description": "Mobile restart recovery proof failed; release requires repair",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/mobile-status.json
