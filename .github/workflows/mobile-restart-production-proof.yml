name: Mobile Restart Production Proof

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: nico-production-assessment-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate mobile restart proof contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Compile and verify single-dispatch recovery and PDF proof
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/mobile_pdf_download_action_proof_v1.py \
            scripts/mobile_restart_live_acceptance_v1.py \
            scripts/mobile_restart_live_acceptance_v3.py \
            scripts/mobile_restart_live_acceptance_v5.py
          python - <<'PY'
          from pathlib import Path
          proof = Path("scripts/mobile_restart_live_acceptance_v3.py").read_text(encoding="utf-8")
          download = Path("scripts/mobile_pdf_download_action_proof_v1.py").read_text(encoding="utf-8")
          wrapper = Path("scripts/mobile_restart_live_acceptance_v5.py").read_text(encoding="utf-8")
          assert 'nico.mobile_restart_live_acceptance.single_dispatch.v3' in proof
          assert 'class _SingleDispatchLocator' in proof
          assert 'button.click();' in proof
          assert 'start_dispatch_retry_absent' in proof
          assert '_ORIGINAL_RUN_PROOF(SingleDispatchBrowser(browser), args)' in proof
          assert 'page.expect_download(timeout=240_000)' in download
          assert 'ui_review_pdf_download_verified' in download
          assert 'install_ui_pdf_download_proof(recovery)' in wrapper
          PY

  live-production:
    name: Reload mobile assessment and download the exact review PDF
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production-smoke
    env:
      NICO_PRODUCTION_FRONTEND_URL: ${{ vars.NICO_PRODUCTION_FRONTEND_URL || 'https://app.nicoaudit.com' }}
      NICO_PRODUCTION_SMOKE_REPOSITORY: ${{ vars.NICO_PRODUCTION_SMOKE_REPOSITORY || 'BoneManTGRM/NICO' }}
      NICO_PRODUCTION_BACKEND_STATUS_CONTEXT: ${{ vars.NICO_PRODUCTION_BACKEND_STATUS_CONTEXT || 'successful-cat - NICO' }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      STATUS_CONTEXT: NICO Mobile Restart Production Proof
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Publish pending proof status
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/mobile-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": os.environ["STATUS_CONTEXT"],
              "description": "Waiting for exact-SHA mobile recovery and review PDF download proof",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/mobile-status.json

      - name: Wait for exact frontend and backend deployments
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          required = {"Vercel", os.environ["NICO_PRODUCTION_BACKEND_STATUS_CONTEXT"]}
          deadline = time.time() + 30 * 60
          last = {}
          while time.time() < deadline:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/commits/{sha}/status",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "nico-mobile-single-dispatch-pdf-proof",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              last = {}
              for item in payload.get("statuses") or []:
                  last.setdefault(str(item.get("context") or ""), str(item.get("state") or "unknown"))
              observed = {context: last.get(context, "missing") for context in required}
              print(f"Deployment statuses: {observed}", flush=True)
              if all(observed[context] == "success" for context in required):
                  break
              if any(observed[context] in {"error", "failure"} for context in required):
                  raise SystemExit(f"Deployment failed for exact SHA {sha}: {observed}")
              time.sleep(20)
          else:
              raise SystemExit(f"Timed out waiting for exact SHA deployments: {last}")
          PY

      - name: Verify exact frontend release identity
        run: |
          set -euo pipefail
          python scripts/production_frontend_release_identity.py \
            --origin "${NICO_PRODUCTION_FRONTEND_URL}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-ui-contract "expert-engagement-v2" \
            --expected-deployment-environment "production" \
            --timeout-seconds 900 \
            --interval-seconds 15 \
            --output audit-results/mobile-restart-frontend-release.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install pinned browser proof dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "playwright==1.61.0"
          python -m playwright install --with-deps chromium

      - name: Prove recovery and exact-run review PDF download
        id: restart_proof
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/mobile_restart_live_acceptance_v5.py \
            --frontend-url "${NICO_PRODUCTION_FRONTEND_URL}" \
            --repository "${NICO_PRODUCTION_SMOKE_REPOSITORY}" \
            --expected-sha "${RELEASE_SHA}" \
            --output audit-results/mobile-restart-live-proof.json

      - name: Upload immutable mobile restart proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-restart-production-proof-${{ github.sha }}-${{ github.run_id }}
          path: |
            audit-results/mobile-restart-frontend-release.json
            audit-results/mobile-restart-live-proof.json
            audit-results/mobile-restart-live-proof.png
          if-no-files-found: warn
          retention-days: 90

      - name: Require passing mobile restart evidence
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.restart_proof.outcome }}" = "success"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("audit-results/mobile-restart-live-proof.json").read_text(encoding="utf-8"))
          assert payload["artifact_schema"] == "nico.mobile_restart_live_acceptance.v1"
          assert payload["acceptance_version"] == "nico.mobile_restart_live_acceptance.single_dispatch.v3"
          assert payload["status"] == "passed"
          assert payload["expected_sha"] == "${{ github.sha }}"
          assert payload["start_dispatch"] == "single_native_dom_click"
          assert payload["start_dispatch_retry_absent"] is True
          assert payload["start_request_count"] == 1
          assert payload["duplicate_intake_absent"] is True
          assert payload["running_restart_recovery_verified"] is True
          assert payload["terminal_restart_recovery_verified"] is True
          assert payload["terminal_manifest_bounded"] is True
          assert payload["pdf_signature_verified"] is True
          assert payload["ui_review_pdf_download_verified"] is True
          assert payload["ui_review_pdf_signature_verified"] is True
          assert payload["ui_review_pdf_exact_run_filename_verified"] is True
          assert payload["ui_review_pdf_artifact_status_cleared"] is True
          assert payload["ui_review_pdf_original_user_gesture_preserved"] is True
          assert payload["ui_review_pdf_proof_version"] == "nico.mobile-pdf-download-action-proof.v1"
          assert payload["terminal_before_reload"]["commit_sha"] == payload["expected_sha"]
          assert "Awaiting" not in payload["terminal_before_reload"]["score"]
          assert payload["terminal_after_reload"]["pdf_enabled"] == "true"
          PY

      - name: Publish successful proof status
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/mobile-status.json
          import json, os
          print(json.dumps({
              "state": "success",
              "context": os.environ["STATUS_CONTEXT"],
              "description": "Mobile recovered one exact run and downloaded its review PDF",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/mobile-status.json

      - name: Publish failed proof status
        if: failure()
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/mobile-status.json
          import json, os
          print(json.dumps({
              "state": "failure",
              "context": os.environ["STATUS_CONTEXT"],
              "description": "Mobile recovery or review PDF download proof failed",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/mobile-status.json
