name: Fresh Comprehensive Report Diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/comprehensive-report-diagnostic.yml'
      - 'scripts/qualify_comprehensive_diagnostic.py'
      - 'tests/test_comprehensive_diagnostic_runner.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: fresh-report-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == 'BoneManTGRM/NICO' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nico
          POSTGRES_PASSWORD: nico
          POSTGRES_DB: nico_report_diagnostic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nico -d nico_report_diagnostic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://nico:nico@127.0.0.1:5432/nico_report_diagnostic
      NICO_DISABLE_POSTGRES: 'false'
      NICO_ALLOW_PROJECT_COMMANDS: 'false'
      NICO_ENABLE_FULL_HISTORY_SECRET_SCAN: 'true'
      NICO_SCANNER_INSTALL_STRICT: 'true'
      NICO_SCANNER_INSTALL_DIR: /tmp/nico-diagnostic-scanners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Install pinned report and scanner runtime
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --no-deps -e .
          python -m venv "$RUNNER_TEMP/nico-semgrep"
          "$RUNNER_TEMP/nico-semgrep/bin/pip" install semgrep==1.170.0
          mkdir -p "$RUNNER_TEMP/nico-tools-bin"
          ln -s "$RUNNER_TEMP/nico-semgrep/bin/semgrep" "$RUNNER_TEMP/nico-tools-bin/semgrep"
          echo "$RUNNER_TEMP/nico-tools-bin" >> "$GITHUB_PATH"
      - name: Install checksum-verified native scanners
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/install_hosted_scanner_binaries.py
          echo "$NICO_SCANNER_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Verify retention and safety contracts
        run: >-
          python -m pytest -q
          tests/test_comprehensive_diagnostic_runner.py
          tests/test_comprehensive_run_storage_codec_v1.py
          tests/test_spanish_unavailable_eslint_report.py
          tests/test_report_projection_copy_parity.py
          tests/test_report_json_copy.py
          tests/test_finding_risk_scan_prefilter.py
          tests/test_report_pdf_text.py
          tests/test_report_pdf_text_integration.py
          tests/test_score_sync_readonly_projection.py
          tests/test_prepared_render_evidence_retention.py
          tests/test_source_table_export_binding.py
          tests/test_comprehensive_source_table_presentation.py
          tests/test_comprehensive_four_phase_report_v1.py
          tests/test_comprehensive_decision_content_restoration_v66.py
          tests/test_comprehensive_decision_content_restoration_v67.py
          tests/test_comprehensive_client_truth_final_v1.py
          tests/test_comprehensive_score_assurance_ledger_v45.py
          tests/test_phase14_analyzer_evidence_v1.py
          tests/test_comprehensive_finding_roadmap_v1.py
          tests/test_spanish_report_language_publication_contract_v82.py
      - name: Run fresh NICO assessments and retain exact renderer inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.qualify_comprehensive_diagnostic
          --repository BoneManTGRM/NICO
          --source-sha 312693443b1e70c8a065de2c4e9ca329281d162a
          --output fresh-report-diagnostic
      - name: Retain diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fresh-report-diagnostic-${{ github.run_id }}
          path: fresh-report-diagnostic/
          if-no-files-found: error
          retention-days: 7
