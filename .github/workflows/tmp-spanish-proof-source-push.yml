name: Temporary Spanish proof source push

on:
  push:
    branches:
      - fix/spanish-proof-terminal-boundary

permissions:
  contents: write

concurrency:
  group: temporary-spanish-proof-source-push
  cancel-in-progress: false

jobs:
  persist-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/spanish-proof-terminal-boundary
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Patch, verify, and persist source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/spanish_comprehensive_live_acceptance_v1.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'SPANISH_TERMINAL_PHASE = "Revisión interna requerida"\n',
              'SPANISH_TERMINAL_PHASE = "Se requiere revisión experta"\nSPANISH_TERMINAL_REVIEW = "Revisión interna requerida"\n',
              1,
          )
          old = '        assert terminal.get("phase") == SPANISH_TERMINAL_PHASE, terminal\n        assert terminal.get("report_actions_present") == "true", terminal\n'
          new = '        assert terminal.get("phase") == SPANISH_TERMINAL_PHASE, terminal\n        assert terminal.get("review") == SPANISH_TERMINAL_REVIEW, terminal\n        assert terminal.get("report") == "Completa", terminal\n        assert terminal.get("report_actions_present") == "true", terminal\n'
          source = source.replace(old, new, 1)
          required = (
              'SPANISH_TERMINAL_PHASE = "Se requiere revisión experta"',
              'SPANISH_TERMINAL_REVIEW = "Revisión interna requerida"',
              'terminal.get("review") == SPANISH_TERMINAL_REVIEW',
              'terminal.get("report") == "Completa"',
          )
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f'missing Spanish proof contract: {missing}')
          path.write_text(source, encoding='utf-8')
          test = Path('tests/test_spanish_comprehensive_terminal_proof_contract.py')
          test.write_text('''from pathlib import Path

ROOT = Path(__file__).resolve().parents[1]


def test_spanish_terminal_phase_and_review_are_distinct() -> None:
    source = (ROOT / "scripts" / "spanish_comprehensive_live_acceptance_v1.py").read_text(encoding="utf-8")
    assert 'SPANISH_TERMINAL_PHASE = "Se requiere revisión experta"' in source
    assert 'SPANISH_TERMINAL_REVIEW = "Revisión interna requerida"' in source
    assert 'terminal.get("review") == SPANISH_TERMINAL_REVIEW' in source
    assert 'terminal.get("report") == "Completa"' in source
''', encoding='utf-8')
          PY
          python - <<'PY'
          from runpy import run_path
          tests = run_path('tests/test_spanish_comprehensive_terminal_proof_contract.py')
          tests['test_spanish_terminal_phase_and_review_are_distinct']()
          PY
          python -m py_compile scripts/spanish_comprehensive_live_acceptance_v1.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/spanish_comprehensive_live_acceptance_v1.py tests/test_spanish_comprehensive_terminal_proof_contract.py
          if git diff --cached --quiet; then
            echo 'Source already persisted.'
            exit 0
          fi
          git commit -m 'Fix Spanish terminal production proof labels'
          git push origin HEAD:fix/spanish-proof-terminal-boundary
