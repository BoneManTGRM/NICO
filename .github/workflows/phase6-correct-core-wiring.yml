name: Phase 6 Correct Core Wiring

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-correct-core-wiring.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-6/report-deduplication-security-remediation
          fetch-depth: 0
          persist-credentials: true
      - name: Correct exact-commit and quality-contract wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nico/phase6_final_remediation_v1.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          commit_index = next(
              index
              for index, line in enumerate(lines)
              if line.startswith('    commit_sha = _text(output.get("commit_sha") or _find_nested(')
          )
          commit_end = commit_index + 1
          while commit_end < len(lines) and (
              lines[commit_end].startswith("    if isinstance(commit_sha")
              or lines[commit_end].startswith("        commit_sha =")
          ):
              commit_end += 1
          commit_block = [
              "    identity_record = _find_nested(",
              "        stage_results,",
              "        lambda item: bool(item.get(\"commit_sha\") or item.get(\"target_commit_sha\") or item.get(\"snapshot_commit_sha\")),",
              "    )",
              "    commit_sha = _text(output.get(\"commit_sha\"), 80)",
              "    if not commit_sha and isinstance(identity_record, dict):",
              "        commit_sha = _text(",
              "            identity_record.get(\"commit_sha\")",
              "            or identity_record.get(\"target_commit_sha\")",
              "            or identity_record.get(\"snapshot_commit_sha\"),",
              "            80,",
              "        )",
          ]
          lines[commit_index:commit_end] = commit_block

          quality_index = next(
              index
              for index, line in enumerate(lines)
              if "if front_matter is None and len(args) >= 18:" in line
          )
          indent = lines[quality_index].split("if front_matter", 1)[0]
          lines[quality_index:quality_index + 2] = [
              f"{indent}if front_matter is None and len(args) >= 15:",
              f"{indent}    front_matter = args[14]",
          ]

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          rm -f .github/workflows/phase6-correct-core-wiring.yml
          python -m py_compile nico/phase6_final_remediation_v1.py nico/api/terminal_authority_bootstrap.py
          git add -A
          git diff --cached --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 6: correct exact-commit and report quality wiring"
          git push origin HEAD:phase-6/report-deduplication-security-remediation
