name: Phase 6 Correct Core Wiring

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-correct-core-wiring.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-6/report-deduplication-security-remediation
          fetch-depth: 0
          persist-credentials: true
      - name: Correct exact-commit and quality-contract wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nico/phase6_final_remediation_v1.py")
          text = path.read_text(encoding="utf-8")

          old = '''    commit_sha = _text(output.get("commit_sha") or _find_nested(stage_results, lambda item: bool(item.get("commit_sha"))) or "", 80)
              if isinstance(commit_sha, dict):
                  commit_sha = _text(commit_sha.get("commit_sha"), 80)
          '''
          if old not in text:
              old = '''    commit_sha = _text(output.get("commit_sha") or _find_nested(stage_results, lambda item: bool(item.get("commit_sha"))) or "", 80)
              if isinstance(commit_sha, dict):
                  commit_sha = _text(commit_sha.get("commit_sha"), 80)
          '''.replace("              if", "    if").replace("                  commit_sha", "        commit_sha")
          new = '''    identity_record = _find_nested(
              stage_results,
              lambda item: bool(item.get("commit_sha") or item.get("target_commit_sha") or item.get("snapshot_commit_sha")),
          )
          commit_sha = _text(output.get("commit_sha"), 80)
          if not commit_sha and isinstance(identity_record, dict):
              commit_sha = _text(
                  identity_record.get("commit_sha")
                  or identity_record.get("target_commit_sha")
                  or identity_record.get("snapshot_commit_sha"),
                  80,
              )
          '''
          if text.count(old) != 1:
              raise SystemExit(f"exact commit block count={text.count(old)}")
          text = text.replace(old, new)

          old_quality = '''            if front_matter is None and len(args) >= 18:
                      front_matter = args[17]
          '''
          if old_quality not in text:
              old_quality = '''            if front_matter is None and len(args) >= 18:
                      front_matter = args[17]
          '''.replace("                      front_matter", "                front_matter")
          new_quality = '''            if front_matter is None and len(args) >= 15:
                      front_matter = args[14]
          '''.replace("                      front_matter", "                front_matter")
          if text.count(old_quality) != 1:
              raise SystemExit(f"quality positional block count={text.count(old_quality)}")
          text = text.replace(old_quality, new_quality)

          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/phase6-correct-core-wiring.yml
          python -m py_compile nico/phase6_final_remediation_v1.py nico/api/terminal_authority_bootstrap.py
          git add -A
          git diff --cached --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 6: correct exact-commit and report quality wiring"
          git push origin HEAD:phase-6/report-deduplication-security-remediation
