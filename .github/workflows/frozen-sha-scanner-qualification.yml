name: Frozen SHA Scanner Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/frozen-sha-scanner-qualification.yml"
      - "nico/scanner_determinism_v1.py"
      - "nico/scanner_history_truth.py"
      - "nico/scanner_result_truth_v1.py"
      - "tests/test_scanner_determinism_v1.py"
      - "tests/test_scanner_history_truth.py"
      - "tests/test_scanner_result_truth_v1.py"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Two clean exact-revision passes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FROZEN_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify exact checked-out revision
        run: |
          test "$(git rev-parse HEAD)" = "$FROZEN_SHA"

      - name: Run qualification pass one
        run: |
          mkdir -p qualification-evidence
          python -m pytest -q \
            tests/test_scanner_determinism_v1.py \
            tests/test_scanner_history_truth.py \
            tests/test_scanner_result_truth_v1.py \
            --junitxml=qualification-evidence/pass-1.xml

      - name: Run qualification pass two
        run: |
          python -m pytest -q \
            tests/test_scanner_determinism_v1.py \
            tests/test_scanner_history_truth.py \
            tests/test_scanner_result_truth_v1.py \
            --junitxml=qualification-evidence/pass-2.xml

      - name: Build independently verifiable manifest
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          import os
          import subprocess

          root = Path("qualification-evidence")
          files = {}
          for path in sorted(root.glob("pass-*.xml")):
              files[path.name] = {
                  "sha256": sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              }
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["FROZEN_SHA"]
          payload = {
              "status": "qualified",
              "expected_commit_sha": expected,
              "actual_commit_sha": actual,
              "snapshot_match": actual == expected,
              "repeatability": {
                  "status": "verified",
                  "passes": 2,
                  "both_passed": len(files) == 2,
              },
              "evidence": files,
          }
          assert payload["snapshot_match"]
          assert payload["repeatability"]["both_passed"]
          Path("frozen-sha-scanner-qualification.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-sha-scanner-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
          path: |
            frozen-sha-scanner-qualification.json
            qualification-evidence/**
