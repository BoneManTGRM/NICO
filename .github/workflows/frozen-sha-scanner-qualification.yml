name: Frozen SHA Scanner Qualification

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/frozen-sha-scanner-qualification.yml"
      - "nico/frozen_sha_scanner_evidence_v1.py"
      - "nico/api/comprehensive_production_bootstrap.py"
      - "scripts/frozen_sha_scanner_qualification.py"
      - "tests/test_frozen_sha_scanner_evidence_v1.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frozen-sha-scanner-qualification.yml"
      - "nico/frozen_sha_scanner_evidence_v1.py"
      - "nico/api/comprehensive_production_bootstrap.py"
      - "scripts/frozen_sha_scanner_qualification.py"
      - "tests/test_frozen_sha_scanner_evidence_v1.py"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  qualify:
    name: Two clean exact-revision passes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FROZEN_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
      NICO_SCANNER_ARTIFACT_ROOT: ${{ github.workspace }}/.nico-runtime/frozen-sha-scanner-artifacts
      NICO_SCANNER_MAX_RETAINED_OUTPUT_BYTES: "268435456"
      NICO_SCANNER_NODE_HEAP_MB: "4096"
      NICO_SCANNER_INSTALL_DIR: ${{ github.workspace }}/.nico-runtime/scanners
      NICO_SCANNER_INSTALL_STRICT: "true"
      NICO_SEMGREP_HOME: ${{ github.workspace }}/.nico-runtime/semgrep
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout scanner implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Install Python application and scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m venv "$NICO_SEMGREP_HOME"
          "$NICO_SEMGREP_HOME/bin/python" -m pip install --upgrade pip
          "$NICO_SEMGREP_HOME/bin/pip" install semgrep==1.170.0
          mkdir -p "$RUNNER_TEMP/nico-tools-bin"
          ln -s "$NICO_SEMGREP_HOME/bin/semgrep" "$RUNNER_TEMP/nico-tools-bin/semgrep"
          echo "$RUNNER_TEMP/nico-tools-bin" >> "$GITHUB_PATH"

      - name: Install pinned history and dependency scanner binaries
        run: |
          mkdir -p "$NICO_SCANNER_INSTALL_DIR"
          python scripts/install_hosted_scanner_binaries.py
          echo "$NICO_SCANNER_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Install scanner-owned ESLint runtime
        run: |
          npm install -g \
            eslint@9 \
            @eslint/js@9 \
            @typescript-eslint/parser@8 \
            @typescript-eslint/eslint-plugin@8 \
            typescript@5.6.3 \
            --no-audit --no-fund
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          eslint --version
          tsc --version

      - name: Verify required scanner executables
        run: |
          for tool in pip-audit bandit semgrep osv-scanner gitleaks trufflehog eslint tsc npm git; do
            command -v "$tool"
          done

      - name: Run two-pass exact-SHA qualification
        id: qualify
        run: |
          python scripts/frozen_sha_scanner_qualification.py \
            --repository BoneManTGRM/NICO \
            --commit-sha "$FROZEN_SHA" \
            --artifact-root "$NICO_SCANNER_ARTIFACT_ROOT" \
            --output frozen-sha-scanner-qualification.json

      - name: Validate qualification manifest independently
        id: validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          expected = os.environ["FROZEN_SHA"]
          payload = json.loads(Path("frozen-sha-scanner-qualification.json").read_text(encoding="utf-8"))
          assert payload["status"] == "qualified", payload
          assert payload["expected_commit_sha"] == expected
          assert payload["actual_commit_sha"] == expected
          assert payload["snapshot_match"] is True
          assert payload["full_history_verified"] is True
          assert payload["required_tools_complete"] is True
          assert payload["repeatability"]["status"] == "verified"
          assert payload["repeatability"]["equivalent"] is True
          assert payload["artifact_retention"]["raw_outputs_retained"] is True
          assert payload["artifact_retention"]["manifest_sha256"]
          PY

      - name: Upload complete scanner evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-sha-scanner-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            frozen-sha-scanner-qualification.json
            ${{ github.workspace }}/.nico-runtime/frozen-sha-scanner-artifacts/**

      - name: Publish observable qualification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.pull_request.head.sha }}
          QUALIFY_OUTCOME: ${{ steps.qualify.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          STATUS_SHA="${STATUS_SHA:-$GITHUB_SHA}"
          state="failure"
          description="Frozen-SHA scanner qualification failed"
          if [ "$QUALIFY_OUTCOME" = "success" ] && \
             [ "$VALIDATE_OUTCOME" = "success" ] && \
             [ "$UPLOAD_OUTCOME" = "success" ]; then
            state="success"
            description="Two clean exact-SHA scanner passes verified"
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$STATUS_SHA" \
            -f state="$state" \
            -f context="NICO/Frozen SHA Scanner Qualification" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
