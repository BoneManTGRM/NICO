name: Diagnose Main Comprehensive Finality

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-main-comprehensive-finality.yml"
      - "nico/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ORIGIN: https://app.nicoaudit.com
      RUN_ID: comprun_4f6516ebad254c0a816c6e3282a00da7
    steps:
      - name: Check out diagnostic revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch exact persisted run and retained report artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          base="${ORIGIN}/api/nico/assessment/comprehensive-run/${RUN_ID}"
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "${base}" -o diagnostic/run-status.json
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
            "${base}/report/json" -o diagnostic/report.json
          curl --fail-with-body --silent --show-error \
            -H 'Accept: text/markdown' -H 'Cache-Control: no-cache' \
            "${base}/report/markdown" -o diagnostic/report.md
          curl --fail-with-body --silent --show-error \
            -H 'Accept: text/html' -H 'Cache-Control: no-cache' \
            "${base}/report/html" -o diagnostic/report.html
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/pdf' -H 'Cache-Control: no-cache' \
            "${base}/report/pdf" -o diagnostic/report.pdf

      - name: Extract bounded failure truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("diagnostic")
          status = json.loads((root / "run-status.json").read_text(encoding="utf-8"))
          record = status.get("record") if isinstance(status.get("record"), dict) else status
          stages = record.get("stage_results") if isinstance(record.get("stage_results"), dict) else status.get("stage_results")
          stages = stages if isinstance(stages, dict) else {}
          cross = stages.get("cross_format_truth_verification")
          final = stages.get("final_comprehensive_report_generation")
          canonical = json.loads((root / "report.json").read_text(encoding="utf-8"))
          assessment = canonical.get("assessment") if isinstance(canonical.get("assessment"), dict) else {}
          maturity = assessment.get("maturity_signal") if isinstance(assessment.get("maturity_signal"), dict) else {}
          reconciliation = assessment.get("score_reconciliation") if isinstance(assessment.get("score_reconciliation"), dict) else {}
          rows = reconciliation.get("rows") or assessment.get("scoring_weights") or []
          summary = {
              "run_id": status.get("run_id") or record.get("identity", {}).get("run_id"),
              "status": status.get("status") or record.get("status"),
              "current_stage": status.get("current_stage") or record.get("current_stage"),
              "terminal": status.get("terminal", record.get("terminal")),
              "cross_format_truth_verification": cross,
              "final_stage_status": final.get("status") if isinstance(final, dict) else None,
              "technical_score": assessment.get("technical_score", maturity.get("technical_score", maturity.get("score"))),
              "evidence_adjusted_score": assessment.get("canonical_evidence_adjusted_score", assessment.get("evidence_adjusted_score", maturity.get("evidence_adjusted_score"))),
              "scoring_rows": rows,
              "artifact_sha256": {
                  name: hashlib.sha256((root / name).read_bytes()).hexdigest()
                  for name in ("report.json", "report.md", "report.html", "report.pdf")
              },
          }
          (root / "diagnostic-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True, default=str) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True, default=str))
          PY

      - name: Upload immutable diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: main-comprehensive-finality-diagnostic-${{ github.sha }}
          path: diagnostic/
          if-no-files-found: error
          retention-days: 30
