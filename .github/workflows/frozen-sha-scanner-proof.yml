name: Frozen SHA Scanner Evidence Proof

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Immutable application commit to scan twice
        required: true
  workflow_call:
    inputs:
      target_sha:
        description: Immutable application commit to scan twice
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  frozen-scanner-proof:
    name: Two clean scanner runs and final report proof on exact SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      NICO_ALLOW_PROJECT_COMMANDS: "true"
      NICO_NODE_OPTIONS: "--max-old-space-size=2048"
      NICO_MAX_SCANNER_PARSE_BYTES: "268435456"
      NICO_SCANNER_INSTALL_STRICT: "true"
      NICO_REQUIRE_DURABLE_DELIVERY_STORAGE: "false"
      NICO_REQUIRE_DURABLE_ASSESSMENT_STORAGE: "false"
      NICO_ENABLE_SQLITE_DURABLE_STORAGE: "true"
      NICO_SQLITE_PATH: /tmp/nico-phase6-verification.sqlite3
      NICO_SCANNER_RAW_ARTIFACT_ROOT: /tmp/nico-phase6-scanner-artifacts

    steps:
      - name: Check out scanner and report implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: runner

      - name: Check out exact application SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_SHA }}
          path: frozen-source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Install exact NICO scanner and report runtime
        working-directory: runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m venv "$RUNNER_TEMP/nico-semgrep"
          "$RUNNER_TEMP/nico-semgrep/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/nico-semgrep/bin/pip" install semgrep==1.170.0
          mkdir -p "$RUNNER_TEMP/nico-tools-bin"
          ln -s "$RUNNER_TEMP/nico-semgrep/bin/semgrep" "$RUNNER_TEMP/nico-tools-bin/semgrep"
          echo "$RUNNER_TEMP/nico-tools-bin" >> "$GITHUB_PATH"

      - name: Install pinned scanner binaries
        working-directory: runner
        env:
          NICO_SCANNER_INSTALL_DIR: ${{ runner.temp }}/nico-scanners
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$NICO_SCANNER_INSTALL_DIR"
          python scripts/install_hosted_scanner_binaries.py
          echo "$NICO_SCANNER_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Install deterministic JavaScript and TypeScript scanner profile
        run: |
          profile_root="$RUNNER_TEMP/nico-eslint-profile"
          npm install --prefix "$profile_root" \
            eslint@9 \
            @eslint/js@9 \
            @typescript-eslint/parser@8 \
            @typescript-eslint/eslint-plugin@8 \
            typescript@5.6.3 \
            --no-audit --no-fund
          parser_entry="$(NODE_PATH="$profile_root/node_modules" node -p "require.resolve('@typescript-eslint/parser')")"
          test -f "$parser_entry"
          echo "$profile_root/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$profile_root/node_modules" >> "$GITHUB_ENV"
          echo "NICO_ESLINT_MODULE_ROOT=$profile_root/node_modules" >> "$GITHUB_ENV"
          echo "NICO_ESLINT_PARSER_ENTRY=$parser_entry" >> "$GITHUB_ENV"
          "$profile_root/node_modules/.bin/eslint" --version
          "$profile_root/node_modules/.bin/tsc" --version

      - name: Verify exact checkout identity
        working-directory: frozen-source
        run: |
          test -n "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Run two complete scanner passes
        working-directory: runner
        run: |
          python scripts/frozen_scanner_evidence_proof.py \
            --source ../frozen-source \
            --target-sha "$TARGET_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --output frozen-scanner-proof

      - name: Capture bounded CI and pull-request history
        working-directory: runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" > workflow-runs.json
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100&sort=updated&direction=desc" > pull-requests.json
          python - <<'PY'
          import json
          from pathlib import Path
          workflows = json.loads(Path("workflow-runs.json").read_text(encoding="utf-8"))
          pulls = json.loads(Path("pull-requests.json").read_text(encoding="utf-8"))
          assert isinstance(workflows.get("workflow_runs"), list) and workflows["workflow_runs"]
          assert isinstance(pulls, list)
          PY

      - name: Capture assessed-commit CI truth
        working-directory: runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/capture_phase6_ci_truth.py \
            --repository "$GITHUB_REPOSITORY" \
            --target-sha "$TARGET_SHA" \
            --output phase6-ci-truth.json \
            --wait-seconds 300 \
            --poll-seconds 15

      - name: Build exact-SHA Phase 6 final Comprehensive package
        working-directory: runner
        run: |
          python scripts/build_phase6_verification_package.py \
            --source ../frozen-source \
            --scanner-run frozen-scanner-proof/scanner-run-1.json \
            --scanner-proof frozen-scanner-proof/frozen-scanner-proof.json \
            --workflow-runs workflow-runs.json \
            --pulls pull-requests.json \
            --ci-truth phase6-ci-truth.json \
            --repository "$GITHUB_REPOSITORY" \
            --output phase6-final-verification

      - name: Validate final visible outcomes
        working-directory: runner
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              Path("phase6-final-verification/phase6-final-verification-summary.json").read_text(encoding="utf-8")
          )
          assert summary["status"] == "verified", summary
          assert summary["exact_commit_sha"] == os.environ["TARGET_SHA"]
          assert summary["two_consecutive_scanner_runs"] is True
          assert all(value == "completed" for value in summary["required_scanner_statuses"].values())
          assert sorted(summary["report_completed_scanners"]) == sorted(summary["required_scanner_statuses"])
          assert summary["report_incomplete_scanners"] == []
          assert summary["finding_ids_unique"] is True
          assert summary["canonical_locations_present"] is True
          assert summary["source_reviewed_sql_disposition_count"] >= 12
          assert summary["duplicate_mapping_records"] == []
          assert summary["assessed_commit_ci"]["green"] is True
          assert summary["cross_format_truth_status"] == "valid"
          assert summary["english_spanish_factual_parity"]["equivalent"] is True
          assert summary["phase5_customer_section_present"] is False
          assert summary["express_comparison_section_present"] is False
          assert summary["english_filename_token_counts"]["FINAL-PENDING-APPROVAL"] == 1
          assert "FINAL-PENDING-APPROVAL-FINAL-PENDING-APPROVAL" not in summary["english_pdf_filename"].upper()
          assert summary["human_review_required"] is True
          assert summary["client_delivery_allowed"] is False
          required_suffixes = {".md", ".html", ".pdf", ".json", ".csv"}
          assert {Path(name).suffix for name in summary["artifacts"]} >= required_suffixes
          PY

      - name: Upload retained raw scanner evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frozen-sha-scanner-evidence-${{ env.TARGET_SHA }}
          path: runner/frozen-scanner-proof
          if-no-files-found: error
          retention-days: 90

      - name: Upload final Phase 6 Comprehensive proof package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase6-final-comprehensive-${{ env.TARGET_SHA }}
          path: |
            runner/phase6-final-verification
            runner/phase6-ci-truth.json
          if-no-files-found: error
          retention-days: 90
