name: Export remediation source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-remediation-source.yml
      - apps/**
      - nico/**
      - scripts/**
      - tests/**
      - requirements.txt
      - pyproject.toml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify clean checkout and record immutable source identity
        run: |
          test -z "$(git status --porcelain=v1)"
          git rev-parse HEAD > remediation-source-sha.txt

      - name: Upload bounded source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remediation-source-${{ github.run_id }}
          path: |
            .bandit
            .gitleaks.toml
            .github
            apps
            nico
            scripts
            tests
            requirements.txt
            pyproject.toml
            remediation-source-sha.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
