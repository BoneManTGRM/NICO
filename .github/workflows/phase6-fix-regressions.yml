name: Phase 6 Fix Regression Contracts

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-fix-regressions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-6/report-deduplication-security-remediation
          fetch-depth: 0
          persist-credentials: true
      - name: Repair canonical paths, report surfaces, and frontend contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"marker not found in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Repository-relative paths must select the innermost recognized root,
          # not a repository-name directory that happens to be named NICO.
          replace_once(
              "nico/phase6_canonical_truth_v2.py",
              "        raw = min(candidates, key=lambda item: item[0])[1]\n",
              "        raw = max(candidates, key=lambda item: item[0])[1]\n",
          )
          replace_once(
              "nico/phase6_canonical_truth_v2.py",
              '''def _merge_finding_v2(target: dict[str, Any], candidate: dict[str, Any]) -> dict[str, Any]:
              merged = _ORIGINAL_MERGE_FINDING(target, candidate)
              locations = _ordered_unique(
                  [
                      target.get("canonical_location"),
                      candidate.get("canonical_location"),
                      *(target.get("related_locations") or []),
                      *(candidate.get("related_locations") or []),
                  ]
              )
              locations = sorted(locations, key=_location_sort_key)
          ''',
              '''def _canonical_location_text(value: Any) -> str:
              text = _text(value, 1200)
              match = re.search(r"^(.*?):(\\d+)(?::\\d+)?$", text)
              if match:
                  return f"{_repository_relative_path(match.group(1))}:{int(match.group(2))}"
              return _repository_relative_path(text) if text else ""


          def _merge_finding_v2(target: dict[str, Any], candidate: dict[str, Any]) -> dict[str, Any]:
              merged = _ORIGINAL_MERGE_FINDING(target, candidate)
              locations = _ordered_unique(
                  _canonical_location_text(value)
                  for value in [
                      target.get("canonical_location"),
                      candidate.get("canonical_location"),
                      *(target.get("related_locations") or []),
                      *(candidate.get("related_locations") or []),
                  ]
              )
              locations = sorted(locations, key=_location_sort_key)
          ''',
          )

          # Restore decision-grade governance sections in the compact HTML report.
          replace_once(
              "nico/comprehensive_decision_grade_html_v5.py",
              '''    disposition_rows = _disposition_rows(assessment)
              return f"""<!doctype html>''',
              '''    disposition_rows = _disposition_rows(assessment)
              boundaries = [item for item in assessment.get("scope_boundaries") or [] if isinstance(item, dict)]
              assumptions = [item for item in assessment.get("assumption_register") or [] if isinstance(item, dict)]
              return f"""<!doctype html>''',
          )
          replace_once(
              "nico/comprehensive_decision_grade_html_v5.py",
              '''<section><h2>Staffing and Sequencing</h2>{_list_html([f"Sequence {item.get('sequence')}: {item.get('role')} — {item.get('focus')}" for item in staffing if isinstance(item, dict)], 'Requires stakeholder approval.')}</section>
          <h2>Evidence Appendix</h2>{_stage_html(stages)}''',
              '''<section><h2>Staffing and Sequencing</h2>{_list_html([f"Sequence {item.get('sequence')}: {item.get('role')} — {item.get('focus')}" for item in staffing if isinstance(item, dict)], 'Requires stakeholder approval.')}</section>
          <section><h2>How to Use This Report</h2>{_list_html(assessment.get('how_to_use_report') or [], 'Complete exact-package human review before delivery.')}</section>
          <section><h2>Scope Boundary and Unassessed Risk</h2>{_html_table(['Area','Boundary'], [[item.get('area'), item.get('boundary')] for item in boundaries] or [['Unassessed domains','Must not be interpreted as healthy']])}</section>
          <section><h2>Assumption Register</h2>{_html_table(['ID','Category','Assumption','Source','Confidence','Sensitivity','Consequence if wrong'], [[item.get('assumption_id'),item.get('category'),item.get('description'),item.get('source'),item.get('confidence'),item.get('sensitivity'),item.get('consequence_if_wrong')] for item in assumptions] or [['—','—','No structured assumption retained','—','—','—','Human validation required']])}</section>
          <h2>Evidence Appendix</h2>{_stage_html(stages)}''',
          )

          # Preserve the extraction-safe glyph contract without restoring page padding.
          replace_once(
              "nico/comprehensive_decision_grade_pdf_v5.py",
              '''    def list_item(value: Any) -> Paragraph:
                  # A literal hyphen is used because ReportLab's default Helvetica bullet
                  # can extract as DEL (U+007F) in some PDF readers.
                  return paragraph(f"- {_text(value, 2100)}", small)
          ''',
              '''    p = paragraph

              def list_item(value: Any) -> Paragraph:
                  # A literal hyphen is used because ReportLab's default Helvetica bullet
                  # can extract as DEL (U+007F) in some PDF readers.
                  return p(f"- {_text(value, 2100)}", small)
          ''',
          )

          # The public assessment surface is Comprehensive-only; legacy Mid identifiers
          # remain internal transport compatibility names, not customer labels.
          replace_once(
              "apps/web/app/assessment/MidSectionReview.tsx",
              'maturityLabel: displayText(scores.maturity.level || sectionView.assessment.maturity, "Mid"),',
              'maturityLabel: displayText(scores.maturity.level || sectionView.assessment.maturity, "Assessment"),',
          )
          replace_once(
              "apps/web/app/assessment/MidSectionReview.tsx",
              'return <section className={styles.workspace} data-nico-mid-review="true">',
              'return <section className={styles.workspace} data-nico-mid-review="true" aria-label="Comprehensive assessment review">',
          )
          replace_once(
              "apps/web/app/assessment/MidSectionReview.tsx",
              '<div><span className={styles.eyebrow}>MID ASSESSMENT</span><h2>Engineering decision review</h2>',
              '<div><span className={styles.eyebrow}>COMPREHENSIVE ASSESSMENT</span><h2>Engineering decision review</h2>',
          )
          replace_once(
              "apps/web/app/assessment/MidSectionReview.tsx",
              '<div className={styles.filterGroup}>{(["all", "attention", "verified"] as Filter[]).map((item) => <button type="button" key={item} className={filter === item ? styles.activeFilter : ""} onClick={() => setFilter(item)}>{titleCase(item)}</button>)}</div>',
              '<div className={styles.filterGroup} role="group" aria-label="Filter technical controls">{(["all", "attention", "verified"] as Filter[]).map((item) => <button type="button" key={item} aria-pressed={filter === item} className={filter === item ? styles.activeFilter : ""} onClick={() => setFilter(item)}>{titleCase(item)}</button>)}</div>',
          )

          Path("apps/web/app/assessment/midReview.module.css").write_text(r'''.workspace{width:min(100%,1120px);margin:18px auto;padding:22px;padding-bottom:calc(24px + env(safe-area-inset-bottom));border:1px solid #2b3b51;border-radius:20px;background:linear-gradient(180deg,#0c1729,#08111f);box-shadow:0 22px 56px rgb(0 0 0/26%);color:#e8eef7}
          .header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.header h2{margin:5px 0 7px;color:#f8fafc;font-size:clamp(24px,4vw,36px);line-height:1.08}.header p{margin:0;color:#9aa9bc;font-size:13px;overflow-wrap:anywhere}.eyebrow{color:#68c9ed;font-size:10px;font-weight:850;letter-spacing:.15em}.headerActions{display:flex;flex:0 0 auto;gap:8px}.headerActions button{min-height:42px;padding:9px 14px;border-radius:10px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.secondaryAction{border:1px solid #40536d;background:#111e31;color:#dce6f3}.primaryAction{border:1px solid #2e94bc;background:#0b6689;color:#f2fbff}.headerActions button:disabled{cursor:not-allowed;opacity:.45}
          .actionNotice{margin:12px 0 0;padding:9px 11px;border:1px solid #36506b;border-radius:10px;background:#0e2136;color:#b9d9e7;font-size:11px}.summaryGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:18px 0 12px}.summaryGrid article{display:flex;min-width:0;flex-direction:column;gap:5px;padding:14px;border:1px solid #2d3e55;border-radius:13px;background:#0e192b}.summaryGrid span{color:#72c7e7;font-size:9px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.summaryGrid strong{color:#f8fafc;font-size:22px;line-height:1.1;overflow-wrap:anywhere}.summaryGrid small{color:#8998ab;font-size:10px;line-height:1.4}.scoreNote{margin:0 0 14px;padding:10px 12px;border-left:3px solid #3ba7cf;border-radius:8px;background:#0c1c30;color:#aab8c9;font-size:11px;line-height:1.5}
          .priorityPanel,.controlsPanel,.scorePanel,.contextPanel{margin-top:13px;padding:16px;border:1px solid #2d3e55;border-radius:15px;background:#0b1627}.priorityPanel>div:first-child,.scorePanel>div:first-child,.contextPanel>div:first-child{margin-bottom:11px}.priorityPanel h3,.controlsPanel h3,.scorePanel h3,.contextPanel h3{margin:4px 0 0;color:#f4f7fb;font-size:18px}.priorityGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.priorityGrid button{display:flex;min-width:0;flex-direction:column;gap:6px;padding:12px;border:1px solid #3b4d65;border-left:3px solid #c88b2c;border-radius:11px;background:#111e31;color:#edf3f9;font:inherit;text-align:left;cursor:pointer}.priorityGrid span{color:#dce7f4;font-size:12px;font-weight:750;overflow-wrap:anywhere}.priorityGrid strong{font-size:16px}.priorityGrid small{color:#8998ab;font-size:10px;line-height:1.4}
          .controlsHeader{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}.controlsHeader p{margin:5px 0 0;color:#8c9bad;font-size:11px}.filterGroup{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}.filterGroup button{flex:0 0 auto;min-height:36px;padding:7px 11px;border:1px solid #3b4c63;border-radius:9px;background:#101c2e;color:#cfdae7;font:inherit;font-size:11px;font-weight:750;cursor:pointer}.filterGroup .activeFilter{border-color:#3d9fc3;background:#103d55;color:#f0fbff}.controlList{display:grid;gap:8px}.controlRow{min-width:0;overflow:hidden;border:1px solid #314158;border-left-width:3px;border-radius:12px;background:#0d1829}.critical{border-left-color:#d75b5b}.warning{border-left-color:#c88b2c}.healthy{border-left-color:#2ba87e}.neutral{border-left-color:#6d7c91}.controlToggle{display:grid;width:100%;grid-template-columns:minmax(180px,1fr) auto auto 24px;gap:10px;align-items:center;padding:12px;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}.controlToggle:hover,.controlToggle:focus-visible{background:#122139;outline:2px solid transparent}.controlIdentity{display:flex;min-width:0;flex-direction:column;gap:3px}.controlIdentity b{color:#f5f7fb;font-size:14px;overflow-wrap:anywhere}.controlIdentity small,.controlCounts{color:#8998ab;font-size:10px}.controlCounts{white-space:nowrap}.chevron{color:#62c4e8;font-size:18px}.controlSummary,.nextAction{margin:0;padding:0 12px 10px;color:#a5b2c2;font-size:11px;line-height:1.45}.nextAction b{color:#6ec5e5}.detailGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 12px 12px;border-top:1px solid #293a50;background:#091321}.detailGrid section{min-width:0;padding:10px;border:1px solid #2c3c53;border-radius:10px;background:#0e192a}.detailGrid h4{display:flex;justify-content:space-between;margin:0 0 7px;color:#dfe8f3;font-size:11px}.detailList{margin:0;padding-left:17px;color:#a4b0bf;font-size:10px;line-height:1.55}.empty{margin:0;color:#7e8ca0;font-size:10px}
          .scoreTable{overflow-x:auto;border:1px solid #2b3c52;border-radius:10px}.scoreTable>div{display:grid;min-width:520px;grid-template-columns:minmax(230px,1fr) 80px 80px 90px;gap:8px;padding:9px 11px;border-bottom:1px solid #2b3c52;color:#c7d2df;font-size:11px}.scoreTable>div:last-child{border-bottom:0}.scoreTableHeader{background:#102039;color:#73c8e7!important;font-weight:800}.scoreFooter{display:flex;justify-content:space-between;gap:16px;margin-top:10px;color:#9aa8ba;font-size:11px}.scoreFooter p{margin:0}.contextGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.contextGrid article{padding:11px;border:1px solid #2d3e55;border-radius:10px;background:#0f1a2c}.contextGrid span{color:#70c5e5;font-size:10px;font-weight:800}.contextGrid strong{display:block;margin-top:4px;color:#f3f6fa}.contextGrid p{margin:5px 0 0;color:#8e9caf;font-size:10px;line-height:1.45}.footer{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid #2b3b51;color:#8998ab;font-size:10px}.footer span{color:#71c7e7;font-weight:850;text-transform:uppercase}.footer p{margin:0;text-align:right}
          @media (max-width:760px){.workspace{margin:10px auto;padding:15px}.header{flex-direction:column}.headerActions{width:100%}.headerActions button{flex:1}.summaryGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.priorityGrid{grid-template-columns:1fr}.controlsHeader{align-items:flex-start;flex-direction:column}.filterGroup{width:100%}.controlToggle{grid-template-columns:minmax(0,1fr) auto 22px}.controlCounts{display:none}.detailGrid,.contextGrid{grid-template-columns:1fr}.scoreFooter,.footer{align-items:flex-start;flex-direction:column}.footer p{text-align:left}}
          @media (max-width:520px){.workspace{padding:13px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}.summaryGrid{grid-template-columns:1fr}.headerActions{flex-direction:column}.controlToggle{padding:10px}.priorityPanel,.controlsPanel,.scorePanel,.contextPanel{padding:12px}}
          @media (prefers-reduced-motion:reduce){.workspace *{scroll-behavior:auto!important;transition:none!important}}
          ''', encoding="utf-8")

          # Update Phase 6 regression contracts; old fixed-page and product-tier
          # expectations are intentionally retired.
          replace_once("tests/test_comprehensive_decision_grade_v5.py", '    assert 0 < report["core_report_page_count"] < report["final_package_page_count"]\n    assert report["final_package_page_count"] >= 25\n', '    assert 0 < report["core_report_page_count"] <= report["final_package_page_count"]\n    assert 5 <= report["final_package_page_count"] < 25\n')
          replace_once("tests/test_comprehensive_decision_grade_v5.py", '    assert report["findings_csv"].startswith("id,priority,category,title,location")\n', '    assert report["findings_csv"].startswith("id,finding_id,priority,status,category,executive_title")\n')
          replace_once("tests/test_comprehensive_express_quality_v7.py", '    assert page_count >= 25\n', '    assert 2 <= page_count < 25\n')
          replace_once("tests/test_comprehensive_express_quality_v7.py", '    assert "Why this is broader than Express" in front_text\n', '    assert "Assessment Coverage" in front_text\n    assert "Why this is broader than Express" not in front_text\n')
          replace_once("tests/test_mid_score_intelligence_ui.py", '    assert "Express is a faster baseline" in source\n', '    assert "Technical score and evidence readiness are independent measures" in source\n    assert "Express is a faster baseline" not in source\n')
          replace_once("tests/test_mid_score_intelligence_ui.py", '    assert "verified-fix scenario" in source\n    assert "Evidence-unit coverage" in source\n    assert "new immutable snapshot assessment" in source\n    assert "weightTable" in source\n', '    assert "Projected after verified remediation" in source\n    assert "immutable snapshot" in source\n    assert "scoreTable" in source\n')
          replace_once("tests/test_phase6_sql_dispositions_v1.py", '    assert "parameter" in record["rationale"].lower()\n', '    assert "placeholder" in record["rationale"].lower()\n    assert "cursor.execute" in record["rationale"]\n')
          replace_once("tests/test_scanner_evidence_pipeline_v1.py", '    assert "phase5-verification-package-${{ env.TARGET_SHA }}" in workflow\n', '    assert "phase6-final-comprehensive-${{ env.TARGET_SHA }}" in workflow\n    assert "build_phase6_verification_package.py" in workflow\n')

          Path("tests/test_mid_section_review_ui.py").write_text('''from __future__ import annotations

          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          COMPONENT = ROOT / "apps" / "web" / "app" / "assessment" / "MidSectionReview.tsx"
          SECTION_PORTAL = ROOT / "apps" / "web" / "app" / "MidSectionReviewPortal.tsx"
          SCORE_PORTAL = ROOT / "apps" / "web" / "app" / "MidScoreIntelligencePortal.tsx"
          LAYOUT = ROOT / "apps" / "web" / "app" / "layout.tsx"
          STYLES = ROOT / "apps" / "web" / "app" / "assessment" / "midReview.module.css"


          def test_assessment_review_is_one_comprehensive_decision_surface() -> None:
              source = COMPONENT.read_text(encoding="utf-8")

              assert "COMPREHENSIVE ASSESSMENT" in source
              assert "MID ASSESSMENT" not in source
              assert "Engineering decision review" in source
              assert "Technical score" in source
              assert "Evidence readiness" in source
              assert "Report package" in source
              assert "Human review" in source
              assert "What should change first" in source
              assert "Additional evidence and scope" in source


          def test_assessment_review_uses_one_bounded_canonical_score_and_artifact_truth() -> None:
              source = COMPONENT.read_text(encoding="utf-8")

              assert "rows.length === TECHNICAL_IDS.length" in source
              assert "rows.reduce((total, row) => total + row.weight, 0) === 100" in source
              assert "rows.reduce((total, row) => total + row.score * row.weight / 100" in source
              assert "function bounded" in source
              assert "completeScorecard" in source
              assert "function deriveArtifacts" in source
              assert 'claimsReady ? "Artifact unavailable"' in source
              assert 'reviewApproved ? "Approved" : reviewBlocked ? "Blocked" : "Required"' in source
              assert "Projected after verified remediation" in source
              assert "score == null || !completeScorecard" in source


          def test_assessment_review_rejects_false_artifacts_and_handles_malformed_payload_values() -> None:
              source = COMPONENT.read_text(encoding="utf-8")

              assert "function hasArtifact" in source
              assert '["base64", "data", "content", "bytes"]' in source
              assert "Object.keys(value).length > 0" not in source
              assert "function cleanText" in source
              assert "function displayText" in source
              assert "score?: unknown" in source
              assert "summary?: unknown" in source
              assert "evidence?: unknown" in source
              assert "Artifact unavailable" in source


          def test_assessment_review_preserves_evidence_findings_limitations_and_scope() -> None:
              source = COMPONENT.read_text(encoding="utf-8")

              for label in ("Evidence", "Findings", "Limitations", "Scope"):
                  assert label in source
              assert "direct_repository_proof" in source
              assert "missing_evidence_sources" in source
              assert "failed_evidence_tools" in source
              assert "scope_disclosures" in source
              assert "Bandit did not provide accepted exact-snapshot evidence" in source
              assert "Gitleaks did not provide accepted evidence for this exact snapshot" in source


          def test_legacy_transport_portals_remain_unmounted_and_monotonic() -> None:
              score_portal = SCORE_PORTAL.read_text(encoding="utf-8")
              section_portal = SECTION_PORTAL.read_text(encoding="utf-8")
              layout = LAYOUT.read_text(encoding="utf-8")

              assert 'const MID_PAYLOAD_EVENT = "nico:mid-status-payload"' in score_portal
              assert "publishMidPayload(parsed)" in score_portal
              assert "createPortal" not in score_portal
              assert "return null" in score_portal
              assert "window.addEventListener(MID_PAYLOAD_EVENT, onPayload)" in section_portal
              assert "mergePayloadRecord(previous, incoming)" in section_portal
              assert "DURABLE_ARRAY_KEYS" in section_portal
              assert "DURABLE_SCALAR_KEYS" in section_portal
              assert "MONOTONIC_TRUE_KEYS" in section_portal
              assert "MONOTONIC_STATUS_KEYS" in section_portal
              assert "statusRank(previousValue) > statusRank(incomingValue)" in section_portal
              assert "hideLegacySurface(panel, mount)" in section_portal
              assert "restoreLegacySurface()" in section_portal
              assert "MidSectionReviewPortal" not in layout
              assert "MidScoreIntelligencePortal" not in layout
              assert 'href="/assessment?tier=comprehensive#assessment"' in layout


          def test_assessment_review_retains_report_and_human_review_actions_with_feedback() -> None:
              source = COMPONENT.read_text(encoding="utf-8")

              assert "Request review" in source
              assert "Open report" in source
              assert "clickLegacyAction" in source
              assert "requestReview" in source
              assert "openReport" in source
              assert "actionNotice" in source
              assert 'role="status"' in source
              assert 'data-nico-mid-legacy-hidden="true"' in source


          def test_assessment_review_is_mobile_safe_and_accessible() -> None:
              component = COMPONENT.read_text(encoding="utf-8")
              css = STYLES.read_text(encoding="utf-8")

              assert 'aria-label="Comprehensive assessment review"' in component
              assert "aria-expanded={expanded}" in component
              assert 'role="group"' in component
              assert "aria-pressed={filter === item}" in component
              for class_name in (
                  ".workspace",
                  ".summaryGrid",
                  ".headerActions",
                  ".priorityGrid",
                  ".filterGroup",
                  ".controlRow",
                  ".detailGrid",
                  ".contextPanel",
              ):
                  assert class_name in css
              assert "env(safe-area-inset-bottom)" in css
              assert "overflow-x:auto" in css
              assert "@media (max-width:760px)" in css
              assert "@media (max-width:520px)" in css
              assert "@media (prefers-reduced-motion:reduce)" in css
          ''', encoding="utf-8")
          PY
          rm -f .github/workflows/phase6-fix-regressions.yml
          python -m py_compile nico/phase6_canonical_truth_v2.py nico/comprehensive_decision_grade_html_v5.py nico/comprehensive_decision_grade_pdf_v5.py
          python -m pytest \
            tests/test_comprehensive_decision_grade_v5.py \
            tests/test_comprehensive_express_quality_v7.py \
            tests/test_decision_grade_report_surfaces_v1.py \
            tests/test_mid_score_intelligence_ui.py \
            tests/test_mid_section_review_ui.py \
            tests/test_phase6_canonical_truth_v2.py \
            tests/test_phase6_sql_dispositions_v1.py \
            tests/test_production_acceptance_control_glyph_contract.py \
            tests/test_scanner_evidence_pipeline_v1.py \
            -q --tb=short
          git add -A
          git diff --cached --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 6: repair report and frontend regression contracts"
          git push origin HEAD:phase-6/report-deduplication-security-remediation
