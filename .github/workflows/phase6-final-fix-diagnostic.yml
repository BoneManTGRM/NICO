name: Phase 6 Final Correction Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-final-fix-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-6/report-deduplication-security-remediation
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .

      - name: Execute correction patch and tests with complete logs
        run: |
          mkdir -p diagnostic-output
          set +e
          python - <<'PY' > diagnostic-output/patch.stdout.log 2> diagnostic-output/patch.stderr.log
          from pathlib import Path

          workflow = Path(".github/workflows/phase6-final-package-fix.yml")
          text = workflow.read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n          rm -f .github/workflows/phase6-package-debug.yml"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          exec(compile(script, str(workflow), "exec"), {"__name__": "__main__"})
          PY
          patch_status=$?
          echo "$patch_status" > diagnostic-output/patch.exit-code.txt
          if [ "$patch_status" -eq 0 ]; then
            python -m py_compile nico/phase6_canonical_truth_v2.py nico/comprehensive_decision_grade_csv_v6.py \
              > diagnostic-output/compile.stdout.log 2> diagnostic-output/compile.stderr.log
            compile_status=$?
            python -m pytest \
              tests/test_phase6_canonical_truth_v2.py \
              tests/test_phase6_final_verification_contract.py \
              tests/test_phase6_final_remediation.py \
              tests/test_phase6_sql_dispositions_v1.py \
              tests/test_scanner_evidence_pipeline_v1.py \
              -q --tb=short \
              > diagnostic-output/pytest.stdout.log 2> diagnostic-output/pytest.stderr.log
            pytest_status=$?
          else
            compile_status=99
            pytest_status=99
          fi
          echo "$compile_status" > diagnostic-output/compile.exit-code.txt
          echo "$pytest_status" > diagnostic-output/pytest.exit-code.txt
          cat diagnostic-output/patch.stdout.log
          cat diagnostic-output/patch.stderr.log >&2
          cat diagnostic-output/compile.stdout.log 2>/dev/null || true
          cat diagnostic-output/compile.stderr.log >&2 2>/dev/null || true
          cat diagnostic-output/pytest.stdout.log 2>/dev/null || true
          cat diagnostic-output/pytest.stderr.log >&2 2>/dev/null || true
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase6-final-correction-diagnostic
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 7
