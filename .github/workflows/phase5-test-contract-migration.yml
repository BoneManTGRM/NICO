name: Phase 5 Test Contract Migration

on:
  pull_request:
    paths:
      - ".github/workflows/phase5-test-contract-migration.yml"
      - "scripts/fix_phase5_test_contracts.py"

permissions:
  contents: write

concurrency:
  group: phase5-test-contract-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Phase 5 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-5/report-truth-outcomes
          fetch-depth: 1
          persist-credentials: true

      - name: Update workflow contract tests
        run: python scripts/fix_phase5_test_contracts.py

      - name: Remove one-shot migration files
        run: |
          rm -f scripts/fix_phase5_test_contracts.py
          rm -f .github/workflows/phase5-test-contract-migration.yml

      - name: Commit corrected immutable-reference contracts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Phase 5: align tests with immutable workflow references"
          git push origin HEAD:phase-5/report-truth-outcomes
