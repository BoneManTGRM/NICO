name: Phase 6 Final Proof Trigger

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-final-proof-trigger.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-6/report-deduplication-security-remediation
          fetch-depth: 0
          persist-credentials: true
      - name: Finalize exact precedence and proof execution
        run: |
          python - <<'PY'
          from pathlib import Path

          phase6 = Path("nico/phase6_final_remediation_v1.py")
          text = phase6.read_text(encoding="utf-8")
          text = text.replace(
              '                    bool(item.get("execution_complete")),\n                    bool(item.get("current_run")),\n                    str(item.get("observed_at") or ""),\n',
              '                    bool(item.get("execution_complete")),\n                    str(item.get("observed_at") or ""),\n',
              1,
          )
          phase6.write_text(text, encoding="utf-8")

          builder = Path("scripts/build_phase6_verification_package.py")
          text = builder.read_text(encoding="utf-8")
          old = '''def _repository_path(value: Any) -> str:
              raw = str(value or "").replace("\\\\", "/")
              for root in (".github/", "apps/", "config/", "docs/", "nico/", "scripts/", "tests/"):
                  index = raw.casefold().find(root.casefold())
                  if index >= 0:
                      return raw[index:]
              return raw.lstrip("./")
          '''
          new = '''def _repository_path(value: Any) -> str:
              raw = str(value or "").replace("\\\\", "/")
              lowered = raw.casefold()
              candidates: list[tuple[int, str]] = []
              for root in (".github/", "apps/", "config/", "docs/", "nico/", "scripts/", "tests/"):
                  index = lowered.rfind(root.casefold())
                  if index >= 0:
                      candidates.append((index, raw[index:]))
              if candidates:
                  return max(candidates, key=lambda item: item[0])[1]
              return raw.lstrip("./")
          '''
          if old not in text:
              if new not in text:
                  raise SystemExit("verification path normalizer marker missing")
          else:
              text = text.replace(old, new, 1)
          builder.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/frozen-sha-scanner-proof.yml")
          text = workflow.read_text(encoding="utf-8")
          old = '''on:
            pull_request:
              branches:
                - main
            workflow_dispatch:
          '''
          new = '''on:
            pull_request:
              branches:
                - main
            push:
              branches:
                - phase-6/report-deduplication-security-remediation
            workflow_dispatch:
          '''
          if old not in text:
              if new not in text:
                  raise SystemExit("frozen proof trigger marker missing")
          else:
              text = text.replace(old, new, 1)
          text = text.replace(
              "TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.target_sha }}",
              "TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'push' && github.sha || inputs.target_sha }}",
              1,
          )
          workflow.write_text(text, encoding="utf-8")

          test = Path("tests/test_phase6_final_verification_contract.py")
          test.write_text('''from __future__ import annotations

          import importlib.util
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]


          def _load_builder():
              path = ROOT / "scripts" / "build_phase6_verification_package.py"
              spec = importlib.util.spec_from_file_location("phase6_verification_builder", path)
              assert spec is not None and spec.loader is not None
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module


          def test_verification_builder_uses_innermost_repository_root() -> None:
              module = _load_builder()
              assert module._repository_path("/home/runner/work/NICO/NICO/nico/comprehensive_run_store.py") == "nico/comprehensive_run_store.py"
              assert module._repository_path("C:/work/NICO/apps/web/app/page.tsx") == "apps/web/app/page.tsx"


          def test_scanner_authority_order_matches_phase6_contract() -> None:
              source = (ROOT / "nico" / "phase6_final_remediation_v1.py").read_text(encoding="utf-8")
              block = source.split("items.sort(", 1)[1].split("reverse=True", 1)[0]
              tokens = [
                  'exact_commit_match',
                  'raw_artifact_retention_complete',
                  'verified_artifact_hash',
                  'execution_complete',
                  'observed_at',
              ]
              positions = [block.index(token) for token in tokens]
              assert positions == sorted(positions)
              assert 'current_run' not in block


          def test_frozen_sha_proof_runs_on_phase6_branch_push() -> None:
              source = (ROOT / ".github" / "workflows" / "frozen-sha-scanner-proof.yml").read_text(encoding="utf-8")
              assert "push:" in source
              assert "phase-6/report-deduplication-security-remediation" in source
              assert "github.event_name == 'push' && github.sha" in source
          ''', encoding="utf-8")
          PY
          rm -f .github/workflows/phase6-final-proof-trigger.yml
          python -m py_compile \
            nico/phase6_final_remediation_v1.py \
            scripts/build_phase6_verification_package.py \
            tests/test_phase6_final_verification_contract.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("scripts/build_phase6_verification_package.py")
          spec = importlib.util.spec_from_file_location("phase6_verification_builder", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module._repository_path("/home/runner/work/NICO/NICO/nico/x.py") == "nico/x.py"
          PY
          git add -A
          git diff --cached --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 6: finalize scanner precedence and exact-SHA proof trigger"
          git push origin HEAD:phase-6/report-deduplication-security-remediation
