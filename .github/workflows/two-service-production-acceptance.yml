name: Unified Production Acceptance

on:
  pull_request:
  workflow_run:
    workflows:
      - Spanish Comprehensive Production Proof
    types:
      - completed

permissions:
  contents: read
  actions: read
  statuses: write
  id-token: write

concurrency:
  group: unified-production-acceptance-v3-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate authenticated unified acceptance contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require successful main Spanish source proof
        if: github.event_name == 'workflow_run'
        env:
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          test "${SOURCE_CONCLUSION}" = "success"
          test "${SOURCE_HEAD_BRANCH}" = "main"

      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compile and verify authenticated acceptance contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/github_actions_proof_session_v1.py \
            scripts/production_specialist_release_identity_v1.py \
            scripts/comprehensive_production_run_handoff_v1.py \
            scripts/authenticated_completed_run_acceptance_v1.py
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/two-service-production-acceptance.yml").read_text(encoding="utf-8")
          verifier = Path("scripts/authenticated_completed_run_acceptance_v1.py").read_text(encoding="utf-8")
          assert "id-token: write" in workflow
          assert "authenticated_completed_run_acceptance_v1.py" in workflow
          assert "production_specialist_release_identity_v1.py" in workflow
          assert 'STATUS_CONTEXT: NICO Two-Service Production Acceptance' in workflow
          assert '"read_only_pass_count": 2' in verifier
          assert '"exact_release_provenance_verified": True' in verifier
          assert '"client_delivery_allowed": False' in verifier
          PY

  live-production:
    name: Observe one authenticated completed deployed run twice
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 210
    environment: production-smoke
    env:
      NICO_PRODUCTION_FRONTEND_URL: ${{ vars.NICO_PRODUCTION_FRONTEND_URL || 'https://app.nicoaudit.com' }}
      NICO_PRODUCTION_SMOKE_REPOSITORY: https://gitlab.com/gitlab-org/gitlab-test
      NICO_PRODUCTION_BACKEND_STATUS_CONTEXT: ${{ vars.NICO_PRODUCTION_BACKEND_STATUS_CONTEXT || 'successful-cat - NICO' }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      STATUS_CONTEXT: NICO Two-Service Production Acceptance
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Download sole Comprehensive run handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: spanish-comprehensive-production-proof-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: source-proof
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish pending unified acceptance status
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": os.environ["STATUS_CONTEXT"],
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated completed-run acceptance running",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/status.json

      - name: Wait for exact frontend and backend deployments
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          required = {"Vercel", os.environ["NICO_PRODUCTION_BACKEND_STATUS_CONTEXT"]}
          deadline = time.time() + 30 * 60
          while time.time() < deadline:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/commits/{sha}/status",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "nico-authenticated-unified-acceptance",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              latest = {}
              for item in payload.get("statuses") or []:
                  latest.setdefault(str(item.get("context") or ""), str(item.get("state") or "unknown"))
              observed = {context: latest.get(context, "missing") for context in required}
              print(f"Deployment statuses: {observed}", flush=True)
              if all(observed[context] == "success" for context in required): break
              if any(observed[context] in {"error", "failure"} for context in required):
                  raise SystemExit(f"Deployment failed for exact SHA {sha}: {observed}")
              time.sleep(20)
          else:
              raise SystemExit(f"Timed out waiting for exact SHA deployments: {observed}")
          PY

      - name: Wait for exact-source Mobile and iOS proofs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          from scripts.comprehensive_production_run_handoff_v1 import select_source_bound_status
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          required = {
              "NICO Mobile Restart Production Proof",
              "NICO iOS WebKit Paint Proof",
          }
          deadline = time.time() + 190 * 60
          while time.time() < deadline:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/commits/{sha}/status",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "nico-unified-wait-for-mobile-ios",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              selected = {
                  context: select_source_bound_status(
                      payload.get("statuses") or [],
                      context=context,
                      source_workflow_run_id=os.environ["SOURCE_RUN_ID"],
                      source_workflow_run_attempt=os.environ["SOURCE_RUN_ATTEMPT"],
                  )
                  for context in required
              }
              observed = {context: value["state"] for context, value in selected.items()}
              print(f"Serialized prerequisite statuses: {observed}", flush=True)
              if all(state == "success" for state in observed.values()): break
              if any(state in {"error", "failure"} for state in observed.values()):
                  raise SystemExit("A prerequisite proof failed: " + json.dumps(observed, sort_keys=True))
              time.sleep(20)
          else:
              raise SystemExit("Timed out waiting for prerequisite proofs: " + json.dumps(observed, sort_keys=True))
          PY

      - name: Verify exact specialist-gated frontend release
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python scripts/production_specialist_release_identity_v1.py \
            --origin "${NICO_PRODUCTION_FRONTEND_URL}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-ui-contract "expert-engagement-v2" \
            --timeout-seconds 900 \
            --interval-seconds 15 \
            --output audit-results/frontend-specialist-release.json

      - name: Validate sole Comprehensive run handoff
        run: |
          set -euo pipefail
          PROOF_TOOL_SHA="$(git rev-parse HEAD)"
          python scripts/comprehensive_production_run_handoff_v1.py \
            --source-proof source-proof/spanish-comprehensive-live-proof.json \
            --expected-sha "${RELEASE_SHA}" \
            --repository "${NICO_PRODUCTION_SMOKE_REPOSITORY}" \
            --source-workflow-run-id "${SOURCE_RUN_ID}" \
            --source-workflow-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --expected-proof-tool-sha "${PROOF_TOOL_SHA}" \
            --output audit-results/comprehensive-run-handoff.json

      - name: Observe the same completed run twice through authenticated API
        id: acceptance
        continue-on-error: true
        run: |
          set -euo pipefail
          PROOF_TOOL_SHA="$(git rev-parse HEAD)"
          python scripts/authenticated_completed_run_acceptance_v1.py \
            --frontend-url "${NICO_PRODUCTION_FRONTEND_URL}" \
            --repository "${NICO_PRODUCTION_SMOKE_REPOSITORY}" \
            --expected-sha "${RELEASE_SHA}" \
            --source-proof source-proof/spanish-comprehensive-live-proof.json \
            --source-workflow-run-id "${SOURCE_RUN_ID}" \
            --source-workflow-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --expected-proof-tool-sha "${PROOF_TOOL_SHA}" \
            --output audit-results/two-service-live-acceptance.json

      - name: Upload immutable unified acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unified-production-acceptance-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit-results/comprehensive-run-handoff.json
            audit-results/frontend-specialist-release.json
            audit-results/two-service-live-acceptance.json
          if-no-files-found: error
          retention-days: 90

      - name: Require passing authenticated unified evidence
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.acceptance.outcome }}" = "success"
          python - <<'PY'
          import json, os
          from pathlib import Path

          frontend = json.loads(Path("audit-results/frontend-specialist-release.json").read_text(encoding="utf-8"))
          assert frontend["artifact_schema"] == "nico.production_specialist_release_identity.v1"
          assert frontend["status"] == "passed"
          assert frontend["expected_sha"] == os.environ["RELEASE_SHA"]
          assert all(frontend["proof"].values())

          payload = json.loads(Path("audit-results/two-service-live-acceptance.json").read_text(encoding="utf-8"))
          assert payload["artifact_schema"] == "nico.authenticated_completed_run_acceptance.v1"
          assert payload["status"] == "passed"
          assert payload["expected_sha"] == os.environ["RELEASE_SHA"]
          assert payload["source_workflow_run_id"] == os.environ["SOURCE_RUN_ID"]
          assert payload["source_workflow_run_attempt"] == os.environ["SOURCE_RUN_ATTEMPT"]
          assert payload["read_only_pass_count"] == 2
          assert payload["status_stable_across_passes"] is True
          assert payload["report_json_stable_across_passes"] is True
          assert payload["report_pdf_stable_across_passes"] is True
          assert payload["exact_release_provenance_verified"] is True
          assert payload["human_review_required"] is True
          assert payload["client_delivery_allowed"] is False
          session = payload["github_actions_proof_session"]
          assert session["authority"] == "github_actions_production_proof"
          assert session["release_sha"] == os.environ["RELEASE_SHA"]
          assert session["workflow_file"] == ".github/workflows/two-service-production-acceptance.yml"
          assert session["session_cookie_present"] is True
          assert session["session_cookie_value_exposed"] is False
          assert session["oidc_token_exposed"] is False
          PY

      - name: Publish successful production acceptance status
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": "success",
              "context": os.environ["STATUS_CONTEXT"],
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated completed-run acceptance passed",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/status.json

      - name: Publish failed production acceptance status
        if: failure() || cancelled()
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": "failure",
              "context": os.environ["STATUS_CONTEXT"],
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated completed-run acceptance failed",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/status.json
