name: Phase 6 CI Truth Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-ci-truth-diagnostic.yml"

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: 0b5cea0d273d5a119a586b9ba01215038075c166
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show exact-SHA workflow records
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --commit "$TARGET_SHA" --limit 100 \
            --json databaseId,name,workflowName,status,conclusion,headSha,event,createdAt,updatedAt \
            | python -m json.tool
      - name: Run CI truth capture once
        continue-on-error: true
        run: |
          python scripts/capture_phase6_ci_truth.py \
            --repository "$GITHUB_REPOSITORY" \
            --target-sha "$TARGET_SHA" \
            --output phase6-ci-truth-diagnostic.json \
            --wait-seconds 0 \
            --poll-seconds 5
      - name: Show diagnostic output
        if: always()
        run: |
          if [ -f phase6-ci-truth-diagnostic.json ]; then
            cat phase6-ci-truth-diagnostic.json
          else
            echo "No CI truth output was written."
          fi
