name: PR 953 one-use CI repair

on:
  push:
    branches:
      - fix/canonical-finding-truth-client-report-v3
    paths:
      - .github/workflows/pr953-self-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/canonical-finding-truth-client-report-v3
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Apply authoritative repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one target, found {count}')
              return text.replace(old, new)

          path = Path('nico/client_finding_remediation_register_v4.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'VERSION = "nico.client-finding-remediation-register.v6"',
              'VERSION = "nico.client-finding-remediation-register.v7"',
              'version',
          )
          old = '''def _parse_location(item: Mapping[str, Any]) -> tuple[str, int | None]:
              path = normalize_repository_path(
                  item.get("path") or item.get("file_path") or item.get("source_path") or ""
              )
              line = _int(item.get("line") or item.get("start_line"))
              location = normalize_repository_path(item.get("location") or "")
              match = re.match(r"^(.*?):(\\d+)(?:-\\d+)?(?::\\d+)?$", location)
              if match:
                  path = normalize_repository_path(match.group(1))
                  line = line or int(match.group(2))
              elif not path and location not in {"", "location-not-retained", "not retained", "unknown"}:
                  path = location
              return path, line
          '''
          new = '''_MISSING_LOCATION_TOKENS = {
              "",
              "location-not-retained",
              "not-retained",
              "unknown",
              "none",
              "n-a",
          }


def _clean_location(value: Any) -> str:
              normalized = normalize_repository_path(value or "")
              return "" if _token(normalized) in _MISSING_LOCATION_TOKENS else normalized


def _parse_location(item: Mapping[str, Any]) -> tuple[str, int | None]:
              path = _clean_location(
                  item.get("path") or item.get("file_path") or item.get("source_path") or ""
              )
              line = _int(item.get("line") or item.get("start_line"))
              location = _clean_location(item.get("location") or "")
              match = re.match(r"^(.*?):(\\d+)(?:-\\d+)?(?::\\d+)?$", location)
              if match:
                  path = _clean_location(match.group(1))
                  line = line or int(match.group(2))
              elif not path and location:
                  path = location
              return path, line


def _scanner_configuration_issue_count(canonical: Mapping[str, Any]) -> int:
              explicit = 0
              detected: set[tuple[str, str]] = set()
              for item in _iter_mappings(canonical):
                  for key in (
                      "scanner_configuration_issue_count",
                      "scanner_configuration_error_count",
                      "configuration_error_count",
                  ):
                      explicit = max(explicit, max(0, _int(item.get(key)) or 0))
                  scanner = _text(item.get("scanner_name") or item.get("scanner") or item.get("tool"))
                  status = _token(item.get("state") or item.get("status") or item.get("execution_status"))
                  reason = _text(
                      item.get("reason")
                      or item.get("message")
                      or item.get("error")
                      or item.get("configuration_error")
                  ).casefold()
                  is_configuration_failure = (
                      "configuration-failed" in status
                      or "configuration-error" in status
                      or "definition for rule" in reason and "was not found" in reason
                      or "configuration" in reason and any(word in reason for word in ("failed", "invalid", "missing", "not found"))
                  )
                  if is_configuration_failure:
                      detected.add((scanner.casefold() or "unknown", reason or status))
              return max(explicit, len(detected))
          '''
          text = replace_once(text, old, new, 'location and scanner truth')

          old = '''    excluded = _normalize_records(
              (
                  item
                  for item in result.get("excluded_non_production_findings") or []
                  if isinstance(item, Mapping)
              ),
              repository=repository,
              aliases_by_anchor=aliases_by_anchor,
          )

              code.sort(
          '''
          new = '''    excluded = _normalize_records(
              (
                  item
                  for item in result.get("excluded_non_production_findings") or []
                  if isinstance(item, Mapping)
              ),
              repository=repository,
              aliases_by_anchor=aliases_by_anchor,
          )

              code_anchors = {
                  (_text(item.get("path")).casefold(), int(item.get("line") or 0), _text(item.get("finding_family")))
                  for item in code
                  if _text(item.get("path")) and item.get("line") is not None
              }
              operational = [
                  item
                  for item in operational
                  if not (
                      _text(item.get("path"))
                      and item.get("line") is not None
                      and (
                          _text(item.get("path")).casefold(),
                          int(item.get("line") or 0),
                          _text(item.get("finding_family")),
                      ) in code_anchors
                  )
              ]

              code.sort(
          '''
          text = replace_once(text, old, new, 'cross-population dedupe')

          old = '''    summary = deepcopy(dict(result.get("summary") or {}))
              decision_count = len(code) + len(operational)
              summary.update(
                  {
                      "register_normalization_version": VERSION,
                      "decision_finding_count": decision_count,
                      "exact_source_code_finding_count": len(code),
                      "operational_or_context_finding_count": len(operational),
                      "excluded_non_production_count": len(excluded),
          '''
          new = '''    summary = deepcopy(dict(result.get("summary") or {}))
              decision_count = len(code) + len(operational)
              normalized_count = max(decision_count, _int(summary.get("normalized_candidate_count")) or 0)
              raw_count = max(normalized_count, _int(summary.get("raw_observation_count")) or 0)
              scanner_configuration_issue_count = max(
                  _int(summary.get("scanner_configuration_issue_count")) or 0,
                  _scanner_configuration_issue_count(canonical),
              )
              summary.update(
                  {
                      "register_normalization_version": VERSION,
                      "canonical_finding_count": decision_count,
                      "finding_register_count": decision_count,
                      "deduplicated_record_count": decision_count + len(excluded),
                      "raw_observation_count": raw_count,
                      "normalized_candidate_count": normalized_count,
                      "decision_finding_count": decision_count,
                      "exact_source_code_finding_count": len(code),
                      "operational_or_context_finding_count": len(operational),
                      "excluded_non_production_count": len(excluded),
                      "scanner_configuration_issue_count": scanner_configuration_issue_count,
          '''
          text = replace_once(text, old, new, 'summary reconciliation')

          old = '''    result["assessment"] = assessment

              contract = deepcopy(dict(result.get("v2_pipeline_contract") or {}))
          '''
          new = '''    result["assessment"] = assessment
              result["finding_register_count"] = len(findings)
              result["canonical_finding_count"] = len(findings)

              def synchronize_counts(value: Any) -> Any:
                  if isinstance(value, list):
                      return [synchronize_counts(item) for item in value]
                  if not isinstance(value, Mapping):
                      return value
                  output = {key: synchronize_counts(child) for key, child in value.items()}
                  for key in ("finding_register_count", "canonical_finding_count"):
                      if key in output:
                          output[key] = len(findings)
                  if "scanner_configuration_issue_count" in output:
                      output["scanner_configuration_issue_count"] = max(
                          _int(output.get("scanner_configuration_issue_count")) or 0,
                          _int(summary.get("scanner_configuration_issue_count")) or 0,
                      )
                  return output

              for surface in ("stage_summaries", "evidence_reconciliation", "scoring", "report_contract"):
                  if surface in result:
                      result[surface] = synchronize_counts(result[surface])

              contract = deepcopy(dict(result.get("v2_pipeline_contract") or {}))
          '''
          text = replace_once(text, old, new, 'mirrored counts')

          old = '''def finding_register_markdown(register: Mapping[str, Any], *, spanish: bool) -> str:
              return v3.finding_register_markdown(register, spanish=spanish)
          '''
          new = '''def finding_register_markdown(register: Mapping[str, Any], *, spanish: bool) -> str:
              markdown = v3.finding_register_markdown(register, spanish=spanish).rstrip()
              rows: list[str] = []
              findings = [
                  *[item for item in register.get("code_findings") or [] if isinstance(item, Mapping)],
                  *[item for item in register.get("operational_findings") or [] if isinstance(item, Mapping)],
              ]
              for item in findings:
                  finding_id = _text(item.get("finding_id") or item.get("id"))
                  aliases = [
                      alias
                      for alias in _dedupe(item.get("finding_aliases") or [])
                      if alias and alias != finding_id
                  ]
                  if finding_id and aliases:
                      rows.append(f"- `{finding_id}`: " + ", ".join(f"`{alias}`" for alias in aliases))
              if not rows:
                  return markdown + "\\n"
              heading = "### Alias de identidad de hallazgos" if spanish else "### Finding identity aliases"
              return "\\n".join((markdown, "", heading, "", *rows, ""))
          '''
          text = replace_once(text, old, new, 'alias rendering')
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/security-audit.yml')
          security = workflow.read_text(encoding='utf-8')
          setup = '''      - name: Install exact frontend dependencies
                  working-directory: apps/web
                  run: npm ci --ignore-scripts --no-audit --no-fund
          '''
          replacement = '''      - name: Install supported npm audit client
                  run: |
                    npm install --global npm@11
                    npm --version

                - name: Install exact frontend dependencies
                  working-directory: apps/web
                  run: npm ci --ignore-scripts --no-audit --no-fund
          '''
          security = replace_once(security, setup, replacement, 'npm audit client')
          old_audit = '''      - name: Collect npm audit evidence
                  working-directory: apps/web
                  run: npm audit --omit=dev --json > ../../npm-audit.json || true
          '''
          new_audit = '''      - name: Collect npm audit evidence
                  working-directory: apps/web
                  run: |
                    set +e
                    npm audit --omit=dev --json > ../../npm-audit.json 2> ../../npm-audit.stderr.txt
                    status=$?
                    set -e
                    python - "$status" <<'PY'
                    from pathlib import Path
                    import json
                    import sys

                    status = int(sys.argv[1])
                    output = Path('../../npm-audit.json')
                    stderr = Path('../../npm-audit.stderr.txt').read_text(encoding='utf-8', errors='replace')
                    try:
                        data = json.loads(output.read_text(encoding='utf-8'))
                    except Exception:
                        data = None
                    valid = isinstance(data, dict) and (
                        isinstance(data.get('vulnerabilities'), dict)
                        or isinstance(data.get('advisories'), dict)
                    )
                    if not valid:
                        output.write_text(json.dumps({
                            'status': 'unavailable',
                            'reason': stderr[-2000:] or f'npm audit exit {status} emitted invalid JSON',
                            'exit_code': status,
                        }, indent=2), encoding='utf-8')
                    PY
          '''
          security = replace_once(security, old_audit, new_audit, 'validated npm audit')
          security = security.replace(
              '            npm-audit.json\n',
              '            npm-audit.json\n            npm-audit.stderr.txt\n',
              1,
          )
          workflow.write_text(security, encoding='utf-8')
          PY

          python -m py_compile nico/client_finding_remediation_register_v4.py
          git diff --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install --global npm@11
          npm --version
          npm ci --prefix apps/web --ignore-scripts --no-audit --no-fund

      - name: Run focused canonical-report regressions
        run: |
          pytest -q \
            tests/test_canonical_finding_surface_sync_v1.py \
            tests/test_client_report_completion_v2.py \
            tests/test_production_assessment_authority_v2.py

      - name: Prove npm audit transport and JSON contract
        shell: bash
        run: |
          cd apps/web
          set +e
          npm audit --omit=dev --json > ../../npm-audit-proof.json 2> ../../npm-audit-proof.stderr.txt
          status=$?
          set -e
          cd ../..
          python - "$status" <<'PY'
          from pathlib import Path
          import json
          import sys
          status = int(sys.argv[1])
          data = json.loads(Path('npm-audit-proof.json').read_text(encoding='utf-8'))
          if not isinstance(data, dict) or not (
              isinstance(data.get('vulnerabilities'), dict)
              or isinstance(data.get('advisories'), dict)
          ):
              raise SystemExit(f'invalid npm audit JSON at exit {status}')
          PY

      - name: Run complete Python suite
        run: pytest -q

      - name: Commit verified repair and remove one-use workflow
        shell: bash
        run: |
          rm .github/workflows/pr953-self-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add nico/client_finding_remediation_register_v4.py .github/workflows/security-audit.yml .github/workflows/pr953-self-repair.yml
          git diff --cached --check
          git commit -m "Fix canonical finding idempotence and npm audit transport"
          git push origin HEAD:fix/canonical-finding-truth-client-report-v3
