name: Internal Capability Package 5 Alias Fix

on:
  push:
    branches:
      - internal-capabilities/05-finding-complexity-reliability

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ !contains(github.event.head_commit.message, '[finding-alias-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: internal-capabilities/05-finding-complexity-reliability
          fetch-depth: 1
      - name: Add authoritative register aliases
        shell: python
        run: |
          from pathlib import Path

          path = Path("nico/comprehensive_finding_integrity_v1.py")
          text = path.read_text(encoding="utf-8")
          old = '''        "correction",
                  "recommendation",
                  "remediation",
                  "recommended_action",
          '''
          new = '''        "correction",
                  "recommended_correction",
                  "recommendation",
                  "remediation",
                  "remediation_plan",
                  "recommended_action",
          '''
          if old not in text:
              raise SystemExit("correction alias anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/internal-capability-package5-alias-fix.yml").unlink()
      - name: Compile and commit
        run: |
          set -euo pipefail
          python -m py_compile nico/comprehensive_finding_integrity_v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nico/comprehensive_finding_integrity_v1.py .github/workflows/internal-capability-package5-alias-fix.yml
          git commit -m "Recognize canonical correction fields [finding-alias-fixed]"
          git push origin HEAD:internal-capabilities/05-finding-complexity-reliability
