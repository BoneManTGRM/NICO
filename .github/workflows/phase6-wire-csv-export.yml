name: Phase 6 Wire CSV Export

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-wire-csv-export.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-6/report-deduplication-security-remediation
          fetch-depth: 0
          persist-credentials: true
      - name: Wire canonical CSV module
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nico/comprehensive_decision_grade_report_v5.py")
          text = path.read_text(encoding="utf-8")
          old = "from nico.comprehensive_decision_grade_html_v5 import _build_html, _evidence_csv, _findings_csv\n"
          new = (
              "from nico.comprehensive_decision_grade_html_v5 import _build_html\n"
              "from nico.comprehensive_decision_grade_csv_v6 import _evidence_csv, _findings_csv\n"
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("CSV import boundary not found")
          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/phase6-wire-csv-export.yml
          python -m py_compile nico/comprehensive_decision_grade_csv_v6.py nico/comprehensive_decision_grade_html_v5.py nico/comprehensive_decision_grade_report_v5.py
          git add -A
          git diff --cached --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 6: wire canonical CSV exporters"
          git push origin HEAD:phase-6/report-deduplication-security-remediation
