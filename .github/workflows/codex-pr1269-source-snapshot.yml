name: Codex PR 1269 Source Snapshot

on:
  push:
    branches:
      - codex/four-phase-reports-in-system

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1269-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
