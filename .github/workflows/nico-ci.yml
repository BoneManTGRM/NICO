name: NICO CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-stable-v9
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: "20"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install --no-deps -e .

    - name: Verify package entry points
      run: |
        nico --help
        python - <<'PY'
        from importlib.metadata import entry_points
        from nico.api.production import app
        from nico.api_runner import main as api_main

        scripts = {item.name: item.value for item in entry_points(group="console_scripts")}
        assert scripts.get("nico") == "nico.__main__:main"
        assert scripts.get("nico-api") == "nico.api_runner:main"
        assert app is not None
        assert callable(api_main)
        print("NICO package entry points and complete production API import verified.")
        PY

    - name: Install frontend dependencies
      working-directory: apps/web
      run: npm install --legacy-peer-deps

    - name: Run frontend typecheck
      working-directory: apps/web
      run: npm run lint

    - name: Run frontend production build
      working-directory: apps/web
      run: npm run build

    - name: Compile critical files
      run: |
        python -m py_compile nico/assessment.py
        python -m py_compile nico/cli.py
        python -m py_compile nico/api/main.py
        python -m py_compile nico/hosted_assessment.py
        python -m py_compile nico/service_workflows.py
        python -m py_compile nico/storage.py
        python -m py_compile nico/scanner_worker.py
        python -m py_compile nico/evidence.py
        python -m py_compile nico/approval_queue.py
        python -m py_compile nico/repair_intelligence.py
        python -m py_compile nico/reports.py
        python -m py_compile nico/github_app.py
        python -m py_compile nico/customer_access.py
        python -m py_compile nico/tenancy.py
        python -m py_compile nico/modules/reporting.py
        python -m py_compile nico/modules/dependency_audit.py
        python -m py_compile nico/modules/synthesis.py
        python -m py_compile nico/modules/maturity.py
        python -m py_compile nico/modules/roadmap.py
        python -m py_compile nico/modules/express_pack.py
        python -m py_compile nico/phase5_report_truth_v1.py
        python -m py_compile nico/phase5_report_truth_v2.py
        python -m py_compile nico/phase6_final_remediation_v1.py
        python -m py_compile nico/phase6_canonical_truth_v2.py
        python -m py_compile scripts/build_phase6_verification_package.py

    - name: Run Python dependency audit evidence
      run: |
        mkdir -p audit-results
        python -m pip_audit --format json --output audit-results/pip-audit-results.json || true
        test -f audit-results/pip-audit-results.json || echo '{"status":"pip-audit unavailable"}' > audit-results/pip-audit-results.json

    - name: Verify hosted scanner installer strictly
      env:
        GITHUB_TOKEN: ${{ github.token }}
        NICO_SCANNER_INSTALL_STRICT: "true"
      run: |
        export NICO_SCANNER_INSTALL_DIR="$RUNNER_TEMP/nico-scanners"
        export PATH="$NICO_SCANNER_INSTALL_DIR:$PATH"
        python scripts/install_hosted_scanner_binaries.py
        command -v osv-scanner
        command -v gitleaks
        command -v trufflehog

    - name: Run Docker build check
      timeout-minutes: 20
      env:
        GITHUB_TOKEN: ${{ github.token }}
        DOCKER_BUILDKIT: "1"
      run: |
        docker build --secret id=github_token,env=GITHUB_TOKEN -t nico-ci:ci .
        docker run --rm --entrypoint sh nico-ci:ci -c 'test -w /data && command -v nico && command -v nico-api && python -c "from nico.api.production import app; assert app"'

    - name: Run file integrity regression test
      run: |
        python -m pytest tests/test_phase3_file_integrity.py -v

    - name: Upload audit results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: audit-results
        path: audit-results/

  test_shards:
    name: test-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.11"

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: "20"

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install --no-deps -e .
        cd apps/web && npm install --legacy-peer-deps

    - name: Run balanced test shard
      env:
        NICO_TEST_SHARD: ${{ matrix.shard }}
        NICO_TEST_SHARDS: "8"
        PYTHONHASHSEED: "0"
        PYTHONFAULTHANDLER: "1"
        PYTHONUNBUFFERED: "1"
      run: |
        python - <<'PY'
        from pathlib import Path
        import os
        import signal
        import subprocess
        import sys
        import threading

        shard = int(os.environ["NICO_TEST_SHARD"])
        total = int(os.environ["NICO_TEST_SHARDS"])
        files = sorted(
            Path("tests").rglob("test_*.py"),
            key=lambda path: (-path.stat().st_size, str(path)),
        )
        if not files:
            raise SystemExit("No NICO test files were discovered")

        buckets: list[list[Path]] = [[] for _ in range(total)]
        loads = [0 for _ in range(total)]
        for path in files:
            target = min(range(total), key=lambda index: (loads[index], index))
            buckets[target].append(path)
            loads[target] += path.stat().st_size

        selected = sorted(buckets[shard], key=str)
        manifest = Path(f"pytest-shard-{shard}.txt")
        manifest.write_text("\n".join(str(path) for path in selected) + "\n", encoding="utf-8")
        print(
            f"Running NICO test shard {shard + 1}/{total}: "
            f"{len(selected)} files, source bytes={loads[shard]}",
            flush=True,
        )

        # pytest can return successfully while a leaked non-daemon thread or
        # descendant process keeps the interpreter alive. Run it in a dedicated
        # process group, exit immediately after pytest returns, and kill the
        # complete group at the diagnostic boundary if it does not return.
        runner = (
            "import os, sys, pytest; "
            "code = pytest.main(sys.argv[1:]); "
            "sys.stdout.flush(); sys.stderr.flush(); os._exit(int(code))"
        )
        command = [
            sys.executable,
            "-c",
            runner,
            *(str(path) for path in selected),
            "-v",
            "--tb=short",
            f"--junitxml=pytest-results-{shard}.xml",
        ]
        log_path = Path(f"pytest-shard-{shard}.log")
        with log_path.open("w", encoding="utf-8", buffering=1) as log_file:
            process = subprocess.Popen(
                command,
                start_new_session=True,
                stdout=subprocess.PIPE,
                stderr=subprocess.STDOUT,
                text=True,
                bufsize=1,
            )

            def stream_output() -> None:
                assert process.stdout is not None
                for line in process.stdout:
                    print(line, end="", flush=True)
                    log_file.write(line)

            output_thread = threading.Thread(
                target=stream_output,
                daemon=True,
                name=f"pytest-shard-{shard}-output",
            )
            output_thread.start()
            try:
                returncode = process.wait(timeout=10 * 60)
            except subprocess.TimeoutExpired:
                diagnostic = Path(f"pytest-timeout-{shard}.txt")
                diagnostic.write_text(
                    "The isolated pytest process group exceeded 10 minutes and was terminated.\n"
                    f"shard={shard}\nfiles={len(selected)}\n"
                    f"log={log_path}\n",
                    encoding="utf-8",
                )
                os.killpg(process.pid, signal.SIGABRT)
                try:
                    process.wait(timeout=15)
                except subprocess.TimeoutExpired:
                    os.killpg(process.pid, signal.SIGKILL)
                    process.wait(timeout=15)
                returncode = 124
            finally:
                output_thread.join(timeout=10)
        raise SystemExit(returncode)
        PY

    - name: Upload shard results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: always()
      with:
        name: pytest-results-${{ matrix.shard }}
        path: |
          pytest-results-${{ matrix.shard }}.xml
          pytest-shard-${{ matrix.shard }}.txt
          pytest-shard-${{ matrix.shard }}.log
          pytest-timeout-${{ matrix.shard }}.txt

  test:
    name: test
    needs: [quality, test_shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require every NICO CI boundary
      env:
        QUALITY_RESULT: ${{ needs.quality.result }}
        SHARDS_RESULT: ${{ needs.test_shards.result }}
      run: |
        test "$QUALITY_RESULT" = "success"
        test "$SHARDS_RESULT" = "success"
        echo "NICO quality checks and every isolated test shard passed."
