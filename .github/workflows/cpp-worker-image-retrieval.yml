name: C++ Published Image Retrieval

on:
  push:
    branches: [feat/large-repository-cpp-comprehensive]
    paths:
      - .github/workflows/cpp-worker-image-retrieval.yml
      - scripts/cpp_worker_image_release.py
      - scripts/cpp_worker_published_image.json
      - nico/assessment_worker_launch.py

permissions:
  contents: read

concurrency:
  group: cpp-image-retrieval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    env:
      NICO_IMAGE_HANDOFF_SHA256: 5311d1fc8ebba1aefbd378a0d384e4fa09c54d689887aa5e20c09bc685ad2165
      NICO_IMAGE_QUALIFIED_SOURCE_SHA: bb4914b9f8ba94ccea0d4fb256630580a53301b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install existing controller dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Restore the original retained publication receipt
        run: |
          mkdir image-publication
          cp scripts/cpp_worker_published_image.json image-publication/publication.json
      - name: Retrieve published immutable image using job-scoped package access
        env:
          NICO_IMAGE_RELEASE_MODE: verify
          NICO_IMAGE_PULL_TOKEN: ${{ github.token }}
        run: python -m scripts.cpp_worker_image_release
      - name: Retain actual registry access and retrieval result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpp-image-retrieval-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-retrieval/verification.json
          if-no-files-found: warn
          retention-days: 30
