name: Phase 6 Wire Canonical Truth V2

on:
  pull_request:
    paths:
      - ".github/workflows/phase6-wire-canonical-truth-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-6/report-deduplication-security-remediation
          fetch-depth: 0
          persist-credentials: true
      - name: Install canonical truth v2
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nico/api/terminal_authority_bootstrap.py")
          text = path.read_text(encoding="utf-8")
          import_marker = "from nico.phase6_final_remediation_v1 import install_phase6_final_remediation_v1\n"
          import_addition = import_marker + "from nico.phase6_canonical_truth_v2 import install_phase6_canonical_truth_v2\n"
          if "install_phase6_canonical_truth_v2" not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit("Phase 6 import marker not found")
              text = text.replace(import_marker, import_addition, 1)

          text = text.replace('VERSION = "nico.api.terminal_authority_bootstrap.v12"', 'VERSION = "nico.api.terminal_authority_bootstrap.v13"')

          install_marker = "PHASE6_FINAL_REMEDIATION = install_phase6_final_remediation_v1()\n"
          install_addition = install_marker + "PHASE6_CANONICAL_TRUTH = install_phase6_canonical_truth_v2()\n"
          if "PHASE6_CANONICAL_TRUTH =" not in text:
              if text.count(install_marker) != 1:
                  raise SystemExit("Phase 6 install marker not found")
              text = text.replace(install_marker, install_addition, 1)

          state_marker = "app.state.nico_phase6_final_remediation = PHASE6_FINAL_REMEDIATION\n"
          state_addition = state_marker + "app.state.nico_phase6_canonical_truth = PHASE6_CANONICAL_TRUTH\n"
          if "nico_phase6_canonical_truth" not in text:
              if text.count(state_marker) != 1:
                  raise SystemExit("Phase 6 state marker not found")
              text = text.replace(state_marker, state_addition, 1)

          validation_marker = '''if PHASE6_FINAL_REMEDIATION.get("client_delivery_allowed") is not False:
              raise RuntimeError("Phase 6 must block unapproved client delivery")
          '''
          validation_addition = validation_marker + '''
          if PHASE6_CANONICAL_TRUTH.get("status") != "installed":
              raise RuntimeError(f"Phase 6 canonical truth did not install: {PHASE6_CANONICAL_TRUTH}")
          if PHASE6_CANONICAL_TRUTH.get("canonical_model_precedes_all_renderers") is not True:
              raise RuntimeError("Phase 6 canonical model does not precede all report renderers")
          if PHASE6_CANONICAL_TRUTH.get("cross_format_truth_build_gate") is not True:
              raise RuntimeError("Phase 6 cross-format truth build gate is not active")
          if PHASE6_CANONICAL_TRUTH.get("language_factual_parity_projection") is not True:
              raise RuntimeError("Phase 6 language factual parity projection is not active")
          if PHASE6_CANONICAL_TRUTH.get("human_review_required") is not True:
              raise RuntimeError("Phase 6 canonical truth must preserve human review")
          if PHASE6_CANONICAL_TRUTH.get("client_delivery_allowed") is not False:
              raise RuntimeError("Phase 6 canonical truth must block unapproved client delivery")
          '''
          if "Phase 6 canonical truth did not install" not in text:
              if text.count(validation_marker) != 1:
                  raise SystemExit("Phase 6 validation marker not found")
              text = text.replace(validation_marker, validation_addition, 1)

          all_marker = '    "PHASE6_FINAL_REMEDIATION",\n'
          if '    "PHASE6_CANONICAL_TRUTH",\n' not in text:
              if text.count(all_marker) != 1:
                  raise SystemExit("Phase 6 __all__ marker not found")
              text = text.replace(all_marker, all_marker + '    "PHASE6_CANONICAL_TRUTH",\n', 1)

          path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/phase6-wire-canonical-truth-v2.yml
          python -m py_compile nico/phase6_canonical_truth_v2.py nico/api/terminal_authority_bootstrap.py
          git add -A
          git diff --cached --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 6: install canonical cross-format truth v2"
          git push origin HEAD:phase-6/report-deduplication-security-remediation
