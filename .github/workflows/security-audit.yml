name: Security Audit Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  audit-evidence:
    name: Audit evidence collection
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install application audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install isolated pinned Semgrep
        run: |
          python -m venv "$RUNNER_TEMP/nico-semgrep"
          "$RUNNER_TEMP/nico-semgrep/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/nico-semgrep/bin/pip" install semgrep==1.170.0
          mkdir -p "$RUNNER_TEMP/nico-tools-bin"
          ln -s "$RUNNER_TEMP/nico-semgrep/bin/semgrep" "$RUNNER_TEMP/nico-tools-bin/semgrep"
          echo "$RUNNER_TEMP/nico-tools-bin" >> "$GITHUB_PATH"

      - name: Install pinned scanner binaries strictly
        env:
          NICO_SCANNER_INSTALL_DIR: ${{ runner.temp }}/nico-scanners
          NICO_SCANNER_INSTALL_STRICT: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$NICO_SCANNER_INSTALL_DIR"
          python scripts/install_hosted_scanner_binaries.py
          echo "$NICO_SCANNER_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Collect pip-audit evidence
        run: |
          pip-audit -r requirements.txt --format json --output pip-audit.json || true
          test -s pip-audit.json || echo '{"status":"unavailable","reason":"pip-audit emitted no JSON"}' > pip-audit.json

      - name: Collect Bandit evidence
        run: |
          bandit -r nico -f json -o bandit.json || true
          test -s bandit.json || echo '{"results":[],"errors":["bandit emitted no JSON"]}' > bandit.json

      - name: Build Bandit triage evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          data = json.loads(Path('bandit.json').read_text(encoding='utf-8'))
          results = data.get('results') if isinstance(data, dict) else None
          if not isinstance(results, list):
              raise SystemExit('Bandit output is not a results object')
          items = []
          counts = {'blocking': 0, 'needs_review': 0, 'candidate_false_positive': 0}
          for item in results:
              if not isinstance(item, dict):
                  continue
              severity = str(item.get('issue_severity') or 'UNKNOWN').upper()
              confidence = str(item.get('issue_confidence') or 'UNKNOWN').upper()
              test_id = str(item.get('test_id') or 'unknown')
              filename = str(item.get('filename') or '')
              line_number = item.get('line_number')
              fingerprint = hashlib.sha256(
                  f'{test_id}|{filename}|{line_number}|{severity}|{confidence}'.encode()
              ).hexdigest()[:16]
              disposition = (
                  'blocking' if severity in {'HIGH', 'CRITICAL'}
                  else 'candidate_false_positive' if severity == 'LOW'
                  else 'needs_review'
              )
              counts[disposition] += 1
              items.append({
                  'fingerprint': fingerprint,
                  'tool': 'bandit',
                  'rule_id': test_id,
                  'severity': severity,
                  'confidence': confidence,
                  'file': filename,
                  'line': line_number,
                  'disposition': disposition,
              })
          Path('bandit-triage.json').write_text(json.dumps({
              'schema': 'nico.bandit_triage.v1',
              'tool': 'bandit',
              'finding_count': len(items),
              **counts,
              'human_review_required': bool(items),
              'items': items,
          }, indent=2, sort_keys=True), encoding='utf-8')
          PY

      - name: Collect Semgrep evidence
        run: |
          set +e
          semgrep scan --config auto --json --output semgrep.json 2>semgrep.stderr.txt
          status=$?
          set -e
          python - "$status" <<'PY'
          from pathlib import Path
          import json, sys
          status = int(sys.argv[1])
          path = Path('semgrep.json')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except Exception:
              data = None
          if not isinstance(data, dict) or not isinstance(data.get('results'), list) or not isinstance(data.get('errors'), list):
              reason = Path('semgrep.stderr.txt').read_text(encoding='utf-8', errors='replace')[-2000:]
              path.write_text(json.dumps({'results': [], 'errors': [{'level': 'error', 'message': reason or f'exit {status}'}]}, indent=2), encoding='utf-8')
          PY

      - name: Collect OSV Scanner evidence
        run: |
          set +e
          osv-scanner scan source -r . --format json > osv-scanner.json 2>osv-scanner.stderr.txt
          status=$?
          set -e
          python - "$status" <<'PY'
          from pathlib import Path
          import json, sys
          status = int(sys.argv[1])
          path = Path('osv-scanner.json')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except Exception:
              data = None
          if not isinstance(data, dict) or not isinstance(data.get('results'), list):
              reason = Path('osv-scanner.stderr.txt').read_text(encoding='utf-8', errors='replace')[-2000:]
              path.write_text(json.dumps({'status': 'unavailable', 'reason': reason or f'exit {status}'}, indent=2), encoding='utf-8')
          PY

      - name: Collect gitleaks git-history evidence
        run: |
          set +e
          gitleaks detect --source . --report-format json --report-path gitleaks.json --no-banner --redact
          status=$?
          set -e
          python - "$status" <<'PY'
          from pathlib import Path
          import json, sys
          status = int(sys.argv[1])
          path = Path('gitleaks.json')
          if status == 0 and not path.exists():
              path.write_text('[]\n', encoding='utf-8')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except Exception:
              data = None
          valid = isinstance(data, list)
          Path('gitleaks-summary.json').write_text(json.dumps({
              'scanner': 'gitleaks',
              'status': 'completed' if valid else 'unavailable',
              'finding_count': len(data) if valid else 0,
              'artifact_present': path.exists(),
              'history_depth': 'full',
              'exit_code': status,
          }, indent=2), encoding='utf-8')
          PY

      - name: Collect trufflehog git-history evidence
        run: |
          set +e
          trufflehog git "file://$PWD" --json --no-update > trufflehog.json 2>trufflehog.stderr.txt
          status=$?
          set -e
          python - "$status" <<'PY'
          from pathlib import Path
          import json, sys
          status = int(sys.argv[1])
          path = Path('trufflehog.json')
          raw = path.read_text(encoding='utf-8', errors='replace') if path.exists() else ''
          findings = []
          invalid_lines = 0
          for line in raw.splitlines():
              if not line.strip():
                  continue
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  invalid_lines += 1
                  continue
              if isinstance(value, dict):
                  findings.append(value)
              else:
                  invalid_lines += 1
          completed = invalid_lines == 0 and (status == 0 or bool(findings))
          Path('trufflehog-summary.json').write_text(json.dumps({
              'scanner': 'trufflehog',
              'status': 'completed' if completed else 'unavailable',
              'finding_count': len(findings),
              'artifact_present': path.exists(),
              'history_depth': 'full',
              'exit_code': status,
              'invalid_json_lines': invalid_lines,
          }, indent=2), encoding='utf-8')
          PY

      - name: Collect built-in high-confidence credential evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          skip = {'.git', 'node_modules', '.next', 'dist', 'build', '.venv', 'venv', '__pycache__'}
          non_production = {'test', 'tests', 'fixture', 'fixtures', 'example', 'examples', 'sample', 'samples'}
          suffixes = {'.py','.js','.jsx','.ts','.tsx','.json','.yaml','.yml','.toml','.ini','.cfg','.txt','.md','.sh','.html','.css','.xml','.env','.example'}
          patterns = {
              'private_key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'),
              'github_token': re.compile(r'gh[pousr]_[A-Za-z0-9_]{20,}'),
              'aws_access_key': re.compile(r'AKIA[0-9A-Z]{16}'),
          }
          findings = []
          review_required = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in skip for part in path.parts):
                  continue
              if path.suffix not in suffixes and path.name not in {'Dockerfile','Procfile','.env.example'}:
                  continue
              relative = str(path).replace('\\', '/')
              parts = {part.casefold() for part in path.parts}
              name = path.name.casefold()
              non_production_path = bool(
                  parts & non_production
                  or name.startswith('test_')
                  or name.endswith(('_test.py', '.test.ts', '.test.tsx', '.spec.ts', '.spec.tsx'))
                  or name in {'.env.example', '.env.sample', 'example.env', 'sample.env'}
              )
              text = path.read_text(encoding='utf-8', errors='replace')
              for line_number, line in enumerate(text.splitlines(), 1):
                  for finding_type, pattern in patterns.items():
                      if not pattern.search(line):
                          continue
                      item = {
                          'path': relative,
                          'line': line_number,
                          'type': finding_type,
                          'disposition': 'review_required_non_production' if non_production_path else 'blocking_production',
                      }
                      (review_required if non_production_path else findings).append(item)
          Path('credential-scan.json').write_text(json.dumps({
              'findings': findings,
              'review_required_non_production_findings': review_required,
              'raw_candidate_count': len(findings) + len(review_required),
          }, indent=2), encoding='utf-8')
          PY

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install supported npm audit client
        run: |
          npm install --global npm@11
          npm --version

      - name: Install supported ESLint audit client
        run: |
          npm install --global eslint@9 @eslint/js@9 @typescript-eslint/parser@8 --no-audit --no-fund
          echo "NODE_PATH=$(npm root --global)" >> "$GITHUB_ENV"
          eslint --version

      - name: Install exact frontend dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Collect TypeScript evidence
        working-directory: apps/web
        run: |
          set +e
          npm run lint > ../../typescript.txt 2>&1
          status=$?
          set -e
          python - "$status" <<'PY'
          from pathlib import Path
          import json, sys
          status = int(sys.argv[1])
          Path('../../typescript-summary.json').write_text(json.dumps({
              'scanner': 'typescript',
              'status': 'completed_clean' if status == 0 else 'completed_with_findings',
              'finding_count': 0 if status == 0 else 1,
              'artifact_present': True,
              'exit_code': status,
          }, indent=2), encoding='utf-8')
          PY

      - name: Collect honest ESLint evidence
        working-directory: apps/web
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, shutil, subprocess
          configs = ['eslint.config.js','eslint.config.mjs','eslint.config.cjs','.eslintrc','.eslintrc.js','.eslintrc.cjs','.eslintrc.json','.eslintrc.yaml','.eslintrc.yml']
          configured = any(Path(name).is_file() for name in configs)
          local_binary = Path('node_modules/.bin/eslint')
          binary = str(local_binary) if local_binary.is_file() else shutil.which('eslint')
          if not configured:
              data = []
              summary = {'scanner': 'eslint', 'status': 'unavailable_not_configured', 'configured': False, 'finding_count': 0, 'error_count': 0, 'warning_count': 0}
          elif not binary:
              data = []
              summary = {'scanner': 'eslint', 'status': 'unavailable', 'configured': True, 'finding_count': 0, 'error_count': 0, 'warning_count': 0, 'reason': 'neither a local nor supported global ESLint binary is available'}
          else:
              environment = dict(os.environ)
              if not environment.get('NODE_PATH'):
                  root = subprocess.run(['npm', 'root', '--global'], capture_output=True, text=True, check=False).stdout.strip()
                  if root:
                      environment['NODE_PATH'] = root
              result = subprocess.run([binary, '.', '--format', 'json'], capture_output=True, text=True, timeout=180, check=False, env=environment)
              try:
                  data = json.loads(result.stdout)
              except json.JSONDecodeError:
                  data = []
              messages = [message for file_result in data if isinstance(file_result, dict) for message in file_result.get('messages') or [] if isinstance(message, dict)]
              configuration_errors = [
                  message for message in messages
                  if message.get('fatal') is True
                  or (
                      message.get('ruleId') is None
                      and any(marker in str(message.get('message') or '').casefold() for marker in ('configuration', 'config', 'definition for rule', 'parsing error'))
                  )
              ]
              errors = sum(1 for message in messages if int(message.get('severity') or 0) == 2 and message not in configuration_errors)
              warnings = sum(1 for message in messages if int(message.get('severity') or 0) == 1)
              if result.returncode >= 2 or configuration_errors:
                  status = 'configuration_failed'
                  reason = '; '.join(str(message.get('message') or '') for message in configuration_errors[:5]) or result.stderr[-2000:] or f'ESLint exited {result.returncode}'
              else:
                  status = 'completed_clean' if result.returncode == 0 and not errors else 'completed_with_findings'
                  reason = ''
              summary = {
                  'scanner': 'eslint',
                  'status': status,
                  'configured': True,
                  'finding_count': errors + warnings,
                  'error_count': errors,
                  'warning_count': warnings,
                  'configuration_error_count': len(configuration_errors),
                  'exit_code': result.returncode,
                  'binary_source': 'local' if local_binary.is_file() else 'supported_global',
              }
              if reason:
                  summary['reason'] = reason
          Path('../../eslint.json').write_text(json.dumps(data, indent=2), encoding='utf-8')
          Path('../../eslint-summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          PY

      - name: Collect npm audit evidence
        working-directory: apps/web
        run: |
          set +e
          npm audit --omit=dev --json > ../../npm-audit.json 2> ../../npm-audit.stderr.txt
          status=$?
          set -e
          python - "$status" <<'PY'
          from pathlib import Path
          import json, sys
          status = int(sys.argv[1])
          output = Path('../../npm-audit.json')
          stderr = Path('../../npm-audit.stderr.txt').read_text(encoding='utf-8', errors='replace')
          try:
              data = json.loads(output.read_text(encoding='utf-8'))
          except Exception:
              data = None
          valid = isinstance(data, dict) and isinstance(data.get('metadata'), dict) and isinstance(data['metadata'].get('vulnerabilities'), dict)
          if not valid:
              output.write_text(json.dumps({'status': 'unavailable', 'reason': stderr[-2000:] or f'npm audit exit {status} emitted invalid JSON', 'exit_code': status}, indent=2), encoding='utf-8')
          PY

      - name: Collect complexity evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from nico.complexity_engine import build_complexity_profile
          Path('complexity-profile.json').write_text(json.dumps(build_complexity_profile(Path('.')), indent=2, sort_keys=True), encoding='utf-8')
          PY

      - name: Build fail-closed scanner manifest
        if: always()
        run: python scripts/security_audit_gate.py

      - name: Upload audit evidence before enforcement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-audit-evidence
          if-no-files-found: error
          path: |
            pip-audit.json
            bandit.json
            bandit-triage.json
            semgrep.json
            semgrep.stderr.txt
            osv-scanner.json
            osv-scanner.stderr.txt
            gitleaks.json
            gitleaks-summary.json
            trufflehog.json
            trufflehog-summary.json
            trufflehog.stderr.txt
            credential-scan.json
            npm-audit.json
            npm-audit.stderr.txt
            typescript.txt
            typescript-summary.json
            eslint.json
            eslint-summary.json
            complexity-profile.json
            scanner-worker-artifact.json
            security-gate.json

      - name: Require complete clean security evidence
        if: always()
        run: python scripts/security_audit_gate.py --enforce
