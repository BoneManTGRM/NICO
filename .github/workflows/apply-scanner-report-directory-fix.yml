name: Apply scanner report directory repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/evidence-pipeline-frozen-sha'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out scanner repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/evidence-pipeline-frozen-sha
          fetch-depth: 0

      - name: Create scanner-owned report directories before execution
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nico/scanner_evidence_pipeline_v1.py')
          source = path.read_text(encoding='utf-8')
          replacements = (
              (
                  '    raw = workspace.root / "scanner-raw" / "bandit.csv"\n    log = workspace.root / "scanner-output" / "bandit.log"\n',
                  '    raw = workspace.root / "scanner-raw" / "bandit.csv"\n    raw.parent.mkdir(parents=True, exist_ok=True)\n    log = workspace.root / "scanner-output" / "bandit.log"\n',
              ),
              (
                  '    raw = workspace.root / "scanner-raw" / "gitleaks.json"\n    log = workspace.root / "scanner-output" / "gitleaks.log"\n',
                  '    raw = workspace.root / "scanner-raw" / "gitleaks.json"\n    raw.parent.mkdir(parents=True, exist_ok=True)\n    log = workspace.root / "scanner-output" / "gitleaks.log"\n',
              ),
          )
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'expected scanner report block was not found: {old!r}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify source contracts
        run: |
          python -m py_compile nico/scanner_evidence_pipeline_v1.py tests/test_scanner_evidence_pipeline_v1.py
          test "$(grep -c 'raw.parent.mkdir(parents=True, exist_ok=True)' nico/scanner_evidence_pipeline_v1.py)" -ge 2

      - name: Commit repair and remove this workflow
        run: |
          rm .github/workflows/apply-scanner-report-directory-fix.yml
          git config user.name "BoneManTGRM"
          git config user.email "235159333+BoneManTGRM@users.noreply.github.com"
          git add nico/scanner_evidence_pipeline_v1.py .github/workflows/apply-scanner-report-directory-fix.yml
          git commit -m "Create scanner report directories before execution"
          git push origin HEAD:fix/evidence-pipeline-frozen-sha
