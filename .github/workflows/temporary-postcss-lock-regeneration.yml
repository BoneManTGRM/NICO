name: Temporary PostCSS Lock Regeneration

on:
  push:
    branches:
      - agent/remediate-postcss-ghsa-fxqj

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/remediate-postcss-ghsa-fxqj

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Use repository npm version
        run: npm install --global npm@10.8.2

      - name: Regenerate lockfile from the reviewed manifest
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify resolved remediation versions
        working-directory: apps/web
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json')
          const postcss = lock.packages?.['node_modules/postcss']?.version
          const nanoid = lock.packages?.['node_modules/nanoid']?.version
          if (postcss !== '8.5.23') throw new Error(`Expected postcss 8.5.23, got ${postcss}`)
          if (nanoid !== '3.3.16') throw new Error(`Expected nanoid 3.3.16, got ${nanoid}`)
          NODE
          npm audit --omit=dev --audit-level=moderate

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- apps/web/package-lock.json; then
            echo 'Lockfile already matches the reviewed manifest.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package-lock.json
          git commit -m 'Regenerate lockfile for PostCSS remediation'
          git push origin HEAD:agent/remediate-postcss-ghsa-fxqj
