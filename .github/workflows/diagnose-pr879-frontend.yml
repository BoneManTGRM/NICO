name: Diagnose PR 879 frontend

on:
  push:
    branches:
      - feature/internal-review-and-evidence-truth
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: "!contains(github.event.head_commit.message, 'Record PR 879 compiler diagnostics')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/internal-review-and-evidence-truth
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm install
      - name: Capture TypeScript diagnostics
        id: typescript
        working-directory: apps/web
        shell: bash
        run: |
          set +e
          npm run lint > ../../pr879-typescript.log 2>&1
          code=$?
          cat ../../pr879-typescript.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit diagnostics to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr879-typescript.log
          git commit -m "Record PR 879 compiler diagnostics" || exit 0
          git push origin HEAD:feature/internal-review-and-evidence-truth
      - name: Fail when TypeScript failed
        run: test "${{ steps.typescript.outputs.exit_code }}" = "0"
