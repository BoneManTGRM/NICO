name: NICO fake-data native restore rehearsal
on:
  push:
    branches: [atlas-synthetic-restore-20261119]
    paths: [.github/workflows/atlas-synthetic-restore.yml, .github/nico-synthetic-restore/**]
permissions:
  contents: read
jobs:
  fixture:
    if: github.repository == 'BoneManTGRM/NICO'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash .github/nico-synthetic-restore/run-ci.sh
