name: Phase 9 Client Delivery Proof

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify delivery authorization and invalidation twice
        run: |
          pytest -q tests/test_phase9_client_delivery_v1.py
          pytest -q tests/test_phase9_client_delivery_v1.py
      - name: Generate retained delivery proof
        env:
          PHASE9_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p phase9-delivery-proof
          printf 'english pdf proof\n' > phase9-delivery-proof/report-en.pdf
          printf 'spanish pdf proof\n' > phase9-delivery-proof/report-es.pdf
          printf '{"truth":"canonical"}\n' > phase9-delivery-proof/canonical.json
          printf 'finding_id,title\n' > phase9-delivery-proof/findings.csv
          printf '{"release":"pending"}\n' > phase9-delivery-proof/release.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          from nico.phase9_client_delivery_v1 import build_pending_delivery_record

          root = Path('phase9-delivery-proof')
          files = {
              'report_en_pdf': root / 'report-en.pdf',
              'report_es_pdf': root / 'report-es.pdf',
              'canonical_json': root / 'canonical.json',
              'findings_csv': root / 'findings.csv',
              'release_manifest': root / 'release.json',
          }
          record = build_pending_delivery_record(
              repository=os.environ.get('GITHUB_REPOSITORY', 'BoneManTGRM/NICO'),
              revision=os.environ['PHASE9_REVISION'],
              run_id=os.environ.get('GITHUB_RUN_ID', 'local'),
              artifacts=files,
              required_labels=list(files),
              limitations=['Human visual review required'],
          )
          assert record['client_delivery_allowed'] is False
          assert record['approval']['status'] == 'pending'
          (root / 'delivery-record.json').write_text(json.dumps(record, indent=2), encoding='utf-8')
          print({'package_fingerprint': record['package_fingerprint'], 'revision': record['immutable_revision']})
          PY
      - name: Upload retained delivery proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase9-client-delivery-proof-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: phase9-delivery-proof/
