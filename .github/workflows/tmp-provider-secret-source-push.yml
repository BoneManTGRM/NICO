name: Temporary provider credential source push

on:
  push:
    branches:
      - feat/provider-rollout-authority

permissions:
  contents: write

concurrency:
  group: temporary-provider-credential-source-push
  cancel-in-progress: false

jobs:
  persist-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/provider-rollout-authority
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Patch, verify, and persist provider hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('nico/provider_rollout_control_v1.py')
          source = path.read_text(encoding='utf-8')
          anchor = 'def _text(value: Any) -> str:\n    return " ".join(str(value or "").split()).strip()\n\n\n'
          helper = anchor + '''def _contains_secret_field(value: Any) -> bool:
              if isinstance(value, Mapping):
                  for raw_key, item in value.items():
                      if str(raw_key).casefold() in _SECRET_FIELDS:
                          return True
                      if _contains_secret_field(item):
                          return True
                  return False
              if isinstance(value, (list, tuple, set)):
                  return any(_contains_secret_field(item) for item in value)
              return False


          '''
          if 'def _contains_secret_field(' not in source:
              if source.count(anchor) != 1:
                  raise SystemExit('expected _text anchor exactly once')
              source = source.replace(anchor, helper, 1)
          source = source.replace(
              '        if keys & _SECRET_FIELDS:\n            raise ProviderRolloutError("raw_provider_credentials_prohibited")\n',
              '        if _contains_secret_field(payload):\n            raise ProviderRolloutError("raw_provider_credentials_prohibited")\n',
              1,
          )
          source = source.replace(
              '            "credential_reference_fingerprint": binding.credential_reference_fingerprint,\n',
              '',
              1,
          )
          if 'def _contains_secret_field(' not in source or 'if _contains_secret_field(payload):' not in source:
              raise SystemExit('provider secret recursion was not bound')
          if '"credential_reference_fingerprint": binding.credential_reference_fingerprint' in source:
              raise SystemExit('credential-reference fingerprint remains exposed')
          path.write_text(source, encoding='utf-8')

          test = Path('tests/test_provider_rollout_secret_boundary_v1.py')
          test.write_text('''from fastapi import FastAPI
from fastapi.testclient import TestClient

from nico.provider_platform_contract_v1 import ProviderKind
from nico.provider_rollout_control_v1 import ProviderRolloutConfig, ProviderRolloutRegistry, ProviderRolloutState, install_provider_rollout_routes


def _registry() -> ProviderRolloutRegistry:
    return ProviderRolloutRegistry(configs={provider: ProviderRolloutConfig(provider, ProviderRolloutState.INTERNAL_TEST, True, credential_reference_id=f"{provider.value}-server-reference", capability_evidence_reference=f"artifact://{provider.value}/engineering", native_ci_evidence_supported=True) for provider in (ProviderKind.GITHUB, ProviderKind.GITLAB, ProviderKind.BITBUCKET_CLOUD, ProviderKind.AZURE_DEVOPS)})


def _payload() -> dict[str, object]:
    return {"provider": "github", "client_id": "client-1", "project_id": "project-1", "session_id": "session-1", "run_id": "comprun-1", "locale": "en-US", "onboarding_mode": "internal_test"}


def test_nested_raw_credentials_are_rejected_without_echoing_secret(monkeypatch) -> None:
    monkeypatch.setenv("NICO_ADMIN_TOKEN", "operator-token")
    app = FastAPI()
    install_provider_rollout_routes(app, registry=_registry())
    client = TestClient(app)
    secret = "never-return-this-nested-provider-secret"
    response = client.post("/providers/onboarding/preflight", headers={"X-NICO-Admin-Token": "operator-token"}, json={**_payload(), "metadata": {"connection": {"token": secret}}})
    assert response.status_code == 422
    assert response.json()["detail"]["code"] == "raw_provider_credentials_prohibited"
    assert response.json()["detail"]["credential_detail_exposed"] is False
    assert secret not in response.text


def test_preflight_does_not_return_credential_reference_fingerprint(monkeypatch) -> None:
    monkeypatch.setenv("NICO_ADMIN_TOKEN", "operator-token")
    app = FastAPI()
    install_provider_rollout_routes(app, registry=_registry())
    client = TestClient(app)
    response = client.post("/providers/onboarding/preflight", headers={"X-NICO-Admin-Token": "operator-token"}, json=_payload())
    assert response.status_code == 200
    payload = response.json()
    assert payload["credential_reference_bound"] is True
    assert payload["credential_reference_exposed"] is False
    assert "credential_reference_fingerprint" not in payload
''', encoding='utf-8')
          PY
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install --no-deps -e .
          pytest -q tests/test_provider_rollout_control_v1.py tests/test_provider_rollout_secret_boundary_v1.py
          python -m py_compile nico/provider_rollout_control_v1.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nico/provider_rollout_control_v1.py tests/test_provider_rollout_secret_boundary_v1.py
          if git diff --cached --quiet; then
            echo 'Provider hardening already persisted.'
            exit 0
          fi
          git commit -m 'Harden provider credential boundary'
          git push origin HEAD:feat/provider-rollout-authority
