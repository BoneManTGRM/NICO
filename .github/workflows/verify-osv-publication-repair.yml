name: Verify OSV publication repair
on:
  push:
    branches: [fix/1496-osv-publication]
    paths: [.github/workflows/verify-osv-publication-repair.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nico-osv-publication-repair
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PATCH_SHA256: b84e31b5349a7e7533faad1db9e5fa6a14c5ad99f0be502c07d0c21045b0f0fc
      PATCH_BLOB: c6fb870f9ad32d295a94d6dc60f253eb9190f53f
      NICO_DISABLE_POSTGRES: 'true'
      NICO_ALLOW_PROJECT_COMMANDS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply exactly the reviewed three-file patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen
          assert os.environ['GITHUB_REPOSITORY']=='BoneManTGRM/NICO'
          assert os.environ['GITHUB_REF']=='refs/heads/fix/1496-osv-publication'
          root=Path('audit-results/osv-repair'); root.mkdir(parents=True, exist_ok=True)
          request=Request('https://api.github.com/repos/BoneManTGRM/NICO/git/blobs/'+os.environ['PATCH_BLOB'],headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urlopen(request,timeout=30) as response: blob=json.load(response)
          patch=base64.b64decode(blob['content'])
          assert len(patch)==7835 and hashlib.sha256(patch).hexdigest()==os.environ['PATCH_SHA256']
          path=root/'reviewed.patch'; path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          names=sorted(line[6:] for line in patch.decode().splitlines() if line.startswith('+++ b/'))
          assert names==['nico/comprehensive_spanish_canonical_evidence_literals_v95.py','nico/comprehensive_spanish_canonical_report_v87.py','tests/test_osv_applicability_spanish_publication.py']
          subprocess.run(['git','add','-N','--',*names],check=True)
          manifest={'base_sha':os.environ['GITHUB_SHA'],'patch_sha256':os.environ['PATCH_SHA256'],'files':{name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names},'production_modified':False,'shipping_clearance':False}
          (root/'candidate.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Install exact project dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Reproduce both process bootstraps and preserve scanner truth
        run: python -m pytest -q tests/test_osv_applicability_spanish_publication.py --junitxml=audit-results/osv-repair/targeted.xml
      - name: Run related report, localization and scanner regressions in isolated interpreters
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          patterns=('test_spanish*.py','test_comprehensive_spanish*.py','test_scanner_completion_gate.py','test_final_report_runtime_rebind_v91.py','test_final_report_worker_bootstrap_and_diagnostics_v2.py','test_provider_label_after_bootstrap.py')
          files=sorted({str(p) for pattern in patterns for p in Path('tests').glob(pattern)})
          assert len(files)>=40
          root=Path('audit-results/osv-repair'); records=[]
          for number,name in enumerate(files):
              with (root/f'regression-{number:03d}.log').open('w') as log:
                  result=subprocess.run([sys.executable,'-m','pytest','-q',name,f'--junitxml={root}/regression-{number:03d}.xml'],stdout=log,stderr=subprocess.STDOUT,timeout=240,check=False)
              records.append({'file':name,'exit_code':result.returncode})
              (root/'regressions.json').write_text(json.dumps(records,indent=2))
              print(name,result.returncode,flush=True)
              if result.returncode: raise SystemExit('A related regression failed; candidate will not be published')
          PY
      - name: Publish only unchanged tested files to the isolated repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET
          repo='BoneManTGRM/NICO'; branch='fix/1496-osv-publication'; source=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REPOSITORY']==repo and os.environ['GITHUB_REF']=='refs/heads/'+branch
          root=Path('audit-results/osv-repair'); manifest=json.loads((root/'candidate.json').read_text())
          cases=ET.parse(root/'targeted.xml').findall('.//testcase')
          assert len(cases)==5 and not any(case.find(tag) is not None for case in cases for tag in ('failure','error','skipped'))
          def api(method,path,body=None):
              data=None if body is None else json.dumps(body).encode()
              request=Request('https://api.github.com/repos/'+repo+path,method=method,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urlopen(request,timeout=40) as response:return json.load(response)
          assert api('GET','/git/ref/heads/'+branch)['object']['sha']==source,'Branch advanced'
          assert manifest['base_sha']==source
          assert sorted(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==sorted(manifest['files'])
          entries=[]
          for name,digest in manifest['files'].items():
              path=Path(name); assert path.is_file() and not path.is_symlink()
              content=path.read_bytes(); assert hashlib.sha256(content).hexdigest()==digest
              blob=api('POST','/git/blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
          parent=api('GET','/git/commits/'+source)
          tree=api('POST','/git/trees',{'base_tree':parent['tree']['sha'],'tree':entries})
          commit=api('POST','/git/commits',{'message':'Localize exact OSV applicability explanations without weakening publication gates','tree':tree['sha'],'parents':[source]})
          assert api('GET','/git/ref/heads/'+branch)['object']['sha']==source,'Branch advanced before publication'
          api('PATCH','/git/refs/heads/'+branch,{'sha':commit['sha'],'force':False})
          record={'branch':branch,'commit':commit['sha'],'tree':tree['sha'],'entries':entries,'shipping_clearance':False,'production_modified':False}
          (root/'publication.json').write_text(json.dumps(record,indent=2)); print(json.dumps(record,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: osv-publication-repair-${{ github.run_id }}
          path: audit-results/osv-repair/
          if-no-files-found: error
          retention-days: 30
