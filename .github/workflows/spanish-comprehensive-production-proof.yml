name: Spanish Comprehensive Production Proof

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  id-token: write

concurrency:
  group: nico-spanish-comprehensive-production
  cancel-in-progress: false

jobs:
  spanish-comprehensive:
    name: Prove authenticated es-MX Comprehensive report publication
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production-smoke
    env:
      NICO_PRODUCTION_FRONTEND_URL: ${{ vars.NICO_PRODUCTION_FRONTEND_URL || 'https://app.nicoaudit.com' }}
      NICO_PRODUCTION_SMOKE_REPOSITORY: https://gitlab.com/gitlab-org/gitlab-test
      NICO_PRODUCTION_BACKEND_STATUS_CONTEXT: ${{ vars.NICO_PRODUCTION_BACKEND_STATUS_CONTEXT || 'successful-cat - NICO' }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
      SOURCE_RUN_ID: ${{ github.run_id }}
      SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
      STATUS_CONTEXT: NICO Spanish Comprehensive Production Proof
      PYTHONUNBUFFERED: "1"
      NICO_SPANISH_PROOF_TELEMETRY_SECONDS: "30"
      NICO_PROOF_HEADED_CHROMIUM: "1"
      NICO_PROOF_NATIVE_VISIBILITY: "1"

    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Publish pending Spanish proof status
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/spanish-status.json
          import json, os
          print(json.dumps({
              "state": "pending",
              "context": os.environ["STATUS_CONTEXT"],
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated bilingual Comprehensive proof running",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/spanish-status.json

      - name: Validate production scope and proof contracts
        run: |
          set -euo pipefail
          test "${NICO_PRODUCTION_FRONTEND_URL}" = "https://app.nicoaudit.com"
          test "${NICO_PRODUCTION_SMOKE_REPOSITORY}" = "https://gitlab.com/gitlab-org/gitlab-test"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          python -m py_compile \
            scripts/github_actions_proof_session_v1.py \
            scripts/authenticated_proof_browser_v1.py \
            scripts/production_specialist_release_identity_v1.py \
            scripts/spanish_comprehensive_authenticated_live_acceptance_v4.py \
            scripts/spanish_comprehensive_authenticated_existing_run_recovery_v2.py

      - name: Wait for exact frontend and backend deployments
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["RELEASE_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          required = {"Vercel", os.environ["NICO_PRODUCTION_BACKEND_STATUS_CONTEXT"]}
          deadline = time.time() + 30 * 60
          last = {}
          while time.time() < deadline:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/commits/{sha}/status",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "nico-spanish-authenticated-production-proof",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              latest = {}
              for item in payload.get("statuses") or []:
                  latest.setdefault(str(item.get("context") or ""), str(item.get("state") or "unknown"))
              last = {context: latest.get(context, "missing") for context in required}
              print(f"Exact-SHA deployment statuses: {last}", flush=True)
              if all(last[context] == "success" for context in required):
                  break
              if any(last[context] in {"error", "failure"} for context in required):
                  raise SystemExit(f"Exact-SHA deployment failed: {last}")
              time.sleep(20)
          else:
              raise SystemExit(f"Timed out waiting for exact-SHA deployments: {last}")
          PY

      - name: Verify exact specialist-gated frontend release
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python scripts/production_specialist_release_identity_v1.py \
            --origin "${NICO_PRODUCTION_FRONTEND_URL}" \
            --expected-sha "${RELEASE_SHA}" \
            --expected-ui-contract "expert-engagement-v2" \
            --timeout-seconds 900 \
            --interval-seconds 15 \
            --output audit-results/spanish-comprehensive-frontend-release.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install pinned browser proof dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            . "playwright==1.61.0" "pypdf==6.15.0" "pytest==9.1.1"
          python scripts/prepare_playwright_native_visibility_v1.py
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "${apt_source}" ] || continue
            sudo sed -i \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              "${apt_source}"
          done
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99nico-ci-network >/dev/null
          timeout --signal=TERM --kill-after=30s 12m python -m playwright install --with-deps chromium
          command -v xvfb-run
          xvfb-run -a python -m pytest -q tests/test_mobile_visibility_lifecycle_proof_v1.py

      - name: Run authenticated Spanish Comprehensive proof
        id: spanish_proof
        continue-on-error: true
        timeout-minutes: 100
        run: |
          set -uo pipefail
          mkdir -p audit-results
          SOURCE_PROOF_LOG="audit-results/spanish-comprehensive-source-proof.log"
          set +e
          {
            printf 'RELEASE_SHA: %s\n' "${RELEASE_SHA}"
            printf 'SOURCE_RUN_ID: %s\n' "${SOURCE_RUN_ID}"
            printf 'SOURCE_RUN_ATTEMPT: %s\n' "${SOURCE_RUN_ATTEMPT}"
            xvfb-run -a python scripts/spanish_comprehensive_authenticated_live_acceptance_v4.py \
              --frontend-url "${NICO_PRODUCTION_FRONTEND_URL}" \
              --repository "${NICO_PRODUCTION_SMOKE_REPOSITORY}" \
              --expected-sha "${RELEASE_SHA}" \
              --source-workflow-run-id "${SOURCE_RUN_ID}" \
              --source-workflow-run-attempt "${SOURCE_RUN_ATTEMPT}" \
              --timeout-seconds 5400 \
              --output audit-results/spanish-comprehensive-live-proof.json
          } 2>&1 | tee "${SOURCE_PROOF_LOG}"
          SOURCE_PIPE_STATUS=("${PIPESTATUS[@]}")
          SOURCE_PROOF_EXIT="${SOURCE_PIPE_STATUS[0]}"
          SOURCE_LOG_EXIT="${SOURCE_PIPE_STATUS[1]}"
          set -e
          printf 'Process completed with exit code %s\n' "${SOURCE_PROOF_EXIT}" | tee -a "${SOURCE_PROOF_LOG}"
          printf '%s\n' "${SOURCE_PROOF_EXIT}" > audit-results/spanish-comprehensive-source-proof.exit-code
          if [ "${SOURCE_LOG_EXIT}" -ne 0 ]; then exit "${SOURCE_LOG_EXIT}"; fi
          exit "${SOURCE_PROOF_EXIT}"

      - name: Recover a visibility-only failure without new intake
        id: spanish_recovery
        if: steps.spanish_proof.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 100
        run: |
          set -euo pipefail
          FAILED_SOURCE_PROOF="audit-results/spanish-comprehensive-failed-source-proof.json"
          RECOVERED_PROOF="audit-results/spanish-comprehensive-existing-run-recovery-proof.json"
          test -s audit-results/spanish-comprehensive-live-proof.json
          test -s audit-results/spanish-comprehensive-source-proof.log
          test "$(cat audit-results/spanish-comprehensive-source-proof.exit-code)" = "1"
          cp audit-results/spanish-comprehensive-live-proof.json "${FAILED_SOURCE_PROOF}"
          PROOF_TOOL_SHA="$(git rev-parse HEAD)"
          SOURCE_SCRIPT_SHA256="$(sha256sum scripts/spanish_comprehensive_live_acceptance_v3.py | awk '{print $1}')"
          SOURCE_ARTIFACT_DIGEST="$(sha256sum "${FAILED_SOURCE_PROOF}" | awk '{print $1}')"
          xvfb-run -a python scripts/spanish_comprehensive_authenticated_existing_run_recovery_v2.py \
            --frontend-url "${NICO_PRODUCTION_FRONTEND_URL}" \
            --repository "${NICO_PRODUCTION_SMOKE_REPOSITORY}" \
            --expected-sha "${RELEASE_SHA}" \
            --proof-tool-sha "${PROOF_TOOL_SHA}" \
            --expected-proof-tool-sha "${PROOF_TOOL_SHA}" \
            --failed-source-proof "${FAILED_SOURCE_PROOF}" \
            --failed-source-job-log audit-results/spanish-comprehensive-source-proof.log \
            --source-script scripts/spanish_comprehensive_live_acceptance_v3.py \
            --expected-source-script-sha256 "${SOURCE_SCRIPT_SHA256}" \
            --source-artifact-digest "sha256:${SOURCE_ARTIFACT_DIGEST}" \
            --source-workflow-run-id "${SOURCE_RUN_ID}" \
            --source-workflow-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --timeout-seconds 5400 \
            --output "${RECOVERED_PROOF}"
          cp "${RECOVERED_PROOF}" audit-results/spanish-comprehensive-live-proof.json

      - name: Upload immutable Spanish proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spanish-comprehensive-production-proof-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit-results/spanish-comprehensive-frontend-release.json
            audit-results/spanish-comprehensive-live-proof.json
            audit-results/spanish-comprehensive-live-proof.progress.json
            audit-results/spanish-comprehensive-live-proof.png
            audit-results/spanish-comprehensive-source-proof.log
            audit-results/spanish-comprehensive-source-proof.exit-code
            audit-results/spanish-comprehensive-failed-source-proof.json
            audit-results/spanish-comprehensive-existing-run-recovery-proof.json
            audit-results/spanish-comprehensive-existing-run-recovery-proof.png
            audit-results/nico-comprehensive-en-automated-draft-pending-human-approval.pdf
            audit-results/nico-comprehensive-es-MX-automated-draft-pending-human-approval.pdf
          if-no-files-found: warn
          retention-days: 90

      - name: Require passing authenticated Spanish evidence
        if: always()
        run: |
          set -euo pipefail
          SOURCE_OUTCOME="${{ steps.spanish_proof.outcome }}"
          RECOVERY_OUTCOME="${{ steps.spanish_recovery.outcome }}"
          if [ "${SOURCE_OUTCOME}" = "success" ]; then
            test "${RECOVERY_OUTCOME}" = "skipped"
          else
            test "${SOURCE_OUTCOME}" = "failure"
            test "${RECOVERY_OUTCOME}" = "success"
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path

          payload = json.loads(Path("audit-results/spanish-comprehensive-live-proof.json").read_text(encoding="utf-8"))
          assert payload["status"] == "passed"
          assert payload["expected_sha"] == os.environ["RELEASE_SHA"]
          assert payload["source_workflow_run_id"] == os.environ["SOURCE_RUN_ID"]
          assert payload["source_workflow_run_attempt"] == os.environ["SOURCE_RUN_ATTEMPT"]
          assert payload["report_language_requested"] == "es-MX"
          assert payload["authenticated_production_proof"] is True
          sessions = payload["github_actions_proof_sessions"]
          assert isinstance(sessions, list) and sessions
          for session in sessions:
              assert session["status"] == "authenticated"
              assert session["authority"] == "github_actions_production_proof"
              assert session["release_sha"] == os.environ["RELEASE_SHA"]
              assert session["workflow_file"] == ".github/workflows/spanish-comprehensive-production-proof.yml"
              assert session["session_cookie_present"] is True
              assert session["session_cookie_value_exposed"] is False
              assert session["oidc_token_exposed"] is False
              assert session["human_review_required"] is True
              assert session["client_delivery_allowed"] is False
          assert payload["human_review_required"] is True
          assert payload["client_delivery_allowed"] is False
          digest = str(payload["canonical_truth_sha256"])
          assert len(digest) == 64 and set(digest) <= set("0123456789abcdef")
          assert payload["localized_pdf_artifact_hash_headers_verified"] is True
          assert payload["canonical_truth_unchanged_after_localized_rendering"] is True
          assert payload["terminal_state_unchanged_after_localized_reads"] is True
          PY

      - name: Publish successful Spanish proof status
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/spanish-success.json
          import json, os
          print(json.dumps({
              "state": "success",
              "context": os.environ["STATUS_CONTEXT"],
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated bilingual Comprehensive proof passed",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/spanish-success.json

      - name: Publish failed Spanish proof status
        if: failure() || cancelled()
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/spanish-failure.json
          import json, os
          print(json.dumps({
              "state": "failure",
              "context": os.environ["STATUS_CONTEXT"],
              "description": f"source:{os.environ['SOURCE_RUN_ID']}:{os.environ['SOURCE_RUN_ATTEMPT']} authenticated bilingual Comprehensive proof failed",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data-binary @/tmp/spanish-failure.json
