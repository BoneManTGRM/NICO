rules:
  - id: nico.python.dynamic-code-execution
    message: Dynamic Python code execution can turn untrusted input into code execution.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: nico.python.subprocess-shell-true
    message: subprocess execution with shell=True requires exact input-boundary review.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)

  - id: nico.python.unsafe-yaml-load
    message: yaml.load without a SafeLoader can construct unsafe Python objects.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: yaml.load($DATA, ...)
      - pattern-not: yaml.load($DATA, ..., Loader=yaml.SafeLoader, ...)
      - pattern-not: yaml.load($DATA, ..., Loader=SafeLoader, ...)

  - id: nico.python.pickle-deserialization
    message: Pickle deserialization can execute attacker-controlled code.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)

  - id: nico.javascript.dynamic-code-execution
    message: Dynamic JavaScript execution can turn untrusted input into code execution.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: Function(...)

  - id: nico.javascript.child-process-exec
    message: Shell-backed child-process execution requires exact input-boundary review.
    severity: WARNING
    languages: [javascript, typescript]
    pattern-either:
      - pattern: child_process.exec(...)
      - pattern: child_process.execSync(...)
      - pattern: $CP.exec(...)
      - pattern: $CP.execSync(...)

  - id: nico.react.dangerously-set-inner-html
    message: dangerouslySetInnerHTML requires proven sanitization of the supplied HTML.
    severity: WARNING
    languages: [typescript, javascript]
    pattern: <$TAG ... dangerouslySetInnerHTML={...} ... />

  - id: nico.javascript.insecure-tls-validation
    message: Disabling TLS certificate validation can permit machine-in-the-middle attacks.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'
      - pattern: new https.Agent(..., rejectUnauthorized: false, ...)
